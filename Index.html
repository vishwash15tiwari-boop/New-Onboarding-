// Render all verticals as full inline editorial sections below the compare grid.
function renderVertStory() {
  if (currentView !== 'onboarding' || !DS || !DS.verticals) return;
  if (!D) return;
  var container = document.getElementById('vert-story');
  var sep       = document.getElementById('story-sep');
  if (!container) return;

  var verts   = D.verticals;
  var cfgList = getVertCfg();
  var hasAny  = cfgList.some(function(c) { return (verts[c.key] || {}).total > 0; });

  if (sep) sep.style.display = hasAny ? '' : 'none';
  if (!hasAny) { container.innerHTML = ''; return; }

  container.innerHTML = cfgList.map(function(cfg) {
    var v   = verts[cfg.key] || {};
    var tot = v.total || 0;
    if (!tot) return '';

    var vcStyle = 'style="' + vcVars(cfg.key) + '"';
    var pct = v.completionPct || 0;

    // ── Section header ──────────────────────────────────────────────────────
    var hdrHtml = '<div class="vs-hdr">'
      + '<div class="vs-title-wrap">'
      + '<div class="vs-badge">' + cfg.code + '</div>'
      + '<div class="vs-title">' + esc(cfg.name) + '</div>'
      + '<button class="vs-rec-btn" onclick="openVertDetail(\'' + cfg.key + '\')" type="button">View Records →</button>'
      + '</div>'
      + '<div class="vs-hero-stat">'
      + '<div class="vs-hero-count">' + fmt(v.completed || 0) + '</div>'
      + '<div class="vs-hero-lbl">onboarded of ' + fmt(tot) + '</div>'
      + '</div>'
      + '</div>';

    // ── Completion progress bar ──────────────────────────────────────────────
    var progressHtml = '';

    // ── Four pipeline stage boxes ────────────────────────────────────────────
    var pipeHtml = '<div class="vs-pipe">'
      + '<div class="vs-pipe-box vs-pipe-draft" style="--pi:0"><b>' + fmt(v.draft || 0) + '</b><span>Draft</span></div>'
      + '<div class="vs-pipe-box vs-pipe-review" style="--pi:1"><b>' + fmt(v.inReview || 0) + '</b><span>In Review</span></div>'
      + '<div class="vs-pipe-box vs-pipe-onb" style="--pi:2"><b>' + fmt(v.completed || 0) + '</b><span>Onboarded</span></div>'
      + '<div class="vs-pipe-box vs-pipe-rej" style="--pi:3"><b>' + fmt(v.rejected || 0) + '</b><span>Rejected</span></div>'
      + '</div>';

    // ── Compact key metrics strip ────────────────────────────────────────────
    // GMV card: sellers only — buyers are the receiving side of the same transaction.
    var gmvMetric = '';
    if (aud === 'seller' && v.totalTxnValue != null) {
      var agingSub = '';
      if (v.aging != null || v.overdue != null) {
        agingSub = '<div class="vs-aging-sub">';
        if (v.aging   != null) agingSub += 'Aging: <span class="ag-warn">' + fmt(v.aging)   + '</span>';
        if (v.aging != null && v.overdue != null) agingSub += ' · ';
        if (v.overdue != null) agingSub += 'Overdue: <span class="ag-crit">' + fmt(v.overdue) + '</span>';
        agingSub += '</div>';
      }
      gmvMetric = '<div class="vs-metric m-gmv"><b>' + fmtINR(v.totalTxnValue) + '</b><span>Total GMV</span>' + agingSub + '</div>';
    }
    var isOMPs = cfg.key === 'OMP';
    var metArr = [
      ['Avg TAT',        dOr(v.avgTAT, 'd'), ''],
      v.completedThisWeek ? ['Onboarded (7d)', fmt(v.completedThisWeek), ''] : null,
      !isOMPs && v.transacted != null ? ['Transacted', fmt(v.transacted) + ' (' + (v.pctTransacted || 0) + '%)', ''] : null,
    ].filter(Boolean);
    var metricsHtml = (metArr.length || gmvMetric)
      ? '<div class="vs-metrics">'
        + (gmvMetric || '')
        + metArr.map(function(m) {
            return '<div class="vs-metric' + (m[2] ? ' ' + m[2] : '') + '"><b>' + m[1] + '</b><span>' + m[0] + '</span></div>';
          }).join('')
        + '</div>'
      : '';

    return '<section class="vert-section reveal" id="vs-' + cfg.key + '" ' + vcStyle + '>'
      + hdrHtml + progressHtml + pipeHtml + metricsHtml
      + '</section>';
  }).join('');

  // Animate pipeline boxes and category rows as they scroll into view.
  requestAnimationFrame(function() {
    if (!motionOK()) {
      container.querySelectorAll('.vs-pipe-box,.vs-cat-item').forEach(function(el) {
        el.classList.add('pipe-in','cat-in');
      });
      // Set bar widths immediately
      container.querySelectorAll('.vs-cat-bar-fg').forEach(function(el) {
        el.style.width = (el.getAttribute('data-pct') || '0') + '%';
      });
      return;
    }
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (!e.isIntersecting) return;
        var el  = e.target;
        var idx = parseInt(el.style.getPropertyValue('--pi') || el.style.getPropertyValue('--ci') || '0', 10) || 0;
        setTimeout(function() {
          el.classList.add('pipe-in','cat-in');
          // Animate progress bars inside category items
          el.querySelectorAll('.vs-cat-bar-fg').forEach(function(bar) {
            bar.style.width = (bar.getAttribute('data-pct') || '0') + '%';
          });
        }, idx * 65);
        obs.unobserve(el);
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });
    container.querySelectorAll('.vs-pipe-box,.vs-cat-item').forEach(function(el) { obs.observe(el); });
    // Also animate completion bars that are already in view
    container.querySelectorAll('.vs-progress-fill').forEach(function(el) {
      var w = el.style.width;
      el.style.width = '0';
      requestAnimationFrame(function() { el.style.width = w; });
    });
  });

  // Scroll spy — wired up after DOM is updated
  setTimeout(setupScrollSpy, 200);
}

function vdUnique(rows, field) {
  var seen = {};
  var out = [];
  rows.forEach(function(r) {
    var v = r[field];
    if (v && v !== '—' && !seen[v]) { seen[v] = true; out.push(v); }
  });
  return out.sort();
}

function vdSelect(id, label, options, current, labels) {
  // Pill select — the label lives inside the control ("Category: All"),
  // matching the GST filter bar. No floating form labels.
  var html = '<select class="vd-pill" id="' + id + '" onchange="vdfChange()">'
    + '<option value="All">' + esc(label) + ': All</option>';
  options.forEach(function(o) {
    html += '<option value="' + esc(o) + '"' + (current === o ? ' selected' : '') + '>'
      + esc((labels && labels[o]) || o) + '</option>';
  });
  return html + '</select>';
}

// renderVertDetail() is defined above (redirects to renderInlineDetail).
// The old full-overlay implementation has been removed in favour of the inline detail section.

function _isValidRec(r) {
  var nNm = (r.name || '').trim();
  return !!nNm && nNm !== '-' && nNm !== '—';
}

function vdFilteredRows() {
  var _fvd = selectedAud === 'buyer' ? (DB && DB.verticals) : (DS && DS.verticals);
  if (!selectedVert || !_fvd || !_fvd[selectedVert]) return [];
  var rows = vertRows;
  var q = (vdF.search || '').toLowerCase();
  var useRating = vdF.ratingMin !== '' || vdF.ratingMax !== '';
  var rMap = useRating ? _vdBuildRatingMap() : null;
  var rMin = useRating && vdF.ratingMin !== '' ? parseFloat(vdF.ratingMin) : null;
  var rMax = useRating && vdF.ratingMax !== '' ? parseFloat(vdF.ratingMax) : null;
  return rows.filter(function(r) {
    if (!_isValidRec(r)) return false;
    if (vdF.category !== 'All' && r.category   !== vdF.category) return false;
    if (vdF.vendor   !== 'All' && r.vendorType !== vdF.vendor)   return false;
    if (vdF.status   !== 'All' && r.status     !== vdF.status)   return false;
    if (vdF.gst === 'Active'   && !r.hasGST) return false;
    if (vdF.gst === 'Inactive' &&  r.hasGST) return false;
    if (vdF.region !== 'All'   && _stateToRegionFE(r.state) !== vdF.region) return false;
    if (rMap) {
      var rat = _vdGetRating(r, rMap);
      if (rMin !== null && (rat === null || rat < rMin)) return false;
      if (rMax !== null && (rat === null || rat > rMax)) return false;
    }
    if (q && (r.name  || '').toLowerCase().indexOf(q) === -1
          && (r.gstin || '').toLowerCase().indexOf(q) === -1
          && String(r.id || '').toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function vdSetView(view) {
  if (vdView === view) return;
  vdView = view;
  // Update toggle button active states without rebuilding the full page
  document.querySelectorAll('.vd-toggle-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.textContent.toLowerCase().indexOf(view === 'board' ? 'board' : 'table') !== -1);
  });
  renderVdRecords();
}

function renderVdRecords() {
  renderVdTable();
}

function renderVdBoard() {
  var host = document.getElementById('vd-board');
  var note = document.getElementById('vd-note');
  var _bvd = selectedAud === 'buyer' ? (DB && DB.verticals) : (DS && DS.verticals);
  if (!host || !selectedVert || !_bvd || !_bvd[selectedVert]) return;
  _rmD = {}; _rmI = 0;   // fresh lookup for the modal
  var all      = vertRows;
  var filtered = vdFilteredRows();
  var placed   = 0;   // rows that actually appear in one of the four stage columns

  host.innerHTML = KB_COLS.map(function(col) {
    var cases = filtered.filter(function(r) { return r.status === col.key; });
    placed += cases.length;
    var shown = cases.slice(0, KB_MAX_PER_COL);
    var extra = cases.length - shown.length;
    return '<div class="kb-col ' + col.cls + '">'
      + '<div class="kb-col-head"><span class="kb-dot"></span>'
      + '<span class="kb-col-title">' + esc(STATUS_LABELS[col.key]) + '</span>'
      + '<span class="kb-count">' + fmt(cases.length) + '</span></div>'
      + '<div class="kb-cards">'
      + (shown.length ? shown.map(kbCard).join('') : '<div class="kb-empty">No cases</div>')
      + (extra > 0 ? '<div class="kb-more">+ ' + fmt(extra) + ' more — refine filters or switch to Table</div>' : '')
      + '</div></div>';
  }).join('');

  if (note) {
    var other = filtered.length - placed;
    note.textContent = 'Showing ' + fmt(placed) + ' of ' + fmt(all.length)
      + ' records, grouped by stage · latest first'
      + (other > 0 ? ' · ' + fmt(other) + ' with other statuses — see Table view' : '');
  }
}

function kbCard(r) {
  var key  = ++_rmI;
  _rmD[key] = r;
  var meta = [r.category, r.vendorType].filter(function(x) { return x && x !== '—'; }).join(' · ');
  var txnChip = '';
  if (r.hasTransacted) {
    var valStr = r.txnValue !== null ? ' · ' + fmtINR(r.txnValue) : '';
    txnChip = '<span class="kb-gst ok" style="background:var(--st-transacted-bg);color:var(--st-transacted-tx);border-color:transparent"'
      + ' title="Transacted' + (r.txnValue !== null ? ' · ₹' + r.txnValue : '') + '">⚡ Txn' + valStr + '</span>';
  } else if (r.status === 'COMPLETED') {
    txnChip = '<span class="kb-gst bad" style="background:var(--bg2);color:var(--txt3);border-color:transparent" title="Onboarded but not yet transacted">— Txn</span>';
  }
  return '<div class="kb-card" onclick="openRecModal(' + key + ')" role="button" tabindex="0"'
    + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openRecModal(' + key + ')}">'
    + '<div class="kb-card-name">' + esc(r.name || '—') + '</div>'
    + '<div class="kb-card-meta">' + esc(r.id) + (meta ? ' · ' + esc(meta) : '') + '</div>'
    + '<div class="kb-card-foot">'
    + '<span class="kb-gst ' + (r.hasGST ? 'ok" title="' + esc(r.gstin) + '">✓ GST' : 'bad">✗ GST') + '</span>'
    + txnChip
    + kbAge(r)
    + '</div></div>';
}

// Onboarded cards show the achieved TAT; open cards show how long they have been sitting.
function kbAge(r) {
  if (r.status === 'COMPLETED') {
    var t = parseInt(r.tat);
    if (isNaN(t)) return '<span class="kb-age text-muted">' + esc(r.onbDate || '—') + '</span>';
    var cls = t <= 2 ? 'text-green' : t <= 5 ? 'text-amber' : 'text-red';
    return '<span class="kb-age ' + cls + '" title="Onboarding TAT">' + t + 'd TAT</span>';
  }
  // IN_REVIEW: count from when the case entered review, not from creation.
  // Fall back to createdDate if the backend doesn't supply a review entry timestamp.
  var isInReview = r.status === 'IN_REVIEW';
  var dateStr = (isInReview && r.reviewDate) ? r.reviewDate : r.createdDate;
  var d = parseDMY(dateStr);
  if (!d) return '<span class="kb-age text-muted">—</span>';
  var days = Math.max(0, Math.round((Date.now() - d.getTime()) / 86400000));
  if (r.status === 'REJECTED') {
    return '<span class="kb-age text-muted" title="Days since created">' + days + 'd</span>';
  }
  var cls2 = days <= 3 ? 'text-muted' : days <= 7 ? 'text-amber' : 'text-red';
  if (isInReview && r.reviewDate) {
    return '<span class="kb-age ' + cls2 + '" title="Days in review — entered review ' + esc(r.reviewDate) + '">' + days + 'd waiting</span>';
  }
  return '<span class="kb-age ' + cls2 + '" title="Days since created — created ' + esc(r.createdDate) + '">' + days + 'd waiting</span>';
}

function parseDMY(s) {
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s || '').trim());
  if (!m) return null;
  var d = new Date(+m[3], +m[2] - 1, +m[1]);
  return isNaN(d.getTime()) ? null : d;
}

// Column sort — clicking a header sorts by that column; a second click reverses it.
function vdSortBy(key) {
  if (vdSort.key === key) vdSort.dir = -vdSort.dir;
  else vdSort = { key: key, dir: 1 };
  renderVdRecords();
}

// Comparable value for a row under a given column key.
function vdSortVal(r, key, rMap) {
  if (key === 'tat') {
    var n = parseInt(r.tat, 10);
    return isNaN(n) ? -1 : n;
  }
  if (key === 'createdDate' || key === 'onbDate') {
    var d = parseDMY(r[key]);
    return d ? d.getTime() : 0;
  }
  if (key === 'txn') {
    if (r.hasTransacted) return 1 + (r.txnValue || 0);
    return r.status === 'COMPLETED' ? 0 : -1;
  }
  if (key === 'rating') {
    var rat = _vdGetRating(r, rMap || {});
    return rat !== null ? rat : -1;
  }
  if (key === 'gstin') return (r.hasGST ? '1' : '0') + String(r.gstin || '').toLowerCase();
  if (key === 'state') return _stateToRegionFE(r.state) + String(r.state || '').toLowerCase();
  return String(r[key] || '').toLowerCase();
}

function vdSortedRows(filtered) {
  if (!vdSort.key) return filtered;
  var key = vdSort.key, dir = vdSort.dir;
  var rMap = key === 'rating' ? _vdBuildRatingMap() : null;
  return filtered.slice().sort(function(a, b) {
    var va = vdSortVal(a, key, rMap), vb = vdSortVal(b, key, rMap);
    if (va < vb) return -dir;
    if (va > vb) return dir;
    return 0;
  });
}

function renderVdTable() {
  var tbody  = document.getElementById('vd-tbody');
  var pgEl   = document.getElementById('vd-pagination');
  var summEl = document.getElementById('vd-summary');
  var _tvd   = selectedAud === 'buyer' ? (DB && DB.verticals) : (DS && DS.verticals);
  if (!tbody || !selectedVert || !_tvd || !_tvd[selectedVert]) return;
  _rmD = {}; _rmI = 0;

  var rMap     = _vdBuildRatingMap();
  var all      = vertRows;
  var filtered = vdSortedRows(vdFilteredRows());
  var totalPg  = Math.max(1, Math.ceil(filtered.length / vdPageSize));
  if (vdPage >= totalPg) vdPage = Math.max(0, totalPg - 1);
  var start = vdPage * vdPageSize;
  var shown = filtered.slice(start, start + vdPageSize);

  // Sort indicators on column headers
  document.querySelectorAll('.vd-tbl thead th').forEach(function(th) {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.key === vdSort.key) th.classList.add(vdSort.dir === 1 ? 'sort-asc' : 'sort-desc');
  });

  // Summary strip
  if (summEl) {
    var ratSum = 0, ratCount = 0, totalGMV = 0;
    filtered.forEach(function(r) {
      var rat = _vdGetRating(r, rMap);
      if (rat !== null) { ratSum += rat; ratCount++; }
      if (selectedAud === 'seller' && r.hasTransacted && r.txnValue) totalGMV += r.txnValue;
    });
    var avgRat = ratCount > 0 ? (ratSum / ratCount).toFixed(1) : null;
    var cats = {};
    filtered.forEach(function(r) { if (r.category) cats[r.category] = (cats[r.category] || 0) + 1; });
    var catStr = Object.keys(cats).sort().map(function(k) { return k + ': ' + fmt(cats[k]); }).join(' · ');
    summEl.innerHTML = '<div class="vd-summary">'
      + '<div class="vd-summ-item"><div class="vd-summ-val">' + fmt(all.length) + '</div><div class="vd-summ-lbl">Total</div></div>'
      + '<div class="vd-summ-item"><div class="vd-summ-val">' + fmt(filtered.length) + '</div><div class="vd-summ-lbl">Filtered</div></div>'
      + '<div class="vd-summ-item"><div class="vd-summ-val">' + (avgRat !== null ? avgRat + ' / 10' : '—') + '</div><div class="vd-summ-lbl">Avg Rating</div></div>'
      + (selectedAud === 'seller' ? '<div class="vd-summ-item"><div class="vd-summ-val">' + (totalGMV > 0 ? fmtINR(totalGMV) : '—') + '</div><div class="vd-summ-lbl">Total GMV</div></div>' : '')
      + (catStr ? '<div class="vd-summ-item"><div class="vd-summ-val" style="font-size:12px;line-height:1.4">' + catStr + '</div><div class="vd-summ-lbl">By Category</div></div>' : '')
      + '</div>';
  }

  // Table rows
  tbody.innerHTML = shown.length
    ? shown.map(function(r) {
        var key = ++_rmI;
        _rmD[key] = r;
        var txnCell;
        if (r.hasTransacted) {
          txnCell = '<span class="txn-chip">' + (selectedAud === 'seller' && r.txnValue !== null ? fmtINR(r.txnValue) : 'Transacted') + '</span>';
        } else if (r.status === 'COMPLETED') {
          txnCell = '<span style="color:var(--txt3);font-size:11.5px">Not yet</span>';
        } else {
          txnCell = '<span class="text-muted">—</span>';
        }
        var rat = _vdGetRating(r, rMap);
        var ratChip;
        if (rat !== null) {
          var rc = rat >= 7 ? 'high' : rat >= 4 ? 'mid' : 'low';
          ratChip = '<span class="vd-rat-chip ' + rc + '">' + rat.toFixed(1) + ' / 10</span>';
        } else {
          ratChip = '<span class="vd-rat-chip none">—</span>';
        }
        var region = _stateToRegionFE(r.state) || '—';
        return '<tr class="vd-tr" onclick="openRecModal(' + key + ')">'
          + '<td><strong style="font-size:13px">' + esc(r.name || '—') + '</strong>'
          +   '<div class="td-sub" style="margin-top:2px">' + esc(r.id || '—') + '</div></td>'
          + '<td>' + esc(r.category || '—') + '</td>'
          + '<td>' + statusChip(r.status) + '</td>'
          + '<td>' + ratChip + '</td>'
          + '<td>' + txnCell + '</td>'
          + '<td>' + (r.hasGST ? '<span class="gst-ok" style="font-size:11px">' + esc(r.gstin) + '</span>' : '<span class="gst-bad" style="font-size:11px">Missing</span>') + '</td>'
          + '<td class="td-dim">' + esc(region) + '</td>'
          + '<td class="td-dim td-num">' + esc(r.onbDate || r.createdDate || '—') + '</td>'
          + '<td>' + tatChip(r.tat) + '</td>'
          + '</tr>';
      }).join('')
    : '<tr class="no-data-row"><td colspan="9" class="no-data">No records match the selected filters</td></tr>';

  // Pagination controls
  if (pgEl) {
    if (filtered.length === 0) { pgEl.innerHTML = ''; return; }
    var half = 3, pgStart = Math.max(0, Math.min(vdPage - half, totalPg - 7));
    var pgEnd = Math.min(totalPg, pgStart + 7);
    var pgBtns = '';
    for (var p = pgStart; p < pgEnd; p++) {
      pgBtns += '<button class="vd-pg-btn' + (p === vdPage ? ' active' : '') + '" onclick="vdGoPage(' + p + ')">' + (p + 1) + '</button>';
    }
    pgEl.innerHTML = '<div class="vd-pg-info">Showing ' + fmt(start + 1) + '–' + fmt(Math.min(start + vdPageSize, filtered.length)) + ' of ' + fmt(filtered.length) + ' records</div>'
      + '<div style="display:flex;align-items:center;gap:8px">'
      + '<select class="vd-pg-size" onchange="vdChangePageSize(+this.value)">'
      + [25,50,100].map(function(s) { return '<option value="' + s + '"' + (s === vdPageSize ? ' selected' : '') + '>' + s + ' / page</option>'; }).join('')
      + '</select>'
      + '<div class="vd-pg-btns">'
      + '<button class="vd-pg-btn" onclick="vdGoPage(' + (vdPage - 1) + ')"' + (vdPage === 0 ? ' disabled' : '') + '>‹ Prev</button>'
      + pgBtns
      + '<button class="vd-pg-btn" onclick="vdGoPage(' + (vdPage + 1) + ')"' + (vdPage >= totalPg - 1 ? ' disabled' : '') + '>Next ›</button>'
      + '</div></div>';
  }
}

// ─── Rating lookup helpers ────────────────────────────────────
function _vdBuildRatingMap() {
  var map = {};
  if (!qualityData) return map;
  var ratings = qualityData.vendorRatings || [];
  var aud = selectedAud || 'seller';
  ratings.forEach(function(rv) {
    if (rv.aud && rv.aud !== aud) return;
    if (rv.gstin) map['g:' + String(rv.gstin).toUpperCase()] = rv.rating;
    if (rv.id)    map['i:' + String(rv.id).toLowerCase()]    = rv.rating;
  });
  return map;
}
function _vdGetRating(r, rMap) {
  if (!rMap) return null;
  var byGST = r.gstin ? rMap['g:' + String(r.gstin).toUpperCase()] : undefined;
  if (byGST !== undefined) return typeof byGST === 'number' ? byGST : null;
  var byId  = r.id    ? rMap['i:' + String(r.id).toLowerCase()]    : undefined;
  if (byId  !== undefined) return typeof byId  === 'number' ? byId  : null;
  return null;
}

// ─── Pagination ───────────────────────────────────────────────
function vdGoPage(page) {
  var totalPg = Math.max(1, Math.ceil(vdFilteredRows().length / vdPageSize));
  vdPage = Math.max(0, Math.min(page, totalPg - 1));
  renderVdRecords();
}
function vdChangePageSize(size) {
  vdPageSize = size; vdPage = 0;
  renderVdRecords();
}

// ─── CSV export ───────────────────────────────────────────────
function vdExportCSV() {
  var rMap = _vdBuildRatingMap();
  var rows = vdSortedRows(vdFilteredRows());
  var hdr  = ['Vendor Name','Vendor ID','GSTIN','Category','Vendor Type','Status',
               'Rating (/10)','GMV','Region','State','Created Date','Onboarded Date','TAT (days)'];
  function csvCell(v) {
    var s = String(v == null ? '' : v);
    return (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1)
      ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  var lines = [hdr.map(csvCell).join(',')];
  rows.forEach(function(r) {
    var rat = _vdGetRating(r, rMap);
    var gmv = r.hasTransacted && r.txnValue != null ? r.txnValue : '';
    lines.push([
      r.name || '', r.id || '', r.gstin || '',
      r.category || '', r.vendorType || '', r.status || '',
      rat !== null ? rat.toFixed(1) : '',
      gmv, _stateToRegionFE(r.state) || '', r.state || '',
      r.createdDate || '', r.onbDate || '', r.tat || ''
    ].map(csvCell).join(','));
  });
  var blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'vendors_' + (selectedVert || 'export') + '.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function loadGSTData(silent) {
  var btn = document.getElementById('btn-refresh');
  if (btn) btn.classList.add('spinning');
  clearTimeout(_refreshTimer);
  clearInterval(_countdownTimer);
  var cd = document.getElementById('refresh-countdown');
  if (cd) cd.textContent = '…';

  var reqYear = gpYear;
  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) btn.classList.remove('spinning');
      if (_isFirstLoad) { hideLoading(); _isFirstLoad = false; }
      try {
        var data = JSON.parse(res);
        if (data.success) {
          try { localStorage.setItem(STORE_PFX + 'gst_' + reqYear, res); } catch (e) {}
          if (currentView === 'gst' && reqYear === gpYear) { GST = data; renderGST(); }
        } else if (currentView === 'gst') {
          showGSTError(data.error || 'No data returned.');
        }
      } catch (e) {
        if (currentView === 'gst') showGSTError('Parse error: ' + e.message);
      }
      scheduleNextRefresh();
    })
    .withFailureHandler(function(err) {
      if (btn) btn.classList.remove('spinning');
      if (_isFirstLoad) { hideLoading(); _isFirstLoad = false; }
      if (currentView === 'gst') showGSTError((err && err.message) ? err.message : 'Server error while loading GST Payables.');
      scheduleNextRefresh();
    })
    .getGSTPayablesData(JSON.stringify({ year: gpYear }));
}

function showGSTError(msg) {
  var host = document.getElementById('tab-gst');
  if (!host) return;
  host.innerHTML = '<div class="gp-card" style="text-align:center;padding:48px 24px">'
    + '<div style="color:var(--gp-red);font-weight:700;font-size:15px;margin-bottom:8px">⚠ Could not load GST Payables</div>'
    + '<div style="color:var(--gp-ink2);margin-bottom:18px;max-width:560px;margin-left:auto;margin-right:auto">' + esc(msg) + '</div>'
    + '<div style="color:var(--gp-ink3);font-size:12px;margin-bottom:18px">If this is a permissions error, share the source sheet with the account that deployed this web app.</div>'
    + '<button onclick="loadGSTData(false)" style="padding:9px 22px;border-radius:999px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">↻ Retry</button>'

function gpFyDrillModal(fy, field, evt) {
  if (evt) evt.stopPropagation();
  var LABELS = { total: 'Total Balance', material: 'Material Balance', gst: 'GST Balance' };
  var label = LABELS[field] || field;

  var vendors;
  if (gpYear === fy) {
    vendors = (GST.rows || []).filter(function(r) { return r.total > 0; })
      .map(function(r) { return { name: r.name, gstNo: r.gstNo, vertical: r.vertical, total: r.total, material: r.material, gst: r.gst }; });
  } else if (gpYear === 'All') {
    vendors = (GST.rows || []).filter(function(r) { return ((r.yearAmounts || {})[fy] || 0) > 0; })
      .map(function(r) {
        var ya = (r.yearAmounts || {})[fy] || 0;
        var mR = r.total > 0 ? r.material / r.total : 0;
        var mA = Math.round(ya * mR);
        return { name: r.name, gstNo: r.gstNo, vertical: r.vertical, total: ya, material: mA, gst: ya - mA };
      });
  } else {
    vendors = null;
  }

  if (vendors) vendors.sort(function(a, b) { return b[field] - a[field]; });

  // Single pass over vendors for all three column totals
  var tots = (vendors || []).reduce(function(s, r) {
    s.material += r.material; s.gst += r.gst; s.total += r.total; return s;
  }, { material: 0, gst: 0, total: 0 });

  // Highlight the sorted-by column, dim the others
  function cell(f, v) {
    return '<span class="' + (field === f ? 'gm-hi' : 'gm-dim') + '">' + fmtRupee(v) + '</span>';
  }

  var content;
  if (!vendors) {
    content = '<div style="padding:28px 20px;text-align:center">'
      + '<div style="color:var(--gp-ink2);margin-bottom:16px;line-height:1.5">Per-vendor detail for a year not currently loaded.<br>Switch to ' + esc(fyFull(fy)) + ' to see the breakdown.</div>'
      + '<button onclick="closeGpModal();gpSetYear(\'' + fy + '\')" style="font-family:inherit;font-size:13px;font-weight:600;padding:9px 22px;border-radius:999px;border:none;background:var(--blue);color:#fff;cursor:pointer">Switch to ' + esc(fyFull(fy)) + '</button>'
      + '</div>';
  } else if (!vendors.length) {
    content = '<div style="padding:32px 20px;text-align:center;color:var(--gp-ink2)">No vendors with outstanding ' + esc(label.toLowerCase()) + ' in ' + esc(fyFull(fy)) + '</div>';
  } else {
    var rows = vendors.map(function(r, i) {
      return '<tr>'
        + '<td class="gm-rank">' + (i + 1) + '</td>'
        + '<td><div class="gm-vname" title="' + esc(r.name) + '">' + esc(r.name || '—') + '</div>'
        + (r.gstNo ? '<div class="gm-gstin">' + esc(r.gstNo) + '</div>' : '') + '</td>'
        + '<td style="font-size:11px;color:var(--gp-ink2)">' + esc(r.vertical || '—') + '</td>'
        + '<td class="r">' + cell('material', r.material) + '</td>'
        + '<td class="r">' + cell('gst',      r.gst)      + '</td>'
        + '<td class="r">' + cell('total',    r.total)    + '</td>'
        + '</tr>';
    }).join('');
    content = '<div style="overflow-x:auto;padding-bottom:4px">'
      + '<table class="gm-tbl">'
      + '<thead><tr>'
      + '<th class="gm-rank"></th>'
      + '<th>Vendor</th>'
      + '<th>Vertical</th>'
      + '<th class="r">Material</th>'
      + '<th class="r">GST</th>'
      + '<th class="r">Total</th>'
      + '</tr></thead>'
      + '<tbody>' + rows + '</tbody>'
      + '<tfoot><tr>'
      + '<td></td>'
      + '<td style="color:var(--gp-ink2);font-size:11px">' + fmt(vendors.length) + ' vendors</td>'
      + '<td></td>'
      + '<td class="r">' + cell('material', tots.material) + '</td>'
      + '<td class="r">' + cell('gst',      tots.gst)      + '</td>'
      + '<td class="r">' + cell('total',    tots.total)    + '</td>'
      + '</tr></tfoot>'
      + '</table></div>';
  }

  var fieldTotal = tots[field];
  var el = document.getElementById('gp-modal');
  var pn = document.getElementById('gm-pn');
  if (!el || !pn) return;
  pn.innerHTML =
    '<div class="km-head">'
    + '<div class="km-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div>'
    + '<div class="km-htxt">'
    + '<div class="km-title">' + esc(fyFull(fy)) + ' — ' + esc(label) + '</div>'
    + '<div class="km-sub">' + (vendors ? fmt(vendors.length) + ' vendors · ' + fmtRupee(fieldTotal) + ' outstanding' : 'Switch year to view vendor details') + '</div>'
    + '</div>'
    + '<button class="km-close" onclick="closeGpModal()" aria-label="Close">✕</button>'
    + '</div>'
    + content;
  el.classList.add('gm-open');
  document.addEventListener('keydown', _gpModalEsc);
}

function gpDonut(segs) {
  var total = segs.reduce(function(a, s) { return a + s.count; }, 0);
  if (!total) return '<div class="gp-empty">No data</div>';
  var cx = 90, cy = 90, r = 66, sw = 24, circ = 2 * Math.PI * r, off = 0;
  var arcs = segs.map(function(s, i) {
    var len = s.count / total * circ, col = GP_STATUS_COLORS[i % GP_STATUS_COLORS.length];
    var el = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '"'
      + ' stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"'
      + ' transform="rotate(-90 ' + cx + ' ' + cy + ')"><title>' + esc(s.label) + ': ' + fmt(s.count) + ' (' + Math.round(s.count / total * 100) + '%)</title></circle>';
    off += len; return el;
  }).join('');
  var legend = segs.map(function(s, i) {
    return '<div class="gp-leg"><span class="gp-leg-dot" style="background:' + GP_STATUS_COLORS[i % GP_STATUS_COLORS.length] + '"></span>'
      + esc(s.label) + ' <b>' + fmt(s.count) + '</b></div>';
  }).join('');
  return '<div class="gp-donut-wrap"><svg viewBox="0 0 180 180" class="gp-donut-svg" role="img" aria-label="GST status breakdown">'
    + arcs
    + '<text x="90" y="86" text-anchor="middle" class="gp-donut-num">' + fmt(total) + '</text>'
    + '<text x="90" y="104" text-anchor="middle" class="gp-donut-lbl">Vendors</text>'
    + '</svg><div class="gp-legend">' + legend + '</div></div>';
}

function gpVBars(items) {

  if (!items.length) return '<div class="gp-empty">No data</div>';
  return '<div class="gp-num-list">' + items.map(function(it, i) {
    return '<div class="gp-num-row">'
      + '<span class="gp-num-dot" style="background:' + GP_VERT_COLORS[i % GP_VERT_COLORS.length] + '"></span>'
      + '<span class="gp-num-lbl">' + esc(it.label) + '</span>'

function gpSortRows(rows) {
  var key = gpSort.key, dir = gpSort.dir;

    var va = numeric ? (a[key] || 0) : String(a[key] || '').toLowerCase();
    var vb = numeric ? (b[key] || 0) : String(b[key] || '').toLowerCase();
    if (va < vb) return -dir;
    if (va > vb) return dir;
    return 0;
  });
}

function animateGSTCounters() {
  if (typeof motionOK === 'function' && !motionOK()) return;   // respect reduced-motion
  document.querySelectorAll('#tab-gst .gp-kpi-val[data-count]').forEach(function(el) {
    var target = parseFloat(el.getAttribute('data-count')) || 0, dur = 850, start = null;
    function step(ts) {
      if (!start) start = ts;
      var p = Math.min(1, (ts - start) / dur), eased = 1 - Math.pow(1 - p, 3);
      el.textContent = fmtRupee(Math.round(target * eased));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

// ═══════════════════════════════════════════════════════════════
// SCROLL REVEAL — D.E. Shaw editorial entrance pattern
// IntersectionObserver fires .visible the moment each .reveal
// element crosses an 8% threshold.  The .reveal CSS rule
// (opacity:0 → 1, translateY 22px → 0) plays the transition.
// Only runs when OS motion is permitted.
// ═══════════════════════════════════════════════════════════════
(function initReveal() {
  if (!window.IntersectionObserver) return;
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        var delay = (parseInt(e.target.getAttribute('data-ri') || '0', 10) || 0) * 8;
        if (delay) {
          setTimeout(function() { e.target.classList.add('visible'); }, delay);
        } else {
          e.target.classList.add('visible');
        }
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.06, rootMargin: '0px 0px -32px 0px' });

  function observe() {
    if (motionOK()) {
      document.querySelectorAll('.reveal:not(.visible)').forEach(function(el) { io.observe(el); });
    } else {
      document.querySelectorAll('.reveal').forEach(function(el) { el.classList.add('visible'); });
    }
  }

  if (document.readyState !== 'loading') { observe(); }
  else { document.addEventListener('DOMContentLoaded', observe); }

  var _origRenderAll = window.renderAll;
  window.renderAll = function() {
    if (_origRenderAll) _origRenderAll.apply(this, arguments);
    requestAnimationFrame(observe);
  };
})();

// IntersectionObserver scroll spy — highlights the sidebar item matching the
// section closest to the top of the viewport.
function setupScrollSpy() {
  if (_scrollSpyObs) { _scrollSpyObs.disconnect(); _scrollSpyObs = null; }
  if (!window.IntersectionObserver) return;

  var sections = document.querySelectorAll('.vert-section[id^="vs-"]');
  if (!sections.length) return;

  _scrollSpyObs = new IntersectionObserver(function(entries) {
    var best = null, bestRatio = 0;
    entries.forEach(function(e) {
      if (e.isIntersecting && e.intersectionRatio > bestRatio) {
        bestRatio = e.intersectionRatio;
        best = e.target;
      }
    });
    if (!best) return;
    var key = best.id.replace('vs-', '');
    if (key === snActiveKey) return;
    snActiveKey = key;
  }, { threshold: [0.1, 0.25, 0.5], rootMargin: '-64px 0px -40% 0px' });

  sections.forEach(function(sec) { _scrollSpyObs.observe(sec); });
}

function set(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }
function dOr(v, suffix) { return (v === null || v === undefined) ? '—' : v + (suffix || ''); }
function fmt(n) { return Number(n || 0).toLocaleString('en-IN'); }
var _cfdHtml = '<span class="cfd">Click for Details <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>';
function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtINR(v) {
  if (v === null || v === undefined || isNaN(parseFloat(v))) return '—';
  v = parseFloat(v);
  if (v >= 1e7) {
    var cr = v / 1e7;
    // Large Crore values (≥100 Cr) get Indian grouping and no decimals: "₹35,793 Cr"
    // Smaller Crore values keep 2 decimal places: "₹87.75 Cr"
    var s = cr >= 100
      ? cr.toLocaleString('en-IN', { maximumFractionDigits: 0 })
      : cr.toFixed(2);
    return '₹' + s + ' Cr';
  }
  if (v >= 1e5) return '₹' + (v / 1e5).toFixed(2) + ' L';
  if (v >= 1000) return '₹' + (v / 1000).toFixed(1) + ' K';
  return '₹' + Math.round(v).toLocaleString('en-IN');
}

function statusChip(s) {
  var cls = { COMPLETED: 'chip-completed', DRAFT: 'chip-draft', IN_REVIEW: 'chip-review', REJECTED: 'chip-rejected' };
  return '<span class="status-chip ' + (cls[s] || '') + '">' + esc(STATUS_LABELS[s] || s || '—') + '</span>';
}
function tatChip(t) {
  // 0 is a valid TAT (same-day onboarding) — only null/undefined/'—' mean "no TAT".
  if (t === null || t === undefined || t === '' || t === '—') return '<span class="text-muted">—</span>';
  var n = parseInt(t, 10);
  if (isNaN(n)) return '<span class="text-muted">' + esc(t) + '</span>';
  var cls = n <= 2 ? 'text-green' : n <= 5 ? 'text-amber' : 'text-red';
  return '<span class="' + cls + '">' + n + 'd</span>';
}

// ═══════════════════════════════════════════════════════════════
// VENDOR TYPE BREAKDOWN MODAL
// ═══════════════════════════════════════════════════════════════
var _vtb = { view: 'summary', vtType: null, vtCol: '#005DFF',
             aud: 'seller',
             vtRows: [], row: null,
             q: '', sk: 'name', sd: 1, pg: 0, pgSz: 15,
             txnRows: [], txnLoading: false, txnError: false,
             txnQ: '', txnSk: 'txnDate', txnSd: -1, txnPg: 0, txnPgSz: 20 };
var _VTB_CLR = ['#005DFF','#1DC797','#FF9F0A','#8460D4','#FF6B35','#FF3B30','#567DE8','#8E8E93'];

function openVtbModal(aud) {
  _vtb.aud  = aud || selectedAud || 'seller';
  _vtb.view = 'summary'; _vtb.vtType = null; _vtb.vtRows = []; _vtb.row = null;
  _vtb.q = ''; _vtb.sk = 'name'; _vtb.sd = 1; _vtb.pg = 0;
  _vtbRender();
  var m = document.getElementById('vtb-modal');
  if (m) { void m.offsetHeight; m.classList.add('vtb-open'); }
}

function closeVtbModal() {
  var m = document.getElementById('vtb-modal');
  if (m) m.classList.remove('vtb-open');
}

document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  var m = document.getElementById('vtb-modal');
  if (!m || !m.classList.contains('vtb-open')) return;
  e.stopPropagation();
  if (_vtb.view === 'txnhist')      { _vtb.view = 'vendors'; _vtbRender(); }
  else if (_vtb.view === 'detail')  { _vtb.view = 'vendors'; _vtbRender(); }
  else if (_vtb.view === 'vendors') { _vtb.view = 'summary'; _vtbRender(); }
  else                               closeVtbModal();
}, true);

// Aggregate vendor types from _kpiSnap — scoped to the audience that opened the modal
function _vtbTypes() {
  var d = window._kpiSnap;
  if (!d) return [];
  var map = {};
  function proc(cats) {
    if (!cats) return;
    for (var i = 0; i < cats.length; i++) {
      var vts = cats[i].vendorTypes || [];
      for (var j = 0; j < vts.length; j++) {
        var vt = vts[j];
        var k = (vt.type || 'Unknown').trim() || 'Unknown';
        if (!map[k]) map[k] = { type: k, onboarded: 0, transacted: 0 };
        map[k].onboarded  += (vt.count      || 0);
        map[k].transacted += (vt.transacted || 0);
      }
    }
  }
  // Scope strictly to the pipeline that opened the modal
  if (_vtb.aud === 'buyer') { if (d.vb) proc(d.vb.categories); }
  else                      { if (d.vs) proc(d.vs.categories); }
  var arr = [];
  for (var k in map) arr.push(map[k]);
  arr.sort(function(a, b) { return b.onboarded - a.onboarded; });
  return arr;
}

// Collect completed rows for a vendor type — scoped to _vtb.aud (seller or buyer)
function _vtbGatherRows(vtType) {
  var myPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var aud = _vtb.aud;
  var seen = {}, rows = [];
  var cfg = getVertCfg();
  cfg.forEach(function(v) {
    try {
      var sv = JSON.parse(localStorage.getItem(STORE_PFX + 'vr_' + aud + '_' + v.key) || 'null');
      if (sv && sv.pKey === myPKey && Array.isArray(sv.rows)) {
        sv.rows.forEach(function(r) {
          if (r.status === 'COMPLETED' && (r.vendorType || 'Unknown').trim() === vtType && !seen[r.id] && _isValidRec(r)) {
            seen[r.id] = true; rows.push(r);
          }
        });
      }
    } catch(e) {}
  });
  // Supplement with live vertRows if they match the audience
  if (Array.isArray(vertRows)) {
    vertRows.forEach(function(r) {
      if ((r.audience || 'seller') === aud
          && r.status === 'COMPLETED'
          && (r.vendorType || 'Unknown').trim() === vtType
          && !seen[r.id]
          && _isValidRec(r)) {
        seen[r.id] = true; rows.push(r);
      }
    });
  }
  return rows;
}

function _vtbRatingMap() {
  var map = {};
  if (!qualityData) return map;
  var aud = _vtb.aud;
  (qualityData.vendorRatings || []).forEach(function(rv) {
    if (rv.aud && rv.aud !== aud) return;
    if (rv.gstin) map['g:' + String(rv.gstin).toUpperCase()] = rv.rating;
    if (rv.id)    map['i:' + String(rv.id).toLowerCase()]    = rv.rating;
  });
  return map;
}
function _vtbGetRating(r, rMap) {
  if (!rMap) return null;
  var byG = r.gstin ? rMap['g:' + String(r.gstin).toUpperCase()] : undefined;
  if (byG !== undefined) return typeof byG === 'number' ? byG : null;
  var byI = r.id    ? rMap['i:' + String(r.id).toLowerCase()]    : undefined;
  if (byI !== undefined) return typeof byI === 'number' ? byI : null;
  return null;
}

function _vtbRender() {
  var hd   = document.getElementById('vtb-hd');
  var body = document.getElementById('vtb-body');
  if (!hd || !body) return;
  if (_vtb.view === 'summary')      { hd.innerHTML = _vtbSumHd();  body.innerHTML = _vtbSumBody(); }
  else if (_vtb.view === 'vendors') { hd.innerHTML = _vtbVlHd();   body.innerHTML = _vtbVlBody(); }
  else if (_vtb.view === 'txnhist') { hd.innerHTML = _vtbTxnHd();  body.innerHTML = _vtbTxnBody(); }
  else                              { hd.innerHTML = _vtbDetHd();  body.innerHTML = _vtbDetBody(); }
}

/* ── Summary ── */
function _vtbSumHd() {
  var d = window._kpiSnap;
  var isBuyer = _vtb.aud === 'buyer';
  var total   = d ? (isBuyer ? (d.compB || 0) : (d.compS || 0)) : 0;
  var pipelineLabel = isBuyer ? 'Buyer' : 'Seller';
  return '<div class="vtb-hd-txt">'
    + '<div class="vtb-hd-title">' + pipelineLabel + ' Completed – Vendor Type Breakdown</div>'
    + '<div class="vtb-hd-sub">' + fmt(total) + ' ' + pipelineLabel.toLowerCase() + 's completed onboarding</div>'
    + '</div>'
    + '<button class="vtb-hd-close" onclick="closeVtbModal()" title="Close">×</button>';
}

function _vtbSumBody() {
  var types = _vtbTypes();
  if (!types.length) return '<div class="vtb-no-data">No vendor type data available for the current selection.</div>';
  var rows = '';
  for (var i = 0; i < types.length; i++) {
    var t = types[i];
    var col = _VTB_CLR[i % _VTB_CLR.length];
    var rate = t.onboarded > 0 ? Math.round((t.transacted / t.onboarded) * 100) : 0;
    rows += '<tr class="vtb-sum-row" onclick="vtbDrilldown(' + i + ')">'
      + '<td><div class="vtb-type-name"><span class="vtb-type-dot" style="background:' + col + '"></span>'
      + esc(t.type) + '</div></td>'
      + '<td><strong>' + fmt(t.onboarded) + '</strong></td>'
      + '<td>' + fmt(t.transacted) + '<div class="vtb-txn-rate">' + rate + '% of completed</div></td>'
      + '<td><span class="vtb-arr">›</span></td>'
      + '</tr>';
  }
  return '<table class="vtb-sum-tbl"><thead><tr>'
    + '<th>Vendor Type</th><th>Total Completed</th><th>Transacted</th><th></th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table>';
}

/* ── Vendor list ── */
function vtbDrilldown(ci) {
  var types = _vtbTypes();
  var t = types[ci];
  if (!t) return;
  _vtb.vtType = t.type;
  _vtb.vtCol  = _VTB_CLR[ci % _VTB_CLR.length];
  _vtb.view   = 'vendors';
  _vtb.q = ''; _vtb.sk = 'name'; _vtb.sd = 1; _vtb.pg = 0;
  _vtb.vtRows = _vtbGatherRows(t.type);
  _vtbRender();
}

function _vtbFiltered() {
  var q = _vtb.q.toLowerCase();
  return _vtb.vtRows.filter(function(r) {
    if (!q) return true;
    return (r.name||'').toLowerCase().indexOf(q) > -1
      || (r.id||'').toLowerCase().indexOf(q) > -1
      || (r.state||'').toLowerCase().indexOf(q) > -1
      || (r.category||'').toLowerCase().indexOf(q) > -1;
  });
}

function _vtbSorted(arr, rMap) {
  var k = _vtb.sk, d = _vtb.sd;
  return arr.slice().sort(function(a, b) {
    if (k === 'rating') {
      var _rm = rMap || {};
      var ra = _vtbGetRating(a, _rm), rb = _vtbGetRating(b, _rm);
      return d * ((ra !== null ? ra : -1) - (rb !== null ? rb : -1));
    }
    if (k === 'onbDate') {
      var an = typeof _taDateNum === 'function' ? _taDateNum(a.onbDate||'') : 0;
      var bn = typeof _taDateNum === 'function' ? _taDateNum(b.onbDate||'') : 0;
      return d * (an - bn);
    }
    return d * String(a[k]||'').localeCompare(String(b[k]||''));
  });
}

function _vtbVlHd() {
  var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'
    + _vtb.vtCol + ';margin-right:6px;vertical-align:middle"></span>';
  var pipelineLbl = (_vtb.aud === 'buyer' ? 'Buyer' : 'Seller') + ' Onboarding Pipeline';
  return '<button class="vtb-hd-back" onclick="_vtbBack()" title="Back">&#8592;</button>'
    + '<div class="vtb-hd-txt"><div class="vtb-hd-title">' + dot + esc(_vtb.vtType) + '</div>'
    + '<div class="vtb-hd-sub">Completed vendors · ' + pipelineLbl + ' · ' + fmt(_vtb.vtRows.length) + ' vendors</div></div>'
    + '<button class="vtb-hd-close" onclick="closeVtbModal()" title="Close">×</button>';
}

function _vtbVlBody() {
  var rMap     = _vtbRatingMap();
  var filtered = _vtbFiltered();
  var sorted   = _vtbSorted(filtered, rMap);
  var total    = sorted.length;
  var pgSz = _vtb.pgSz, pg = _vtb.pg;

  var allRows = _vtb.vtRows;
  var catCounts = {};

  allRows.forEach(function(r) {
    var c = r.category ? (r.category.charAt(0).toUpperCase() + r.category.slice(1)) : 'Other';
    catCounts[c] = (catCounts[c] || 0) + 1;
    var rat = _vtbGetRating(r, rMap);

  });

  var audLbl = _vtb.aud === 'buyer' ? 'Buyer' : 'Seller';

  // KPI summary cards

  var catFzSt  = catNames.length > 10 ? ' style=”font-size:13px;line-height:1.35;white-space:normal”' : '';
  var isOmpVtb = (typeof activeVertKey !== 'undefined' && activeVertKey === 'OMP');
  var ratSt    = avgRat !== null ? '' : ' style=”color:var(--txt3)”';
  var _kSt = 'display:flex;flex-direction:column;gap:4px;padding:10px 14px;background:#F5F5F7;border:1px solid rgba(0,0,0,.13);border-radius:10px;min-width:0;overflow:hidden';
  var _vSt = 'font-size:18px;font-weight:700;color:#1D1D1F;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
  var _lSt = 'font-size:10px;font-weight:600;color:#86868B;text-transform:uppercase;letter-spacing:.05em;margin-top:1px';
  var statStrip = '<div class=”vtb-kpi-strip” style=”display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;width:100%;padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.09);box-sizing:border-box;flex-shrink:0”>'
    + '<div class=”vtb-kpi-card” style=”' + _kSt + '”><div class=”vtb-kpi-val” style=”' + _vSt + '”>' + fmt(allRows.length) + '</div><div class=”vtb-kpi-lbl” style=”' + _lSt + '”>Total Vendors</div></div>'
    + '<div class=”vtb-kpi-card” style=”' + _kSt + '”><div class=”vtb-kpi-val” style=”' + _vSt + ';font-size:14px”>' + esc(audLbl) + '</div><div class=”vtb-kpi-lbl” style=”' + _lSt + '”>Active Pipeline</div></div>'
    + '<div class=”vtb-kpi-card” style=”' + _kSt + '”><div class=”vtb-kpi-val” style=”' + _vSt + (catNames.length > 10 ? ';font-size:13px;line-height:1.35;white-space:normal' : '') + '”>' + esc(catNames) + '</div><div class=”vtb-kpi-lbl” style=”' + _lSt + '”>Material Category</div></div>'
    + (isOmpVtb ? '<div class=”vtb-kpi-card” style=”' + _kSt + '”><div class=”vtb-kpi-val” style=”' + _vSt + (avgRat === null ? ';color:#86868B' : '') + '”>' + (avgRat !== null ? avgRat + ' / 10' : '—') + '</div><div class=”vtb-kpi-lbl” style=”' + _lSt + '”>Avg Vendor Rating</div></div>' : '')
    + '<div class=”vtb-kpi-card” style=”' + _kSt + '”><div class=”vtb-kpi-val” style=”' + _vSt + '”>' + fmt(total) + '</div><div class=”vtb-kpi-lbl” style=”' + _lSt + '”>Vendors Displayed</div></div>'
    + '</div>';

  var cols = [
    { key:'name',       lbl:'Company Name'  },
    { key:'id',         lbl:'Vendor ID'     },
    { key:'vendorType', lbl:'Vendor Type'   },
    { key:'_aud',       lbl:'Pipeline', nosort:true },
    { key:'category',   lbl:'Material'      },
    { key:'state',      lbl:'State'         },
    { key:'status',     lbl:'Status'        },
    { key:'onbDate',    lbl:'Onb. Date'     },
    { key:'rating',     lbl:'Rating'        },
  ];

  var thHtml = cols.map(function(c) {
    if (c.nosort) return '<th>' + esc(c.lbl) + '</th>';
    var isAsc  = _vtb.sk === c.key && _vtb.sd ===  1;
    var isDesc = _vtb.sk === c.key && _vtb.sd === -1;
    var cls = isAsc ? 'vtb-th-asc' : isDesc ? 'vtb-th-desc' : '';
    var ic  = isAsc ? '&#9650;' : isDesc ? '&#9660;' : '&#9651;';
    return '<th class=”' + cls + '” onclick=”vtbSrt(\'' + c.key + '\')”>'
      + esc(c.lbl) + '<span class=”s-ic”>' + ic + '</span></th>';
  }).join('');

  var audBadgeCls = _vtb.aud === 'buyer' ? 'vtb-badge vtb-badge-b' : 'vtb-badge vtb-badge-s';

  var trHtml = page.map(function(r, si) {

}

    + '<button class="vtb-hd-close" onclick="closeVtbModal()" title="Close">×</button>';
}

function _vtbTxnFiltered() {
  var q = _vtb.txnQ.toLowerCase();
  return _vtb.txnRows.filter(function(t) {
    if (!q) return true;
    return (t.txnId||'').toLowerCase().indexOf(q) > -1
      || (t.txnDate||'').toLowerCase().indexOf(q) > -1
      || (t.material||'').toLowerCase().indexOf(q) > -1
      || (t.counterParty||'').toLowerCase().indexOf(q) > -1
      || (t.txnStatus||'').toLowerCase().indexOf(q) > -1;
  });
}

function _vtbTxnSorted(arr) {
  var k = _vtb.txnSk, d = _vtb.txnSd;
  return arr.slice().sort(function(a, b) {
    if (k === 'txnValue') return d * ((+a.txnValue||0) - (+b.txnValue||0));
    if (k === 'qty') return d * ((parseFloat(a.qty)||0) - (parseFloat(b.qty)||0));
    if (k === 'txnDate') {
      var aD = typeof _taDateNum === 'function' ? _taDateNum(a.txnDate||'') : 0;
      var bD = typeof _taDateNum === 'function' ? _taDateNum(b.txnDate||'') : 0;
      return d * (aD - bD);
    }
    return d * String(a[k]||'').localeCompare(String(b[k]||''));
  });
}

function _vtbTxnBody() {
  var r = _vtb.row;
  // Vendor summary strip at top
  var cat = r ? (r.category ? r.category.charAt(0).toUpperCase() + r.category.slice(1) : null) : null;
  var catCls = cat === 'Metal' ? 'vtb-badge vtb-badge-m' : cat === 'Plastic' ? 'vtb-badge vtb-badge-p' : '';
  var audCls = _vtb.aud === 'buyer' ? 'vtb-badge vtb-badge-b' : 'vtb-badge vtb-badge-s';
  var audLbl = _vtb.aud === 'buyer' ? 'Buyer' : 'Seller';
  var vndrHtml = r
    ? '<div class="vtb-txn-vndr">'
      + '<strong>' + esc(r.name||'—') + '</strong>'
      + '<span style="color:var(--txt3)">·</span>'
      + '<span class="' + audCls + '">' + audLbl + '</span>'
      + (cat ? '<span class="' + (catCls || 'vtb-badge') + '">' + esc(cat) + '</span>' : '')
      + (r.state ? '<span>' + esc(r.state) + '</span>' : '')
      + '<span style="color:var(--txt3);margin-left:auto">Vendor ID: <strong>' + esc(r.id||'—') + '</strong></span>'
      + '</div>'
    : '';

  if (_vtb.txnLoading) {
    return vndrHtml + '<div class="vtb-txn-loading"><span class="vtb-txn-spinner"></span>Loading transaction history…</div>';
  }
  if (_vtb.txnError) {
    return vndrHtml + '<div class="vtb-no-data">Failed to load transaction history. Please try again.</div>';
  }

  var filtered = _vtbTxnFiltered();
  var sorted   = _vtbTxnSorted(filtered);
  var total    = sorted.length;
  var pgSz = _vtb.txnPgSz, pg = _vtb.txnPg;
  var start    = pg * pgSz;
  var page     = sorted.slice(start, start + pgSz);
  var maxPg    = Math.max(0, Math.ceil(total / pgSz) - 1);

  var cols = [
    { key:'txnId',        lbl:'Transaction ID'    },
    { key:'txnDate',      lbl:'Transaction Date'  },
    { key:'material',     lbl:'Material'          },
    { key:'qty',          lbl:'Quantity'          },
    { key:'txnValue',     lbl:'Txn Value'         },
    { key:'counterParty', lbl:'Buyer / Seller Name' },
    { key:'txnStatus',    lbl:'Status'            },
  ];

  var thHtml = cols.map(function(c) {
    var isAsc  = _vtb.txnSk === c.key && _vtb.txnSd ===  1;
    var isDesc = _vtb.txnSk === c.key && _vtb.txnSd === -1;
    var cls    = isAsc ? 'vtb-th-asc' : isDesc ? 'vtb-th-desc' : '';
    var ic     = isAsc ? '&#9650;' : isDesc ? '&#9660;' : '&#9651;';
    return '<th class="' + cls + '" onclick="vtbTxnSrt(\'' + c.key + '\')">'
      + esc(c.lbl) + '<span class="s-ic">' + ic + '</span></th>';
  }).join('');

  var trHtml = page.map(function(t) {
    var val = (t.txnValue !== null && t.txnValue !== undefined) ? '₹' + fmt(t.txnValue) : '—';
    var statusBadge = t.txnStatus
      ? '<span class="vtb-badge vtb-badge-ok">' + esc(t.txnStatus) + '</span>'
      : '—';
    var qty = (t.qty !== null && t.qty !== undefined && t.qty !== '') ? esc(String(t.qty)) : '—';
    return '<tr class="vtb-vl-row" style="cursor:default">'
      + '<td style="color:var(--txt3);font-size:11px">' + esc(t.txnId||'—') + '</td>'
      + '<td>' + esc(t.txnDate||'—') + '</td>'
      + '<td>' + esc(t.material||'—') + '</td>'
      + '<td style="text-align:right">' + qty + '</td>'
      + '<td style="text-align:right">' + val + '</td>'
      + '<td>' + esc(t.counterParty||'—') + '</td>'
      + '<td>' + statusBadge + '</td>'
      + '</tr>';
  }).join('');

  if (!trHtml) {
    var msg = !_vtb.txnRows.length
      ? 'No individual transaction records found for this vendor in the current dataset.'
      : 'No transactions matching "' + esc(_vtb.txnQ) + '".';
    trHtml = '<tr><td colspan="7" class="vtb-no-data" style="padding:40px">' + msg + '</td></tr>';
  }

  return vndrHtml
    + '<div class="vtb-toolbar"><input class="vtb-search" type="text" placeholder="Search transactions…" value="'
    + esc(_vtb.txnQ) + '" oninput="vtbTxnSetQ(this.value)">'
    + '<span class="vtb-count-lbl">' + total + ' transaction' + (total !== 1 ? 's' : '') + '</span></div>'
    + '<div class="vtb-vl-wrap"><table class="vtb-vl-tbl" style="min-width:700px"><thead><tr>' + thHtml + '</tr></thead>'
    + '<tbody>' + trHtml + '</tbody></table></div>'
    + '<div class="vtb-pg"><span>Showing ' + (total ? start + 1 : 0) + '–'
    + Math.min(start + pgSz, total) + ' of ' + total + '</span>'
    + '<div class="vtb-pg-btns">'
    + '<button class="vtb-pg-btn" onclick="vtbTxnPg(-1)"' + (pg <= 0 ? ' disabled' : '') + '>‹ Prev</button>'
    + '<button class="vtb-pg-btn" onclick="vtbTxnPg(1)"'  + (pg >= maxPg ? ' disabled' : '') + '>Next ›</button>'
    + '</div></div>';
}

function vtbTxnSrt(key) {
  _vtb.txnSd = (_vtb.txnSk === key) ? -_vtb.txnSd : -1;
  _vtb.txnSk = key; _vtb.txnPg = 0; _vtbRender();
}
function vtbTxnSetQ(v) { _vtb.txnQ = v; _vtb.txnPg = 0; _vtbRender(); }
function vtbTxnPg(d) {
  var max = Math.max(0, Math.ceil(_vtbTxnFiltered().length / _vtb.txnPgSz) - 1);
  _vtb.txnPg = Math.max(0, Math.min(_vtb.txnPg + d, max));
  _vtbRender();
}

function vtbSrt(key) {
  _vtb.sd = (_vtb.sk === key) ? -_vtb.sd : 1;
  _vtb.sk = key; _vtb.pg = 0; _vtbRender();
}
function vtbSetQ(v) { _vtb.q = v; _vtb.pg = 0; _vtbRender(); }
function vtbPg(d) {
  var max = Math.max(0, Math.ceil(_vtbFiltered().length / _vtb.pgSz) - 1);
  _vtb.pg = Math.max(0, Math.min(_vtb.pg + d, max));
  _vtbRender();
}

// STATUS LIST MODAL — In Review / Rejected vendor list
// ═══════════════════════════════════════════════════════════════
var _sl = { aud: 'seller', status: 'IN_REVIEW', q: '', rows: [], sk: 'name', sd: 1, pg: 0, pgSz: 20 };

function _slGatherRows(aud, status) {
  var myPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var seen = {}, rows = [];
  var cfg = getVertCfg();
  cfg.forEach(function(v) {
    try {
      var sv = JSON.parse(localStorage.getItem(STORE_PFX + 'vr_' + aud + '_' + v.key) || 'null');
      if (sv && sv.pKey === myPKey && Array.isArray(sv.rows)) {
        sv.rows.forEach(function(r) {
          if (r.status === status && !seen[r.id] && _isValidRec(r)) { seen[r.id] = true; rows.push(r); }
        });
      }
    } catch(e) {}
  });
  if (Array.isArray(vertRows)) {
    vertRows.forEach(function(r) {
      if ((r.audience || 'seller') === aud && r.status === status && !seen[r.id] && _isValidRec(r)) {
        seen[r.id] = true; rows.push(r);
      }
    });
  }
  return rows;
}

function openSlModal(aud, status) {
  _sl.aud    = aud || selectedAud || 'seller';
  _sl.status = status || 'IN_REVIEW';
  _sl.q = ''; _sl.sk = 'name'; _sl.sd = 1; _sl.pg = 0;
  _sl.rows = _slGatherRows(_sl.aud, _sl.status);
  _slRender();
  var m = document.getElementById('sl-modal');
  if (m) { void m.offsetHeight; m.classList.add('sl-open'); }
  document.addEventListener('keydown', _slEsc);
}

function closeSlModal() {
  var m = document.getElementById('sl-modal');
  if (m) m.classList.remove('sl-open');
  document.removeEventListener('keydown', _slEsc);
}

function _slEsc(e) {
  if (e.key !== 'Escape') return;
  var m = document.getElementById('sl-modal');
  if (!m || !m.classList.contains('sl-open')) return;
  e.stopPropagation();
  closeSlModal();
}

function _slFiltered() {
  var q = (_sl.q || '').toLowerCase().trim();
  if (!q) return _sl.rows.slice();
  return _sl.rows.filter(function(r) {
    return (r.name     || '').toLowerCase().indexOf(q) >= 0
        || (r.id       || '').toLowerCase().indexOf(q) >= 0
        || (r.state    || '').toLowerCase().indexOf(q) >= 0
        || (r.category || '').toLowerCase().indexOf(q) >= 0;
  });
}

function _slSorted(rows) {
  var k = _sl.sk, d = _sl.sd;
  return rows.slice().sort(function(a, b) {
    return d * String(a[k]||'').localeCompare(String(b[k]||''));
  });
}

function _slRender() {
  var hd   = document.getElementById('sl-hd');
  var body = document.getElementById('sl-body');
  if (!hd || !body) return;
  var isRej   = _sl.status === 'REJECTED';
  var stLbl   = isRej ? 'Rejected' : 'In Review';
  var audLbl  = _sl.aud === 'buyer' ? 'Buyer' : 'Seller';
  var stColor = isRej ? 'var(--st-rejected)' : 'var(--st-review)';

  hd.innerHTML = '<div class="sl-hd-txt">'
    + '<div class="sl-hd-title" style="color:' + stColor + '">' + stLbl + ' – ' + audLbl + ' Onboarding Pipeline</div>'
    + '<div class="sl-hd-sub">' + fmt(_sl.rows.length) + ' vendor' + (_sl.rows.length !== 1 ? 's' : '') + ' in this stage</div>'
    + '</div>'
    + '<button class="sl-hd-close" onclick="closeSlModal()" title="Close">×</button>';

  var filtered = _slFiltered();
  var sorted   = _slSorted(filtered);
  var total    = sorted.length;
  var pgSz = _sl.pgSz, pg = _sl.pg;
  var start = pg * pgSz;
  var page  = sorted.slice(start, start + pgSz);
  var maxPg = Math.max(0, Math.ceil(total / pgSz) - 1);

  var cols = [
    { key:'name',     lbl:'Company Name' },
    { key:'category', lbl:'Category'     },
    { key:'state',    lbl:'State'        }
  ];
  var thHtml = cols.map(function(c) {
    var isAsc  = _sl.sk === c.key && _sl.sd ===  1;
    var isDesc = _sl.sk === c.key && _sl.sd === -1;
    var cls = isAsc ? 'sl-th-asc' : isDesc ? 'sl-th-desc' : '';
    var ic  = isAsc ? '&#9650;' : isDesc ? '&#9660;' : '&#9651;';
    return '<th class="' + cls + '" onclick="slSrt(\'' + c.key + '\')">'
      + esc(c.lbl) + '<span class="s-ic">' + ic + '</span></th>';
  }).join('');

  var trHtml = page.map(function(r) {
    var cat    = r.category ? r.category.charAt(0).toUpperCase() + r.category.slice(1) : null;
    var catBg  = r.category === 'Plastic' ? 'rgba(255,159,10,.15)' : r.category === 'Metal' ? 'rgba(29,199,151,.12)' : 'rgba(99,99,102,.12)';
    var catClr = r.category === 'Plastic' ? '#B25000' : r.category === 'Metal' ? '#0A7044' : '#636366';
    return '<tr class="sl-row">'
      + '<td><strong>' + esc(r.name||'—') + '</strong>'
      + (r.id ? '<div style="font-size:11px;color:var(--txt3);font-family:monospace;margin-top:2px">' + esc(r.id) + '</div>' : '')
      + '</td>'
      + '<td>' + (cat ? '<span class="sl-cat-badge" style="background:' + catBg + ';color:' + catClr + '">' + esc(cat) + '</span>' : '—') + '</td>'
      + '<td>' + esc(r.state||'—') + '</td>'
      + '</tr>';
  }).join('');

  if (!trHtml) {
    trHtml = '<tr><td colspan="3" class="sl-no-data">'
      + (_sl.q ? 'No match for "' + esc(_sl.q) + '"' : 'No vendors in this stage for the current period.')
      + '</td></tr>';
  }

  var noRowsNote = !_sl.rows.length
    ? '<div style="padding:10px 16px 0;font-size:12px;color:var(--txt3)">Open a vertical to load vendor records.</div>'
    : '';

  body.innerHTML = noRowsNote
    + '<div class="sl-toolbar"><input class="sl-search" type="text" placeholder="Search name, ID, state…" value="' + esc(_sl.q) + '" oninput="slSetQ(this.value)">'
    + '<span class="sl-count">' + total + ' vendor' + (total !== 1 ? 's' : '') + '</span></div>'
    + '<table class="sl-tbl"><thead><tr>' + thHtml + '</tr></thead><tbody>' + trHtml + '</tbody></table>'
    + '<div class="sl-pg"><span>Showing ' + (total ? start + 1 : 0) + '–' + Math.min(start + pgSz, total) + ' of ' + total + '</span>'
    + '<div class="sl-pg-btns">'
    + '<button class="sl-pg-btn" onclick="slPg(-1)"' + (pg <= 0 ? ' disabled' : '') + '>‹ Prev</button>'
    + '<button class="sl-pg-btn" onclick="slPg(1)"' + (pg >= maxPg ? ' disabled' : '') + '>Next ›</button>'
    + '</div></div>';
}

function slSetQ(v) { _sl.q = v; _sl.pg = 0; _slRender(); }
function slSrt(key) {
  _sl.sd = (_sl.sk === key) ? -_sl.sd : 1;
  _sl.sk = key; _sl.pg = 0; _slRender();
}
function slPg(d) {
  var max = Math.max(0, Math.ceil(_slFiltered().length / _sl.pgSz) - 1);
  _sl.pg = Math.max(0, Math.min(_sl.pg + d, max));
  _slRender();
}

// ═══════════════════════════════════════════════════════════════
// DRAFT MODAL
// ═══════════════════════════════════════════════════════════════
var DM_SELLER_MANDATORY = ['gst_certificate','owner_pan','cancelled_cheque','kyc_document','gst_portal_screenshot_bank_details','msme_certificate'];
var DM_SELLER_LABELS = {'gst_certificate':'GST Certificate','owner_pan':'PAN Card','cancelled_cheque':'Cancelled Cheque','kyc_document':'KYC Document','gst_portal_screenshot_bank_details':'GST Portal Screenshot','msme_certificate':'MSME Certificate'};
var DM_BUYER_MANDATORY = ['entity_pan','gst_certificate','pwm_certificate'];
var DM_BUYER_LABELS = {'entity_pan':'Entity PAN','gst_certificate':'GST Certificate','pwm_certificate':'PWM Certificate'};

var _dm = {
  view:'summary', aud:'seller',
  f:{ aud:'all', cat:'', vtype:'', state:'', miss:'', q:'' },
  sk:'name', sd:1, pg:0, pgSz:25,
  allRows:[], selVendorId:null, _cache:null, _loading:false
};

function _dmBuildDocMap() {
  var m = {};
  if (!window.qualityData || !Array.isArray(window.qualityData.vendorDocs)) return m;
  window.qualityData.vendorDocs.forEach(function(d) {
    if (d.id) m[d.id] = d;
    if (d.gstin) m[d.gstin] = d;
  });
  return m;
}

function _dmMandatoryMissing(docRec, aud) {
  var keys = aud === 'buyer' ? DM_BUYER_MANDATORY : DM_SELLER_MANDATORY;
  if (!docRec) return keys.slice();
  var byKey = {};
  if (Array.isArray(docRec.docs)) docRec.docs.forEach(function(d){ byKey[d.key]=d; });
  return keys.filter(function(k){ var d=byKey[k]; return !d||!d.submitted; });
}

function _dmGatherAllRows(aud) {
  var myPKey = JSON.stringify([currentPeriod, customStart||'', customEnd||'']);
  var seen = {}, rows = [];
  var vertKey = activeVertKey || selectedVert;
  // Scope to the active vertical only — the pipeline card count is per-vertical
  if (vertKey) {
    try {
      var sv = JSON.parse(localStorage.getItem(STORE_PFX+'vr_'+aud+'_'+vertKey)||'null');
      if (sv && sv.pKey===myPKey && Array.isArray(sv.rows)) {
        sv.rows.forEach(function(r) {
          if (r.status==='DRAFT' && !seen[r.id] && _isValidRec(r)) { seen[r.id]=true; rows.push(Object.assign({},r,{audience:aud})); }
        });
      }
    } catch(e){}
  }
  // Fall back to the in-memory vertRows set if it belongs to the right audience
  if (Array.isArray(vertRows)) {
    vertRows.forEach(function(r) {
      var rAud = r.audience||'seller';
      if (rAud===aud && r.status==='DRAFT' && !seen[r.id] && _isValidRec(r)) { seen[r.id]=true; rows.push(Object.assign({},r,{audience:aud})); }
    });
  }
  return rows;
}

function _dmEnrich(rows) {
  var docMap = _dmBuildDocMap();
  return rows.map(function(r) {
    var aud = r.audience||'seller';
    var mKeys  = aud==='buyer' ? DM_BUYER_MANDATORY : DM_SELLER_MANDATORY;
    var mLbls  = aud==='buyer' ? DM_BUYER_LABELS    : DM_SELLER_LABELS;
    var docRec = docMap[r.id] || docMap[r.gstin] || null;
    var miss   = _dmMandatoryMissing(docRec, aud);
    var mTotal = mKeys.length;
    var mDone  = mTotal - miss.length;
    var pct    = mTotal>0 ? Math.round(mDone/mTotal*100) : 0;
    var reason;
    if (miss.length===0)      reason = 'Awaiting Review';
    else if (miss.length===1) reason = 'Missing '+(mLbls[miss[0]]||miss[0]);
    else                      reason = 'Multiple Mandatory Docs Pending';
    return Object.assign({},r,{_docRec:docRec,_mKeys:mKeys,_mLbls:mLbls,_miss:miss,_mTotal:mTotal,_mDone:mDone,_pct:pct,_reason:reason});
  });
}

function _dmFiltered(enriched) {
  var f=_dm.f, q=(f.q||'').toLowerCase().trim();
  return enriched.filter(function(r) {
    if (f.aud&&f.aud!=='all'&&r.audience!==f.aud) return false;
    if (f.cat&&r.category!==f.cat) return false;
    if (f.vtype&&r.vendorType!==f.vtype) return false;
    if (f.state&&r.state!==f.state) return false;
    if (f.miss) {
      var mc=r._miss.length;
      if (f.miss==='0'&&mc!==0) return false;
      if (f.miss==='1'&&mc!==1) return false;
      if (f.miss==='2'&&mc!==2) return false;
      if (f.miss==='3+'&&mc<3)  return false;
    }
    if (q) {
      var hay=[(r.name||''),(r.id||''),(r.category||''),(r.state||''),(r.vendorType||'')].join(' ').toLowerCase();
      if (hay.indexOf(q)<0) return false;
    }
    return true;
  });
}

function _dmSorted(rows) {
  var k=_dm.sk, d=_dm.sd;
  return rows.slice().sort(function(a,b) {
    var av,bv;
    if (k==='_miss') { av=a._miss.length; bv=b._miss.length; }
    else if (k==='_pct') { av=a._pct; bv=b._pct; }
    else { av=a[k]!=null?a[k]:''; bv=b[k]!=null?b[k]:''; }
    if (typeof av==='number'&&typeof bv==='number') return d*(av-bv);
    return d*String(av).localeCompare(String(bv));
  });
}

function _esc(v){ return String(v||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function openDmModal(aud) {
  _dm.aud = aud||'seller';
  _dm.view='summary';
  _dm.f={ aud:_dm.aud, cat:'', vtype:'', state:'', miss:'', q:'' };
  _dm.sk='name'; _dm.sd=1; _dm.pg=0; _dm.pgSz=25;
  _dm.selVendorId=null; _dm._cache=null; _dm._loading=false;
  _dm.allRows = _dmGatherAllRows(_dm.aud);
  _dm._cache  = _dmEnrich(_dm.allRows);
  // If the row cache for this audience+vertical is missing, fetch it from server.
  // The summary tile shows the authoritative count from dashboard aggregates while loading.
  var vertKey = activeVertKey || selectedVert;
  var myPKey  = JSON.stringify([currentPeriod, customStart||'', customEnd||'']);
  var cacheHit = false;
  if (vertKey) {
    try {
      var sv = JSON.parse(localStorage.getItem(STORE_PFX+'vr_'+_dm.aud+'_'+vertKey)||'null');
      cacheHit = !!(sv && sv.pKey===myPKey && Array.isArray(sv.rows));
    } catch(e){}
  }
  if (!cacheHit && vertKey) { _dm._loading=true; _dmFetchRows(vertKey, _dm.aud); }
  _dmRender();
  var el=document.getElementById('draft-modal');
  if (el){ el.style.display='flex'; requestAnimationFrame(function(){ el.classList.add('dm-open'); }); }
  document.addEventListener('keydown',_dmEsc);
}

function closeDmModal() {
  var el=document.getElementById('draft-modal');
  if (el){ el.classList.remove('dm-open'); setTimeout(function(){ el.style.display='none'; },230); }
  document.removeEventListener('keydown',_dmEsc);
}
function _dmEsc(e){ if(e.key==='Escape') closeDmModal(); }

// Fetch row data for the given vertical+audience when the localStorage cache is missing.
// Persists the full row set so future modal opens are instant, then re-renders if still open.
function _dmFetchRows(vertKey, aud) {
  var myPKey = JSON.stringify([currentPeriod, customStart||'', customEnd||'']);
  var lsVKey = STORE_PFX+'vr_'+aud+'_'+vertKey;
  var f = { audience: aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (_dm.aud !== aud) return; // audience changed while fetching
      _dm._loading = false;
      try {
        var data = JSON.parse(res);
        if (data.success) {
          try { localStorage.setItem(lsVKey, JSON.stringify({ pKey: myPKey, rows: data.rows||[] })); } catch(e){}
          _dm.allRows = (data.rows||[])
            .filter(function(r){ return r.status==='DRAFT'; })
            .map(function(r){ return Object.assign({},r,{audience:aud}); });
          _dm._cache = _dmEnrich(_dm.allRows);
        }
      } catch(e){}
      var el = document.getElementById('draft-modal');
      if (el && el.style.display !== 'none') _dmRender();
    })
    .withFailureHandler(function() {
      if (_dm.aud !== aud) return;
      _dm._loading = false;
      var el = document.getElementById('draft-modal');
      if (el && el.style.display !== 'none') _dmRender();
    })
    .getVerticalRows(vertKey, JSON.stringify(f));
}

function dmOpenDetail(aud) { _dm.view='detail'; if(aud) _dm.f.aud=aud; _dm.pg=0; _dmRender(); }
function dmOpenVendor(id)  { _dm.view='vendor'; _dm.selVendorId=id; _dmRender(); }
function dmBack() {
  if (_dm.view==='vendor') { _dm.view='detail'; _dmRender(); }
  else { _dm.view='summary'; _dmRender(); }
}
function dmSetF(k,v){ _dm.f[k]=v; _dm.pg=0; _dmRender(); }
function dmSort(k){ _dm.sd=(_dm.sk===k)?-_dm.sd:1; _dm.sk=k; _dm.pg=0; _dmRender(); }
function dmPg(d){
  var max=Math.max(0,Math.ceil(_dmFiltered(_dm._cache||[]).length/_dm.pgSz)-1);
  _dm.pg=Math.max(0,Math.min(_dm.pg+d,max)); _dmRender();
}
function dmSetPgSz(n){ _dm.pgSz=+n; _dm.pg=0; _dmRender(); }

function dmExportCSV() {
  var rows=_dmSorted(_dmFiltered(_dm._cache||[]));
  var hdr=['Company Name','Vendor ID','Audience','Category','Vendor Type','State','Created Date','Doc Completion %','Missing Count','Reason'];
  var lines=[hdr.join(',')];
  rows.forEach(function(r){
    lines.push([
      '"'+(r.name||'').replace(/"/g,'""')+'"',
      '"'+(r.id||'')+'"',
      r.audience,
      '"'+(r.category||'')+'"',
      '"'+(r.vendorType||'')+'"',
      '"'+(r.state||'')+'"',
      '"'+(r.createdDate||'')+'"',
      r._pct+'%',
      r._miss.length,
      '"'+(r._reason||'').replace(/"/g,'""')+'"'
    ].join(','));
  });
  var blob=new Blob([lines.join('\n')],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='draft_'+_dm.aud+'s_'+(new Date().toISOString().slice(0,10))+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
