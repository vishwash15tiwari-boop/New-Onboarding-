// ── Animated number counters — count up only when a value actually changes ──
var _counterPrev = {};   // id → last shown value, so silent refreshes don't re-run
function animateCounters(scope) {
  var els = (scope || document).querySelectorAll('[data-count]');
  els.forEach(function(el) {
    var id     = el.getAttribute('data-count-id') || '';
    var target = parseInt(el.getAttribute('data-count'), 10) || 0;
    var prev   = (id && _counterPrev[id] !== undefined) ? _counterPrev[id] : null;
    if (id) _counterPrev[id] = target;
    if (!motionOK() || prev === target) { el.textContent = fmt(target); return; }
    var from  = (prev === null) ? 0 : prev;
    var t0    = performance.now(), dur = 650;
    (function tick(now) {
      var p = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);   // ease-out cubic
      el.textContent = fmt(Math.round(from + (target - from) * e));
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  });
}

function scheduleNextRefresh() {
  clearTimeout(_refreshTimer);
  clearInterval(_countdownTimer);
  _nextAt = Date.now() + AUTO_REFRESH_SEC * 1000;

  var el = document.getElementById('refresh-countdown');
  _countdownTimer = setInterval(function() {
    var rem = Math.max(0, Math.ceil((_nextAt - Date.now()) / 1000));
    if (el) el.textContent = (rem >= 60 ? Math.floor(rem / 60) + 'm ' : '') + (rem % 60) + 's';
  }, 1000);

  _refreshTimer = setTimeout(function() { refreshActive(true); }, AUTO_REFRESH_SEC * 1000);
}

// Reload whichever view is active (manual refresh button + auto-refresh timer).
function refreshActive(silent) {
  if (currentView === 'gst') loadGSTData(silent);
  else loadData(silent);
}

// Primary: getCombinedDashboard (one call, seller + buyer together).
// Fallback: two getDashboardData calls when the combined cache is cold and
// the live read returns empty seller data (Metabase temporarily unreachable).
function loadData(silent) {
  var btn = document.getElementById('btn-refresh');
  if (btn) btn.classList.add('spinning');
  clearTimeout(_refreshTimer);
  clearInterval(_countdownTimer);
  var cd = document.getElementById('refresh-countdown');
  if (cd) cd.textContent = '…';

  function done() {
    if (btn) btn.classList.remove('spinning');
    if (_isFirstLoad) { hideLoading(); _isFirstLoad = false; }
    scheduleNextRefresh();
  }
  function fail(msg) {
    if (_isFirstLoad) { _isFirstLoad = false; hideLoading(); showError(msg, true); }
    else if (!silent) showError(msg, false);
    if (btn) btn.classList.remove('spinning');
    scheduleNextRefresh();
  }

  var baseF = { period: currentPeriod };
  if (currentPeriod === 'Custom') { baseF.startDate = customStart; baseF.endDate = customEnd; }
  var filtersJson = JSON.stringify(baseF);
  var sellerF = JSON.stringify({ audience: 'seller', period: baseF.period, startDate: baseF.startDate, endDate: baseF.endDate });
  var buyerF  = JSON.stringify({ audience: 'buyer',  period: baseF.period, startDate: baseF.startDate, endDate: baseF.endDate });

  function applyAndRender(newDS, newDB, meta) {
    DS = newDS; DB = newDB; D = meta;
    D.verticals      = DS.verticals;
    D.verticalConfig = meta.verticalConfig || [];
    D.fiscalYears    = (meta.seller && meta.seller.fiscalYears) || meta.fiscalYears || [];
    try {
      localStorage.setItem(STORE_PFX + 'combined', JSON.stringify({
        success: true, lastUpdated: D.lastUpdated, dataSource: D.dataSource,
        verticalConfig: D.verticalConfig, fiscalYears: D.fiscalYears,
        seller: DS, buyer: DB,
      }));
    } catch (e) {}
    var hash = D.lastUpdated || '';
    if (_lastDashHash['combined'] !== hash) {
      _lastDashHash['combined'] = hash;
      qualityData = null;
      qualityLoading = false;
      var newPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
      if (selectedVert && _vertRowsPKey !== newPKey) {
        vertRows = []; vertRowsLoading = false; vertRowsError = null;
        loadVertRows(selectedVert);
      }
      try { renderAll(); } catch (e) { console.error('renderAll error', e); }
    }
    done();
  }

  // Returns true if seller verticals object has at least one non-zero total.
  function hasSellerData(verticals) {
    if (!verticals) return false;
    return Object.keys(verticals).some(function(k) { return (verticals[k].total || 0) > 0; });
  }

  // Fallback: two individual getDashboardData calls (seller is fatal, buyer is not).
  function loadFallback() {
    var _sData = null, _bData = null, _pending = 2, _fbFailed = false;
    function tryFbMerge() {
      if (_fbFailed || --_pending > 0) return;
      applyAndRender(
        _sData ? { verticals: _sData.verticals || {} } : { verticals: {} },
        _bData ? { verticals: _bData.verticals || {} } : { verticals: {} },
        _sData || _bData || {}
      );
    }
    google.script.run
      .withSuccessHandler(function(res) {
        try { var d = JSON.parse(res); if (d && d.verticals) _sData = d; else { _fbFailed = true; fail((d && d.error) || 'Seller error'); return; } } catch (e) { _fbFailed = true; fail('Parse error'); return; }
        tryFbMerge();
      })
      .withFailureHandler(function(err) { if (!_fbFailed) { _fbFailed = true; fail((err && err.message) || 'Script error'); } })
      .getDashboardData(sellerF);
    google.script.run
      .withSuccessHandler(function(res) { try { var d = JSON.parse(res); if (d && d.verticals) _bData = d; } catch (e) {} tryFbMerge(); })
      .withFailureHandler(function() { tryFbMerge(); })
      .getDashboardData(buyerF);
  }

  // Primary: single combined call.
  google.script.run
    .withSuccessHandler(function(res) {
      try {
        var d = JSON.parse(res);
        if (!d || !d.success || !d.seller) { fail((d && d.error) || 'Data error'); return; }
        var sVerts = (d.seller && d.seller.verticals) || {};
        // If combined returned empty seller data (cold cache + Metabase unreachable),
        // fall back to individual calls which may hit the pre-warmed getDashboardData cache.
        if (!hasSellerData(sVerts)) { loadFallback(); return; }
        applyAndRender(
          { verticals: sVerts },
          { verticals: (d.buyer && d.buyer.verticals) || {} },
          d
        );
      } catch (e) { fail('Parse error: ' + e.message); }
    })
    .withFailureHandler(function(err) {
      // getCombinedDashboard not available (older deployment) — fall back.
      loadFallback();
    })
    .getCombinedDashboard(filtersJson);
}

  EPR:           { c: '#AF52DE', ink: '#8944AB' },   // iOS purple

function hexRGBA(hex, a) {
  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
  if (!m) return 'rgba(0,0,0,' + a + ')';
  var n = parseInt(m[1], 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
// Inline CSS-variable pack for a vertical's signature colour.
function vcVars(key) {
  var vc = VERT_COLORS[key] || VERT_COLORS.Others;
  return '--vc:' + vc.c + ';--vc-ink:' + vc.ink

}

// Shared funnel order — the meter bars and the 3D funnel render this exact
// sequence: Total Cases, then Onboarded, then the remaining stages by
// descending count (so the funnel narrows properly).
function funnelTiers(v) {
  var rest = [
    { k: 'draft',  n: v.draft    || 0 },
    { k: 'review', n: v.inReview || 0 },
  ];
  if (v.transacted !== null && v.transacted !== undefined) {
    rest.push({ k: 'transacted', n: v.transacted });
  }
  rest.sort(function(a, b) { return b.n - a.n; });
  return [{ k: 'total', n: v.total || 0, isTotal: true }, { k: 'onboarded', n: v.completed || 0 }].concat(rest);
}

// Detail funnel — Apple Activity-style concentric rings. One ring per stage,
// sweep proportional to its share of Total (12 o'clock, clockwise); Total sits
// in the centre. The legend carries the exact counts, so precision never
// depends on reading arc lengths. Ring order matches the 3D funnel.
function funnelBig(v, cfg) {
  var tot = v.total || 0;
  if (!tot) return '';

  // Outermost → innermost: Onboarded, then the rest of the pipeline by
  // descending count (same as funnelTiers), Rejected always innermost.
  var tiers = funnelTiers(v).filter(function(t) { return !t.isTotal; });
  tiers.push({ k: 'rejected', n: v.rejected || 0 });

  var S = 260, c0 = S / 2;            // svg size / centre
  var R0 = 112, RW = 14, RGAP = 4;    // outer radius, ring width, ring gap

  var rings = tiers.map(function(t, i) {
    var r = R0 - i * (RW + RGAP);
    if (r < 24) return '';            // never collide with the centre label
    var C = 2 * Math.PI * r;
    var frac = Math.max(0, Math.min(1, (t.n || 0) / tot));
    var st = STAGE[t.k];
    var track = '<circle cx="' + c0 + '" cy="' + c0 + '" r="' + r + '" fill="none"'
      + ' stroke="var(--bg2)" stroke-width="' + RW + '"/>';
    if (!frac) return track;
    // Floor tiny arcs at one ring-width so they read as arcs, never dots;
    // the legend + tooltip carry the exact value.
    var dash = Math.max(frac * C, RW);
    var arc = '<circle class="fring" cx="' + c0 + '" cy="' + c0 + '" r="' + r + '" fill="none"'
      + ' stroke="' + st.fill + '" stroke-width="' + RW + '" stroke-linecap="round"'
      + ' stroke-dasharray="' + dash.toFixed(2) + ' ' + C.toFixed(2) + '"'
      + ' transform="rotate(-90 ' + c0 + ' ' + c0 + ')"'
      + ' style="animation-delay:' + (120 + i * 110) + 'ms"'
      + '><title>' + st.lbl + ' — ' + fmt(t.n) + ' (' + Math.round(frac * 100) + '%)</title></circle>';
    return track + arc;
  }).join('');

  var centre = '<g class="donut-ctr">'
    + '<text x="' + c0 + '" y="' + (c0 - 2) + '" text-anchor="middle" font-family="Inter,sans-serif"'
    + ' font-size="23" font-weight="800" fill="var(--txt)">' + fmt(tot) + '</text>'
    + '<text x="' + c0 + '" y="' + (c0 + 13) + '" text-anchor="middle" font-family="Inter,sans-serif"'
    + ' font-size="8" font-weight="600" fill="var(--txt3)" letter-spacing="0.5">TOTAL CASES</text>'
    + '</g>';

  var svg = '<svg width="' + S + '" height="' + S + '" viewBox="0 0 ' + S + ' ' + S + '"'
    + ' style="flex-shrink:0;display:block" role="img" aria-label="Onboarding funnel rings">'
    + rings + centre + '</svg>';

  var legend = '<div class="fring-leg">'
    + [{ k: 'total', n: tot }].concat(tiers).map(function(t) {
        var st   = STAGE[t.k];
        var pc   = Math.round(((t.n || 0) / tot) * 100);
        var hero = t.k === 'onboarded';
        return '<div class="fring-leg-row' + (hero ? ' is-hero' : '') + '">'
          + '<span class="cc-dot" style="background:' + st.fill + '"></span>'
          + '<span class="fring-leg-lbl">' + st.lbl + '</span>'
          + '<span class="fring-leg-val">' + fmt(t.n) + '</span>'
          + '<span class="fring-leg-pct">(' + pc + '%)</span>'
          + '</div>';
      }).join('')
    + '</div>';

  return '<div class="fun-split">'
    + '<div class="fun-rings">' + svg + legend + '</div>'
    + '<div class="fun-3d">' + funnel3D(v) + '</div>'
    + '</div>';
}

// Small 3D funnel. Sequence: Total Cases, then Onboarded, then the remaining
// stages by descending count (so the funnel narrows properly). Each stage is a
// row: a centred 3D band (width ∝ its share of Total) beside a small detail
// card naming the stage and its count.
function funnel3D(v) {
  var tot = v.total || 0;
  if (!tot) return '';
  var tiers = funnelTiers(v);

  var BA = 178, cx = 89, FW = 166, ry = 6, y0 = 6, bandH = 28, y1 = y0 + bandH, vbH = 40;
  var scale = function(n) { return Math.min(FW, Math.max(28, FW * ((n || 0) / tot))); };

  // Shared cylindrical-sheen gradient, defined once for all band SVGs.
  var out = '<div class="f3d"><svg width="0" height="0" style="position:absolute" aria-hidden="true">'
    + '<defs><linearGradient id="f3d-cyl" x1="0" y1="0" x2="1" y2="0">'
    +   '<stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".40" stop-color="#fff" stop-opacity="0"/>'
    +   '<stop offset=".64" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>'
    + '</linearGradient></defs></svg>';

  out += tiers.map(function(t) {
    var w  = scale(t.n);
    var wB = w * 0.86;
    var col = STAGE[t.k].fill;
    var trap = 'M' + (cx - w / 2) + ' ' + y0 + ' L' + (cx + w / 2) + ' ' + y0
             + ' L' + (cx + wB / 2) + ' ' + y1 + ' L' + (cx - wB / 2) + ' ' + y1 + ' Z';
    var band = '<svg class="f3d-band-svg" viewBox="0 0 ' + BA + ' ' + vbH + '" role="img" aria-label="' + esc(STAGE[t.k].lbl) + '">'
      + '<path d="' + trap + '" fill="' + col + '"/>'
      + '<ellipse cx="' + cx + '" cy="' + y0 + '" rx="' + (w / 2).toFixed(1) + '" ry="' + ry + '" fill="' + col + '"/>'
      + '<ellipse cx="' + cx + '" cy="' + y0 + '" rx="' + (w / 2).toFixed(1) + '" ry="' + ry + '" fill="#fff" opacity=".26"/>'
      + '<path d="' + trap + '" fill="url(#f3d-cyl)"/>'
      + '<ellipse cx="' + cx + '" cy="' + y1 + '" rx="' + (wB / 2).toFixed(1) + '" ry="' + (ry * 0.78).toFixed(1) + '" fill="' + col + '"/>'
      + '<ellipse cx="' + cx + '" cy="' + y1 + '" rx="' + (wB / 2).toFixed(1) + '" ry="' + (ry * 0.78).toFixed(1) + '" fill="#000" opacity=".12"/>'
      + '</svg>';
    var card = '<div class="f3d-card"><span class="cc-dot" style="background:' + col + '"></span>'
      + '<span class="f3d-card-lbl">' + STAGE[t.k].lbl + '</span>'
      + '<span class="f3d-card-val">' + fmt(t.n) + '</span></div>';
    return '<div class="f3d-row">' + band + card + '</div>';
  }).join('');

  return out + '</div>';
}

// ── Liquid tab thumb — the white pill that slides between vertical tabs.
//    Recreated on every bar re-render (innerHTML wipes it); positioned from
//    the active tab's box. animate=false snaps (first paint, resize, refresh).
function positionVertThumb(animate) {
  var bar = document.getElementById('vert-tabs-bar');
  if (!bar) return;
  var active = bar.querySelector('.vert-tab.active');
  var thumb  = bar.querySelector('.vert-tab-thumb');
  if (!active) { if (thumb) thumb.style.width = '0px'; return; }
  if (!active.offsetWidth) return;   // bar hidden (GST view) — keep last position
  if (!thumb) {
    thumb = document.createElement('div');
    thumb.className = 'vert-tab-thumb';
    bar.insertBefore(thumb, bar.firstChild);
  }
  bar.classList.add('has-thumb');
  var instant = animate === false || !motionOK();
  if (instant) thumb.style.transition = 'none';
  thumb.style.width = active.offsetWidth + 'px';
  thumb.style.transform = 'translateX(' + active.offsetLeft + 'px)';
  if (instant) requestAnimationFrame(function() { thumb.style.transition = ''; });
}
window.addEventListener('resize', function() { positionVertThumb(false); });
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function() { positionVertThumb(false); });
}

function renderVertCtxHdr(key) {
  var el = document.getElementById('vert-ctx-hdr');
  if (!el) return;
  if (currentView === 'gst' || !key) { el.innerHTML = ''; return; }
  var cfg = getVertCfg().filter(function(c) { return c.key === key; })[0];
  if (!cfg) { el.innerHTML = ''; return; }
  el.setAttribute('style', vcVars(key));
  el.innerHTML = '<span class="vert-ctx-code">' + esc(cfg.code || cfg.key) + '</span>'
    + '<span class="vert-ctx-name">' + esc(cfg.name) + '</span>';
}

function selectVertTab(key) {
  if (activeVertKey === key) return;
  activeVertKey = key;
  selectedVert  = key;
  // Reset rows — new vertical, fresh load
  vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '' };
  vdSort = { key: '', dir: 1 };
  vertRows = []; vertRowsLoading = true; vertRowsError = null;
  _vertRowsPKey = null; ++_vertRowsGen;
  // Update tab active states in-place (faster than full re-render)
  var actTab = null;
  document.querySelectorAll('.vert-tab[data-key]').forEach(function(t) {
    t.classList.toggle('active', t.dataset.key === key);
    if (t.dataset.key === key) { t.setAttribute('style', vcVars(key)); actTab = t; }
  });
  positionVertThumb(true);
  setAura(key);
  if (actTab && actTab.scrollIntoView) {
    try { actTab.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'nearest', inline: 'nearest' }); } catch (e) {}
  }
  renderVertCtxHdr(key);
  renderVertKPIs(key);
  renderPipelinePair(key);
  var detEl = document.getElementById('vert-detail-section');
  if (detEl) detEl.style.display = '';
  renderInlineDetail(key);
  loadVertRows(key);
}

// Merge seller+buyer FY breakdowns into one chronological series per metric.
function mergeFYSeries(vsF, vbF, field) {
  var m = {};
  (vsF || []).concat(vbF || []).forEach(function(f) {
    if (!f || !f.fy) return;
    if (m[f.fy] === undefined) m[f.fy] = null;
    if (f[field] != null) m[f.fy] = (m[f.fy] || 0) + f[field];
  });
  return Object.keys(m).sort().map(function(k) { return m[k]; });
}

// Mini FY bar sparkline — quiet bars, latest year in the accent colour.
function sparkBars(vals, accent, dark) {
  vals = (vals || []).filter(function(v) { return v != null; });
  if (vals.length < 2) return '';
  var max = Math.max.apply(null, vals);
  if (!(max > 0)) return '';
  var H = 26, bw = 9, gap = 5;
  var n = vals.length, W = n * bw + (n - 1) * gap;
  var base = dark ? 'rgba(255,255,255,.22)' : 'rgba(60,60,67,.18)';
  return '<svg class="vkpi-spark" viewBox="0 0 ' + W + ' ' + H + '" style="width:' + W + 'px" aria-hidden="true">'
    + vals.map(function(v, i) {
        var h = Math.max(3, Math.round((v / max) * H));
        var x = i * (bw + gap), y = H - h;
        return '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" rx="2.5" fill="' + (i === n - 1 ? accent : base) + '"/>';
      }).join('')
    + '</svg>';
}

function renderVertKPIs(key) {

  // FY sparklines from real breakdown data (skipped when <2 years exist)

  var spTxn   = sparkBars(mergeFYSeries(vs.fyBreakdown, vb.fyBreakdown, 'transacted'), 'var(--st-transacted)', false);

  // Completion meter on the ink card — onboarded share of the whole pipeline
  var totAll  = totalS + totalB;
  var compPct = totAll > 0 ? Math.round(((compS + compB) / totAll) * 100) : 0;

  var PC = '#FF9F0A', MC = '#8E8E93';
  function matLine(p, m) {
    if (!p && !m) return '';
    return '<div class="vkpi-mat">'
      + '<span class="vkpi-mat-chip"><i class="vkpi-mat-dot" style="background:' + PC + '"></i>' + fmt(p) + ' plastic</span>'
      + '<span class="vkpi-mat-chip"><i class="vkpi-mat-dot" style="background:' + MC + '"></i>' + fmt(m) + ' metal</span>'

  function matBracket(p, m) {
    if (!p && !m) return '';

  var pTotal   = (vs.plasticTotal      || 0) + (vb.plasticTotal      || 0);

    // ── Quality summary cards (patched async after loadQualityData) ──
    var icStar   = svg('<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>');
    var icShield = svg('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>');
    var icDocFl  = svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>');

    var qc     = qualityData && qualityData.success ? (qualityData.seller || {}) : null;
    var rQ     = qc ? (qc.rating || {}) : null;
    var oQ     = qc ? (qc.osv    || {}) : null;
    var dQ     = qc ? (qc.docs   || {}) : null;
    var selOnb = compS || 0; // total sellers onboarded on OMP — the correct denominator

    var rVal = rQ && rQ.avg != null ? rQ.avg.toFixed(1) + '★' : '—';
    var rSub = rQ ? fmt(rQ.rated || 0) + (selOnb > 0 ? ' of ' + fmt(selOnb) : '') + ' rated' : 'Syncing…';
    var oVal = selOnb > 0 && oQ ? Math.round((oQ.completed || 0) / selOnb * 100) + '%' : '—';
    var oSub = oQ ? fmt(oQ.completed || 0) + (selOnb > 0 ? ' of ' + fmt(selOnb) : '') + ' verified' : 'Syncing…';
    var dVal = selOnb > 0 && dQ ? Math.round((dQ.complete  || 0) / selOnb * 100) + '%' : '—';
    var dSub = dQ ? fmt(dQ.complete  || 0) + (selOnb > 0 ? ' of ' + fmt(selOnb) : '') + ' complete' : 'Syncing…';

    cards.push(mk(icStar,   'Vendor Rating', rVal, rSub, 'vk-rating', 'rating', 'qkpi-rating'));
    cards.push(mk(icShield, 'OSV Status',    oVal, oSub, 'vk-osv',    'osv',    'qkpi-osv'));
    cards.push(mk(icDocFl,  'Doc Status',    dVal, dSub, 'vk-docs',   'docs',   'qkpi-docs'));
  }
  // Wrap cards naturally by minimum width instead of forcing fixed columns per card count.
  // This ensures OMP's 7 cards (or any count) stays readable — wraps 4+3 or best fit.
  el.style.gridTemplateColumns = 'repeat(auto-fit, minmax(240px, 1fr))';
  el.innerHTML = cards.join('');
  animateCounters(el);
}

function vkpiOpen(action) {
  var aud = selectedAud || 'seller';
  var detEl = document.getElementById('vert-detail-section');
  var rowsReady = vertRows.length > 0 && !vertRowsLoading;
  if (rowsReady && detEl) {
    vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '' };
    ['vdf-category','vdf-vendor','vdf-status','vdf-gst'].forEach(function(id) {
      var e = document.getElementById(id); if (e) e.value = 'All';
    });
    var s = document.getElementById('vdf-search'); if (s) s.value = '';
    if (action === 'missing') {
      vdF.gst = 'Inactive';
      var e = document.getElementById('vdf-gst'); if (e) e.value = 'Inactive';
    } else if (action === 'onboarded') {
      vdF.status = 'COMPLETED';
      var e = document.getElementById('vdf-status'); if (e) e.value = 'COMPLETED';
    }
    renderVdRecords();
    detEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    setDetailAud(aud);
  }
}

function openKpiModal(cardId) {
  window._lastKpiCardId = cardId;

  var S = '#34C759', B = '#007AFF';
  var PC = '#FF9F0A', MC = '#8E8E93';

  // ── layout primitives ────────────────────────────────────────
  function hero(num, lbl) {
    return '<div class="km-hero">'
      + '<div class="km-hero-num">' + num + '</div>'

  }
  function srow(items) {

            + '<div class="km-sl">' + it.l + '</div>'
            + (it.s ? '<div class="km-sb">' + it.s + '</div>' : '')
            + '</div>';

  function sec(title, inner) {
    return '<div class="km-sec"><div class="km-sec-t">' + title + '</div>' + inner + '</div>';

  function sbar(segs) {
    var tot = segs.reduce(function(a, s) { return a + s.w; }, 0);

    return '<div class="km-sbar">'
      + segs.map(function(s) {
          return s.w > 0 ? '<div style="flex:' + s.w + ';background:' + s.color + '"></div>' : '';
        }).join('') + '</div>';
  }
  function sgrid(items, two) {
    return '<div class="km-sg' + (two ? ' km-sg-2' : '') + '">'
      + items.map(function(it) {
          return '<div class="km-sg-item">'
            + '<div class="km-sg-v">' + it.v + '</div>'
            + '<div class="km-sg-l"><i class="km-dot" style="background:' + it.c + '"></i>' + it.l + '</div>'
            + '</div>';
        }).join('') + '</div>';
  }
  function expandTileGrid(specs) {
    var gid = 'etg' + Math.random().toString(36).slice(2, 8);
    var h = '<div class="km-sg" id="' + gid + '-g">'
      + specs.map(function(sp, si) {
          var vendors = sp.vendors || [];

            return '<div class="km-sg-item">'
              + '<div class="km-sg-v">' + sp.v + '</div>'
              + '<div class="km-sg-l"><i class="km-dot" style="background:' + sp.c + '"></i>' + sp.l + '</div>'
              + '</div>';
          }
          var tid = gid + '-p' + si;
          return '<div class="km-sg-item km-sg-xp" role="button" tabindex="0"'

            + '<div class="km-sg-v">' + sp.v + '</div>'

        }).join('')

    specs.forEach(function(sp, si) {

      h += '<div id="' + tid + '" class="km-tile-vlist" style="display:none">';

            + '<span class="km-vname" style="min-width:100px">' + esc(v.name || 'Unknown') + '</span>'
            + (v.gstin ? '<span class="km-vaud">' + esc(v.gstin) + '</span>' : '')
            + '<span class="km-vbadge" style="background:' + cBg + ';color:' + cClr + '">' + cLbl + '</span>'
            + (v.category ? '<span class="km-vbadge" style="background:rgba(0,122,255,.10);color:#0066CC;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(v.category) + '</span>' : '')
            + '</div>';

        var vr = '<div class="km-vrow"' + (sp.mode === 'docs' && v.missingDocs && v.missingDocs.length ? ' style="flex-wrap:wrap;align-items:flex-start"' : '') + '>';

        vr += '<span class="km-vname">' + esc(v.name || 'Unknown') + '</span>';
        if (v.aud === 'seller' || v.aud === 'buyer') {

          vr += '<span class="km-vaud">' + (v.submitted || 0) + '/' + (v.total || 0) + '</span>';
          if (v.missingDocs && v.missingDocs.length > 0) {
            vr += '<span class="km-vmissing">Missing: ' + esc(v.missingDocs.join(' · ')) + '</span>';

        vr += '</div>';
        return vr;

      }
      h += '</div>';
    });
    return h;
  }
  function matBadges(p, m) {
    if (!p && !m) return '';
    return '<div class="km-mat">'
      + '<div class="km-mb"><div class="km-mb-dot" style="background:' + PC + '"></div>'

      + '<div class="km-mb"><div class="km-mb-dot" style="background:' + MC + '"></div>'

  }

  var content = '', title = '', subtitle = '', iconHtml = '';
  var vs = d ? d.vs : {}, vb = d ? d.vb : {};

  if (cardId === 'total') {
    title = 'Total Cases';
    subtitle = 'All pipeline entries across sellers & buyers';
    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>';
    var dComb = (vs.draft || 0) + (vb.draft || 0);
    var rComb = (vs.inReview || 0) + (vb.inReview || 0);
    var jComb = (vs.rejected || 0) + (vb.rejected || 0);
    content =
      hero(fmt(d.totalS + d.totalB), 'Total Pipeline')
      + srow([
          {v: fmt(d.totalS), l: 'Sellers', c: S},
          {v: fmt(d.totalB), l: 'Buyers',  c: B},
        ])
      + sec('Pipeline Status',
          sbar([
            {w: d.compS + d.compB, color: 'var(--st-onboarded)'},
            {w: dComb,             color: 'var(--st-draft)'},
            {w: rComb,             color: 'var(--st-review)'},
            {w: jComb,             color: 'var(--st-rejected)'},
          ])
          + sgrid([
              {v: fmt(d.compS + d.compB), l: 'Onboarded', c: 'var(--st-onboarded)'},

  } else if (cardId === 'onboarded') {

    var tatS = vs.avgTAT != null ? vs.avgTAT + 'd avg TAT' : null;

    content =
      hero(fmt(d.compS + d.compB), 'Onboarded')

          {v: fmt(d.compS), l: 'Sellers', c: S, s: tatS},
          {v: fmt(d.compB), l: 'Buyers',  c: B, s: tatB},
        ])
      + srow([
          {v: d.compPct + '%', l: 'Completion Rate', s: 'of total pipeline'},
          {v: fmt(((d.vs.draft||0)+(d.vb.draft||0))+((d.vs.inReview||0)+(d.vb.inReview||0))), l: 'Active Pipeline', s: 'draft + in review'},
        ])
      + (d.pOnb + d.mOnb > 0 ? sec('Material Mix', matBadges(d.pOnb, d.mOnb)) : '');

  } else if (cardId === 'transacted') {

    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>';
    var gmvCombined = (vs.totalTxnValue || 0) + (vb.totalTxnValue || 0);
    var sPMSub = (vs.plasticTransacted || vs.metalTransacted)

    var txnUnique = d.txnUniqueTotal || d.txnTotal;
    content =
      hero(fmt(d.txnTotal), 'Transacted')
      + srow([
          {v: fmt(txnUnique),                          l: 'Unique Transactions', s: 'distinct txns completed'},
          {v: fmt(d.txnS != null ? d.txnS : 0), c: S, l: 'Unique Sellers',      s: sPMSub},
          {v: fmt(d.txnB != null ? d.txnB : 0), c: B, l: 'Unique Buyers',       s: bPMSub},
        ])
      + srow(metricItems)
      + (d.pTxn + d.mTxn > 0 ? sec('Material Split', matBadges(d.pTxn, d.mTxn)) : '')
      + '<div class="km-txn-expand">'

      + 'View Transaction Details ↓'

      + '<div id="txn-detail-wrap" style="display:none;margin-top:4px"></div>';

  } else if (cardId === 'oldvsnew') {
    title = 'Existing vs New';
    subtitle = 'OMP vendors — existing in other verticals vs first-time';
    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';

        h += '</div>';

      return h;

    content =
      hero(fmt(totalOnb), 'Total Onboarded in OMP')
      + srow([
          {v: fmt(totalNew),  l: 'New',      s: 'first-time in OMP'},

        ])
      + sec('Sellers', ovnBlock('seller', d.newS, d.oldS))
      + sec('Buyers',  ovnBlock('buyer',  d.newB, d.oldB));
  }

  // ── Quality card modals ──────────────────────────────────────
  var isQuality = (cardId === 'rating' || cardId === 'osv' || cardId === 'docs');
  if (isQuality) {
    var qd = qualityData || { success: false };

      vendors = vendors || [];

      var ratedD = rated || 1;
      var h = '';
      for (var si = 5; si >= 1; si--) {

                  + '<span class="km-vrating" style="color:' + bcol + '">' + v.rating.toFixed(1) + '★</span>'

                  + '</div>';
              }).join('')
            + '</div>';
        } else {
          h += '<div class="km-star-row">'
            + '<span class="km-star-n">' + si + '★</span>'
            + '<div class="km-star-track"><div class="km-star-fill" style="width:' + bpct + '%;background:' + bcol + '"></div></div>'
            + '<span class="km-star-cnt">' + fmt(rc) + '</span>'
            + '<span class="km-star-pct">' + dpct + '%</span>'
            + '</div>';
        }
      }
      return h;
    }

    // Segmented progress bar
    function progBar(segs) {
      var tot = segs.reduce(function(a, s) { return a + s.w; }, 0);

      return '<div class="km-prog">'
        + segs.filter(function(s) { return s.w > 0; }).map(function(s) {

        + '</div>';

    var noDataMsg = '<div style="padding:32px 18px;text-align:center;color:var(--txt3);font-size:13px">Quality data is loading — check back shortly.</div>';

    if (cardId === 'rating') {

// Load rows for `aud` in the background and re-render the open KPI modal when done.
// Called by the "Load Buyers/Sellers detail" button inside the modal tiles.
function _kvnLoadAud(aud) {
  selectedAud = aud;
  vertRows = []; vertRowsLoading = true; vertRowsError = null;
  var myGen = ++_vertRowsGen;
  var key = activeVertKey || selectedVert;
  if (!key) return;
  var f = { audience: aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  var myPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var lsVKey = STORE_PFX + 'vr_' + aud + '_' + key;
  // SWR: serve from localStorage immediately, then refresh from server
  var swrDone = false;
  try {
    var sv = JSON.parse(localStorage.getItem(lsVKey) || 'null');
    if (sv && sv.pKey === myPKey && Array.isArray(sv.rows)) {
      vertRows = sv.rows; vertRowsLoading = false; swrDone = true;
      if (window._lastKpiCardId) openKpiModal(window._lastKpiCardId);
    }
  } catch (e) {}
  if (!swrDone) {
    // Show "Loading…" inside any currently-open tile panels while we wait
    var pn = document.getElementById('km-pn');
    if (pn) {
      var pvs = pn.querySelectorAll('.km-tile-vlist');
      for (var pi = 0; pi < pvs.length; pi++) {
        if (pvs[pi].style.display !== 'none') {
          pvs[pi].innerHTML = '<div style="padding:12px 4px;text-align:center;color:var(--txt3);font-size:11px">Loading…</div>';
        }
      }
    }
  }
  google.script.run
    .withSuccessHandler(function(res) {
      if (myGen !== _vertRowsGen) return;
      vertRowsLoading = false;
      try {
        var data = JSON.parse(res);
        if (data.success) {
          vertRows = data.rows || [];
          try { localStorage.setItem(lsVKey, JSON.stringify({ pKey: myPKey, rows: data.rows || [] })); } catch (e) {}
        }
      } catch (e) {}
      if (window._lastKpiCardId) openKpiModal(window._lastKpiCardId);
    })
    .withFailureHandler(function() {
      if (myGen !== _vertRowsGen) return;
      vertRowsLoading = false;
      if (window._lastKpiCardId) openKpiModal(window._lastKpiCardId);
    })
    .getVerticalRows(key, JSON.stringify(f));
}

function _kmStarToggle(id, row) {
  var el = document.getElementById(id);

  var open = el.style.display !== 'none';
  el.style.display = open ? 'none' : '';
  if (row) row.classList.toggle('km-star-open', !open);
}
function _kmTileToggle(panelId, groupId, tile) {
  var panel = document.getElementById(panelId);
  if (!panel) return;
  var isOpen = panel.style.display !== 'none';
  var grid = document.getElementById(groupId + '-g');
  if (grid && grid.parentNode) {
    var ch = grid.parentNode.children;
    for (var i = 0; i < ch.length; i++) {
      if (ch[i].className && ch[i].className.indexOf('km-tile-vlist') >= 0) ch[i].style.display = 'none';
    }
  }
  if (grid) {
    var tiles = grid.querySelectorAll('.km-sg-xp');
    for (var j = 0; j < tiles.length; j++) tiles[j].classList.remove('km-sg-open');
  }
  if (!isOpen) {
    panel.style.display = '';
    if (tile) tile.classList.add('km-sg-open');
  }
}

function _txnDetailToggle(btn) {
  var wrap = document.getElementById('txn-detail-wrap');
  if (!wrap) return;
  var isOpen = wrap.style.display !== 'none';
  if (isOpen) {
    wrap.style.display = 'none';
    if (btn) btn.textContent = 'View Transaction Details ↓';
    return;
  }
  wrap.style.display = '';
  if (btn) btn.textContent = 'Hide Transaction Details ↑';
  if (wrap.dataset.loaded) return;
  wrap.dataset.loaded = '1';
  wrap.innerHTML = '<div style="padding:12px 0;text-align:center;font-size:11px;color:var(--txt3)">Loading transaction details…</div>';
  var f = { period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  google.script.run
    .withSuccessHandler(function(res) {
      try {
        var data = JSON.parse(res);
        if (!data.success) { wrap.innerHTML = '<div class="km-txn-empty" style="color:#c00">Failed: ' + esc(data.error || 'Unknown error') + '</div>'; return; }
        _renderTxnDetail(wrap, data);

      }
    })
    .withFailureHandler(function() {
      wrap.innerHTML = '<div class="km-txn-empty" style="color:#c00">Could not load transaction details</div>';
    })
    .getTransactedVendors(JSON.stringify(f));
}

function _renderTxnDetail(wrap, data) {
  var sellers = data.sellers || [];
  var buyers  = data.buyers  || [];
  var totalTxns = 0, totalGMV = 0;
  sellers.forEach(function(r) { totalTxns += (r.txnCount || 1); totalGMV += (r.txnValue || 0); });
  buyers.forEach(function(r)  { totalTxns += (r.txnCount || 1); totalGMV += (r.txnValue || 0); });

  var smry = '<div class="km-txn-smry">'
    + '<div class="km-txn-smry-item"><div class="km-txn-smry-val">' + fmt(totalTxns) + '</div><div class="km-txn-smry-lbl">Total Unique Txns</div></div>'
    + '<div class="km-txn-smry-item"><div class="km-txn-smry-val">' + fmt(sellers.length) + '</div><div class="km-txn-smry-lbl">Total Unique Sellers</div></div>'
    + '<div class="km-txn-smry-item"><div class="km-txn-smry-val">' + fmt(buyers.length) + '</div><div class="km-txn-smry-lbl">Total Unique Buyers</div></div>'
    + '<div class="km-txn-smry-item"><div class="km-txn-smry-val">' + (totalGMV > 0 ? fmtINR(totalGMV) : '—') + '</div><div class="km-txn-smry-lbl">Total GMV</div></div>'
    + '</div>';

  function tblSection(label, rows) {
    var h = '<div class="km-txn-aud">' + esc(label) + '</div>';
    if (!rows.length) return h + '<div class="km-txn-empty">No records</div>';
    h += '<table class="km-txn-tbl"><thead><tr>'
      + '<th>Name</th><th>GSTIN</th>'
      + '<th style="text-align:right"># Unique Txns</th>'
      + '<th style="text-align:right">Total GMV</th>'
      + '</tr></thead><tbody>';
    rows.slice(0, 100).forEach(function(r) {
      h += '<tr>'
        + '<td style="font-weight:500;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.name || '—') + '</td>'
        + '<td style="font-family:monospace;font-size:10px;color:var(--txt3)">' + esc(r.gstin || '—') + '</td>'
        + '<td style="text-align:right;font-weight:600;font-variant-numeric:tabular-nums">' + fmt(r.txnCount || 1) + '</td>'
        + '<td style="text-align:right;font-weight:600;color:var(--st-transacted-tx);font-variant-numeric:tabular-nums">' + (r.txnValue > 0 ? fmtINR(r.txnValue) : '—') + '</td>'
        + '</tr>';
    });
    if (rows.length > 100) h += '<tr><td colspan="4" style="color:var(--txt3);font-size:10px">… and ' + (rows.length - 100) + ' more records</td></tr>';
    h += '</tbody></table>';
    return h;
  }

  wrap.innerHTML = smry + tblSection('Seller-wise Details', sellers) + tblSection('Buyer-wise Details', buyers);
}

// ── Quality data: load once for OMP, patch into Seller + Buyer cards ─
function loadQualityData() {
  if (qualityData) { _patchQualitySects(); return; }
  if (qualityLoading) return;
  qualityLoading = true;
  google.script.run
    .withSuccessHandler(function(json) {
      qualityLoading = false;
      try { qualityData = JSON.parse(json); } catch (e) { qualityData = { success: false }; }
      _patchQualitySects();
    })
    .withFailureHandler(function() {
      qualityLoading = false;
      qualityData = { success: false };
      _patchQualitySects();
    })
    .getQualityData();
}

function _patchQualitySects() {
  ['seller', 'buyer'].forEach(function(aud) {
    var el = document.getElementById('qsect-' + aud);
    if (!el) return;
    el.innerHTML = buildQualitySect(qualityData, aud);
  });
  _patchQualityKpiCards();
}

function _patchQualityKpiCards() {
  var qd = qualityData;
  if (!qd || !qd.success) return;
  var qc     = qd.seller || {};
  var selOnb = (window._kpiSnap && window._kpiSnap.compS) || 0;

  var rEl = document.getElementById('qkpi-rating');
  if (rEl) {
    var r    = qc.rating || {};
    var avg  = r.avg != null ? r.avg.toFixed(1) + '★' : '—';
    var rOmp = r.total || 0;
    var rsb  = fmt(r.rated || 0) + (rOmp > 0 ? ' of ' + fmt(rOmp) + ' OMP' : '') + ' rated';
    var rv   = rEl.querySelector('.vkpi-val'); if (rv) rv.textContent = avg;
    var rs   = rEl.querySelector('.vkpi-sub'); if (rs) rs.textContent = rsb;
  }

  var oEl = document.getElementById('qkpi-osv');
  if (oEl) {
    var o    = qc.osv || {}, oCmp = o.completed || 0, oOmp = o.total || 0;
    var opct = oOmp > 0 ? Math.round(oCmp / oOmp * 100) + '%' : '—';
    var osb  = fmt(oCmp) + (oOmp > 0 ? ' of ' + fmt(oOmp) + ' OMP' : '') + ' verified';
    var ov   = oEl.querySelector('.vkpi-val'); if (ov)  ov.textContent  = opct;
    var oSub = oEl.querySelector('.vkpi-sub'); if (oSub) oSub.textContent = osb;
  }

  var dEl = document.getElementById('qkpi-docs');
  if (dEl) {
    var d    = qc.docs || {}, dCmp = d.complete || 0;
    var dpct = selOnb > 0 ? Math.round(dCmp / selOnb * 100) + '%' : '—';
    var dsb  = fmt(dCmp) + (selOnb > 0 ? ' of ' + fmt(selOnb) : '') + ' complete';
    var dv  = dEl.querySelector('.vkpi-val'); if (dv) dv.textContent = dpct;
    var ds  = dEl.querySelector('.vkpi-sub'); if (ds) ds.textContent = dsb;
  }
}

// Build in-card quality HTML — shows count + % for every item.
// qd = { success, seller:{rating,osv,docs}, buyer:{...}, combined:{...} }
function buildQualitySect(qd, aud) {
  var hd = '<div class="cc-qsect-hd">Quality &amp; Compliance</div>';
  if (!qd || !qd.success) {
    return hd + '<div style="font-size:11px;color:var(--txt3);padding:4px 0">Data syncing… Run syncQualityData() in Apps Script.</div>';
  }
  var q = qd[aud] || qd.combined || {};
  var html = hd;

  // ── Vendor Rating ──────────────────────────────────────────
  // Header: avg score  |  N rated / N total
  // Rows: [★N] [bar] [count] [pct%]  — one per star level
  if (q.rating && q.rating.total > 0) {
    var r    = q.rating;
    var avg  = r.avg != null ? r.avg.toFixed(1) : '—';
    var rRated = r.rated || r.total || 1;
    var maxD = Math.max.apply(null, r.dist) || 1;
    var rSub = (r.total > r.rated && r.total > 0)
      ? fmt(r.rated) + ' of ' + fmt(r.total) + ' rated'
      : fmt(r.rated) + ' rated';
    var bars = '';
    for (var i = 5; i >= 1; i--) {
      var rc   = r.dist[i - 1] || 0;
      var bpct = Math.round(rc / maxD * 100);
      var dpct = Math.round(rc / rRated * 100);
      var bcol = i >= 4 ? '#22C55E' : i === 3 ? '#F59E0B' : '#EF4444';
      bars += '<div class="cc-qsect-sbar">'
        + '<span class="cc-qsect-sbar-n">' + i + '</span>'
        + '<div class="cc-qsect-sbar-t"><div class="cc-qsect-sbar-f" style="width:' + bpct + '%;background:' + bcol + '"></div></div>'
        + '<span class="cc-qsect-sbar-c">' + (rc > 999 ? Math.round(rc / 1000) + 'k' : rc) + '</span>'
        + '<span class="cc-qsect-sbar-p">' + dpct + '%</span>'
        + '</div>';
    }
    html += '<div class="cc-qsect-row">'
      + '<span class="cc-qsect-ic">★</span>'
      + '<span class="cc-qsect-lb">Vendor Rating</span>'
      + '<span class="cc-qsect-vl">' + avg + '&thinsp;<span class="cc-qsect-sub">avg · ' + rSub + '</span></span>'
      + '</div>'
      + '<div class="cc-qsect-bars">' + bars + '</div>';
  }

  // ── OSV Verification ──────────────────────────────────────
  // Header: label | N done / N total
  // Rows: [●col] [label] [count] [pct%]
  if (q.osv && q.osv.total > 0) {
    var o  = q.osv, oT = o.total || 1;
    var osvPct = Math.round((o.completed || 0) / oT * 100);
    var or_ = [
      { col: 'var(--st-onboarded)', v: o.completed,   lbl: 'Verified'      },
      { col: 'var(--st-draft)',     v: o.notInitiated, lbl: 'Not Initiated' },
    ];
    html += '<div class="cc-qsect-row cc-qsect-mt">'
      + '<span class="cc-qsect-ic">◎</span>'
      + '<span class="cc-qsect-lb">OSV Consent</span>'
      + '<span class="cc-qsect-vl">' + fmt(o.completed) + '&thinsp;<span class="cc-qsect-sub">' + osvPct + '% of OMP</span></span>'
      + '</div>'
      + or_.map(function(x) {
          if (!x.v) return '';
          var p = Math.round(x.v / oT * 100);
          return '<div class="cc-qsect-drow">'
            + '<span class="cc-qsect-dot" style="background:' + x.col + '"></span>'
            + '<span class="cc-qsect-dlb">' + x.lbl + '</span>'
            + '<span class="cc-qsect-dn">' + fmt(x.v) + '</span>'
            + '<span class="cc-qsect-dp">' + p + '%</span>'
            + '</div>';
        }).join('');
  }

  // ── Doc Completeness ──────────────────────────────────────
  // Header: label | N% complete
  // Progress bar
  // Rows: [●col] [label] [count] [pct%]
  if (q.docs && q.docs.total > 0) {
    var d  = q.docs, dT = d.total || 1;
    var dr = [
      { col: 'var(--st-onboarded)', v: d.complete,   lbl: 'Complete'   },
      { col: 'var(--st-review)',    v: d.partial,     lbl: 'Partial'    },
      { col: 'var(--st-draft)',     v: d.incomplete,  lbl: 'Incomplete' },
      { col: 'var(--st-rejected)',  v: d.missing,     lbl: 'Missing'    },
    ];
    html += '<div class="cc-qsect-row cc-qsect-mt">'
      + '<span class="cc-qsect-ic">◻</span>'
      + '<span class="cc-qsect-lb">Doc Completeness</span>'
      + '<span class="cc-qsect-vl">' + Math.round(d.complete / dT * 100) + '<span class="cc-qsect-sub">% complete</span></span>'
      + '</div>'
      + '<div class="cc-qsect-prog">'
      + dr.filter(function(s){ return s.v > 0; }).map(function(s) {
          return '<div class="cc-qsect-prog-seg" style="flex:' + (s.v / dT * 100).toFixed(1) + ';background:' + s.col + '"></div>';
        }).join('')
      + '</div>'
      + dr.map(function(x) {
          if (!x.v) return '';
          var p = Math.round(x.v / dT * 100);
          return '<div class="cc-qsect-drow">'
            + '<span class="cc-qsect-dot" style="background:' + x.col + '"></span>'
            + '<span class="cc-qsect-dlb">' + x.lbl + '</span>'
            + '<span class="cc-qsect-dn">' + fmt(x.v) + '</span>'
            + '<span class="cc-qsect-dp">' + p + '%</span>'
            + '</div>';
        }).join('');
  }

  return html;
}

function renderPipelinePair(key) {
  var el = document.getElementById('vert-pipeline-pair');
  if (!el) return;
  var cfg = getVertCfg().filter(function(c) { return c.key === key; })[0];
  if (!cfg || !DS || !DS.verticals) { el.innerHTML = ''; return; }
  var vs = (DS.verticals || {})[key] || {};
  var vb = (DB && DB.verticals || {})[key] || {};
  el.classList.remove('three-col');
  el.innerHTML = buildInlinePipeCard(cfg, vs, 'Seller Pipeline', 'seller', 0)
    + buildInlinePipeCard(cfg, vb, 'Buyer Pipeline', 'buyer', 1);
  animateCounters(el);
  if (key === 'OMP') loadQualityData();
}

function buildInlinePipeCard(cfg, v, label, aud, idx) {
  var lblCls = aud === 'seller' ? 'cc-pipe-lbl-seller' : 'cc-pipe-lbl-buyer';
  var isActive = aud === selectedAud;
  var attrs = ' style="--i:' + idx + ';' + vcVars(cfg.key) + '"'
    + ' class="compare-card vpipe-card aud-' + aud + (isActive ? ' det-active' : '') + '"'
    + ' onclick="setDetailAud(\'' + aud + '\')" role="button" tabindex="0"'
    + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();setDetailAud(\'' + aud + '\')}"';
  var ghost = '<span class="cc-ghost" aria-hidden="true">' + (aud === 'seller' ? 'S' : 'B') + '</span>';
  var dotClr = aud === 'seller' ? 'var(--st-onboarded)' : 'var(--st-transacted)';

    + '<span class="pipe-dot" style="background:' + dotClr + '"></span>'
    + '<span class="pipe-title">' + (aud === 'seller' ? 'Sellers' : 'Buyers') + '</span>'
    + '<span class="pipe-sub">Onboarding pipeline</span>'
    + (isActive ? '<span class="pipe-viewing">Viewing below</span>' : '')

  var tot = v.total || 0;
  if (!tot) {
    return '<div' + attrs + '>' + ghost + hdr + '<div class="no-data" style="padding:24px 0">No data</div></div>';
  }
  // Flow bar — the whole pipeline as one proportional strip
  var flowSegs = [
    ['draft',     v.draft     || 0],
    ['review',    v.inReview  || 0],
    ['onboarded', v.completed || 0],
    ['rejected',  v.rejected  || 0],
  ].filter(function(s) { return s[1] > 0; });
  var flowTot = flowSegs.reduce(function(a, s) { return a + s[1]; }, 0);
  var flowBar = flowTot > 0
    ? '<div class="cc-flow" aria-hidden="true">' + flowSegs.map(function(s) {
        return '<i style="flex:' + (s[1] / flowTot * 100).toFixed(2) + ';background:var(--st-' + s[0] + ')" title="' + STAGE[s[0]].lbl + ' — ' + fmt(s[1]) + '"></i>';
      }).join('') + '</div>'
    : '';
  var pipeBoxes = '<div class="cc-pipe">'
    + '<div class="cc-pipe-box cc-pipe-draft"><b>' + fmt(v.draft || 0) + '</b><span>Draft</span></div>'
    + '<div class="cc-pipe-box cc-pipe-review"><b>' + fmt(v.inReview || 0) + '</b><span>In Review</span></div>'
    + '<div class="cc-pipe-box cc-pipe-onb"><b>' + fmt(v.completed || 0) + '</b><span>Completed</span></div>'
    + '</div>';
  var topCats = (v.categories || []).filter(function(c) { return (c.total || 0) > 0; }).slice(0, 3);
  var catRows = topCats.map(function(c) {
    var parts = [];
    if ((c.onboarded || 0) > 0) parts.push('<em>' + fmt(c.onboarded) + ' onboarded</em>');
    if ((c.draft     || 0) > 0) parts.push(fmt(c.draft) + ' draft');
    if ((c.inReview  || 0) > 0) parts.push(fmt(c.inReview) + ' review');
    return '<div class="cc-cat-row"><span class="cc-cat-badge">' + esc(c.category) + '</span>'
      + '<span class="cc-cat-detail">' + parts.join(' · ') + '</span></div>';
  }).join('');
  if (catRows) catRows = '<div class="cc-cat-rows">' + catRows + '</div>';
  var fys = (v.fyBreakdown || []).filter(function(f) { return !f.fyStart || f.fyStart >= 2019; });
  var statsList = '';
  if (fys.length) {
    var isOMP    = cfg.key === 'OMP';
    var aggTAT   = v.avgTAT        != null ? v.avgTAT + 'd'           : null;
    var aggPct   = v.pctTransacted  != null ? v.pctTransacted + '%'   : null;
    var aggGMV   = v.totalTxnValue  != null ? fmtINR(v.totalTxnValue) : null;
    var aggGSTon = v.withGST        != null ? fmt(v.withGST)          : null;
    var fyTr = function(label, valFn, aggVal, badCls) {
      var cells = fys.map(valFn);
      var allEmpty = cells.every(function(c){ return c === null || c === undefined || c === '—'; }) && aggVal == null;
      if (allEmpty) return '';
      return '<tr' + (badCls ? ' class="' + badCls + '"' : '') + '>'
        + '<td class="cc-fy-td-lbl">' + label + '</td>'
        + cells.map(function(c){ return '<td class="cc-fy-td">' + (c != null ? c : '—') + '</td>'; }).join('')
        + '<td class="cc-fy-td cc-fy-all">' + (aggVal != null ? aggVal : '—') + '</td>'
        + '</tr>';
    };
    var fyTbody = [
      fyTr('Avg TAT',       function(f){ return f.avgTAT        != null ? f.avgTAT + 'd'           : null; }, aggTAT,   ''),
      isOMP ? null : fyTr('% Transacted',  function(f){ return f.pctTransacted != null ? f.pctTransacted + '%'   : null; }, aggPct,   ''),
      fyTr('Total GMV',     function(f){ return f.totalTxnValue != null ? fmtINR(f.totalTxnValue) : null; }, aggGMV,   ''),
      fyTr('GSTIN active',  function(f){ return f.withGST       != null ? fmt(f.withGST)          : null; }, aggGSTon, ''),
    ].filter(Boolean).join('');
    if (fyTbody) {
      var fyThead = '<thead><tr><th class="cc-fy-th-lbl"></th>'
        + fys.map(function(f){ return '<th class="cc-fy-th">' + esc(f.fy) + '</th>'; }).join('')
        + '<th class="cc-fy-th cc-fy-all">All</th>'
        + '</tr></thead>';
      statsList = '<div class="cc-fy-wrap">'
        + '<table class="cc-fy-tbl">' + fyThead + '<tbody>' + fyTbody + '</tbody></table>'
        + '</div>';
    }
  } else {
    var isOMP2 = cfg.key === 'OMP';
    var statRows = [];
    if (v.avgTAT        != null) statRows.push(['Avg TAT',      v.avgTAT + 'd',          '']);
    if (!isOMP2 && v.pctTransacted != null) statRows.push(['% Transacted', v.pctTransacted + '%', '']);
    if (v.totalTxnValue != null && v.totalTxnValue > 0) statRows.push(['Total GMV', fmtINR(v.totalTxnValue), '']);
    if (v.withGST       != null) statRows.push(['GSTIN Active', fmt(v.withGST),          '']);
    statsList = statRows.length

        }).join('') + '</div>'
      : '';
  }
  return '<div' + attrs + '>' + ghost + hdr + flowBar + pipeBoxes + catRows + statsList + '</div>';

function openVertDetail(key, aud) {
  aud = aud || 'seller';
  // If a different vertical tab — switch to it, which resets rows and re-renders.
  if (activeVertKey !== key) {
    selectedAud = aud;
    activeVertKey = key;
    selectedVert  = key;
    vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '' };
    vdSort = { key: '', dir: 1 };
    vertRows = []; vertRowsLoading = true; vertRowsError = null;
    _vertRowsPKey = null; ++_vertRowsGen;
    document.querySelectorAll('.vert-tab[data-key]').forEach(function(t) {
      t.classList.toggle('active', t.dataset.key === key);
    });
    renderVertKPIs(key);
    renderPipelinePair(key);
    var detEl = document.getElementById('vert-detail-section');
    if (detEl) detEl.style.display = '';
    renderInlineDetail(key);
    loadVertRows(key);
  } else {
    // Same vertical — just switch audience
    setDetailAud(aud);
  }
  // Scroll to the detail section
  setTimeout(function() {
    var detEl = document.getElementById('vert-detail-section');
    if (detEl) detEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 80);
}

function loadVertRows(key) {
  var myGen = ++_vertRowsGen;
  var f = { audience: selectedAud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  var myPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var lsVKey = STORE_PFX + 'vr_' + selectedAud + '_' + key;

  // SWR: serve cached rows immediately so the panel is never blank
  var swrDone = false;
  try {
    var sv = JSON.parse(localStorage.getItem(lsVKey) || 'null');
    if (sv && sv.pKey === myPKey && Array.isArray(sv.rows)) {
      vertRows = sv.rows;
      _vertRowsPKey = myPKey;
      vertRowsLoading = false;
      vertRowsError = null;
      renderVertDetail();
      swrDone = true;
    }
  } catch (e) {}

  // Always refresh from the server — spinner only shown when there's no SWR data
  if (!swrDone) { vertRowsLoading = true; vertRowsError = null; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (myGen !== _vertRowsGen) return;  // a newer request superseded this one
      vertRowsLoading = false;
      try {
        var data = JSON.parse(res);
        if (data.success && data.vertKey === selectedVert) {
          vertRows = data.rows || [];
          _vertRowsPKey = myPKey;
          // Persist so the next open is instant
          try { localStorage.setItem(lsVKey, JSON.stringify({ pKey: myPKey, rows: data.rows || [] })); } catch (e) {}
        } else if (!data.success && !swrDone) {
          vertRowsError = data.error || 'The server could not load records for this vertical.';
        }
      } catch (e) {
        if (!swrDone) vertRowsError = 'Could not read the server response: ' + e.message;
      }
      renderVertDetail();   // always re-render — never leave the panel stuck on the spinner
    })
    .withFailureHandler(function(err) {
      if (myGen !== _vertRowsGen) return;
      vertRowsLoading = false;
      if (!swrDone) vertRowsError = (err && err.message) ? err.message : 'Server error while loading records.';
      renderVertDetail();
    })
    .getVerticalRows(key, JSON.stringify(f));
}

// Render all verticals as full inline editorial sections below the compare grid.
function renderVertStory() {
  if (currentView !== 'onboarding' || !DS || !DS.verticals) return;
  if (!D) return;
  var container = document.getElementById('vert-story');
  var sep       = document.getElementById('story-sep');
  if (!container) return;

  var verts   = D.verticals;
  var cfgList = getVertCfg();
  var hasAny  = cfgList.some(function(c) { return (verts[c.key] || {}).total > 0; });

  if (sep) sep.style.display = hasAny ? '' : 'none';
  if (!hasAny) { container.innerHTML = ''; return; }

  container.innerHTML = cfgList.map(function(cfg) {
    var v   = verts[cfg.key] || {};
    var tot = v.total || 0;
    if (!tot) return '';

    var vcStyle = 'style="' + vcVars(cfg.key) + '"';
    var pct = v.completionPct || 0;

    // ── Section header ──────────────────────────────────────────────────────
    var hdrHtml = '<div class="vs-hdr">'
      + '<div class="vs-title-wrap">'
      + '<div class="vs-badge">' + cfg.code + '</div>'
      + '<div class="vs-title">' + esc(cfg.name) + '</div>'
      + '<button class="vs-rec-btn" onclick="openVertDetail(\'' + cfg.key + '\')" type="button">View Records →</button>'
      + '</div>'
      + '<div class="vs-hero-stat">'
      + '<div class="vs-hero-count">' + fmt(v.completed || 0) + '</div>'
      + '<div class="vs-hero-lbl">onboarded of ' + fmt(tot) + '</div>'
      + '</div>'
      + '</div>';

    // ── Completion progress bar ──────────────────────────────────────────────
    var progressHtml = '';

    // ── Four pipeline stage boxes ────────────────────────────────────────────
    var pipeHtml = '<div class="vs-pipe">'
      + '<div class="vs-pipe-box vs-pipe-draft" style="--pi:0"><b>' + fmt(v.draft || 0) + '</b><span>Draft</span></div>'
      + '<div class="vs-pipe-box vs-pipe-review" style="--pi:1"><b>' + fmt(v.inReview || 0) + '</b><span>In Review</span></div>'
      + '<div class="vs-pipe-box vs-pipe-onb" style="--pi:2"><b>' + fmt(v.completed || 0) + '</b><span>Onboarded</span></div>'
      + '<div class="vs-pipe-box vs-pipe-rej" style="--pi:3"><b>' + fmt(v.rejected || 0) + '</b><span>Rejected</span></div>'
      + '</div>';

    // ── Compact key metrics strip ────────────────────────────────────────────
    // GMV card: shows total GMV with aging/overdue as a sub-line when present
    var gmvMetric = '';
    if (v.totalTxnValue != null) {
      var agingSub = '';
      if (v.aging != null || v.overdue != null) {
        agingSub = '<div class="vs-aging-sub">';
        if (v.aging   != null) agingSub += 'Aging: <span class="ag-warn">' + fmt(v.aging)   + '</span>';
        if (v.aging != null && v.overdue != null) agingSub += ' · ';
        if (v.overdue != null) agingSub += 'Overdue: <span class="ag-crit">' + fmt(v.overdue) + '</span>';
        agingSub += '</div>';
      }
      gmvMetric = '<div class="vs-metric m-gmv"><b>' + fmtINR(v.totalTxnValue) + '</b><span>Total GMV</span>' + agingSub + '</div>';
    }
    var isOMPs = cfg.key === 'OMP';
    var metArr = [
      ['Avg TAT',        dOr(v.avgTAT, 'd'), ''],
      v.completedThisWeek ? ['Onboarded (7d)', fmt(v.completedThisWeek), ''] : null,
      !isOMPs && v.transacted != null ? ['Transacted', fmt(v.transacted) + ' (' + (v.pctTransacted || 0) + '%)', ''] : null,
      v.withGST != null ? ['GST Active', fmt(v.withGST), ''] : null,
    ].filter(Boolean);
    var metricsHtml = (metArr.length || gmvMetric)
      ? '<div class="vs-metrics">'
        + (gmvMetric || '')
        + metArr.map(function(m) {
            return '<div class="vs-metric' + (m[2] ? ' ' + m[2] : '') + '"><b>' + m[1] + '</b><span>' + m[0] + '</span></div>';
          }).join('')
        + '</div>'
      : '';

    return '<section class="vert-section reveal" id="vs-' + cfg.key + '" ' + vcStyle + '>'
      + hdrHtml + progressHtml + pipeHtml + metricsHtml
      + '</section>';
  }).join('');

  // Animate pipeline boxes and category rows as they scroll into view.
  requestAnimationFrame(function() {
    if (!motionOK()) {
      container.querySelectorAll('.vs-pipe-box,.vs-cat-item').forEach(function(el) {
        el.classList.add('pipe-in','cat-in');
      });
      // Set bar widths immediately
      container.querySelectorAll('.vs-cat-bar-fg').forEach(function(el) {
        el.style.width = (el.getAttribute('data-pct') || '0') + '%';
      });
      return;
    }
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (!e.isIntersecting) return;
        var el  = e.target;
        var idx = parseInt(el.style.getPropertyValue('--pi') || el.style.getPropertyValue('--ci') || '0', 10) || 0;
        setTimeout(function() {
          el.classList.add('pipe-in','cat-in');
          // Animate progress bars inside category items
          el.querySelectorAll('.vs-cat-bar-fg').forEach(function(bar) {
            bar.style.width = (bar.getAttribute('data-pct') || '0') + '%';
          });
        }, idx * 65);
        obs.unobserve(el);
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });
    container.querySelectorAll('.vs-pipe-box,.vs-cat-item').forEach(function(el) { obs.observe(el); });
    // Also animate completion bars that are already in view
    container.querySelectorAll('.vs-progress-fill').forEach(function(el) {
      var w = el.style.width;
      el.style.width = '0';
      requestAnimationFrame(function() { el.style.width = w; });
    });
  });

  // Scroll spy — wired up after DOM is updated
  setTimeout(setupScrollSpy, 200);
}

function vdUnique(rows, field) {
  var seen = {};
  var out = [];
  rows.forEach(function(r) {
    var v = r[field];
    if (v && v !== '—' && !seen[v]) { seen[v] = true; out.push(v); }
  });
  return out.sort();
}

function vdSelect(id, label, options, current, labels) {
  // Pill select — the label lives inside the control ("Category: All"),
  // matching the GST filter bar. No floating form labels.
  var html = '<select class="vd-pill" id="' + id + '" onchange="vdfChange()">'
    + '<option value="All">' + esc(label) + ': All</option>';
  options.forEach(function(o) {
    html += '<option value="' + esc(o) + '"' + (current === o ? ' selected' : '') + '>'
      + esc((labels && labels[o]) || o) + '</option>';
  });
  return html + '</select>';
}

function vdFilteredRows() {
  var _fvd = selectedAud === 'buyer' ? (DB && DB.verticals) : (DS && DS.verticals);
  if (!selectedVert || !_fvd || !_fvd[selectedVert]) return [];
  var rows = vertRows;
  var q = (vdF.search || '').toLowerCase();
  return rows.filter(function(r) {
    if (vdF.category !== 'All' && r.category   !== vdF.category) return false;
    if (vdF.vendor   !== 'All' && r.vendorType !== vdF.vendor)   return false;
    if (vdF.status   !== 'All' && r.status     !== vdF.status)   return false;
    if (vdF.gst === 'Active'   && !r.hasGST) return false;
    if (vdF.gst === 'Inactive' &&  r.hasGST) return false;
    if (q && (r.name  || '').toLowerCase().indexOf(q) === -1
          && (r.gstin || '').toLowerCase().indexOf(q) === -1
          && String(r.id || '').toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function kbCard(r) {
  var key  = ++_rmI;
  _rmD[key] = r;
  var meta = [r.category, r.vendorType].filter(function(x) { return x && x !== '—'; }).join(' · ');
  var txnChip = '';
  if (r.hasTransacted) {
    var valStr = r.txnValue !== null ? ' · ' + fmtINR(r.txnValue) : '';
    txnChip = '<span class="kb-gst ok" style="background:var(--st-transacted-bg);color:var(--st-transacted-tx);border-color:transparent"'
      + ' title="Transacted' + (r.txnValue !== null ? ' · ₹' + r.txnValue : '') + '">⚡ Txn' + valStr + '</span>';
  } else if (r.status === 'COMPLETED') {
    txnChip = '<span class="kb-gst bad" style="background:var(--bg2);color:var(--txt3);border-color:transparent" title="Onboarded but not yet transacted">— Txn</span>';
  }
  return '<div class="kb-card" onclick="openRecModal(' + key + ')" role="button" tabindex="0"'
    + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openRecModal(' + key + ')}">'
    + '<div class="kb-card-name">' + esc(r.name || '—') + '</div>'
    + '<div class="kb-card-meta">' + esc(r.id) + (meta ? ' · ' + esc(meta) : '') + '</div>'
    + '<div class="kb-card-foot">'
    + '<span class="kb-gst ' + (r.hasGST ? 'ok" title="' + esc(r.gstin) + '">✓ GST' : 'bad">✗ GST') + '</span>'
    + txnChip
    + kbAge(r)
    + '</div></div>';
}

// Onboarded cards show the achieved TAT; open cards show how long they have been sitting.
function kbAge(r) {
  if (r.status === 'COMPLETED') {
    var t = parseInt(r.tat);
    if (isNaN(t)) return '<span class="kb-age text-muted">' + esc(r.onbDate || '—') + '</span>';
    var cls = t <= 2 ? 'text-green' : t <= 5 ? 'text-amber' : 'text-red';
    return '<span class="kb-age ' + cls + '" title="Onboarding TAT">' + t + 'd TAT</span>';
  }
  var d = parseDMY(r.createdDate);
  if (!d) return '<span class="kb-age text-muted">—</span>';
  var days = Math.max(0, Math.round((Date.now() - d.getTime()) / 86400000));
  if (r.status === 'REJECTED') {
    return '<span class="kb-age text-muted" title="Days since created">' + days + 'd</span>';
  }
  var cls2 = days <= 3 ? 'text-muted' : days <= 7 ? 'text-amber' : 'text-red';
  return '<span class="kb-age ' + cls2 + '" title="Days since created — created ' + esc(r.createdDate) + '">' + days + 'd waiting</span>';
}

function parseDMY(s) {
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s || '').trim());
  if (!m) return null;
  var d = new Date(+m[3], +m[2] - 1, +m[1]);
  return isNaN(d.getTime()) ? null : d;
}

// Column sort — clicking a header sorts by that column; a second click reverses it.
function vdSortBy(key) {
  if (vdSort.key === key) vdSort.dir = -vdSort.dir;
  else vdSort = { key: key, dir: 1 };
  renderVdRecords();
}

// Comparable value for a row under a given column key.
function vdSortVal(r, key) {
  if (key === 'tat') {
    var n = parseInt(r.tat, 10);
    return isNaN(n) ? -1 : n;                       // rows without a TAT sort first (asc)
  }
  if (key === 'createdDate' || key === 'onbDate') {
    var d = parseDMY(r[key]);
    return d ? d.getTime() : 0;                     // undated rows sort first (asc)
  }
  if (key === 'txn') {
    // Transacted (by value) > onboarded-but-not-transacted > not applicable
    if (r.hasTransacted) return 1 + (r.txnValue || 0);
    return r.status === 'COMPLETED' ? 0 : -1;
  }
  if (key === 'gstin') return (r.hasGST ? '1' : '0') + String(r.gstin || '').toLowerCase();
  return String(r[key] || '').toLowerCase();
}

function vdSortedRows(filtered) {
  if (!vdSort.key) return filtered;
  var key = vdSort.key, dir = vdSort.dir;
  return filtered.slice().sort(function(a, b) {
    var va = vdSortVal(a, key), vb = vdSortVal(b, key);
    if (va < vb) return -dir;
    if (va > vb) return dir;
    return 0;
  });
}

  tbody.innerHTML = shown.length
    ? shown.map(function(r) {
        var key = ++_rmI;
        _rmD[key] = r;

          txnCell = '<span class="txn-chip" title="' + esc(txnTip) + '">'

          txnCell = '<span style="color:var(--txt3);font-size:11.5px;font-weight:500">Not yet</span>';
        } else {
          txnCell = '<span class="text-muted">—</span>';

        return '<tr class="vd-tr" onclick="openRecModal(' + key + ')" title="View details">'
          + '<td><strong>' + esc(r.name || '—') + '</strong>'
          +   '<span class="td-sub">' + esc(r.id) + '</span></td>'
          + '<td>' + esc(r.category || '—') + '</td>'
          + '<td class="td-dim">' + esc(r.vendorType || '—') + '</td>'
          + '<td>' + statusChip(r.status) + '</td>'
          + '<td>' + (r.hasGST ? '<span class="gst-ok">' + esc(r.gstin) + '</span>' : '<span class="gst-bad">Missing</span>') + '</td>'
          + '<td class="td-dim">' + esc(r.state || '—') + '</td>'
          + '<td class="td-dim td-num">' + esc(r.createdDate) + '</td>'
          + '<td class="td-dim td-num">' + esc(r.onbDate) + '</td>'
          + '<td>' + tatChip(r.tat) + '</td>'
          + '<td>' + txnCell + '</td>'
          + '</tr>';
      }).join('')
    : '<tr><td colspan="10" class="no-data">No records match the selected filters</td></tr>';

  if (note) {
    note.textContent = 'Showing ' + fmt(shown.length) + ' of ' + fmt(filtered.length)
      + ' matching · ' + fmt(all.length) + ' total · '
      + (vdSort.key ? 'sorted by ' + vdSort.key + (vdSort.dir === 1 ? ' ↑' : ' ↓') : 'latest first');
  }
}

// Called when a category card is clicked — filters the records section to
// that category and scrolls the records into view.
// Show a funnel breakdown card for a single category, in the same bar-chart
// style as the aggregate funnel. Called by filterByCategory().
function renderCatDetailCard(c) {
  var ctot = c.total || 0;
  if (!ctot) return '';

  var STAGE = {
    onboarded: { lbl: 'Onboarded', fill: 'var(--st-onboarded)' },
    review:    { lbl: 'In Review', fill: 'var(--st-review)'    },
    draft:     { lbl: 'Draft',     fill: 'var(--st-draft)'     },
    rejected:  { lbl: 'Rejected',  fill: 'var(--st-rejected)'  },
  };

  var segs = [
    { key: 'onboarded', n: c.onboarded || 0 },
    { key: 'draft',     n: c.draft     || 0 },
    { key: 'review',    n: c.inReview  || 0 },
    { key: 'rejected',  n: c.rejected  || 0 },
  ];

  var vtCols = ['#007AFF', '#34C759', '#FF9F0A', '#AF52DE', '#5AC8FA', '#8E8E93'];
  var vts    = (c.vendorTypes || []).filter(function(v) { return v.count > 0; });
  var vtTot  = vts.reduce(function(s, v) { return s + v.count; }, 0) || ctot;

  // ── Shared donut builder ─────────────────────────────────────────
  function mkDonut(segments, total, centerNum, centerLbl) {
    var R = 42, SW = 14, size = 108, cx = 54, cy = 54;
    var C = 2 * Math.PI * R, GAP = 2.5, cumFrac = 0;
    var rings = '<circle cx="' + cx + '" cy="' + cy + '" r="' + R
      + '" fill="none" stroke="var(--bg2)" stroke-width="' + SW + '"/>'
      + segments.map(function(s, si) {
          var frac = total > 0 ? s.n / total : 0;
          var dash = Math.max(0, frac * C - GAP);
          var rot  = cumFrac * 360 - 90;
          cumFrac += frac;
          return '<circle class="donut-seg" cx="' + cx + '" cy="' + cy + '" r="' + R
            + '" fill="none" stroke="' + s.fill + '" stroke-width="' + SW
            + '" stroke-dasharray="' + dash.toFixed(2) + ' ' + (C - dash).toFixed(2)
            + '" transform="rotate(' + rot.toFixed(2) + ' ' + cx + ' ' + cy
            + ')" style="animation-delay:' + (140 + si * 100) + 'ms">'
            + '<title>' + s.lbl + ' — ' + fmt(s.n) + ' (' + Math.round(frac * 100) + '%)</title></circle>';
        }).join('');
    var ctr = '<g class="donut-ctr">'
      + '<text x="' + cx + '" y="' + (cy - 5) + '" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="800" fill="var(--txt)">' + fmt(centerNum) + '</text>'
      + '<text x="' + cx + '" y="' + (cy + 10) + '" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="600" fill="var(--txt3)" letter-spacing="0.5">' + centerLbl + '</text>'
      + '</g>';
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="display:block;margin:0 auto">' + rings + ctr + '</svg>';
  }

  // ── Status donut ─────────────────────────────────────────────────
  var statusSegs = segs.map(function(s) {
    return { n: s.n, fill: STAGE[s.key].fill, lbl: STAGE[s.key].lbl };
  });
  var statusDonut = mkDonut(statusSegs, ctot, ctot, 'TOTAL CASES');

  var statusLeg = segs.map(function(s, i) {
    var st  = STAGE[s.key];
    var pc  = ctot > 0 ? Math.round(s.n / ctot * 100) : 0;
    var pri = s.key === 'onboarded';
    return '<div class="donut-leg-row" style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);animation-delay:' + (200 + i * 70) + 'ms">'
      + '<span style="width:9px;height:9px;border-radius:2px;flex-shrink:0;background:' + st.fill + '"></span>'
      + '<span style="flex:1;font-size:12px;font-weight:' + (pri ? '700' : '600') + ';color:var(--txt' + (pri ? '' : '2') + ')">' + st.lbl + '</span>'
      + '<span style="font-size:' + (pri ? '14' : '13') + 'px;font-weight:700;color:' + st.fill + ';font-variant-numeric:tabular-nums;min-width:28px;text-align:right">' + fmt(s.n) + '</span>'
      + '<span style="font-size:10.5px;color:var(--txt3);min-width:36px;text-align:right">(' + pc + '%)</span>'
      + '</div>';
  }).join('');

  // ── Vendor type donut ────────────────────────────────────────────
  var vtSegs = vts.map(function(vt, vi) {
    return { n: vt.count, fill: vtCols[vi % vtCols.length], lbl: vt.type };
  });
  var vtDonut = vts.length > 0
    ? mkDonut(vtSegs, vtTot, vts.length, 'TYPES')
    : '<div style="height:108px;display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:12px">No data</div>';

  var vtLeg = vts.length > 0
    ? vts.map(function(vt, vi) {
        var col = vtCols[vi % vtCols.length];
        var pc2 = ctot > 0 ? Math.round(vt.count / ctot * 100) : 0;
        return '<div class="donut-leg-row" style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);animation-delay:' + (200 + vi * 60) + 'ms">'
          + '<span style="width:9px;height:9px;border-radius:2px;flex-shrink:0;background:' + col + '"></span>'
          + '<span style="flex:1;font-size:12px;font-weight:600;color:var(--txt2)">' + esc(vt.type) + '</span>'
          + '<span style="font-size:13px;font-weight:700;color:' + col + ';font-variant-numeric:tabular-nums;min-width:28px;text-align:right">' + fmt(vt.count) + '</span>'
          + '<span style="font-size:10.5px;color:var(--txt3);min-width:36px;text-align:right">(' + pc2 + '%)</span>'
          + '</div>';
      }).join('')
    : '<div style="padding:10px 0;font-size:12px;color:var(--txt3)">No vendor type data</div>';

  // ── Assemble ─────────────────────────────────────────────────────
  function half(sectionTitle, donutHtml, legHtml, borderRight) {
    return '<div style="padding:14px 16px' + (borderRight ? ';border-right:1px solid var(--border)' : '') + '">'
      + '<div style="font-size:9.5px;font-weight:700;color:var(--txt3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px">' + sectionTitle + '</div>'
      + donutHtml
      + '<div style="margin-top:10px">' + legHtml + '</div>'
      + '</div>';
  }

  return '<div class="chart-card mt-16">'
    + '<div class="chart-card-title">'
    +   '<span style="font-size:13.5px;font-weight:700;color:var(--txt);text-transform:none;letter-spacing:0">' + esc(c.category) + '</span>'
    +   '<span class="muted-total" style="margin-left:8px">— Category Breakdown</span>'
    +   '<button onclick="filterByCategory(\'All\')" style="margin-left:auto;background:rgba(120,120,128,.12);border:none;border-radius:999px;font-size:11px;font-weight:500;color:var(--txt2);padding:4px 12px;cursor:pointer;font-family:inherit;text-transform:none;letter-spacing:0">✕ Clear</button>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr">'
    +   half('Total Cases Breakdown', statusDonut, statusLeg, true)
    +   half('Vendor Type Breakdown', vtDonut, vtLeg, false)
    + '</div>'
    + '</div>';
}

function showCatDetail(catName, quiet) {
  var wrap = document.getElementById('cat-detail-wrap');
  if (!wrap) return;
  // quiet — re-inject without replaying animations (silent refresh path)
  if (quiet) { wrap.classList.add('no-anim'); } else { wrap.classList.remove('no-anim'); }
  if (!catName || catName === 'All') {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
    return;
  }
  var _scdSrc = selectedAud === 'buyer' ? (DB && DB.verticals) : (DS && DS.verticals);
  var v = _scdSrc && selectedVert && _scdSrc[selectedVert];
  var cats = (v && v.categories) || [];
  var c = null;
  for (var i = 0; i < cats.length; i++) {
    if (cats[i].category === catName) { c = cats[i]; break; }
  }
  if (!c || !c.total) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
  wrap.innerHTML = renderCatDetailCard(c);
  wrap.style.display = 'block';
}

function filterByCategory(cat) {
  vdF.category = cat;

  // If rows haven't loaded yet, open the detail section to trigger loading.
  // renderInlineDetail() will call renderVdRecords() with vdF.category set
  // once rows arrive — so we just need to make sure the section is loading.
  if (vertRows.length === 0) {
    if (!vertRowsLoading) {
      // Not loading at all — trigger the detail section (starts the load).
      setDetailAud(selectedAud || 'seller');
      vdF.category = cat;  // setDetailAud resets vdF; re-apply the category
    }
    // If already loading, vdF.category is already set above; renderInlineDetail
    // will apply it once rows arrive. Nothing more to do here.
    return;
  }

  // Rows are loaded — apply filter immediately.
  var el = document.getElementById('vdf-category');
  if (el) {
    var found = false;
    for (var i = 0; i < el.options.length; i++) {
      if (el.options[i].value === cat) { el.value = cat; found = true; break; }
    }
    if (!found) {
      var opt = document.createElement('option');
      opt.value = opt.text = cat;
      el.appendChild(opt);
      el.value = cat;
    }
  }
  showCatDetail(cat);
  renderVdRecords();
  // Scroll to the category detail card if visible, otherwise to the records.
  var target = document.getElementById('cat-detail-wrap');
  if (!target || target.style.display === 'none') {
    target = document.getElementById('vd-board-view') || document.getElementById('vd-table-view');
  }
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function vdfClear() {
  vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '' };
  ['vdf-category','vdf-vendor','vdf-status','vdf-gst'].forEach(function(id) {
    var el = document.getElementById(id); if (el) el.value = 'All';
  });
  var s = document.getElementById('vdf-search'); if (s) s.value = '';
  showCatDetail('All');
  renderVdRecords();
}

function loadGSTData(silent) {
  var btn = document.getElementById('btn-refresh');
  if (btn) btn.classList.add('spinning');
  clearTimeout(_refreshTimer);
  clearInterval(_countdownTimer);
  var cd = document.getElementById('refresh-countdown');
  if (cd) cd.textContent = '…';

  var reqYear = gpYear;
  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) btn.classList.remove('spinning');
      if (_isFirstLoad) { hideLoading(); _isFirstLoad = false; }
      try {
        var data = JSON.parse(res);
        if (data.success) {
          try { localStorage.setItem(STORE_PFX + 'gst_' + reqYear, res); } catch (e) {}
          if (currentView === 'gst' && reqYear === gpYear) { GST = data; renderGST(); }
        } else if (currentView === 'gst') {
          showGSTError(data.error || 'No data returned.');
        }
      } catch (e) {
        if (currentView === 'gst') showGSTError('Parse error: ' + e.message);
      }
      scheduleNextRefresh();
    })
    .withFailureHandler(function(err) {
      if (btn) btn.classList.remove('spinning');
      if (_isFirstLoad) { hideLoading(); _isFirstLoad = false; }
      if (currentView === 'gst') showGSTError((err && err.message) ? err.message : 'Server error while loading GST Payables.');
      scheduleNextRefresh();
    })
    .getGSTPayablesData(JSON.stringify({ year: gpYear }));
}

function showGSTError(msg) {
  var host = document.getElementById('tab-gst');
  if (!host) return;
  host.innerHTML = '<div class="gp-card" style="text-align:center;padding:48px 24px">'
    + '<div style="color:var(--gp-red);font-weight:700;font-size:15px;margin-bottom:8px">⚠ Could not load GST Payables</div>'
    + '<div style="color:var(--gp-ink2);margin-bottom:18px;max-width:560px;margin-left:auto;margin-right:auto">' + esc(msg) + '</div>'
    + '<div style="color:var(--gp-ink3);font-size:12px;margin-bottom:18px">If this is a permissions error, share the source sheet with the account that deployed this web app.</div>'
    + '<button onclick="loadGSTData(false)" style="padding:9px 22px;border-radius:999px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">↻ Retry</button>'
    + '</div>';
}
