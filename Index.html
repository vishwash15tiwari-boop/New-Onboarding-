    }
    return;
  }
  var vs = (DS.verticals || {})[key] || {};
  var vb = (DB && DB.verticals || {})[key] || {};
  window._gmvCats = { seller: vs.categories || [], buyer: vb.categories || [] };
  if (sEl) sEl.innerHTML = buildInlinePipeCard(cfg, vs, 'Seller Pipeline', 'seller', 0);
  if (bEl) bEl.innerHTML = buildInlinePipeCard(cfg, vb, 'Buyer Pipeline', 'buyer', 1);
  var sTag = document.getElementById('mm-seller-tag');
  var bTag = document.getElementById('mm-buyer-tag');
  if (sTag) sTag.textContent = fmt(vs.total || 0) + ' cases';
  if (bTag) bTag.textContent = fmt(vb.total || 0) + ' cases';
  renderBizRail(cfg, vs);
  if (sEl) animateCounters(sEl);
  if (bEl) animateCounters(bEl);
  if (key === 'OMP') {
    loadQualityData();       // populates the quality strips AND the Documents section
  } else {
    var de = document.getElementById('vert-docs-section');
    if (de) de.style.display = 'none';   // Document Management is Open Marketplace only
  }
}

// ── Business Insights rail (right column) ─────────────────────────
// Seller-side GMV (business rule: GMV = seller transaction value only),
// per-category GMV, plus Vendor Rating & OSV Consent (OMP only). The
// quality rows start as "Syncing…" and are patched by _patchQualityKpiCards.
function renderBizRail(cfg, vs) {
  var ops      = document.getElementById('sec-ops');
  var perf     = document.getElementById('sec-perf');
  var opsWrap  = document.getElementById('sec-ops-wrap');
  var perfWrap = document.getElementById('sec-perf-wrap');
  if (!ops && !perf) return;
  var isOMP = cfg && cfg.key === 'OMP';
  var key   = cfg && cfg.key;
  var vb    = (key && DB && DB.verticals) ? (DB.verticals[key] || {}) : {};

  // ── small builders ──
  function opCard(action, label, body, clickable) {
    var can = clickable && action;
    var attrs = can
      ? ' role="button" tabindex="0" onclick="openKpiModal(\'' + action + '\')"'
        + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openKpiModal(\'' + action + '\')}"'
      : '';
    var link = can ? '<span class="op-link">Details ›</span>' : '';
    return '<div class="op-card' + (can ? '' : ' static') + '"' + attrs + '>'
      + '<div class="op-hd"><span class="op-lbl">' + label + '</span>' + link + '</div>'
      + body + '</div>';
  }
  function osvRow(color, name, val, p) {
    return '<div class="osv-row"><i class="osv-dot" style="background:' + color + '"></i>'
      + '<span class="osv-nm">' + name + '</span><span class="osv-v">' + fmt(val) + '</span>'
      + '<span class="osv-pct">' + p + '%</span></div>';
  }

  // Loading / no-vertical → skeletons so the sections never flash empty.
  if (!vs) {
    var skc = '<div class="op-card static"><div class="biz-sk" style="width:45%"></div>'
      + '<div class="biz-sk" style="width:62%;height:22px;margin-top:12px"></div></div>';
    if (ops)  ops.innerHTML  = _dashLoading ? '<div class="jr-ops">' + skc + skc + skc + '</div>' : '';
    if (perf) perf.innerHTML = _dashLoading
      ? '<div class="jr-perf"><div class="gmv-dark"><div class="biz-sk" style="width:40%;background:rgba(255,255,255,.18)"></div>'
        + '<div class="biz-sk" style="width:60%;height:26px;margin-top:12px;background:rgba(255,255,255,.18)"></div></div>'
        + '<div class="biz-card"><div class="biz-sk" style="width:38%"></div><div class="biz-sk" style="width:100%;height:14px;margin-top:10px"></div></div></div>'
      : '';
    return;
  }

  // ── 6 · Operational Insights (Vendor Rating · Avg TAT · OSV) ──
  var opCards = [];
  var q = (isOMP && qualityData && qualityData.success) ? (qualityData.seller || {}) : null;
  if (isOMP) {
    var r = q && q.rating ? q.rating : null;
    if (r && r.avg != null) {
      var rPct = Math.min(100, r.avg / 5 * 100);
      opCards.push(opCard('rating', 'Vendor Rating',
        '<div class="op-big">' + r.avg.toFixed(1) + '<small> / 10</small></div>'
        + '<div class="op-sub">' + fmt(r.rated || 0) + (r.total > 0 ? ' of ' + fmt(r.total) + ' OMP' : '') + ' rated</div>'
        + '<div class="op-bar"><i style="width:' + rPct.toFixed(0) + '%"></i></div>', true));
    } else {
      opCards.push(opCard('rating', 'Vendor Rating', '<div class="op-sync">Syncing…</div>', true));
    }
  }
  if (vs.avgTAT != null) {
    var tatSub = (vb.avgTAT != null) ? ('Sellers · Buyers ' + vb.avgTAT + ' days') : 'Seller onboarding';
    opCards.push(opCard(null, 'Avg Turnaround',
      '<div class="op-big">' + vs.avgTAT + '<small> days</small></div><div class="op-sub">' + tatSub + '</div>', false));
  }
  if (isOMP) {
    var o = q && q.osv ? q.osv : null;
    if (o && o.total > 0) {
      var oT = o.total, pf = function(n) { return oT > 0 ? Math.round(n / oT * 100) : 0; };
      opCards.push(opCard('osv', 'OSV Status',
        '<div class="osv-list">'
        + osvRow('var(--st-onboarded)', 'Done',          o.completed || 0,    pf(o.completed || 0))
        + osvRow('var(--st-review)',    'In Progress',   o.pending || 0,      pf(o.pending || 0))
        + osvRow('#D1D1D6',             'Not Initiated', o.notInitiated || 0, pf(o.notInitiated || 0))
        + '</div>', true));
    } else {
      opCards.push(opCard('osv', 'OSV Status', '<div class="op-sync">Syncing…</div>', true));
    }
  }
  if (!isOMP && vs.withGST != null) {
    opCards.push(opCard(null, 'GST Active',
      '<div class="op-big">' + fmt(vs.withGST) + '</div><div class="op-sub">GSTIN active sellers</div>', false));
  }
  if (ops) {
    if (opCards.length) { ops.innerHTML = '<div class="jr-ops">' + opCards.join('') + '</div>'; if (opsWrap) opsWrap.style.display = ''; }
    else { ops.innerHTML = ''; if (opsWrap) opsWrap.style.display = 'none'; }
  }

  // ── 7 · Business Performance (Total GMV dark card + Regional Split) ──
  var gmv = vs.totalTxnValue;
  var gmvCats = (vs.categories || []).filter(function(c) { return c.txnValue != null && c.txnValue > 0; })
    .slice().sort(function(a, b) { return (b.txnValue || 0) - (a.txnValue || 0); }).slice(0, 4);
  var gmvMax = gmvCats.reduce(function(m, c) { return Math.max(m, c.txnValue || 0); }, 0) || 1;
  var GMV_COLORS = ['#005DFF', '#1DC797', '#8460D4', '#FF9500'];
  var gmvBody;
  if (gmv != null && gmv > 0) {
    var splitRows = gmvCats.map(function(c, i) {
      var w = (c.txnValue || 0) / gmvMax * 100;
      return '<div class="gmv-dr"><span class="gmv-dr-nm">' + esc(c.category) + '</span>'
        + '<div class="gmv-dr-track"><i class="gmv-dr-fill" style="width:' + w.toFixed(0) + '%;background:' + GMV_COLORS[i % GMV_COLORS.length] + '"></i></div>'
        + '<span class="gmv-dr-vl">' + fmtINR(c.txnValue) + '</span></div>';
    }).join('');
    gmvBody = '<div class="gmv-dark-vl">' + fmtINR(gmv) + '</div>'
      + (splitRows ? '<div class="gmv-dark-split">' + splitRows + '</div>' : '');
  } else {
    gmvBody = '<div class="gmv-dark-empty">No GMV recorded for this segment yet</div>';
  }
  var gmvClick = (gmv != null && gmv > 0)
    ? ' role="button" tabindex="0" onclick="openGmvCatModal(\'seller\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openGmvCatModal(\'seller\')}"'
    : '';
  var gmvCard = '<div class="gmv-dark"' + gmvClick + '>'
    + '<div class="gmv-dark-top"><span class="gmv-dark-lb">Total GMV</span>'
    +   ((gmv != null && gmv > 0) ? '<span class="gmv-dark-link">Details ›</span>' : '') + '</div>'
    + gmvBody + '</div>';

  var regionInner = _buildRailRegions(vs);
  var regionCard  = regionInner ? '<div class="biz-card">' + regionInner + '</div>' : '';

  if (perf) {
    perf.innerHTML = regionCard
      ? ('<div class="jr-perf">' + gmvCard + regionCard + '</div>')
      : ('<div class="jr-perf" style="grid-template-columns:1fr">' + gmvCard + '</div>');
    if (perfWrap) perfWrap.style.display = '';
  }
  mmGrowRail();   // Operational Metrics height changed — re-reach the rail to the last branch
}

// Fixed accent per region so the split reads as a consistent legend.
var REGION_COLORS = { North: '#005DFF', South: '#1DC797', Other: '#8E8E93' };
// Frontend mirror of the backend stateToRegion_ (two-way North / South split) —
// lets the Regional Split card populate from loaded detail rows even before
// Code.gs is redeployed, exactly like the GMV-by-category fallback.
var SOUTH_STATES_FE = (function() {
  var s = {};
  ['andhrapradesh','ap','karnataka','ka','kerala','kl','tamilnadu','tn','telangana','ts','tg',
   'puducherry','pondicherry','py','lakshadweep','ld',
   'andamannicobar','andamanandnicobar','andamanandnicobarislands','an']
    .forEach(function(n) { s[n] = true; });
  return s;
}());
var SOUTH_GST_CODES_FE = { '28':1,'29':1,'31':1,'32':1,'33':1,'34':1,'35':1,'36':1,'37':1 };
function _stateToRegionFE(state) {
  var raw = String(state || '').trim();
  if (!raw) return '';
  var digits = raw.match(/^\s*(\d{1,2})\b/);
  if (digits) {
    var code = digits[1].length === 1 ? '0' + digits[1] : digits[1];
    return SOUTH_GST_CODES_FE[code] ? 'South' : 'North';
  }
  var key = raw.toLowerCase().replace(/&/g, 'and').replace(/[^a-z]/g, '');
  return SOUTH_STATES_FE[key] ? 'South' : 'North';
}
// Aggregate per-vendor detail rows into the same shape the backend `regions`
// field uses (region, total, onboarded, txnValue).
function _regionsFromRows(rows) {
  var map = {};
  rows.forEach(function(r) {
    var reg = _stateToRegionFE(r.state);
    if (!reg) return;
    if (!map[reg]) map[reg] = { region: reg, total: 0, onboarded: 0, txnValue: 0, hasTxnVal: false };
    var g = map[reg];
    g.total++;
    if (r.status === 'COMPLETED') g.onboarded++;
    var tv = r.txnValue;
    if (tv != null && tv > 0) { g.txnValue += Number(tv); g.hasTxnVal = true; }
  });
  return Object.keys(map).map(function(k) {
    var g = map[k];
    return { region: g.region, total: g.total, onboarded: g.onboarded, txnValue: g.hasTxnVal ? g.txnValue : null };
  });
}
// Recompute cfg + seller summary for the active vertical and repaint the rail.
// Called after detail rows load so the region fallback can fill the card.
function refreshBizRail() {
  var key = (typeof activeVertKey !== 'undefined' && activeVertKey) || selectedVert;
  if (!key) return;
  var cfg = getVertCfg().filter(function(c) { return c.key === key; })[0];
  if (!cfg) return;
  var vs = (DS && DS.verticals) ? DS.verticals[key] : null;
  renderBizRail(cfg, vs || null);
}
// Region-wise bifurcation card for the Business Insights rail. Shows onboarded
// sellers per region with a proportional share bar; empty when no region data.
function _buildRailRegions(vs) {
  var regs = (vs && vs.regions ? vs.regions : [])
    .filter(function(r) { return (r.total || 0) > 0; });
  // Fallback: derive from loaded seller detail rows when the backend response
  // predates the `regions` field (e.g. before Code.gs is redeployed).
  if (!regs.length && selectedAud === 'seller' && Array.isArray(vertRows) && vertRows.length) {
    regs = _regionsFromRows(vertRows).filter(function(r) { return (r.total || 0) > 0; });
  }
  if (!regs.length) return '';
  // Prefer onboarded counts; fall back to total pipeline if nothing onboarded yet.
  var onbSum = regs.reduce(function(s, r) { return s + (r.onboarded || 0); }, 0);
  var useOnb = onbSum > 0;
  var metric = function(r) { return useOnb ? (r.onboarded || 0) : (r.total || 0); };
  var sorted = regs.slice().sort(function(a, b) { return metric(b) - metric(a); });
  var denom  = sorted.reduce(function(s, r) { return s + metric(r); }, 0);
  var top    = sorted.slice(0, 6);
  var rows = top.map(function(r) {
    var v   = metric(r);
    var p   = denom > 0 ? (v / denom * 100) : 0;
    var col = REGION_COLORS[r.region] || REGION_COLORS.Other;
    var gmv = (r.txnValue != null && r.txnValue > 0) ? ' · ' + fmtINR(r.txnValue) : '';
    var rg  = esc(r.region);
    return '<div class="biz-reg biz-reg-btn" role="button" tabindex="0"'
      + ' title="' + rg + ' — ' + fmt(v) + (useOnb ? ' onboarded' : ' in pipeline') + gmv + ' · click for details"'
      + ' onclick="openRegionModal(\'' + rg + '\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openRegionModal(\'' + rg + '\')}">'
      + '<div class="biz-reg-top">'
      +   '<span class="biz-reg-nm"><i class="biz-reg-dot" style="background:' + col + '"></i>' + rg + '</span>'
      +   '<span class="biz-reg-vl">' + fmt(v) + '<em>' + p.toFixed(0) + '%</em></span>'
      + '</div>'
      + '<div class="biz-reg-bar"><div class="biz-reg-fill" style="width:' + p.toFixed(1) + '%;background:' + col + '"></div></div>'
      + '</div>';
  }).join('');
  return '<div class="biz-region">'
    + '<div class="biz-hd">'
    +   '<div class="biz-hd-ttl">Regional Split</div>'
    +   '<div class="biz-hd-sub">' + (useOnb ? 'Onboarded sellers by region' : 'Pipeline by region') + '</div>'
    + '</div>'
    + rows
    + '</div>';
}

// ═══════════════════════════════════════════════════════════════
// REGION DETAIL MODAL — click a North/South row to see the vendors
// in that region, grouped by onboarding stage, with a Sellers/Buyers
// toggle. Rows are fetched per audience on demand (cached), mirroring
// the GMV-by-category modal.
// ═══════════════════════════════════════════════════════════════
var _rgn = { region: '', key: '', pKey: '', aud: 'seller', rows: { seller: null, buyer: null } };

function openRegionModal(region) {
  var key = (typeof activeVertKey !== 'undefined' && activeVertKey) || selectedVert;
  if (!key) return;
  var pKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  // Reset the row cache when the vertical or period changed since last open.
  if (_rgn.key !== key || _rgn.pKey !== pKey) _rgn.rows = { seller: null, buyer: null };
  _rgn.region = region;
  _rgn.key    = key;
  _rgn.pKey   = pKey;
  _rgn.aud    = (selectedAud === 'buyer') ? 'buyer' : 'seller';
  // Seed from already-loaded detail rows when they match the active audience.
  if (_rgn.rows[_rgn.aud] == null && selectedVert === key
      && Array.isArray(vertRows) && vertRows.length
      && (selectedAud === 'buyer' ? 'buyer' : 'seller') === _rgn.aud) {
    _rgn.rows[_rgn.aud] = vertRows.slice();
  }
  _regionShow();
}

function _regionSetAud(aud) {
  if (_rgn.aud === aud) return;
  _rgn.aud = aud;
  _regionShow();
}

// Render if rows for the active audience are available, else fetch them first.
function _regionShow() {
  if (_rgn.rows[_rgn.aud] == null) { _regionFetch(_rgn.aud); return; }
  _regionRender(false);
}

function _regionFetch(aud) {
  _regionRender(true);   // paint the loading state immediately
  var f = { audience: aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  google.script.run
    .withSuccessHandler(function(res) {
      try {
        var d = JSON.parse(res);
        _rgn.rows[aud] = (d && d.success && Array.isArray(d.rows)) ? d.rows : [];
      } catch (e) { _rgn.rows[aud] = []; }
      if (_rgn.aud === aud) _regionShow();
    })
    .withFailureHandler(function() {
      _rgn.rows[aud] = [];
      if (_rgn.aud === aud) _regionRender(false);
    })
    .getVerticalRows(_rgn.key, JSON.stringify(f));
}

function _regionRender(loading) {
  var el = document.getElementById('km-pn');
  var modal = document.getElementById('kpi-modal');
  if (!el || !modal) return;
  var region = _rgn.region, aud = _rgn.aud;
  var cfg = getVertCfg().filter(function(c) { return c.key === _rgn.key; })[0];
  var vname = (cfg && cfg.name) || _rgn.key || '';
  var audLbl = aud === 'seller' ? 'Sellers' : 'Buyers';
  var col = REGION_COLORS[region] || REGION_COLORS.Other;

  var head = '<div class="km-head">'
    + '<div style="display:flex;align-items:center;min-width:0">'
    + '<div class="km-icon" style="color:' + col + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>'
    + '<div class="km-htxt"><div class="km-title">' + esc(region) + ' Region</div>'
    + '<div class="km-sub">' + esc(vname) + ' · ' + audLbl + '</div></div></div>'
    + '<button class="km-close" onclick="closeKpiModal()" aria-label="Close">✕</button>'
    + '</div>';

  var audToggle = '<div class="rgn-aud">'
    + '<button class="rgn-aud-btn' + (aud === 'seller' ? ' on' : '') + '" onclick="_regionSetAud(\'seller\')">Sellers</button>'
    + '<button class="rgn-aud-btn' + (aud === 'buyer'  ? ' on' : '') + '" onclick="_regionSetAud(\'buyer\')">Buyers</button>'
    + '</div>';

  if (loading) {
    el.innerHTML = head + audToggle
      + '<div style="padding:40px 18px;text-align:center;color:var(--txt3);font-size:13px">Loading ' + esc(audLbl.toLowerCase()) + '…</div>';
    _modalOpenClass(modal, 'km-open', _kpiEsc);
    return;
  }

  var all = (_rgn.rows[aud] || []).filter(function(r) { return _stateToRegionFE(r.state) === region; });
  // Summary stats for this region + audience.
  var sm = { total: all.length, onb: 0, rev: 0, draft: 0, rej: 0, gmv: 0, hasGmv: false };
  all.forEach(function(r) {
    if (r.status === 'COMPLETED') sm.onb++;
    else if (r.status === 'IN_REVIEW') sm.rev++;
    else if (r.status === 'DRAFT') sm.draft++;
    else if (r.status === 'REJECTED') sm.rej++;
    if (r.txnValue != null && r.txnValue > 0) { sm.gmv += Number(r.txnValue); sm.hasGmv = true; }
  });
  var tile = function(v, l) {
    return '<div class="rgn-tile"><div class="rgn-tile-v">' + v + '</div><div class="rgn-tile-l">' + l + '</div></div>';
  };
  var tiles = '<div class="rgn-tiles">'
    + tile(fmt(sm.total), 'Total')
    + tile(fmt(sm.onb), 'Onboarded')
    + tile(fmt(sm.rev), 'In Review')
    + tile(fmt(sm.draft), 'Draft')
    + (aud === 'seller' && sm.hasGmv ? tile(fmtINR(sm.gmv), 'GMV') : '')
    + '</div>';

  var body;
  if (!all.length) {
    body = '<div style="padding:36px 18px;text-align:center;color:var(--txt3);font-size:13px">No '
      + esc(audLbl.toLowerCase()) + ' in ' + esc(region) + ' for the selected period</div>';
  } else {
    // Group by onboarding stage — onboarded first — for an at-a-glance structure.
    var groups = [
      ['COMPLETED', 'Onboarded'], ['IN_REVIEW', 'In Review'],
      ['DRAFT', 'Draft'], ['REJECTED', 'Rejected'],
    ];
    var MAXG = 60;   // cap rows per group so the modal stays snappy
    body = groups.map(function(g) {
      var list = all.filter(function(r) { return r.status === g[0]; })
        .sort(function(a, b) { return (b.txnValue || 0) - (a.txnValue || 0) || String(a.name || '').localeCompare(String(b.name || '')); });
      if (!list.length) return '';
      var shown = list.slice(0, MAXG);
      var rowsHtml = shown.map(function(r) {
        var meta = [r.id ? '#' + esc(r.id) : '', esc(r.category || ''), esc(r.state || '')]
          .filter(Boolean).join(' · ');
        var gstChip = r.hasGST
          ? '<span class="rgn-gst ok" title="' + esc(r.gstin || '') + '">✓ GST</span>'
          : '<span class="rgn-gst bad">✗ GST</span>';
        var gmvChip = (r.txnValue != null && r.txnValue > 0)
          ? '<span class="rgn-gmv">' + fmtINR(r.txnValue) + '</span>' : '';
        return '<div class="rgn-row">'
          + '<div class="rgn-row-main"><div class="rgn-row-nm">' + esc(r.name || '—') + '</div>'
          +   '<div class="rgn-row-sub">' + meta + '</div></div>'
          + '<div class="rgn-row-side">' + gmvChip + gstChip + '</div>'
          + '</div>';
      }).join('');
      var more = list.length > MAXG
        ? '<div class="rgn-more">+ ' + fmt(list.length - MAXG) + ' more</div>' : '';
      return '<div class="rgn-group">'
        + '<div class="rgn-group-hd"><span class="rgn-group-ttl">' + g[1] + '</span>'
        +   '<span class="rgn-group-ct">' + fmt(list.length) + '</span></div>'
        + rowsHtml + more
        + '</div>';
    }).join('');
  }

  el.innerHTML = head + audToggle + tiles + body;
  if (!modal.classList.contains('km-open')) { modal.classList.add('km-open'); document.addEventListener('keydown', _kpiEsc); }
}

// Vendor Rating + OSV Consent mini-cards for the rail. qc null → "Syncing…".
function _buildRailQual(qc, vname) {
  var wrap = '<div id="biz-qual">';
  var ratingVal, ratingSub, osvVal, osvSub;
  if (qc) {
    var r = qc.rating || {}, o = qc.osv || {};
    ratingVal = r.avg != null ? r.avg.toFixed(1) + ' / 10' : '—';
    ratingSub = fmt(r.rated || 0) + (r.total > 0 ? ' of ' + fmt(r.total) + ' OMP' : '') + ' rated';
    osvVal    = o.total > 0 ? Math.round((o.completed || 0) / o.total * 100) + '%' : '—';
    osvSub    = fmt(o.completed || 0) + (o.total > 0 ? ' of ' + fmt(o.total) + ' OMP' : '') + ' consent given';
  }
  var card = function(cardId, icon, label, val, sub) {
    var body = val != null
      ? '<div class="biz-q-vl">' + val + '</div><div class="biz-q-sub">' + sub + '</div>'
      : '<div class="biz-q-sync">Syncing</div>';
    return '<div class="biz-q" role="button" tabindex="0"'
      + ' onclick="openKpiModal(\'' + cardId + '\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openKpiModal(\'' + cardId + '\')}">'
      + '<div class="biz-q-ic">' + icon + '</div>'
      + '<div class="biz-q-tx"><div class="biz-q-lb">' + label + '</div>' + body + '</div></div>';
  };
  return wrap
    + card('rating', '★', 'Vendor Rating', ratingVal, ratingSub)
    + card('osv',    '✓', 'OSV Consent',   osvVal,    osvSub)
    + '</div>';
}

function buildInlinePipeCard(cfg, v, label, aud, idx) {
  var lblCls = aud === 'seller' ? 'cc-pipe-lbl-seller' : 'cc-pipe-lbl-buyer';
  var isActive = aud === selectedAud;
  var attrs = ' style="--i:' + idx + ';' + vcVars(cfg.key) + '"'
    + ' class="compare-card vpipe-card aud-' + aud + (isActive ? ' det-active' : '') + '"'
    + ' onclick="setDetailAud(\'' + aud + '\')" role="button" tabindex="0"'
    + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();setDetailAud(\'' + aud + '\')}"';
  var ghost = '<span class="cc-ghost" aria-hidden="true">' + (aud === 'seller' ? 'S' : 'B') + '</span>';
  var dotClr = aud === 'seller' ? 'var(--st-onboarded)' : 'var(--st-transacted)';
  var hdr = '<div class="cc-hdr2 pipe-hdr" style="align-items:center;gap:8px">'
    + '<span class="pipe-title2">' + (aud === 'seller' ? 'Sellers' : 'Buyers') + '&rsquo; Onboarding Pipeline</span>'
    + (isActive ? '<span class="pipe-viewing">Viewing below</span>' : '')
    + '</div>';
  var tot = v.total || 0;
  if (!tot) {
    var noDataBody = _dashLoading
      ? ('<div class="sk-pipe">'
         + '<div class="sk-line" style="width:100%;height:8px;border-radius:4px"></div>'
         + '<div style="display:flex;gap:8px;margin:10px 0">'
         + '<div class="sk-line" style="flex:1;height:44px;border-radius:6px;margin:0"></div>'
         + '<div class="sk-line" style="flex:1;height:44px;border-radius:6px;margin:0"></div>'
         + '<div class="sk-line" style="flex:1;height:44px;border-radius:6px;margin:0"></div>'
         + '</div>'
         + '<div class="sk-line" style="width:65%"></div>'
         + '<div class="sk-line" style="width:45%"></div>'
         + '</div>')
      : ('<div class="no-data" style="padding:24px 0">'
         + ((typeof currentPeriod !== 'undefined' && currentPeriod && currentPeriod !== 'All')
            ? 'No ' + (aud === 'seller' ? 'seller' : 'buyer') + ' activity in the selected period'
            : 'No data')
         + '</div>');
    return '<div' + attrs + '>' + ghost + hdr + noDataBody + '</div>';
  }
  // Stage row — each stage shows its label + count on one line with a
  // proportional bar beneath (bar length relative to the largest stage).
  var vDraft = v.draft || 0, vReview = v.inReview || 0, vDone = v.completed || 0;
  var stageMax = Math.max(vDraft, vReview, vDone, 1);
  var stageDef = [
    ['Draft',     vDraft,  'ps-draft'],
    ['In Review', vReview, 'ps-review'],
    ['Completed', vDone,   'ps-done'],
  ];
  var pipeBoxes = '<div class="pipe-stages">' + stageDef.map(function(s) {
    var w = s[1] > 0 ? Math.max(5, s[1] / stageMax * 100) : 0;
    return '<div class="pipe-stage">'
      + '<div class="ps-top"><span class="ps-lbl">' + s[0] + '</span><span class="ps-num">' + fmt(s[1]) + '</span></div>'
      + '<div class="ps-bar"><i class="ps-fill ' + s[2] + '" style="width:' + w.toFixed(1) + '%"></i></div>'
      + '</div>';
  }).join('') + '</div>';
  var flowBar = '';   // stage bars now live inline within pipeBoxes
  var topCats = (v.categories || []).filter(function(c) { return (c.total || 0) > 0; }).slice(0, 3);
  var catRows = topCats.map(function(c) {
    var parts = [];
    if ((c.onboarded || 0) > 0) parts.push('<em>' + fmt(c.onboarded) + ' onboarded</em>');
    if ((c.draft     || 0) > 0) parts.push(fmt(c.draft) + ' draft');
    if ((c.inReview  || 0) > 0) parts.push(fmt(c.inReview) + ' review');
    return '<div class="cc-cat-row"><span class="cc-cat-badge">' + esc(c.category) + '</span>'
      + '<span class="cc-cat-detail">' + parts.join(' · ') + '</span></div>';
  }).join('');
  if (catRows) catRows = '<div class="cc-cat-rows">' + catRows + '</div>';
  var newV = v.newVendors || 0, oldV = v.oldVendors || 0;
  var enVal = null; // shown in the top KPI row for OMP, not in pipeline cards
  var fys = (v.fyBreakdown || []).filter(function(f) { return !f.fyStart || f.fyStart >= 2019; });
  var statsList = '';
  if (fys.length) {
    var isOMP    = cfg.key === 'OMP';
    var aggTAT   = v.avgTAT        != null ? v.avgTAT + 'd'           : null;
    var aggPct   = v.pctTransacted  != null ? v.pctTransacted + '%'   : null;
    var aggGMV   = v.totalTxnValue  != null ? fmtINR(v.totalTxnValue) : null;
    var aggGSTon = v.withGST        != null ? fmt(v.withGST)          : null;
    var fyTr = function(label, valFn, aggVal, badCls, onclickFn) {
      var cells = fys.map(valFn);
      var allEmpty = cells.every(function(c){ return c === null || c === undefined || c === '—'; }) && aggVal == null;
      if (allEmpty) return '';
      var trCls = onclickFn ? ('cc-fy-row-btn' + (badCls ? ' ' + badCls : '')) : (badCls || '');
      var trAttrs = trCls ? ' class="' + trCls + '"' : '';
      if (onclickFn) trAttrs += ' role="button" tabindex="0"'
        + ' onclick="event.stopPropagation();' + onclickFn + '"'
        + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();event.stopPropagation();' + onclickFn + '}"';
      return '<tr' + trAttrs + '>'
        + '<td class="cc-fy-td-lbl">' + label + '</td>'
        + cells.map(function(c){ return '<td class="cc-fy-td">' + (c != null ? c : '—') + '</td>'; }).join('')
        + '<td class="cc-fy-td cc-fy-all">' + (aggVal != null ? aggVal : '—') + '</td>'
        + '</tr>';
    };
    var fyTbody = [
      fyTr('Avg TAT',       function(f){ return f.avgTAT        != null ? f.avgTAT + 'd'           : null; }, aggTAT,   ''),
      isOMP ? null : fyTr('% Transacted',  function(f){ return f.pctTransacted != null ? f.pctTransacted + '%'   : null; }, aggPct,   ''),
      // Total GMV now lives in the Business Insights rail (seller-only), not here.
      fyTr('GSTIN active',  function(f){ return f.withGST       != null ? fmt(f.withGST)          : null; }, aggGSTon, ''),
      enVal ? '<tr class="cc-fy-row-btn" role="button" tabindex="0"'
        + ' onclick="event.stopPropagation();openKpiModal(\'oldvsnew\')"'
        + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();event.stopPropagation();openKpiModal(\'oldvsnew\')}">'
        + '<td class="cc-fy-td-lbl">New Vendors Onboarded</td>'
        + fys.map(function(){ return '<td class="cc-fy-td" style="color:var(--txt3)">—</td>'; }).join('')
        + '<td class="cc-fy-td cc-fy-all">' + enVal + '</td>'
        + '</tr>' : null,
    ].filter(Boolean).join('');
    if (fyTbody) {
      var fyThead = '<thead><tr><th class="cc-fy-th-lbl"></th>'
        + fys.map(function(f){ return '<th class="cc-fy-th">' + esc(f.fy) + '</th>'; }).join('')
        + '<th class="cc-fy-th cc-fy-all">All</th>'
        + '</tr></thead>';
      statsList = '<div class="cc-fy-wrap">'
        + '<table class="cc-fy-tbl">' + fyThead + '<tbody>' + fyTbody + '</tbody></table>'
        + '</div>';
    }
  } else {
    var isOMP2 = cfg.key === 'OMP';
    var statRows = [];
    if (v.avgTAT        != null) statRows.push(['Avg TAT',      v.avgTAT + 'd',          '']);
    if (!isOMP2 && v.pctTransacted != null) statRows.push(['% Transacted', v.pctTransacted + '%', '']);
    // Total GMV now lives in the Business Insights rail (seller-only), not here.
    if (v.withGST       != null) statRows.push(['GSTIN Active', fmt(v.withGST),          '']);
    var rowsHtml = statRows.map(function(r) {
      if (r[3]) {
        return '<div class="cc-stat-row cc-stat-row-btn" role="button" tabindex="0"'
          + ' onclick="event.stopPropagation();' + r[3] + '"'
          + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();event.stopPropagation();' + r[3] + '}">'
          + r[0] + '<b>' + r[1] + '</b></div>';
      }
      return '<div class="cc-stat-row' + (r[2] ? ' ' + r[2] : '') + '">' + r[0] + '<b>' + r[1] + '</b></div>';
    }).join('');
    if (enVal) rowsHtml += '<div class="cc-stat-row cc-stat-row-btn" role="button" tabindex="0"'
      + ' onclick="event.stopPropagation();openKpiModal(\'oldvsnew\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();event.stopPropagation();openKpiModal(\'oldvsnew\')}">'
      + 'New Vendors Onboarded<b>' + enVal + '</b></div>';
    statsList = rowsHtml ? '<div class="cc-stat-list">' + rowsHtml + '</div>' : '';
  }
  // Category breakdown (left) and the FY stats table (right) sit side-by-side,
  // divided by a hairline. If only one is present it spans the full width.
  var btm;
  if (catRows && statsList) {
    btm = '<div class="pipe-btm">'
      + '<div class="pipe-btm-l">' + catRows + '</div>'
      + '<div class="pipe-btm-r">' + statsList + '</div>'
      + '</div>';
  } else if (catRows || statsList) {
    btm = '<div class="pipe-btm-solo">' + (catRows || statsList) + '</div>';
  } else {
    btm = '';
  }
  // Vendor Rating / OSV Consent moved to the Business Insights rail (seller OMP).
  return '<div' + attrs + '>' + ghost + hdr + flowBar + pipeBoxes + btm + '</div>';
}

// Render the inline detailed view section (replaces the full-screen overlay).

  var el = document.getElementById('vert-detail-section');
  if (!el) return;
  if (!key) { el.style.display = 'none'; return; }
  var vcStyle = vcVars(key);
  el.style.cssText = 'display:block;' + vcStyle;

  var cfg = getVertCfg().filter(function(c) { return c.key === key; })[0];
  var aud = selectedAud || 'seller';
  var rowCount = vertRows.length;

  var audTabs = '<div class="aud-tabs">'
    + '<button class="aud-tab' + (aud === 'seller' ? ' active' : '') + '" id="det-aud-s" onclick="setDetailAud(\'seller\')">Sellers</button>'
    + '<button class="aud-tab' + (aud === 'buyer'  ? ' active' : '') + '" id="det-aud-b" onclick="setDetailAud(\'buyer\')">Buyers</button>'
    + '</div>';

    + '<span class="vds-title">Records</span>'
    + audTabs

    + '</div>';

  var bodyContent;
  if (vertRowsLoading) {
    bodyContent = '<div style="padding:26px">'
      + '<div class="sk-line" style="width:38%"></div>'
      + '<div class="sk-line" style="width:86%"></div>'
      + '<div class="sk-line" style="width:74%"></div>'
      + '<div class="no-data plain" style="padding:14px 0 0">Loading records…</div></div>';
  } else if (vertRowsError) {
    bodyContent = '<div class="no-data plain" style="padding:32px">'
      + '<div style="color:var(--red);font-weight:600;margin-bottom:6px">⚠ Could not load records</div>'
      + '<div style="margin-bottom:14px">' + esc(vertRowsError) + '</div>'
      + '<button class="vd-retry" onclick="vdRetryRows()">↻ Retry</button></div>';
  } else if (vertRows.length) {
    var vSrcD = aud === 'buyer' ? (DB && DB.verticals) : (DS && DS.verticals);
    var vD = (vSrcD && vSrcD[key]) || {};
    var catSection = ((vD.categories || []).length > 0)
      ? '<div class="cc-cap vd-cat-cap">Onboarded by Category</div>' + cardCategories(vD, 12)
      : '';
    var cols = [
      ['name', 'Business'], ['category', 'Category'], ['vendorType', 'Vendor Type'],
      ['status', 'Status'], ['gstin', 'GSTIN'], ['state', 'State'], ['createdDate', 'Created'],
      ['onbDate', 'Onboarded'], ['tat', 'TAT'], ['txn', 'Transaction'],
    ];
    var filtersHtml = '<div class="vd-filters">'
      + '<div class="vd-toggle">'
      + '<button class="vd-toggle-btn' + (vdView === 'board' ? ' active' : '') + '" onclick="vdSetView(\'board\')">▦ Board</button>'
      + '<button class="vd-toggle-btn' + (vdView === 'table' ? ' active' : '') + '" onclick="vdSetView(\'table\')">☰ Table</button>'
      + '</div>'
      + vdSelect('vdf-category', 'Category',    vdUnique(vertRows, 'category'),   vdF.category, null)
      + vdSelect('vdf-vendor',   'Vendor Type', vdUnique(vertRows, 'vendorType'), vdF.vendor,   null)
      + vdSelect('vdf-status',   'Status',      vdUnique(vertRows, 'status'),     vdF.status,   STATUS_LABELS)
      + vdSelect('vdf-gst',      'GST',         ['Active', 'Inactive'],           vdF.gst,      null)
      + '<input type="text" class="filter-input vd-search" id="vdf-search" placeholder="Search name, GSTIN or ID" value="' + esc(vdF.search) + '" oninput="vdfSearchDeb()">'
      + '<button class="vd-close" onclick="vdfClear()">Clear</button>'
      + '</div>';
    bodyContent = catSection
      + '<div id="cat-detail-wrap" style="display:none"></div>'
      + filtersHtml
      + '<div class="kb-wrap mt-16" id="vd-board-view"><div class="kb-board" id="vd-board"></div></div>'
      + '<div class="table-wrap vd-table-wrap mt-16" id="vd-table-view"><table><thead><tr>'
      + cols.map(function(c) {
          return '<th data-key="' + c[0] + '" onclick="vdSortBy(\'' + c[0] + '\')" title="Sort by ' + esc(c[1]) + '">' + c[1] + '</th>';
        }).join('')
      + '</tr></thead><tbody id="vd-tbody"></tbody></table></div>'

  } else {
    bodyContent = '<div class="no-data">No records for this vertical</div>';

  el.innerHTML = head + '<div class="vds-body">' + bodyContent + '</div>';

  if (vdF.category && vdF.category !== 'All') showCatDetail(vdF.category, true);
  renderVdRecords();
}

// SELLERS / BUYERS toggle inside the detailed view section.
function setDetailAud(aud) {
  var key = activeVertKey || selectedVert;
  if (selectedAud === aud && vertRows.length > 0 && !vertRowsLoading) {
    renderInlineDetail(key);
    _showRecSheet(key);
    return;
  }
  selectedAud = aud;
  renderPipelinePair(key);   // updates .det-active class on the cards
  // Reset and reload rows for the new audience
  vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '' };
  vdSort = { key: '', dir: 1 };
  vertRows = []; vertRowsLoading = true; vertRowsError = null;
  _vertRowsPKey = null; ++_vertRowsGen;
  var detEl = document.getElementById('vert-detail-section');
  if (detEl) detEl.style.display = '';
  renderInlineDetail(key);
  loadVertRows(key);
  _showRecSheet(key);
}
// Reveal the Detailed Records slide-over and label it for the active context.
function _showRecSheet(key) {
  key = key || activeVertKey || selectedVert;
  var sub = document.getElementById('rs-sub');
  if (sub) {
    var cfg = getVertCfg().filter(function(c) { return c.key === key; })[0];
    sub.textContent = ((cfg && cfg.name) || key || '') + ' · ' + (selectedAud === 'buyer' ? 'Buyers' : 'Sellers');
  }
  var ovl = document.getElementById('rec-ovl');
  if (ovl && !ovl.classList.contains('show')) {
    ovl.classList.add('show'); document.body.classList.add('rec-open');
    lockBodyScroll();
  }
}

// Redirect renderVertDetail() to the inline section (backward compat for existing callers).
function renderVertDetail() {
  var key = activeVertKey || selectedVert;
  if (key) renderInlineDetail(key);
}

// Legacy buildCard — not used in the new layout.
var _gridAnimKey = null;
var _bcIdx = 0;
function buildCard(cfg, v, pipelineLabel) {
    var tot = v.total || 0;
    var aud = pipelineLabel === 'Seller Pipeline' ? 'seller' : 'buyer';
    var lblCls = pipelineLabel === 'Seller Pipeline' ? 'cc-pipe-lbl-seller' : 'cc-pipe-lbl-buyer';
    var attrs = ' style="--i:' + (_bcIdx++) + ';' + vcVars(cfg.key) + '" tabindex="0" role="button"'
      + ' aria-label="' + esc(cfg.name) + ' ' + esc(pipelineLabel) + ' details"'
      + ' onclick="openVertDetail(\'' + cfg.key + '\',\'' + aud + '\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openVertDetail(\'' + cfg.key + '\',\'' + aud + '\')}"';

    var hdr = '<div class="cc-hdr2"><span class="cc-pipe-lbl ' + lblCls + '">' + pipelineLabel + '</span></div>';

    if (tot <= 0) {
      return '<div class="compare-card"' + attrs + '>'
        + hdr + '<div class="no-data" style="padding:24px 0">No data</div></div>';
    }

    // Hero: big onboarded number + subtitle
    var hero = '<div class="cc-onb-hero">'
      + '<span class="cc-onb-num">' + fmt(v.completed || 0) + '</span>'
      + '<span class="cc-onb-sub">Onboarded</span>'
      + '</div>';

    // Pipeline stat rows: Draft / In Review / Rejected
    var pipeStats = '<div class="cc-pipe-stats">'
      + '<div class="cc-pipe-stat ps-draft"><span class="cc-pipe-stat-lbl">Draft</span><span class="cc-pipe-stat-val">' + fmt(v.draft || 0) + '</span></div>'
      + '<div class="cc-pipe-stat ps-review"><span class="cc-pipe-stat-lbl">In Review</span><span class="cc-pipe-stat-val">' + fmt(v.inReview || 0) + '</span></div>'
      + '<div class="cc-pipe-stat ps-reject"><span class="cc-pipe-stat-lbl">Rejected</span><span class="cc-pipe-stat-val">' + fmt(v.rejected || 0) + '</span></div>'
      + '</div>';

    // Category rows: top 3
    var topCats = (v.categories || []).filter(function(c){ return (c.total||0) > 0; }).slice(0, 3);
    var catRows = topCats.length
      ? '<div class="cc-cat-rows">'
        + topCats.map(function(c) {
            var parts = [];
            if ((c.onboarded||0) > 0) parts.push('<em>' + fmt(c.onboarded) + ' onboarded</em>');
            if ((c.draft    ||0) > 0) parts.push(fmt(c.draft) + ' draft');
            if ((c.inReview ||0) > 0) parts.push(fmt(c.inReview) + ' review');
            return '<div class="cc-cat-row">'
              + '<span class="cc-cat-badge">' + esc(c.category) + '</span>'
              + '<span class="cc-cat-detail">' + parts.join(' · ') + '</span>'
              + '</div>';
          }).join('')
        + '</div>'
      : '<div class="cc-cat-rows"></div>';

    // FY breakdown table: all available FYs from 2015 onwards, newest first
    var fys = (v.fyBreakdown || []).filter(function(f) { return !f.fyStart || f.fyStart >= 2019; });
    var statsList = '';
    if (fys.length) {
      // Aggregate values from v (totals across all FYs)
      var isOMPc   = cfg.key === 'OMP';
      var aggTAT   = v.avgTAT        != null ? v.avgTAT + 'd'           : null;
      var aggPct   = v.pctTransacted  != null ? v.pctTransacted + '%'   : null;
      var aggGMV   = v.totalTxnValue  != null ? fmtINR(v.totalTxnValue) : null;
      var aggGSTon = v.withGST        != null ? fmt(v.withGST)          : null;

      function fyTr(label, valFn, aggVal, badCls) {
        var cells = fys.map(valFn);
        var allEmpty = cells.every(function(c){ return c === null || c === undefined || c === '—'; }) && aggVal == null;
        if (allEmpty) return '';
        return '<tr' + (badCls ? ' class="' + badCls + '"' : '') + '>'
          + '<td class="cc-fy-td-lbl">' + label + '</td>'
          + cells.map(function(c){ return '<td class="cc-fy-td">' + (c != null ? c : '—') + '</td>'; }).join('')
          + '<td class="cc-fy-td cc-fy-all">' + (aggVal != null ? aggVal : '—') + '</td>'
          + '</tr>';
      }
      var fyTbody = [
        fyTr('Avg TAT',       function(f){ return f.avgTAT        != null ? f.avgTAT + 'd'           : null; }, aggTAT,   ''),
        isOMPc ? null : fyTr('% Transacted',  function(f){ return f.pctTransacted != null ? f.pctTransacted + '%'   : null; }, aggPct,   ''),
        aud === 'seller' ? fyTr('Total GMV', function(f){ return f.totalTxnValue != null ? fmtINR(f.totalTxnValue) : null; }, aggGMV, '') : null,
        fyTr('GSTIN active',  function(f){ return f.withGST       != null ? fmt(f.withGST)          : null; }, aggGSTon, ''),
      ].filter(Boolean).join('');

      if (fyTbody) {
        var fyThead = '<thead><tr><th class="cc-fy-th-lbl"></th>'
          + fys.map(function(f){ return '<th class="cc-fy-th">' + esc(f.fy) + '</th>'; }).join('')
          + '<th class="cc-fy-th cc-fy-all">All</th>'
          + '</tr></thead>';
        statsList = '<div class="cc-fy-wrap">'
          + '<table class="cc-fy-tbl">' + fyThead + '<tbody>' + fyTbody + '</tbody></table>'
          + '</div>'
          + '<div style="margin-top:auto;align-self:flex-end;padding:10px 0 0">'
          +   '<span style="font-size:11px;font-weight:500;color:var(--blue);letter-spacing:0">View details ›</span>'
          + '</div>';
      }
    }

    return '<div class="compare-card"' + attrs + '>'
      + hdr + hero + pipeStats + catRows + statsList
      + '</div>';
  }

function openVertDetail(key, aud) {
  aud = aud || 'seller';
  // If a different vertical tab — switch to it, which resets rows and re-renders.
  if (activeVertKey !== key) {
    selectedAud = aud;
    activeVertKey = key;
    selectedVert  = key;
    vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '' };
    vdSort = { key: '', dir: 1 };
    vertRows = []; vertRowsLoading = true; vertRowsError = null;
    _vertRowsPKey = null; ++_vertRowsGen; _ovnRows = {};
    document.querySelectorAll('.vert-tab[data-key]').forEach(function(t) {
      t.classList.toggle('active', t.dataset.key === key);
    });
    renderVertKPIs(key);
    renderPipelinePair(key);
    var detEl = document.getElementById('vert-detail-section');
    if (detEl) detEl.style.display = '';
    renderInlineDetail(key);
    loadVertRows(key);
  } else {
    // Same vertical — just switch audience
    setDetailAud(aud);
  }
  // Scroll to the detail section
  setTimeout(function() {
    var detEl = document.getElementById('vert-detail-section');
    if (detEl) detEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 80);
}

function loadVertRows(key) {
  var myGen = ++_vertRowsGen;
  var f = { audience: selectedAud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  var myPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var lsVKey = STORE_PFX + 'vr_' + selectedAud + '_' + key;

  // SWR: serve cached rows immediately so the panel is never blank
  var swrDone = false;
  try {
    var sv = JSON.parse(localStorage.getItem(lsVKey) || 'null');
    if (sv && sv.pKey === myPKey && Array.isArray(sv.rows)) {
      vertRows = sv.rows;
      _vertRowsPKey = myPKey;
      vertRowsLoading = false;
      vertRowsError = null;
      renderVertDetail();
      if (selectedAud === 'seller') refreshBizRail();  // fill Regional Split from detail rows
      swrDone = true;
    }
  } catch (e) {}

  // Always refresh from the server — spinner only shown when there's no SWR data
  if (!swrDone) { vertRowsLoading = true; vertRowsError = null; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (myGen !== _vertRowsGen) return;  // a newer request superseded this one
      vertRowsLoading = false;
      try {
        var data = JSON.parse(res);
        if (data.success && data.vertKey === selectedVert) {
          vertRows = data.rows || [];
          _vertRowsPKey = myPKey;
          if (selectedAud === 'seller') refreshBizRail();  // fill Regional Split from detail rows
          // Persist so the next open is instant
          try { localStorage.setItem(lsVKey, JSON.stringify({ pKey: myPKey, rows: data.rows || [] })); } catch (e) {}
        } else if (!data.success && !swrDone) {
          vertRowsError = data.error || 'The server could not load records for this vertical.';
        }
      } catch (e) {
        if (!swrDone) vertRowsError = 'Could not read the server response: ' + e.message;
      }
      renderVertDetail();   // always re-render — never leave the panel stuck on the spinner
      _mrRefreshFromVertRows();   // keep an open drill-down in step with the new rows
      // Silently warm the cache for the next vertical tab (2 s delay avoids contention)
      setTimeout(function() { _prefetchNextVert(key); }, 2000);
    })
    .withFailureHandler(function(err) {
      if (myGen !== _vertRowsGen) return;
      vertRowsLoading = false;
      if (!swrDone) vertRowsError = (err && err.message) ? err.message : 'Server error while loading records.';
      renderVertDetail();
    })
    .getVerticalRows(key, JSON.stringify(f));
}

// Retry button in the detail panel's error state.
function vdRetryRows() {
  if (!selectedVert) return;
  loadVertRows(selectedVert);
  renderVertDetail();   // show the loading state immediately
}

// Silently warm the localStorage cache for the next vertical tab so switching
// feels instant. Only fires after the active vertical's rows have loaded and
// the main dashboard fetch is idle.
function _prefetchNextVert(doneKey) {
  if (_dashLoading) return;
  var cfg = getVertCfg();
  var di = -1;
  for (var i = 0; i < cfg.length; i++) { if (cfg[i].key === doneKey) { di = i; break; } }
  if (di < 0 || cfg.length < 2) return;
  var next = cfg[(di + 1) % cfg.length];
  if (!next || next.key === doneKey) return;
  var aud  = selectedAud;
  var pKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var lsKey = STORE_PFX + 'vr_' + aud + '_' + next.key;
  try { var sv = JSON.parse(localStorage.getItem(lsKey) || 'null'); if (sv && sv.pKey === pKey) return; } catch (e) {}
  var f = { audience: aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  google.script.run
    .withSuccessHandler(function(res) {
      try { var d = JSON.parse(res); if (d.success) { localStorage.setItem(lsKey, JSON.stringify({ pKey: pKey, rows: d.rows || [] })); } } catch (e) {}
    })
    .withFailureHandler(function() {})
    .getVerticalRows(next.key, JSON.stringify(f));
}

function closeVertDetail() {
  // In the new tab layout the detail section is always visible while a tab is active.
  // This function is kept for backward compat (Escape key, switchView, etc.).
  document.body.style.overflow = '';
  var panel = document.getElementById('vert-detail');
  if (panel) { panel.style.display = 'none'; panel.innerHTML = ''; }
  var inlineDetail = document.getElementById('vert-detail-section');
  if (inlineDetail) inlineDetail.style.display = 'none';
}

// Scroll to a vertical's inline story section, flashing it on arrival.
function scrollToVert(key) {
  var el = document.getElementById('vs-' + key);
  if (!el) { renderVertStory(); el = document.getElementById('vs-' + key); }
  if (!el) return;
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Render all verticals as full inline editorial sections below the compare grid.
function renderVertStory() {
  if (currentView !== 'onboarding' || !DS || !DS.verticals) return;
  if (!D) return;
  var container = document.getElementById('vert-story');
  var sep       = document.getElementById('story-sep');
  if (!container) return;

  var verts   = D.verticals;
  var cfgList = getVertCfg();
  var hasAny  = cfgList.some(function(c) { return (verts[c.key] || {}).total > 0; });

  if (sep) sep.style.display = hasAny ? '' : 'none';
  if (!hasAny) { container.innerHTML = ''; return; }

  container.innerHTML = cfgList.map(function(cfg) {
    var v   = verts[cfg.key] || {};
    var tot = v.total || 0;
    if (!tot) return '';

    var vcStyle = 'style="' + vcVars(cfg.key) + '"';
    var pct = v.completionPct || 0;

    // ── Section header ──────────────────────────────────────────────────────
    var hdrHtml = '<div class="vs-hdr">'
      + '<div class="vs-title-wrap">'
      + '<div class="vs-badge">' + cfg.code + '</div>'
      + '<div class="vs-title">' + esc(cfg.name) + '</div>'
      + '<button class="vs-rec-btn" onclick="openVertDetail(\'' + cfg.key + '\')" type="button">View Records →</button>'
      + '</div>'
      + '<div class="vs-hero-stat">'
      + '<div class="vs-hero-count">' + fmt(v.completed || 0) + '</div>'
      + '<div class="vs-hero-lbl">onboarded of ' + fmt(tot) + '</div>'
      + '</div>'
      + '</div>';

    // ── Completion progress bar ──────────────────────────────────────────────
    var progressHtml = '';

    // ── Four pipeline stage boxes ────────────────────────────────────────────
    var pipeHtml = '<div class="vs-pipe">'
      + '<div class="vs-pipe-box vs-pipe-draft" style="--pi:0"><b>' + fmt(v.draft || 0) + '</b><span>Draft</span></div>'
      + '<div class="vs-pipe-box vs-pipe-review" style="--pi:1"><b>' + fmt(v.inReview || 0) + '</b><span>In Review</span></div>'
      + '<div class="vs-pipe-box vs-pipe-onb" style="--pi:2"><b>' + fmt(v.completed || 0) + '</b><span>Onboarded</span></div>'
      + '<div class="vs-pipe-box vs-pipe-rej" style="--pi:3"><b>' + fmt(v.rejected || 0) + '</b><span>Rejected</span></div>'
      + '</div>';

    // ── Compact key metrics strip ────────────────────────────────────────────
    // GMV card: sellers only — buyers are the receiving side of the same transaction.
    var gmvMetric = '';
    if (aud === 'seller' && v.totalTxnValue != null) {
      var agingSub = '';
      if (v.aging != null || v.overdue != null) {
        agingSub = '<div class="vs-aging-sub">';
        if (v.aging   != null) agingSub += 'Aging: <span class="ag-warn">' + fmt(v.aging)   + '</span>';
        if (v.aging != null && v.overdue != null) agingSub += ' · ';
        if (v.overdue != null) agingSub += 'Overdue: <span class="ag-crit">' + fmt(v.overdue) + '</span>';
        agingSub += '</div>';
      }
      gmvMetric = '<div class="vs-metric m-gmv"><b>' + fmtINR(v.totalTxnValue) + '</b><span>Total GMV</span>' + agingSub + '</div>';
    }
    var isOMPs = cfg.key === 'OMP';
    var metArr = [
      ['Avg TAT',        dOr(v.avgTAT, 'd'), ''],
      v.completedThisWeek ? ['Onboarded (7d)', fmt(v.completedThisWeek), ''] : null,
      !isOMPs && v.transacted != null ? ['Transacted', fmt(v.transacted) + ' (' + (v.pctTransacted || 0) + '%)', ''] : null,
      v.withGST != null ? ['GST Active', fmt(v.withGST), ''] : null,
    ].filter(Boolean);
    var metricsHtml = (metArr.length || gmvMetric)
      ? '<div class="vs-metrics">'
        + (gmvMetric || '')
        + metArr.map(function(m) {
            return '<div class="vs-metric' + (m[2] ? ' ' + m[2] : '') + '"><b>' + m[1] + '</b><span>' + m[0] + '</span></div>';
          }).join('')
        + '</div>'
      : '';

    return '<section class="vert-section reveal" id="vs-' + cfg.key + '" ' + vcStyle + '>'
      + hdrHtml + progressHtml + pipeHtml + metricsHtml
      + '</section>';
  }).join('');

  // Animate pipeline boxes and category rows as they scroll into view.
  requestAnimationFrame(function() {
    if (!motionOK()) {
      container.querySelectorAll('.vs-pipe-box,.vs-cat-item').forEach(function(el) {
        el.classList.add('pipe-in','cat-in');
      });
      // Set bar widths immediately
      container.querySelectorAll('.vs-cat-bar-fg').forEach(function(el) {
        el.style.width = (el.getAttribute('data-pct') || '0') + '%';
      });
      return;
    }
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (!e.isIntersecting) return;
        var el  = e.target;
        var idx = parseInt(el.style.getPropertyValue('--pi') || el.style.getPropertyValue('--ci') || '0', 10) || 0;
        setTimeout(function() {
          el.classList.add('pipe-in','cat-in');
          // Animate progress bars inside category items
          el.querySelectorAll('.vs-cat-bar-fg').forEach(function(bar) {
            bar.style.width = (bar.getAttribute('data-pct') || '0') + '%';
          });
        }, idx * 65);
        obs.unobserve(el);
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });
    container.querySelectorAll('.vs-pipe-box,.vs-cat-item').forEach(function(el) { obs.observe(el); });
    // Also animate completion bars that are already in view
    container.querySelectorAll('.vs-progress-fill').forEach(function(el) {
      var w = el.style.width;
      el.style.width = '0';
      requestAnimationFrame(function() { el.style.width = w; });
    });
  });

  // Scroll spy — wired up after DOM is updated
  setTimeout(setupScrollSpy, 200);
}

function vdUnique(rows, field) {
  var seen = {};
  var out = [];
  rows.forEach(function(r) {
    var v = r[field];
    if (v && v !== '—' && !seen[v]) { seen[v] = true; out.push(v); }
  });
  return out.sort();
}

function vdSelect(id, label, options, current, labels) {
  // Pill select — the label lives inside the control ("Category: All"),
  // matching the GST filter bar. No floating form labels.
  var html = '<select class="vd-pill" id="' + id + '" onchange="vdfChange()">'
    + '<option value="All">' + esc(label) + ': All</option>';
  options.forEach(function(o) {
    html += '<option value="' + esc(o) + '"' + (current === o ? ' selected' : '') + '>'
      + esc((labels && labels[o]) || o) + '</option>';
  });
  return html + '</select>';
}

// renderVertDetail() is defined above (redirects to renderInlineDetail).
// The old full-overlay implementation has been removed in favour of the inline detail section.

function vdFilteredRows() {
  var _fvd = selectedAud === 'buyer' ? (DB && DB.verticals) : (DS && DS.verticals);
  if (!selectedVert || !_fvd || !_fvd[selectedVert]) return [];
  var rows = vertRows;
  var q = (vdF.search || '').toLowerCase();
  return rows.filter(function(r) {
    if (vdF.category !== 'All' && r.category   !== vdF.category) return false;
    if (vdF.vendor   !== 'All' && r.vendorType !== vdF.vendor)   return false;
    if (vdF.status   !== 'All' && r.status     !== vdF.status)   return false;
    if (vdF.gst === 'Active'   && !r.hasGST) return false;
    if (vdF.gst === 'Inactive' &&  r.hasGST) return false;
    if (q && (r.name  || '').toLowerCase().indexOf(q) === -1
          && (r.gstin || '').toLowerCase().indexOf(q) === -1
          && String(r.id || '').toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function vdSetView(view) {
  if (vdView === view) return;
  vdView = view;
  // Update toggle button active states without rebuilding the full page
  document.querySelectorAll('.vd-toggle-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.textContent.toLowerCase().indexOf(view === 'board' ? 'board' : 'table') !== -1);
  });
  renderVdRecords();
}

// Shows whichever records view is active and renders it from the filtered rows.
function renderVdRecords() {
  var boardEl = document.getElementById('vd-board-view');
  var tableEl = document.getElementById('vd-table-view');
  if (!boardEl || !tableEl) return;
  var board = vdView === 'board';
  boardEl.style.display = board ? '' : 'none';
  tableEl.style.display = board ? 'none' : '';
  if (board) renderVdBoard(); else renderVdTable();
}

function renderVdBoard() {
  var host = document.getElementById('vd-board');
  var note = document.getElementById('vd-note');
  var _bvd = selectedAud === 'buyer' ? (DB && DB.verticals) : (DS && DS.verticals);
  if (!host || !selectedVert || !_bvd || !_bvd[selectedVert]) return;
  _rmD = {}; _rmI = 0;   // fresh lookup for the modal
  var all      = vertRows;
  var filtered = vdFilteredRows();
  var placed   = 0;   // rows that actually appear in one of the four stage columns

  host.innerHTML = KB_COLS.map(function(col) {
    var cases = filtered.filter(function(r) { return r.status === col.key; });
    placed += cases.length;
    var shown = cases.slice(0, KB_MAX_PER_COL);
    var extra = cases.length - shown.length;
    return '<div class="kb-col ' + col.cls + '">'
      + '<div class="kb-col-head"><span class="kb-dot"></span>'
      + '<span class="kb-col-title">' + esc(STATUS_LABELS[col.key]) + '</span>'
      + '<span class="kb-count">' + fmt(cases.length) + '</span></div>'
      + '<div class="kb-cards">'
      + (shown.length ? shown.map(kbCard).join('') : '<div class="kb-empty">No cases</div>')
      + (extra > 0 ? '<div class="kb-more">+ ' + fmt(extra) + ' more — refine filters or switch to Table</div>' : '')
      + '</div></div>';
  }).join('');

  if (note) {
    var other = filtered.length - placed;
    note.textContent = 'Showing ' + fmt(placed) + ' of ' + fmt(all.length)
      + ' records, grouped by stage · latest first'
      + (other > 0 ? ' · ' + fmt(other) + ' with other statuses — see Table view' : '');
  }
}

function kbCard(r) {
  var key  = ++_rmI;
  _rmD[key] = r;
  var meta = [r.category, r.vendorType].filter(function(x) { return x && x !== '—'; }).join(' · ');
  var txnChip = '';
  if (r.hasTransacted) {
    var valStr = r.txnValue !== null ? ' · ' + fmtINR(r.txnValue) : '';
    txnChip = '<span class="kb-gst ok" style="background:var(--st-transacted-bg);color:var(--st-transacted-tx);border-color:transparent"'
      + ' title="Transacted' + (r.txnValue !== null ? ' · ₹' + r.txnValue : '') + '">⚡ Txn' + valStr + '</span>';
  } else if (r.status === 'COMPLETED') {
    txnChip = '<span class="kb-gst bad" style="background:var(--bg2);color:var(--txt3);border-color:transparent" title="Onboarded but not yet transacted">— Txn</span>';
  }
  return '<div class="kb-card" onclick="openRecModal(' + key + ')" role="button" tabindex="0"'
    + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openRecModal(' + key + ')}">'
    + '<div class="kb-card-name">' + esc(r.name || '—') + '</div>'
    + '<div class="kb-card-meta">' + esc(r.id) + (meta ? ' · ' + esc(meta) : '') + '</div>'
    + '<div class="kb-card-foot">'
    + '<span class="kb-gst ' + (r.hasGST ? 'ok" title="' + esc(r.gstin) + '">✓ GST' : 'bad">✗ GST') + '</span>'
    + txnChip
    + kbAge(r)
    + '</div></div>';
}

// Onboarded cards show the achieved TAT; open cards show how long they have been sitting.
function kbAge(r) {
  if (r.status === 'COMPLETED') {
    var t = parseInt(r.tat);
    if (isNaN(t)) return '<span class="kb-age text-muted">' + esc(r.onbDate || '—') + '</span>';
    var cls = t <= 2 ? 'text-green' : t <= 5 ? 'text-amber' : 'text-red';
    return '<span class="kb-age ' + cls + '" title="Onboarding TAT">' + t + 'd TAT</span>';
  }
  // IN_REVIEW: count from when the case entered review, not from creation.
  // Fall back to createdDate if the backend doesn't supply a review entry timestamp.
  var isInReview = r.status === 'IN_REVIEW';
  var dateStr = (isInReview && r.reviewDate) ? r.reviewDate : r.createdDate;
  var d = parseDMY(dateStr);
  if (!d) return '<span class="kb-age text-muted">—</span>';
  var days = Math.max(0, Math.round((Date.now() - d.getTime()) / 86400000));
  if (r.status === 'REJECTED') {
    return '<span class="kb-age text-muted" title="Days since created">' + days + 'd</span>';
  }
  var cls2 = days <= 3 ? 'text-muted' : days <= 7 ? 'text-amber' : 'text-red';
  if (isInReview && r.reviewDate) {
    return '<span class="kb-age ' + cls2 + '" title="Days in review — entered review ' + esc(r.reviewDate) + '">' + days + 'd waiting</span>';
  }
  return '<span class="kb-age ' + cls2 + '" title="Days since created — created ' + esc(r.createdDate) + '">' + days + 'd waiting</span>';
}

function parseDMY(s) {
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s || '').trim());
  if (!m) return null;
  var d = new Date(+m[3], +m[2] - 1, +m[1]);
  return isNaN(d.getTime()) ? null : d;
}

// Column sort — clicking a header sorts by that column; a second click reverses it.
function vdSortBy(key) {
  if (vdSort.key === key) vdSort.dir = -vdSort.dir;
  else vdSort = { key: key, dir: 1 };
  renderVdRecords();
}

// Comparable value for a row under a given column key.
function vdSortVal(r, key) {
  if (key === 'tat') {
    var n = parseInt(r.tat, 10);
    return isNaN(n) ? -1 : n;                       // rows without a TAT sort first (asc)
  }
  if (key === 'createdDate' || key === 'onbDate') {
    var d = parseDMY(r[key]);
    return d ? d.getTime() : 0;                     // undated rows sort first (asc)
  }
  if (key === 'txn') {
    // Transacted (by value) > onboarded-but-not-transacted > not applicable
    if (r.hasTransacted) return 1 + (r.txnValue || 0);
    return r.status === 'COMPLETED' ? 0 : -1;
  }
  if (key === 'txnCount') return r.txnCount || 0;
  if (key === 'txnGmv')   return r.txnValue  || 0;
  if (key === 'txnDate')  { var dt = parseDMY(r.txnDate && r.txnDate !== '—' ? r.txnDate : null); return dt ? dt.getTime() : 0; }
  if (key === 'gstin') return (r.hasGST ? '1' : '0') + String(r.gstin || '').toLowerCase();
  return String(r[key] || '').toLowerCase();
}

function vdSortedRows(filtered) {
  if (!vdSort.key) return filtered;
  var key = vdSort.key, dir = vdSort.dir;
  return filtered.slice().sort(function(a, b) {
    var va = vdSortVal(a, key), vb = vdSortVal(b, key);
    if (va < vb) return -dir;
    if (va > vb) return dir;
    return 0;
  });
}

function renderVdTable() {
  var tbody = document.getElementById('vd-tbody');
  var note  = document.getElementById('vd-note');
  var _tvd = selectedAud === 'buyer' ? (DB && DB.verticals) : (DS && DS.verticals);
  if (!tbody || !selectedVert || !_tvd || !_tvd[selectedVert]) return;
  _rmD = {}; _rmI = 0;   // fresh lookup for the modal
  var all      = vertRows;
  var filtered = vdSortedRows(vdFilteredRows());
  var shown    = filtered.slice(0, VD_MAX_RENDER);

  // Sync the ↑/↓ indicator on the column headers with the active sort.
  document.querySelectorAll('#vd-table-view thead th').forEach(function(th) {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.key === vdSort.key) th.classList.add(vdSort.dir === 1 ? 'sort-asc' : 'sort-desc');
  });

  tbody.innerHTML = shown.length
    ? shown.map(function(r) {
        var key = ++_rmI;
        _rmD[key] = r;
        var txnCell;
        if (r.hasTransacted) {
          var txnTip = 'Transacted' + (r.txnDate && r.txnDate !== '—' ? ' · ' + r.txnDate : '');
          txnCell = '<span class="txn-chip" title="' + esc(txnTip) + '">'
            + (r.txnValue !== null ? fmtINR(r.txnValue) : 'Transacted') + '</span>';
        } else if (r.status === 'COMPLETED') {
          txnCell = '<span style="color:var(--txt3);font-size:11.5px;font-weight:500">Not yet</span>';
        } else {
          txnCell = '<span class="text-muted">—</span>';
        }
        return '<tr class="vd-tr" onclick="openRecModal(' + key + ')" title="View details">'
          + '<td><strong>' + esc(r.name || '—') + '</strong>'
          +   '<span class="td-sub">' + esc(r.id) + '</span></td>'
          + '<td>' + esc(r.category || '—') + '</td>'
          + '<td class="td-dim">' + esc(r.vendorType || '—') + '</td>'
          + '<td>' + statusChip(r.status) + '</td>'
          + '<td>' + (r.hasGST ? '<span class="gst-ok">' + esc(r.gstin) + '</span>' : '<span class="gst-bad">Missing</span>') + '</td>'
          + '<td class="td-dim">' + esc(r.state || '—') + '</td>'
          + '<td class="td-dim td-num">' + esc(r.createdDate) + '</td>'
          + '<td class="td-dim td-num">' + esc(r.onbDate) + '</td>'
          + '<td>' + tatChip(r.tat) + '</td>'
          + '<td>' + txnCell + '</td>'
          + '</tr>';
      }).join('')
    : '<tr><td colspan="10" class="no-data">No records match the selected filters</td></tr>';

  if (note) {
    note.textContent = 'Showing ' + fmt(shown.length) + ' of ' + fmt(filtered.length)
      + ' matching · ' + fmt(all.length) + ' total · '
      + (vdSort.key ? 'sorted by ' + vdSort.key + (vdSort.dir === 1 ? ' ↑' : ' ↓') : 'latest first');
  }
}

// ═══════════════════════════════════════════════════════════════
// RECORD DETAIL MODAL
// ═══════════════════════════════════════════════════════════════
function openRecModal(key) {
  var r = _rmD[key];
  if (!r) return;
  var pn = document.getElementById('rm-pn');
  if (!pn) return;

  var gstChip = r.hasGST
    ? '<span class="kb-gst ok" style="font-size:10px;padding:2px 9px">✓ GST Active</span>'
    : '<span class="kb-gst bad" style="font-size:10px;padding:2px 9px">✗ GST Missing</span>';

  var txnSec = '';
  if (r.hasTxn) {
    if (r.hasTransacted) {
      var amt  = r.txnValue !== null ? '<div class="rm-txn-amt">' + fmtINR(r.txnValue) + '</div>' : '';
      var dt   = r.txnDate && r.txnDate !== '—' ? '<div class="rm-txn-dt">First transaction: ' + esc(r.txnDate) + '</div>' : '';

// Called when a category card is clicked — filters the records section to
// that category and scrolls the records into view.
// Show a funnel breakdown card for a single category, in the same bar-chart
// style as the aggregate funnel. Called by filterByCategory().
function renderCatDetailCard(c) {
  var ctot = c.total || 0;
  if (!ctot) return '';

  var STAGE = {
    onboarded: { lbl: 'Onboarded', fill: 'var(--st-onboarded)' },
    review:    { lbl: 'In Review', fill: 'var(--st-review)'    },
    draft:     { lbl: 'Draft',     fill: 'var(--st-draft)'     },
    rejected:  { lbl: 'Rejected',  fill: 'var(--st-rejected)'  },
  };

  var segs = [
    { key: 'onboarded', n: c.onboarded || 0 },
    { key: 'draft',     n: c.draft     || 0 },
    { key: 'review',    n: c.inReview  || 0 },
    { key: 'rejected',  n: c.rejected  || 0 },
  ];

  var vtCols = ['#005DFF', '#1DC797', '#FF9F0A', '#8460D4', '#567DE8', '#8E8E93'];
  var vts    = (c.vendorTypes || []).filter(function(v) { return v.count > 0; });
  var vtTot  = vts.reduce(function(s, v) { return s + v.count; }, 0) || ctot;

  // ── Shared donut builder ─────────────────────────────────────────
  function mkDonut(segments, total, centerNum, centerLbl) {
    var R = 42, SW = 14, size = 108, cx = 54, cy = 54;
    var C = 2 * Math.PI * R, GAP = 2.5, cumFrac = 0;
    var rings = '<circle cx="' + cx + '" cy="' + cy + '" r="' + R
      + '" fill="none" stroke="var(--bg2)" stroke-width="' + SW + '"/>'
      + segments.map(function(s, si) {
          var frac = total > 0 ? s.n / total : 0;
          var dash = Math.max(0, frac * C - GAP);
          var rot  = cumFrac * 360 - 90;
          cumFrac += frac;
          return '<circle class="donut-seg" cx="' + cx + '" cy="' + cy + '" r="' + R
            + '" fill="none" stroke="' + s.fill + '" stroke-width="' + SW
            + '" stroke-dasharray="' + dash.toFixed(2) + ' ' + (C - dash).toFixed(2)
            + '" transform="rotate(' + rot.toFixed(2) + ' ' + cx + ' ' + cy
            + ')" style="animation-delay:' + (140 + si * 100) + 'ms">'
            + '<title>' + s.lbl + ' — ' + fmt(s.n) + ' (' + Math.round(frac * 100) + '%)</title></circle>';
        }).join('');
    var ctr = '<g class="donut-ctr">'
      + '<text x="' + cx + '" y="' + (cy - 5) + '" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="800" fill="var(--txt)">' + fmt(centerNum) + '</text>'
      + '<text x="' + cx + '" y="' + (cy + 10) + '" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="600" fill="var(--txt3)" letter-spacing="0.5">' + centerLbl + '</text>'
      + '</g>';
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="display:block;margin:0 auto">' + rings + ctr + '</svg>';
  }

  // ── Status donut ─────────────────────────────────────────────────
  var statusSegs = segs.map(function(s) {
    return { n: s.n, fill: STAGE[s.key].fill, lbl: STAGE[s.key].lbl };
  });
  var statusDonut = mkDonut(statusSegs, ctot, ctot, 'TOTAL CASES');

  var statusLeg = segs.map(function(s, i) {
    var st  = STAGE[s.key];
    var pc  = ctot > 0 ? Math.round(s.n / ctot * 100) : 0;
    var pri = s.key === 'onboarded';
    return '<div class="donut-leg-row" style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);animation-delay:' + (200 + i * 70) + 'ms">'
      + '<span style="width:9px;height:9px;border-radius:2px;flex-shrink:0;background:' + st.fill + '"></span>'
      + '<span style="flex:1;font-size:12px;font-weight:' + (pri ? '700' : '600') + ';color:var(--txt' + (pri ? '' : '2') + ')">' + st.lbl + '</span>'
      + '<span style="font-size:' + (pri ? '14' : '13') + 'px;font-weight:700;color:' + st.fill + ';font-variant-numeric:tabular-nums;min-width:28px;text-align:right">' + fmt(s.n) + '</span>'
      + '<span style="font-size:10.5px;color:var(--txt3);min-width:36px;text-align:right">(' + pc + '%)</span>'
      + '</div>';
  }).join('');

  // ── Vendor type donut ────────────────────────────────────────────
  var vtSegs = vts.map(function(vt, vi) {
    return { n: vt.count, fill: vtCols[vi % vtCols.length], lbl: vt.type };
  });
  var vtDonut = vts.length > 0
    ? mkDonut(vtSegs, vtTot, vtTot, 'ONBOARDED')
    : '<div style="height:108px;display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:12px">No data</div>';

  var vtLeg = vts.length > 0
    ? vts.map(function(vt, vi) {
        var col = vtCols[vi % vtCols.length];
        var pc2 = vtTot > 0 ? Math.round(vt.count / vtTot * 100) : 0;
        return '<div class="donut-leg-row" style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);animation-delay:' + (200 + vi * 60) + 'ms">'
          + '<span style="width:9px;height:9px;border-radius:2px;flex-shrink:0;background:' + col + '"></span>'
          + '<span style="flex:1;font-size:12px;font-weight:600;color:var(--txt2)">' + esc(vt.type) + '</span>'
          + '<span style="font-size:13px;font-weight:700;color:' + col + ';font-variant-numeric:tabular-nums;min-width:28px;text-align:right">' + fmt(vt.count) + '</span>'
          + '<span style="font-size:10.5px;color:var(--txt3);min-width:36px;text-align:right">(' + pc2 + '%)</span>'
          + '</div>';
      }).join('')
    : '<div style="padding:10px 0;font-size:12px;color:var(--txt3)">No vendor type data</div>';

  // ── Assemble ─────────────────────────────────────────────────────
  function half(sectionTitle, donutHtml, legHtml, borderRight) {
    return '<div style="padding:14px 16px' + (borderRight ? ';border-right:1px solid var(--border)' : '') + '">'
      + '<div style="font-size:9.5px;font-weight:700;color:var(--txt3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px">' + sectionTitle + '</div>'
      + donutHtml
      + '<div style="margin-top:10px">' + legHtml + '</div>'
      + '</div>';
  }

  return '<div class="chart-card mt-16">'
    + '<div class="chart-card-title">'
    +   '<span style="font-size:13.5px;font-weight:700;color:var(--txt);text-transform:none;letter-spacing:0">' + esc(c.category) + '</span>'
    +   '<span class="muted-total" style="margin-left:8px">— Category Breakdown</span>'
    +   '<button onclick="filterByCategory(\'All\')" style="margin-left:auto;background:rgba(120,120,128,.12);border:none;border-radius:999px;font-size:11px;font-weight:500;color:var(--txt2);padding:4px 12px;cursor:pointer;font-family:inherit;text-transform:none;letter-spacing:0">✕ Clear</button>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr">'
    +   half('Logged In Cases Breakdown', statusDonut, statusLeg, true)
    +   half('Vendor Type Breakdown · Onboarded', vtDonut, vtLeg, false)
    + '</div>'
    + '</div>';
}

function showCatDetail(catName, quiet) {
  var wrap = document.getElementById('cat-detail-wrap');
  if (!wrap) return;
  // quiet — re-inject without replaying animations (silent refresh path)
  if (quiet) { wrap.classList.add('no-anim'); } else { wrap.classList.remove('no-anim'); }
  if (!catName || catName === 'All') {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
    return;
  }
  var _scdSrc = selectedAud === 'buyer' ? (DB && DB.verticals) : (DS && DS.verticals);
  var v = _scdSrc && selectedVert && _scdSrc[selectedVert];
  var cats = (v && v.categories) || [];
  var c = null;
  for (var i = 0; i < cats.length; i++) {
    if (cats[i].category === catName) { c = cats[i]; break; }
  }
  if (!c || !c.total) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
  wrap.innerHTML = renderCatDetailCard(c);
  wrap.style.display = 'block';
}

function filterByCategory(cat) {
  vdF.category = cat;

  // If rows haven't loaded yet, open the detail section to trigger loading.
  // renderInlineDetail() will call renderVdRecords() with vdF.category set
  // once rows arrive — so we just need to make sure the section is loading.
  if (vertRows.length === 0) {
    if (!vertRowsLoading) {
      // Not loading at all — trigger the detail section (starts the load).
      setDetailAud(selectedAud || 'seller');
      vdF.category = cat;  // setDetailAud resets vdF; re-apply the category
    }
    // If already loading, vdF.category is already set above; renderInlineDetail
    // will apply it once rows arrive. Nothing more to do here.
    return;
  }

  // Rows are loaded — apply filter immediately.
  var el = document.getElementById('vdf-category');
  if (el) {
    var found = false;
    for (var i = 0; i < el.options.length; i++) {
      if (el.options[i].value === cat) { el.value = cat; found = true; break; }
    }
    if (!found) {
      var opt = document.createElement('option');
      opt.value = opt.text = cat;
      el.appendChild(opt);
      el.value = cat;
    }
  }
  showCatDetail(cat);
  renderVdRecords();
  // Scroll to the category detail card if visible, otherwise to the records.
  var target = document.getElementById('cat-detail-wrap');
  if (!target || target.style.display === 'none') {
    target = document.getElementById('vd-board-view') || document.getElementById('vd-table-view');
  }
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function vdfClear() {
  vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '' };
  ['vdf-category','vdf-vendor','vdf-status','vdf-gst'].forEach(function(id) {
    var el = document.getElementById(id); if (el) el.value = 'All';
  });
  var s = document.getElementById('vdf-search'); if (s) s.value = '';
  showCatDetail('All');
  renderVdRecords();
}

function loadGSTData(silent) {
  var btn = document.getElementById('btn-refresh');
  if (btn) btn.classList.add('spinning');
  clearTimeout(_refreshTimer);
  clearInterval(_countdownTimer);
  var cd = document.getElementById('refresh-countdown');
  if (cd) cd.textContent = '…';

  var reqYear = gpYear;
  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) btn.classList.remove('spinning');
      if (_isFirstLoad) { hideLoading(); _isFirstLoad = false; }
      try {
        var data = JSON.parse(res);
        if (data.success) {
          try { localStorage.setItem(STORE_PFX + 'gst_' + reqYear, res); } catch (e) {}
          if (currentView === 'gst' && reqYear === gpYear) { GST = data; renderGST(); }
        } else if (currentView === 'gst') {
          showGSTError(data.error || 'No data returned.');
        }
      } catch (e) {
        if (currentView === 'gst') showGSTError('Parse error: ' + e.message);
      }
      scheduleNextRefresh();
    })
    .withFailureHandler(function(err) {
      if (btn) btn.classList.remove('spinning');
      if (_isFirstLoad) { hideLoading(); _isFirstLoad = false; }
      if (currentView === 'gst') showGSTError((err && err.message) ? err.message : 'Server error while loading GST Payables.');
      scheduleNextRefresh();
    })
    .getGSTPayablesData(JSON.stringify({ year: gpYear }));
}

function showGSTError(msg) {
  var host = document.getElementById('tab-gst');
  if (!host) return;
  host.innerHTML = '<div class="gp-card" style="text-align:center;padding:48px 24px">'
    + '<div style="color:var(--gp-red);font-weight:700;font-size:15px;margin-bottom:8px">⚠ Could not load GST Payables</div>'
    + '<div style="color:var(--gp-ink2);margin-bottom:18px;max-width:560px;margin-left:auto;margin-right:auto">' + esc(msg) + '</div>'
    + '<div style="color:var(--gp-ink3);font-size:12px;margin-bottom:18px">If this is a permissions error, share the source sheet with the account that deployed this web app.</div>'
    + '<button onclick="loadGSTData(false)" style="padding:9px 22px;border-radius:999px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">↻ Retry</button>'

}

    + '<div style="margin-bottom:24px"><button onclick="switchView(\'onboarding\')" style="display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:999px;border:1px solid var(--gp-border);background:var(--gp-card);color:var(--gp-ink2);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit">← Back to Dashboard</button></div>'
    + '<div style="font-size:34px;margin-bottom:12px">🧾</div>'
    + '<div style="color:var(--gp-ink);font-weight:700;font-size:16px;margin-bottom:6px">Vendor Payables sheet has no data yet</div>'
    + '<div style="color:var(--gp-ink2);max-width:520px;margin:0 auto 20px;line-height:1.5">Once the "Vendor Payables" tab of the GST Payables sheet is populated, this dashboard fills in automatically on the next refresh (within ~5 minutes), or hit refresh below.</div>'
