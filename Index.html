// each stage card shows the same columns in the same order and a category can be
// traced straight down the funnel. Order is by the category's overall volume, which
// is stage-independent and therefore stable across every card.
function _mmCatRowsFixed(vs, vb, field) {
  var m = {}, order = [];
  function seed(list) {
    (list || []).forEach(function(c) {
      var k = c.category || 'Other';
      if (!m[k]) { m[k] = { cat:k, s:0, b:0, _rank:0 }; order.push(k); }
      m[k]._rank += (c.total || 0);
    });
  }
  function fill(list, side) {
    (list || []).forEach(function(c) {
      var k = c.category || 'Other';
      if (m[k]) m[k][side] = c[field] || 0;
    });
  }
  seed(vs && vs.categories); seed(vb && vb.categories);
  fill(vs && vs.categories, 's'); fill(vb && vb.categories, 'b');
  return order.map(function(k) { return m[k]; })
              .filter(function(x) { return x._rank > 0; })
              .sort(function(a, b) { return b._rank - a._rank; });
}

// Per-category GMV. SELLER SIDE ONLY, by business rule: a seller→buyer sale is one
// transaction carrying one value, so adding the buyer side counts it twice. The
// headline total (vs.totalTxnValue) is seller-only for the same reason, and both
// come from the same server aggregation over the same rows — so the categories sum
// to the total exactly. The buyer argument is deliberately not accepted: taking it
// is what let the two diverge, with the categories summing to double the total.
function _mmCatGmvRows(vs) {
  return (vs && vs.categories || [])
    .filter(function(c) { return c.txnValue != null && c.txnValue > 0; })
    .map(function(c) { return { cat: c.category || 'Other', v: c.txnValue }; })
    .sort(function(a, b) { return b.v - a.v; });
}

// Guard the invariant the dashboard is built on: Σ(category GMV) must equal the
// headline GMV. Anything beyond a rounding tolerance means the two were derived
// from different sets, so it is surfaced rather than displayed silently.
function _gmvReconcile(total, catRows, ctx) {
  if (total == null || !catRows || !catRows.length) return true;
  var sum = catRows.reduce(function(s, c) { return s + (c.v || 0); }, 0);
  var tol = Math.max(1, Math.abs(total) * 0.005);   // 0.5%, absorbs server rounding
  if (Math.abs(sum - total) <= tol) return true;
  if (window.console && console.warn) {
    console.warn('[GMV] category total does not reconcile' + (ctx ? ' (' + ctx + ')' : '')
      + ' — Σcategories=' + sum + ' vs total=' + total
      + '. Both must come from the same seller-side aggregation.');
  }
  return false;
}
function _mmRegRows(vs, vb) {
  var m = {}, order = [];
  function add(list, side) {
    (list || []).forEach(function(r) {
      var k = r.region;
      if (!m[k]) { m[k] = { region:k, s:0, b:0 }; order.push(k); }
      m[k][side] = r.onboarded || r.total || 0;
    });
  }
  add(vs && vs.regions, 's'); add(vb && vb.regions, 'b');
  return order.map(function(k){ return m[k]; })
    .filter(function(x){ return (x.s + x.b) > 0; })
    .sort(function(a, b){ return (b.s + b.b) - (a.s + a.b); });
}

// Module list for one vertical, wired to live DS/DB/quality data.
function _mmVertModules(key) {
  var vs = (DS && DS.verticals || {})[key] || {};
  var vb = (DB && DB.verticals || {})[key] || {};
  var q  = (key === 'OMP' && qualityData && qualityData.success) ? (qualityData.seller || {}) : null;
  var isOMP = key === 'OMP';
  var onb  = _mmC(vs, vb, 'completed');
  var txn  = (vs.transacted != null || vb.transacted != null) ? _mmC(vs, vb, 'transacted') : null;
  var gmv  = vs.totalTxnValue;
  // Data-driven category + region breakdowns for THIS vertical, seller + buyer.
  var catTot  = _mmCatRows(vs, vb, 'total');
  var catOnb  = _mmCatRows(vs, vb, 'onboarded');
  var catTxn  = _mmCatRows(vs, vb, 'transacted');
  var catGmv  = _mmCatGmvRows(vs);
  var regRows = _mmRegRows(vs, vb);
  var hasCat  = catOnb.length > 0 || catTot.length > 0;
  function _catDetails(rows) { return rows.map(function(x){ return _d(x.cat, _mmSB(x.s, x.b)); }); }
  var f = function(t, v, ic, tone, kids) { return { t:t, v:fmt(v), ic:ic, tone:tone, kind:'kpi', children:kids }; };
  var mods = [];

  // 1 — Funnel (expands inline as a horizontal stage dashboard)
  mods.push({ t:'Breakup', ic:MM_IC.funnel, tone:'t-blue', kind:'module', expand:'inline-funnel', eye:'Breakup · stages', children:[
    f('Logged In Cases', _mmC(vs,vb,'total'), MM_IC.funnel, 't-blue',
      [ _d('Sellers', fmt(vs.total||0), MM_IC.users), _d('Buyers', fmt(vb.total||0), MM_IC.users) ]
        .concat(_catDetails(catTot)).concat([ _vd('total') ])),
    f('Draft Cases', _mmC(vs,vb,'draft'), MM_IC.draft, 't-purple',
      [ _d('Sellers', fmt(vs.draft||0), MM_IC.users), _d('Buyers', fmt(vb.draft||0), MM_IC.users) ]
        .concat(_catDetails(_mmCatRowsFixed(vs, vb, 'draft'))).concat([ _vd('draft') ])),
    f('Cases Under Review', _mmC(vs,vb,'inReview'), MM_IC.clock, 't-amber',
      [ _d('Sellers', fmt(vs.inReview||0), MM_IC.users), _d('Buyers', fmt(vb.inReview||0), MM_IC.users) ]
        .concat(_catDetails(_mmCatRowsFixed(vs, vb, 'inReview'))).concat([ _vd('review') ])),
    f('Successfully Onboarded', onb, MM_IC.check, 't-green',
      [ _d('Sellers', fmt(vs.completed||0), MM_IC.users), _d('Buyers', fmt(vb.completed||0), MM_IC.users) ]
        .concat(_catDetails(catOnb)).concat([ _vd('onboarded') ])),
    f('Rejected Cases', _mmC(vs,vb,'rejected'), MM_IC.x, 't-red',
      [ _d('Sellers', fmt(vs.rejected||0), MM_IC.users), _d('Buyers', fmt(vb.rejected||0), MM_IC.users) ]
        .concat(_catDetails(_mmCatRowsFixed(vs, vb, 'rejected'))).concat([ _vd('rejected') ])),
  ]});

  // 2 — Volume (onboarded composition — Type × Category cross-tab, chains into Geography).
  //     Category columns are data-driven per vertical; rows are Sellers / Buyers.
  var volBar = catOnb.length
    ? catOnb.map(function(x, i){ return { label:x.cat, v:x.s + x.b, color:MM_CAT_COLORS[i % MM_CAT_COLORS.length], seg:_mmGeoSeg(x.cat) }; })
    : [ { label:'Sellers', v:vs.completed||0, color:'#6366f1' }, { label:'Buyers', v:vb.completed||0, color:'#0ea5e9' } ];
  var volMatrix = catOnb.length ? {
    colColors: catOnb.map(function(x, i){ return MM_CAT_COLORS[i % MM_CAT_COLORS.length]; }),
    cols: catOnb.map(function(x){ return { label:_catLabel(x.cat), full:x.cat, seg:_mmGeoSeg(x.cat) }; }),
    rows: [ { label:'Sellers', vals: catOnb.map(function(x){ return x.s; }) },
            { label:'Buyers',  vals: catOnb.map(function(x){ return x.b; }) } ],
    chain:true
  } : null;
  // Average TAT (In Review → Onboarded) as a Sellers/Buyers × Category matrix that
  // mirrors the volume matrix above it. Roll-ups are volume-weighted by the number of
  // completed records carrying a TAT, so the Overall figures reconcile with the
  // headline average instead of being an average of averages.
  // Hidden for now — flip SHOW_VOLUME_TAT back to true to restore it unchanged.
  var tatMapS = _mmCatTatMap(vs && vs.categories);
  var tatMapB = _mmCatTatMap(vb && vb.categories);
  var volTatExtra = '';
  // Every onboarded category gets a column, including ones with no TAT yet. The
  // block is rendered whenever the vertical has categories rather than only when
  // data exists — a section that silently disappears gives no way to tell
  // "nothing carries a review date" from "the TAT view is gone".
  var tatCats = catOnb.map(function(x, i) {
    return { cat:x.cat, color:MM_CAT_COLORS[i % MM_CAT_COLORS.length],
             s: tatMapS[x.cat] || null, b: tatMapB[x.cat] || null };
  });
  if (SHOW_VOLUME_TAT && tatCats.length) {
    // Each cell carries the sample it was averaged from. A category where only a
    // handful of records have a review date would otherwise show a confident-looking
    // number built on almost nothing, which reads as simply wrong.
    // Every populated cell drills into the vendors behind it: `aud` is the row and
    // `cat` the column, or null on the Overall column which spans all categories.
    var tCell = function(o, cls, aud, cat) {
      var has = !!(o && o.n > 0 && o.v != null);
      var txt = has
        ? o.v + '<small style="font-size:.62em;font-weight:600;color:var(--txt3);letter-spacing:0">d</small>'
        : '<span style="color:var(--txt3);font-weight:600">—</span>';
      var sub = has
        ? '<div style="font-size:.6rem;color:var(--txt3);margin-top:2px;font-weight:600">n=' + fmt(o.n) + '</div>'
        : '';
      if (!has || !aud) {
        return '<div class="mp-mx-cell' + (cls || '') + '"'
          + ' title="No onboarded record here carries a usable start date">'
          + '<span class="mp-mx-n">' + txt + '</span>' + sub + '</div>';
      }
      var call = "openTatRecords('" + aud + "'," + (cat ? "'" + esc(String(cat).replace(/'/g, "\\'")) + "'" : 'null') + ")";
      return '<div class="mp-mx-cell ch' + (cls || '') + '" role="button" tabindex="0"'
        + ' title="View the ' + fmt(o.n) + ' ' + (aud === 'buyer' ? 'buyer' : 'seller')
        + (o.n === 1 ? '' : 's') + ' behind this average"'
        + ' onclick="' + call + '"'
        + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();' + call + '}">'
        + '<span class="mp-mx-n">' + txt + '</span>' + sub + '<span class="mp-mx-go">↦</span></div>';
    };
    var rowS  = tatCats.map(function(c){ return c.s; });
    var rowB  = tatCats.map(function(c){ return c.b; });
    var totS  = _mmTatAvg(rowS), totB = _mmTatAvg(rowB);
    // grandT is not rendered — it supplies the sample size behind the coverage note.
    var grandT = _mmTatAvg(rowS.concat(rowB));
    // Which start date each audience was measured from. Sellers and buyers can
    // differ — buyers are always measured from Created — so this is resolved before
    // the matrix, whose row labels carry it, and reused by the caption below.
    var _basisName = function(b) {
      return b === 'review'  ? 'In Review → Onboarded'
           : b === 'level1'  ? 'Level 1 → Onboarded'
           : b === 'created' ? 'Created → Onboarded'
           : null;
    };
    var sBasis = vs.tatBasis || null, bBasis = vb.tatBasis || null;
    var tmx = '<div class="mp-mx-corner"></div>'
      + tatCats.map(function(c) {
          return '<div class="mp-mx-hd" title="' + esc(c.cat) + '"><span class="mp-mx-dot" style="background:' + c.color + '"></span>' + esc(_catLabel(c.cat)) + '</div>';
        }).join('')
      + '<div class="mp-mx-hd tot">Overall</div>'
      // No Overall row: the per-category totals it held duplicated the Overall
      // column and the headline strip, so the word appeared three times over.
      + '<div class="mp-mx-rlbl" title="' + esc(_basisName(sBasis) || 'no usable start date') + '">Sellers</div>'
      + rowS.map(function(o, ci){ return tCell(o, '', 'seller', tatCats[ci].cat); }).join('')
      + tCell(totS, ' tot', 'seller', null)
      + '<div class="mp-mx-rlbl" title="' + esc(_basisName(bBasis) || 'no usable start date') + '">Buyers</div>'
      + rowB.map(function(o, ci){ return tCell(o, '', 'buyer', tatCats[ci].cat); }).join('')
      + tCell(totB, ' tot', 'buyer', null);
    // Coverage: how much of the onboarded base actually carries a review date.
    // Everything else is excluded rather than measured from a different start.
    var tatN = grandT ? grandT.n : 0;
    // The start date each audience is measured from stays available on the row-label
    // and pill tooltips rather than as a caption line under the heading.
    // Only the zero-data case gets a note. The partial-coverage line was noise once
    // TAT is populating — the per-cell n= already carries the sample size — but with
    // no data at all an empty grid would otherwise be unexplained.
    var covNote = tatN === 0
      ? '<div style="font-size:.68rem;color:var(--txt3);margin-top:9px;line-height:1.5">'
        + 'None of the ' + fmt(onb) + ' onboarded records carry a usable start date, so turnaround cannot be '
        + 'measured yet. TAT appears here as soon as the feed supplies an In Review or Level 1 date.</div>'
      : '';
    // Headline strip — the vertical's own averages, which exist independently of the
    // category split, so a usable number shows even when the matrix is sparse.
    var _tatPill = function(lbl, v, ttl) {
      return '<div style="flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;text-align:center"'
        + (ttl ? ' title="' + esc(ttl) + '"' : '') + '>'
        + '<div style="font-size:1.02rem;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums">'
        + (v != null ? v + '<small style="font-size:.62em;font-weight:600;color:var(--txt3)">d</small>'
                     : '<span style="color:var(--txt3)">—</span>') + '</div>'
        + '<div style="font-size:.6rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3);margin-top:2px">' + esc(lbl) + '</div>'
        + '</div>';
    };
    // Overall is only meaningful when both audiences share a start date. With buyers
    // on Created and sellers on In Review, a blend would average two different
    // measurements into a number describing neither, so it is withheld instead.
    var mixedBasis = !!(sBasis && bBasis && sBasis !== bBasis);
    var tatStrip = '<div style="display:flex;gap:6px;margin-bottom:10px">'
      + _tatPill('Overall', mixedBasis ? null : _bnBlendTAT(vs, vb),
          mixedBasis ? 'Not shown: seller and buyer TAT are measured from different start dates, so a combined average would describe neither.'
                     : 'Seller and buyer average, weighted by onboarded count')
      + _tatPill('Sellers', vs.avgTAT != null ? vs.avgTAT : null, _basisName(sBasis) || '')
      + _tatPill('Buyers',  vb.avgTAT != null ? vb.avgTAT : null, _basisName(bBasis) || '')
      + '</div>';
    volTatExtra = '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">'
      + '<div style="font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3);margin-bottom:3px">Average TAT · Seller / Buyer × Category</div>'
      + tatStrip
      + '<div class="mp-matrix" style="grid-template-columns:auto repeat(' + (tatCats.length + 1) + ',minmax(0,1fr))">' + tmx + '</div>'
      + covNote
      + '</div>';
  }
  mods.push({ t:'Onboarded (Details)', ic:MM_IC.grid, tone:'t-ink', kind:'module', expand:'inline-panel',
    eye: hasCat ? 'Onboarded by category · seller / buyer' : 'Onboarded composition',
    panel:{
      eye: hasCat ? 'Onboarded by category · seller / buyer' : 'Onboarded composition',
      headline:{ v:onb, label:'Total Onboarded', tone:'good' },
      bar: volBar,
      matrix: volMatrix,
      tiles: volMatrix ? null : [ { label:'Sellers', v:vs.completed||0 }, { label:'Buyers', v:vb.completed||0 } ],
      extra: volTatExtra,
      chain:true, records:'onboarded'
    }
  });

  // 3 — Geographic Split (each region expands an inline interactive India map).
  //     Regions carry BOTH audiences — each card shows onboarded seller · buyer.
  var regs = regRows;
  if (!regs.length && key === activeVertKey && Array.isArray(vertRows) && vertRows.length) {
    regs = _regionsFromRows(vertRows).filter(function(r){ return (r.total||0) > 0; })
      .map(function(r){ return { region:r.region, s:r.total||0, b:0 }; });
  }
  if (regs.length) {
    mods.push({ t:'Geographic Split', ic:MM_IC.pin, tone:'t-blue', kind:'module', geoModule:true,
      eye:'Onboarded by region · seller / buyer' });
  }

  // 4 — Transactions (Sellers + Buyers combined; GMV remains seller-side only).
  var sTxn = (vs.transacted != null) ? vs.transacted : null;
  var bTxn = (vb.transacted != null) ? vb.transacted : null;
  if (sTxn != null || bTxn != null || gmv != null) {
    var sOnb = vs.completed || 0, bOnb = vb.completed || 0;
    var combinedTxn    = (sTxn || 0) + (bTxn || 0);
    var combinedNonTxn = Math.max(0, (sOnb + bOnb) - combinedTxn);
    var sMtxn = vs.metalTransacted || 0, sPtxn = vs.plasticTransacted || 0;
    var bMtxn = vb.metalTransacted || 0, bPtxn = vb.plasticTransacted || 0;
    // Trigger background load of buyer rows so ageing includes both audiences.
    if (key === activeVertKey) _ovnEnsureAud('buyer');
    var ag = _mmAging(key);   // seller + buyer ageing (buyer rows included when loaded)
    var tTiles = [];
    if (sTxn != null || bTxn != null) {
      if (key === activeVertKey) {
        window._mmTxnAud = {
          key: key,
          seller: { total: sTxn || 0, metal: sMtxn, plastic: sPtxn, cats: catTxn },
          buyer:  { total: bTxn || 0, metal: bMtxn, plastic: bPtxn, cats: catTxn }
        };
      }
      tTiles.push(
        { label:'Sellers', v:sTxn || 0, click:"openTxnAudModal('seller')", tip:'View seller transaction breakdown' },
        { label:'Buyers',  v:bTxn || 0, click:"openTxnAudModal('buyer')",  tip:'View buyer transaction breakdown' }
      );
    }
    if (ag) {
      tTiles.push({ label:'Ageing · 0–30 days',  v:ag.a, tone:'good', sub:'Non-transacted',
                    click:"openAgingRecords('a')", tip:'View the 0–30 day sellers' },
                  { label:'Ageing · 31–60 days', v:ag.c, tone:'warn', sub:'Non-transacted',
                    click:"openAgingRecords('c')", tip:'View the 31–60 day sellers' },
                  { label:'Ageing · 60+ days',   v:ag.d, tone:'crit', sub:'Non-transacted',
                    click:"openAgingRecords('d')", tip:'View the 60+ day sellers' });
    }
    if (gmv != null) {
      // GMV is seller-side only — buyer-side transaction value is excluded by design.
      _gmvReconcile(gmv, catGmv, 'Transactions panel · ' + key);
      tTiles.push({ label:'GMV · total', v:fmtINR(gmv), raw:true });
      catGmv.forEach(function(x){ tTiles.push({ label:'GMV · ' + x.cat, v:fmtINR(x.v), raw:true }); });
    }
    mods.push({ t:'Transactions', ic:MM_IC.bolt, tone:'t-blue', kind:'module', expand:'inline-panel', eye:'Transaction activity',
      panel:{
        eye:'Transaction activity', badge:'Sellers & Buyers',
        headline: (sTxn != null || bTxn != null)
          ? { v:combinedTxn, label:'Transacted (Unique · Sellers & Buyers)', tone:'accent' }
          : { v:gmv, label:'Total GMV', raw:true, rawv:fmtINR(gmv), tone:'ink' },
        bar: (sTxn != null || bTxn != null)
          ? [ { label:'Transacted', v:combinedTxn, color:'#16a34a' },
              { label:'Non-Transacted', v:combinedNonTxn, color:'#d97706' } ]
          : null,
        tiles: tTiles, records:'transacted'
      }
    });
  }

  // 5 — Vendor Ratings (OMP quality feed — inline panel)
  if (q && q.rating && q.rating.total) {
    var rRated = q.rating.rated || 0, rTotal = q.rating.total || 0, rAvg = q.rating.avg;
    var rDist = q.rating.dist || [0,0,0,0,0];
    var rUnr  = Math.max(0, rTotal - rRated);
    var selVR = (qualityData && qualityData.vendorRatings || []).filter(function(v){ return v.aud !== 'buyer'; });
    // Build star-distribution section HTML — cached so repeated tree rebuilds skip the work
    var _rCKey = 'r:' + rRated + ':' + (rAvg != null ? rAvg.toFixed(2) : '') + ':' + rDist.join(',') + ':' + selVR.length;
    var rExtra = '';
    if (!_mmExtraCache.hasOwnProperty(_rCKey)) {
    if (rRated > 0) {
      var rMaxD = Math.max.apply(null, rDist) || 1;
      rExtra = '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">'
        + '<div style="font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3);margin-bottom:10px">Score Distribution · out of 10</div>';
      for (var bandI = 4; bandI >= 0; bandI--) {
        var rC   = rDist[bandI] || 0;
        var rBP  = Math.round(rC / rMaxD * 100);
        var rDP  = rRated > 0 ? Math.round(rC / rRated * 100) : 0;
        var rCol = _vsBandColor(bandI);
        var rSV  = selVR.filter(function(v){ return _vsBand(v.rating) === bandI; })
                        .sort(function(a, b){ return b.rating - a.rating; });
        var rTid = 'mp-svl-' + bandI;
        if (rSV.length) {
          rExtra += '<div class="km-star-row km-star-clickable" role="button" tabindex="0"'
            + ' onclick="_kmStarToggle(\'' + rTid + '\',this)"'
            + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();_kmStarToggle(\'' + rTid + '\',this)}">'
            + '<span class="km-star-n">' + _vsBandLabel(bandI) + '</span>'
            + '<div class="km-star-track"><div class="km-star-fill" style="width:' + rBP + '%;background:' + rCol + '"></div></div>'
            + '<span class="km-star-cnt">' + fmt(rC) + '</span>'
            + '<span class="km-star-pct">' + rDP + '% <span class="km-star-arr">▶</span></span>'
            + '</div>'
            + '<div id="' + rTid + '" class="km-star-vlist" style="display:none">'
            + rSV.slice(0, 60).map(function(v) {
                return '<div class="km-vrow" style="flex-wrap:wrap;gap:3px 6px;align-items:center">'
                  + '<span class="km-vname" style="min-width:100px">' + esc(v.name || 'Unknown') + '</span>'
                  + (v.gstin ? '<span class="km-vaud">' + esc(v.gstin) + '</span>' : '')
                  + '<span class="km-vrating" style="color:' + rCol + '">' + v.rating.toFixed(1) + '</span>'
                  + (v.category ? '<span class="km-vbadge" style="background:rgba(0,122,255,.10);color:#024C8A">' + esc(v.category) + '</span>' : '')
                  + '</div>';

            + '</div>';
        } else {
          rExtra += '<div class="km-star-row">'
            + '<span class="km-star-n">' + _vsBandLabel(bandI) + '</span>'
            + '<div class="km-star-track"><div class="km-star-fill" style="width:' + rBP + '%;background:' + rCol + '"></div></div>'
            + '<span class="km-star-cnt">' + fmt(rC) + '</span>'
            + '<span class="km-star-pct">' + rDP + '%</span>'

        }
      }
      rExtra += '</div>';
    }
    _mmExtraCache[_rCKey] = rExtra;
    } else { rExtra = _mmExtraCache[_rCKey]; }
    mods.push({ t:'Vendor Ratings', ic:MM_IC.star, tone:'t-amber', kind:'module', expand:'inline-panel', eye:'Vendor Rating',
      panel:{
        eye:'Vendor Score · Average Seller Score', badge:'Sellers only',
        headline:{ v:(rAvg != null ? rAvg.toFixed(1) : '—'), raw:true, rawv:(rAvg != null ? rAvg.toFixed(1) + ' / 10' : '—'), label:'Average Seller Score (out of 10)', tone:'warn' },
        bar:[ { label:'Rated', v:rRated, color:'#16a34a' }, { label:'Unrated', v:rUnr, color:'#8a93a1' } ],
        tiles:[ { label:'Sellers Rated', v:rRated, sub:'have a score', tone:'good' },
                { label:'Unrated', v:rUnr, sub:'no score yet' } ],
        extra:  rExtra
      }
    });
  }

  // 6 — OSV Status (OMP quality feed — inline panel)
  if (q && q.osv && q.osv.total) {
    // Three-way consent split: Done (accepted) · In Progress (pending/mid-verification)
    // · Not Initiated (never started). The server classifies each vendor; showing all
    // three means the tiles reconcile to the onboarded total.
    var osvVer   = q.osv.completed    || 0;
    var osvIP    = q.osv.pending      || 0;
    var osvNI    = q.osv.notInitiated || 0;
    var osvOTot  = q.osv.total        || 0;
    var osvPctV  = osvOTot > 0 ? Math.round(osvVer / osvOTot * 100) : 0;
    var osvVL    = (qualityData && qualityData.vendorOSV) || [];
    var verVL    = osvVL.filter(function(v){ return v.status === 'verified'; });
    var ipVL     = osvVL.filter(function(v){ return v.status === 'in_progress'; });
    var niVL     = osvVL.filter(function(v){ return v.status === 'not_initiated'; });
    var ogid     = 'mp-osvg';
    var osvBarH  = (osvVer + osvIP + osvNI > 0)
      ? '<div class="km-prog">'
        + (osvVer ? '<div class="km-prog-seg" style="flex:' + osvVer + ';background:var(--st-onboarded)"></div>' : '')
        + (osvIP  ? '<div class="km-prog-seg" style="flex:' + osvIP  + ';background:#F59E0B"></div>' : '')
        + (osvNI  ? '<div class="km-prog-seg" style="flex:' + osvNI  + ';background:#8b5cf6"></div>' : '')
        + '</div>' : '';
    // Each tile opens the OSV records table pre-filtered to its own status, rather
    // than expanding an inline list — the table carries the full record detail
    // (vertical, assigned user, last updated) with search, sort and export.
    var mkOsvTile = function(statusKey, cnt, c, lbl) {
      var dead = !cnt;
      if (dead) {
        return '<div class="km-sg-item">'
          + '<div class="km-sg-v">' + fmt(cnt) + '</div>'
          + '<div class="km-sg-l"><i class="km-dot" style="background:' + c + '"></i>' + esc(lbl) + '</div>'
          + '</div>';
      }
      var call = "openOsvRecords('" + statusKey + "')";
      return '<div class="km-sg-item km-sg-xp" role="button" tabindex="0"'
        + ' title="View the ' + esc(cnt + ' ' + lbl) + ' vendor records"'
        + ' onclick="' + call + '"'
        + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();' + call + '}">'
        + '<div class="km-sg-v">' + fmt(cnt) + '</div>'
        + '<div class="km-sg-l"><i class="km-dot" style="background:' + c + '"></i>' + esc(lbl)
        + ' <span class="km-star-arr" style="transform:none">→</span></div>'
        + '</div>';
    };
    // Build OSV extra section — cached so repeated tree rebuilds skip the string work
    var _oCKey = 'o:' + osvVer + ':' + osvIP + ':' + osvNI + ':' + osvOTot
               + ':' + verVL.length + ':' + ipVL.length + ':' + niVL.length;
    var osvExtra;
    if (_mmExtraCache.hasOwnProperty(_oCKey)) {
      osvExtra = _mmExtraCache[_oCKey];
    } else {
      osvExtra = '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">'
        + '<div style="font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3);margin-bottom:8px">Consent Status</div>'
        + osvBarH
        + '<div class="km-sg" id="' + ogid + '-g" style="grid-template-columns:repeat(3,1fr);margin-top:8px">'
        + mkOsvTile('verified',      osvVer, 'var(--st-onboarded)', 'Done')
        + mkOsvTile('in_progress',   osvIP,  '#F59E0B',             'In Progress')
        + mkOsvTile('not_initiated', osvNI,  '#8b5cf6',             'Not Initiated')
        + '</div>'
        + '<div style="font-size:.68rem;color:var(--txt3);margin-top:9px">Select a status to open its vendor records.</div>'
        + '</div>';
      _mmExtraCache[_oCKey] = osvExtra;
    }
    mods.push({ t:'OSV Status', ic:MM_IC.shield, tone:'t-green', kind:'module', expand:'inline-panel', eye:'OSV Consent',
      panel:{
        eye:'OSV Consent · Verification Status', badge:'Sellers only',
        headline:{ v:osvVer, label:'OSV Completed', tone:'good' },
        bar:[],
        tiles:[ { label:'Verification Rate', v:osvPctV + '%', sub:'of OMP onboarded', raw:true },
                { label:'Total Onboarded Sellers (OMP)', v:osvOTot, sub:'COMPLETED status' } ],
        extra:  osvExtra,
        records:'osv'
      }
    });
  }

  // Vendor Ratings and OSV come from the quality feed, which resolves on its own
  // request. Until it lands they are shown as placeholders so the module list is
  // complete from the first paint and does not grow underneath the user.
  if (isOMP && !(q && q.rating && q.rating.total)) {
    mods.push({ t:'Vendor Ratings', ic:MM_IC.star, tone:'t-amber', kind:'module',
                muted:true, leaf:true, eye:'Vendor Score', s:'Loading…' });
  }
  if (isOMP && !(q && q.osv && q.osv.total)) {
    mods.push({ t:'OSV Status', ic:MM_IC.shield, tone:'t-green', kind:'module',
                muted:true, leaf:true, eye:'OSV Consent', s:'Loading…' });
  }

  // 7 — Documents (OMP quality feed — inline panel). Doc completeness split.
  // Hidden for OMP per product decision; condition retained for other verticals if q is ever set there.
  if (!isOMP && q && q.docs && q.docs.total) {
    var dcC = q.docs.complete||0, dcP = q.docs.partial||0, dcI = q.docs.incomplete||0, dcM = q.docs.missing||0;
    mods.push({ t:'Documents', ic:MM_IC.doc, tone:'t-blue', kind:'module', expand:'inline-panel', eye:'Document completeness',
      panel:{
        eye:'Document completeness', badge:'Sellers only',
        headline:{ v:dcC, label:'Complete', tone:'good' },
        bar:[ { label:'Complete', v:dcC, color:'#16a34a' },
              { label:'Partial', v:dcP, color:'#d97706' },
              { label:'Incomplete', v:dcI, color:'#8a93a1' },
              { label:'Missing', v:dcM, color:'#dc2626' } ],
        tiles:[ { label:'Complete', v:dcC, tone:'good' }, { label:'Partial', v:dcP, tone:'warn' },
                { label:'Incomplete', v:dcI }, { label:'Missing', v:dcM, tone:'crit' },
                { label:'Total', v:q.docs.total||0 } ],
        records:'docs'
      }
    });
  }

  // 8 — Existing vs New (OMP only — inline panel). Split shown seller / buyer.
  if (isOMP && vs.oldVendors != null) {
    var exAll = (vs.oldVendors||0)+(vb.oldVendors||0), nwAll = (vs.newVendors||0)+(vb.newVendors||0);
    mods.push({ t:'Existing vs New', ic:MM_IC.users, tone:'t-purple', kind:'module', expand:'inline-panel', eye:'Vendor classification',
      panel:{
        eye:'Vendor classification by onboarding date',
        note:'Existing: onboarded before 1 Apr 2026  ·  New: onboarded on or after 1 Apr 2026',
        badge:'Seller + Buyer',
        headline:{ v:exAll+nwAll, label:'Classified onboarded', tone:'ink' },
        bar:[ { label:'Existing', v:exAll, color:'#8b5cf6' },
              { label:'New', v:nwAll, color:'#005dff' } ],
        tiles:[ { label:'Existing', v:exAll, sub:'Before 1 Apr 2026  ·  ' + _mmSB(vs.oldVendors||0, vb.oldVendors||0) },
                { label:'New', v:nwAll, sub:'On/After 1 Apr 2026  ·  ' + _mmSB(vs.newVendors||0, vb.newVendors||0) } ]
      }
    });
  }
  return mods;
}

// Whole tree: ROOT → every business vertical → its modules.
function mmBuildTree() {
  var cfg = getVertCfg(), totAll = 0;
  var verts = cfg.map(function(c) {
    var vs = (DS && DS.verticals || {})[c.key] || {}, vb = (DB && DB.verticals || {})[c.key] || {};
    var tot = (vs.total||0)+(vb.total||0), onb = (vs.completed||0)+(vb.completed||0);
    totAll += tot;
    if (tot <= 0) return { t:c.name, kind:'vert', vkey:c.key, muted:true, ratio:0 };
    return { t:c.name, kind:'vert', vkey:c.key, v:fmt(tot), s:fmt(onb) + ' onboarded',
             ratio: tot > 0 ? onb / tot : 0, eye:'Modules', children:_mmVertModules(c.key) };
  });
  return { t:'Central Onboarding', kind:'root', ic:MM_IC.hub,
           s:'Complete Operational View · ' + fmt(totAll) + ' cases', eye:'Business Verticals', children:verts };
}

// Stable, path-based ids + parent links; indexed by id.
function mmAssignIds() {
  _mmById = {};
  (function walk(n, parent, pid) {
    var id = n.kind === 'root' ? 'root'
           : pid + '/' + (n.vkey || String(n.t).replace(/[^A-Za-z0-9]+/g, ''));
    if (_mmById[id]) { var i = 2; while (_mmById[id + '~' + i]) i++; id = id + '~' + i; }
    n._id = id; n._parent = parent; _mmById[id] = n;
    (n.children || []).forEach(function(c){ walk(c, n, id); });
  })(mmTree, null, '');
}
function mmFindById(id) { return _mmById[id] || null; }
function _mmPathIds(node) { var p = [], c = node; while (c) { p.unshift(c._id); c = c._parent; } return p; }

function mmBuildColumns() {
  var chain = mmPath.map(mmFindById).filter(Boolean);
  // rootcol gets extra width so the title and its call-to-action sit comfortably.
  var cols = [{ cards:[mmTree], active: chain.length ? mmTree._id : null, eye:'Central', wide:true, rootcol:true }];
  for (var k = 0; k < chain.length; k++) {
    var parent = chain[k];
    if (!parent.children || !parent.children.length) break;
    if (parent.expand) break; // inline-funnel / inline-panel → children shown in a panel, not a column
    cols.push({ cards:parent.children, active: chain[k+1] ? chain[k+1]._id : null, eye:parent.eye || '',
                wide: parent.kind === 'module' || parent.kind === 'kpi' || parent.kind === 'root' });
  }
  return cols;
}

      + '<div class="mmn-root-titles">'
      +   '<div class="mmn-root-t1">Central Onboarding</div>'
      +   '<div class="mmn-root-t2">Dashboard</div>'
      + '</div></div>';
  } else if (kind === 'vert') {
    cls = 'mmn vert' + (node.muted ? ' muted' : '') + (on ? ' on' : '');
    // Clean navigation card: small status dot + name + chevron. No metric graphic.
    inner = '<div class="mmn-top"><i class="mmn-dot"></i><div class="mmn-ttl">' + esc(node.t) + '</div>'
      + (hasKids && !node.muted ? '<span class="mmn-arr">›</span>' : '') + '</div>';
  } else if (kind === 'vd') {
    cls = 'mmn vd';
    inner = '<div class="mmn-top"><div class="mmn-ic">' + (node.ic || MM_IC.doc) + '</div><div class="mmn-ttl">' + esc(node.t) + '</div><span class="mmn-arr">→</span></div>';
  } else {
    var modCls = (kind === 'module') ? ' module' : '';
    cls = 'mmn ' + (node.tone || 't-ink') + modCls + (on ? ' on' : '') + (isLeaf ? ' leaf' : '');
    var arrow = (hasKids || node.action || node.geoRegion || node.expand || node.geoModule) ? '<span class="mmn-arr">' + ((node.action || node.geoRegion) && !hasKids && !node.expand ? '→' : '›') + '</span>' : '';
    inner = '<div class="mmn-top"><div class="mmn-ic">' + (node.ic || MM_IC.grid) + '</div><div class="mmn-ttl">' + esc(node.t) + '</div>' + arrow + '</div>'
      + (node.v ? '<div class="mmn-v tnum">' + esc(node.v) + '</div>' : '')
      + (node.s ? '<div class="mmn-s">' + esc(node.s) + '</div>' : '');
  }
  var dim = (colActiveId && !on) ? ' dim' : '';
  var clickable = !(node.muted || (isLeaf && !node.action && !node.geoRegion && !node.expand));
  return '<div class="' + cls + dim + '" data-id="' + esc(node._id) + '"'
    + (clickable ? ' role="button" tabindex="0" onclick="mmClickNode(\'' + esc(node._id) + '\')" onkeydown="if(event.key===\'Enter\'){mmClickNode(\'' + esc(node._id) + '\')}"' : '')
    + '>' + inner + '</div>';
}

// Entry point (kept name for existing callers: refresh + selectVertTab).
function renderBranchNav(key) {
  if (currentView === 'gst') return;
  if (key) _mmVert = key;
  mmTree = mmBuildTree();
  mmAssignIds();
  // A vertical is expanded but the active vertical changed (top tab bar) →
  // retarget the map to the newly active vertical.
  if (mmPath.length >= 2 && _mmVert) {
    var want = 'root/' + _mmVert;
    if (mmPath[1] !== want) mmPath = mmFindById(want) ? ['root', want] : [];
  }
  // Keep the deepest prefix that still resolves, rather than dropping to the root.
  // The tree is rebuilt from live data on every refresh, and modules appear or
  // disappear with the selected period — Transactions vanishes when the period has
  // no transactions, for instance. Wiping the whole path on any missing id ejected
  // the user from their vertical back to Central Onboarding on a simple filter
  // change. Now only the part that no longer exists is trimmed, so the vertical and
  // its breadcrumb survive even when the module below it does not.
  var _keep = 0;
  while (_keep < mmPath.length && mmFindById(mmPath[_keep])) _keep++;
  if (_keep < mmPath.length) mmPath = mmPath.slice(0, _keep);
  // Validate inline-panel state after rebuild
  var lastNode = mmPath.length ? mmFindById(mmPath[mmPath.length - 1]) : null;
  if (mmFunnelActive && (!lastNode || lastNode.expand !== 'inline-funnel')) mmFunnelActive = false;
  if (mmGeoActive && (!lastNode || (!lastNode.geoRegion && !lastNode.geoModule))) { mmGeoActive = false; _geo.region = null; _geo.state = null; }
  if (mmModActive && (!lastNode || lastNode.expand !== 'inline-panel')) mmModActive = false;
  mmRender();
  mmRenderFunnel();
  mmRenderGeo();
  mmRenderModPanel();
  _mmSyncDetail();
}

function mmRender() {
  var map = document.getElementById('mm'); if (!map || !mmTree) return;
  var cols = mmBuildColumns();
  var html = '<svg class="mm-svg" id="mm-svg" aria-hidden="true"></svg>';
  cols.forEach(function(col, ci) {
    html += '<div class="mmcol' + (col.wide ? ' wide' : '') + (col.rootcol ? ' rootcol' : '') + '"><div class="mmcoleye">' + esc(col.eye || '') + '</div>'
      + col.cards.map(function(n){ return mmNodeCard(n, col.active); }).join('') + '</div>';
    if (ci < cols.length - 1) html += '<div class="mmcolgap"></div>';
  });
  map.innerHTML = html;
  mmRenderCrumbs();
  mmReveal();
}

function mmRenderCrumbs() {
  var el = document.getElementById('mm-crumbs'); if (!el || !mmTree) return;
  var chain = mmPath.length ? mmPath.map(mmFindById).filter(Boolean) : [mmTree];
  el.innerHTML = chain.map(function(n, i) {
    var here = i === chain.length - 1;
    return '<button class="mmcrumb' + (here ? ' here' : '') + '" onclick="mmGoto(' + i + ')">' + esc(n.t) + '</button>'
      + (here ? '' : '<span class="mmcrumb-sep">›</span>');
  }).join('');
}
function mmGoto(i) {
  var chain = mmPath.length ? mmPath.slice() : ['root'];
  mmPath = i <= 0 ? ['root'] : chain.slice(0, i + 1);
  var lastNode = mmPath.length ? mmFindById(mmPath[mmPath.length - 1]) : null;
  if (!lastNode || lastNode.expand !== 'inline-funnel') { mmFunnelActive = false; }
  if (!lastNode || lastNode.expand !== 'inline-panel') { mmModActive = false; }
  if (!lastNode || (!lastNode.geoRegion && !lastNode.geoModule)) { mmGeoActive = false; _geo.region = null; _geo.state = null; _geo.cat = null; }
  _mmAnimateReveal = true;
  mmPaint();
}

function mmReveal() {
  var cols = [].slice.call(document.querySelectorAll('#mm .mmcol'));
  // Only run the stagger animation when the user explicitly navigated.
  // Data-refresh re-renders (quality callback, SWR) skip the fade-in so nodes
  // never go invisible mid-session — eliminating the visible flicker.
  var animate = motionOK() && _mmAnimateReveal;
  _mmAnimateReveal = false;
  cols.forEach(function(col, ci) {
    var last = ci === cols.length - 1;
    [].slice.call(col.querySelectorAll('.mmn')).forEach(function(n, i) {
      if (!animate || !last) { n.classList.add('in'); return; }
      setTimeout(function(){ n.classList.add('in'); mmDraw(); }, 60 + i * 70);
    });
  });
  requestAnimationFrame(mmDraw);
  if (animate) setTimeout(mmDraw, 520);
}

function mmCardAction(action) {
  if (!action) return;
  var a = String(action).split(':'), name = a[0], arg = a[1];
  if (name === 'gmv')         return openGmvCatModal('seller');
  if (name === 'region')      return openRegionSplitModal(arg || 'seller');
  if (name === 'regionmodal') return openRegionModal(arg);
  if (name === 'tat')         return openTatModal();
  if (name === 'records')     return openRecordsSheet(arg || (selectedAud || 'seller'));
  // Module "View Detailed Records" → full-screen records overlay
  if (MR_MOD_CFG[name])       return openModRecords(name);
  return openKpiModal(name);
}

// Split the workspace into nav + side detail whenever any panel is open.
function _mmSyncDetail() {
  var ws = document.getElementById('mm-workspace');
  if (!ws) return;
  var open = !!(mmFunnelActive || mmGeoActive || mmModActive);
  ws.classList.toggle('has-panel', open);
  // With a panel docked, the nav narrows; once it settles, keep the active
  // (deepest) column in view rather than clipping it at the edge.
  if (open) {
    setTimeout(function(){
      var mm = document.getElementById('mm');
      if (mm && mm.scrollWidth > mm.clientWidth + 4) {
        if (mm.scrollTo) mm.scrollTo({ left: mm.scrollWidth, behavior: motionOK() ? 'smooth' : 'auto' });
        else mm.scrollLeft = mm.scrollWidth;
      }
    }, motionOK() ? 480 : 0);
  }
}

// Repaint the whole workspace (map + all three inline panels) in one call.
function mmPaint() { mmRender(); mmRenderFunnel(); mmRenderGeo(); mmRenderModPanel(); _mmSyncDetail(); }

function _mmCloseInline() {
  mmFunnelActive = false;
  mmGeoActive = false; _geo.region = null; _geo.state = null; _geo.hover = null; _geo.cat = null;
  mmModActive = false;
}

function mmClickNode(id) {
  var node = mmFindById(id); if (!node) return;
  // Geographic Split module → immediately open full India map (all regions).
  if (node.geoModule) {
    var allOpen = mmGeoActive && _geo.region === 'All' && mmPath.length && mmPath[mmPath.length - 1] === node._id;
    if (allOpen) {
      mmGeoActive = false; _geo.region = null; _geo.state = null;
      mmPath = mmPath.slice(0, -1);
    } else {
      mmFunnelActive = false; mmModActive = false;
      mmPath = _mmPathIds(node);
      mmGeoActive = true; _geo.state = null; _geo.hover = null; _geoAnimate = true;
      mmGeoOpen('All');
    }
    _mmAnimateReveal = true; mmPaint(); return;
  }
  // Region card → toggle the inline India map panel.
  if (node.geoRegion) {
    var geoOpen = mmGeoActive && mmPath.length && mmPath[mmPath.length - 1] === node._id;
    if (geoOpen) {
      mmGeoActive = false; _geo.region = null; _geo.state = null;
      mmPath = mmPath.slice(0, -1);
    } else {
      mmFunnelActive = false; mmModActive = false;
      mmPath = _mmPathIds(node);
      mmGeoActive = true; _geo.state = null; _geo.hover = null; _geoAnimate = true;
      mmGeoOpen(node.geoRegion);
    }
    _mmAnimateReveal = true; mmPaint(); return;
  }
  if (node.action) return mmCardAction(node.action);
  if (node.muted || node.leaf || (!(node.children && node.children.length) && !node.expand)) return;
  if (node.kind === 'vert') {
    mmPath = ['root', node._id];
    if (node.vkey && node.vkey !== activeVertKey) { selectVertTab(node.vkey); return; }
    _mmCloseInline();
    _mmAnimateReveal = true; mmPaint(); return;
  }
  if (node.expand === 'inline-funnel') {
    var funOpen = mmFunnelActive && mmPath.length && mmPath[mmPath.length - 1] === node._id;
    mmGeoActive = false; _geo.region = null; _geo.state = null; mmModActive = false;
    if (funOpen) {
      mmFunnelActive = false;
      mmPath = mmPath.slice(0, -1);
    } else {
      mmPath = _mmPathIds(node);
      mmFunnelActive = true;
    }
    _mmAnimateReveal = true; mmPaint(); return;
  }
  if (node.expand === 'inline-panel') {
    var modOpen = mmModActive && mmPath.length && mmPath[mmPath.length - 1] === node._id;
    mmFunnelActive = false; mmGeoActive = false; _geo.region = null; _geo.state = null;
    if (modOpen) {
      mmModActive = false;
      mmPath = mmPath.slice(0, -1);
    } else {
      mmPath = _mmPathIds(node);
      mmModActive = true; _mmModAnimate = true;
    }
    _mmAnimateReveal = true; mmPaint(); return;
  }
  _mmCloseInline();
  mmPath = _mmPathIds(node);
  _mmAnimateReveal = true; mmPaint();
}

// Chain: from any Volume category segment into Geographic Split, carrying that
// category as a filter so the map + legend stay scoped to it (seller / buyer).
function mmChainToGeo(seg) {
  var vertId = null;
  for (var i = 0; i < mmPath.length; i++) {
    var n = mmFindById(mmPath[i]); if (n && n.kind === 'vert') { vertId = n._id; break; }
  }
  if (!vertId) return;
  var vert = mmFindById(vertId);
  var geoMod = (vert.children || []).filter(function(c){ return c.geoModule; })[0];
  if (!geoMod) return;
  _mmCloseInline();
  _geo.cat = seg ? String(seg).toLowerCase() : null;
  mmPath = _mmPathIds(geoMod);   // show the North/South region cards
  _mmAnimateReveal = true;
  mmPaint();
  // gently bring the region column into view
  var mm = document.getElementById('mm');
  if (mm && mm.scrollTo) mm.scrollTo({ left: mm.scrollWidth, behavior: motionOK() ? 'smooth' : 'auto' });
}

// ── connectors: elbow bus from each active card to its child column ──
function mmDraw() {
  var map = document.getElementById('mm'), svg = document.getElementById('mm-svg');
  if (!map || !svg) return;
  var R = map.getBoundingClientRect(); if (!R.width) return;
  svg.setAttribute('width', R.width); svg.setAttribute('height', R.height);
  svg.setAttribute('viewBox', '0 0 ' + R.width + ' ' + R.height);
  var rel = function(el) { var b = el.getBoundingClientRect(); return { l:b.left-R.left, r:b.right-R.left, cy:b.top-R.top+b.height/2 }; };
  var cols = [].slice.call(map.querySelectorAll('.mmcol')), d = '';
  for (var i = 0; i < cols.length - 1; i++) {
    var act = cols[i].querySelector('.mmn.on'); if (!act) continue;
    var kids = [].slice.call(cols[i+1].querySelectorAll('.mmn.in')); if (!kids.length) continue;
    var p = rel(act), kr = kids.map(rel);
    var busX = (p.r + kr[0].l) / 2;
    var ys = kr.map(function(k){ return k.cy; }).concat(p.cy);
    var top = Math.min.apply(null, ys), bot = Math.max.apply(null, ys);
    d += 'M ' + p.r + ' ' + p.cy + ' L ' + busX + ' ' + p.cy + ' M ' + busX + ' ' + top + ' L ' + busX + ' ' + bot + ' ';
    kr.forEach(function(k){ d += 'M ' + busX + ' ' + k.cy + ' L ' + k.l + ' ' + k.cy + ' '; });
  }
  svg.innerHTML = d ? '<path d="' + d + '" fill="none" stroke="rgba(0,0,0,.16)" stroke-width="1.5" stroke-linecap="round"/>' : '';
}
function mmDrawConnectors() { mmDraw(); }   // alias kept for any external caller
window.addEventListener('resize', function() { if (currentView !== 'gst') mmDraw(); });

// Each stage carries the vstat field for its total, and — where the backend
// provides a per-category breakdown for that stage (Logged In → total,
// Onboarded → onboarded) — a `catField` naming which category metric to split.
// Draft / Under Review / Rejected have no per-category feed, so they fall back
// to a plain Sellers vs Buyers split. No category is ever hardcoded.
// catField is the per-category key on the server's categories[] that corresponds to
// this stage, so every card can show the Metal / Plastic split rather than a bare count.
var MF_STAGES = [
  { key:'total',     label:'Logged In',             color:'blue',   field:'total',     vdAction:'total',     catField:'total'     },
  { key:'draft',     label:'Draft',                 color:'purple', field:'draft',     vdAction:'draft',     catField:'draft'     },
  { key:'review',    label:'Under Review',           color:'amber',  field:'inReview',  vdAction:'review',    catField:'inReview'  },
  { key:'onboarded', label:'Successfully Onboarded', color:'green',  field:'completed', vdAction:'onboarded', catField:'onboarded' },
  { key:'rejected',  label:'Rejected',              color:'red',    field:'rejected',  vdAction:'rejected',  catField:'rejected'  },
];

// mmSelectFunnelStage removed: stage cards now open their records directly.

function _mfCell(v, na) {
  return '<div class="mf-mx-cell' + (na ? ' na' : '') + '">' + (na ? '—' : esc(v)) + '</div>';
}
// Stage breakdown grid: rows = Sellers / Buyers, columns = EVERY category the
// vertical has, in volume order, followed by a Total column. Showing all of them
// is the point — capping the columns silently dropped whatever sat outside the
// top few, so the cells no longer added up to the stage headline. The Total
// column comes from the stage's own audience totals, so any gap between it and
// the category cells is visible rather than hidden. When the stage has no
// per-category feed, a single "Count" column carries the plain audience split.
function _mfMatrix(catRows, sTot, bTot) {
  var cols = (catRows && catRows.length) ? catRows : null;
  var n = cols ? cols.length + 1 : 1;
  var head = '<div class="mf-mx-corner"></div>';
  var sRow = '<div class="mf-mx-lbl"><span class="mf-cat-dot seller"></span>Sellers</div>';
  var bRow = '<div class="mf-mx-lbl"><span class="mf-cat-dot buyer"></span>Buyers</div>';
  if (cols) {
    cols.forEach(function(c, i) {
      head += '<div class="mf-mx-hd" title="' + esc(c.cat) + '"><span class="mf-cat-dot" style="background:'
        + MM_CAT_COLORS[i % MM_CAT_COLORS.length] + '"></span><span>' + esc(_catLabel(c.cat)) + '</span></div>';
      sRow += _mfCell(fmt(c.s), false);
      bRow += _mfCell(fmt(c.b), false);
    });
    head += '<div class="mf-mx-hd tot">Total</div>';
    sRow += '<div class="mf-mx-cell tot">' + fmt(sTot || 0) + '</div>';
    bRow += '<div class="mf-mx-cell tot">' + fmt(bTot || 0) + '</div>';
  } else {
    head += '<div class="mf-mx-hd">Count</div>';
    sRow += _mfCell(fmt(sTot || 0), false);
    bRow += _mfCell(fmt(bTot || 0), false);
  }
  return '<div class="mf-matrix" style="grid-template-columns:auto repeat(' + n + ',1fr)">'
    + head + sRow + bRow + '</div>';
}

function mmRenderFunnel() {
  var panel = document.getElementById('mm-funnel');
  if (!panel) return;
  if (!mmFunnelActive) { panel.className = 'mf'; panel.innerHTML = ''; return; }

  var key = activeVertKey || _mmVert;
  var vs = (DS && DS.verticals || {})[key] || {};
  var vb = (DB && DB.verticals || {})[key] || {};

  // The card keeps its at-a-glance summary — headline metric, label and the
  // audience × category matrix — and the whole thing is a button that opens
  // that stage's own records. The corner arrow is the only added chrome and it
  // is positioned out of flow, so the summary layout is unchanged.
  var html = '<div class="mf-flow">';
  MF_STAGES.forEach(function(s, i) {
    var total   = (vs[s.field]||0) + (vb[s.field]||0);
    var catRows = s.catField ? _mmCatRowsFixed(vs, vb, s.catField) : null;
    html += '<div class="mf-card" role="button" tabindex="0"'
      + ' aria-label="' + esc(s.label) + ': ' + fmt(total) + '. View records"'
      + ' title="View the ' + esc(s.label) + ' records"'
      + ' onclick="openStageRecords(\'' + s.key + '\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openStageRecords(\'' + s.key + '\')}">'
      + '<span class="mf-open-ic" aria-hidden="true">→</span>'
      + '<div class="mf-head"><div class="mf-v ' + s.color + '">' + fmt(total) + '</div>'
      + '<div class="mf-label">' + esc(s.label) + '</div></div>'
      + _mfMatrix(catRows, vs[s.field]||0, vb[s.field]||0)
      + '</div>';
    if (i < MF_STAGES.length - 1) {
      html += '<div class="mf-sep">'
        + '<svg viewBox="0 0 44 44" aria-hidden="true">'
        + '<path class="mf-sep-arrow" d="M4 19 L30 19 L30 13 L40 22 L30 31 L30 25 L4 25 Z"/></svg></div>';
    }
  });
  html += '</div>';

  panel.innerHTML = html;
  panel.className = 'mf mf-open';

  var cards = [].slice.call(panel.querySelectorAll('.mf-card'));
  var anim = motionOK();
  cards.forEach(function(c, i) {
    if (!anim) { c.classList.add('mf-in'); return; }
    setTimeout(function(){ c.classList.add('mf-in'); }, 60 + i * 90);
  });
  if (anim) {
    // Fade the connector arrows in with the cards (the old stroke-draw no longer
    // applies now that each arrow is a single filled shape).
    var arrows = [].slice.call(panel.querySelectorAll('.mf-sep-arrow'));
    arrows.forEach(function(a, i) {
      a.style.transition = 'none';
      a.style.opacity = '0';
      setTimeout(function(){
        a.style.transition = 'opacity .4s ease ' + (i * .09 + .2) + 's';
        a.style.opacity = '1';
      }, 20);
    });
  }
}

// ── Count-up: animate [data-count] figures from 0 → target within a container ──
function _mmCountUp(container) {
  if (!container) return;
  var els = [].slice.call(container.querySelectorAll('[data-count]'));
  if (!motionOK()) { els.forEach(function(el){ el.textContent = fmt(+el.getAttribute('data-count')); }); return; }
  els.forEach(function(el) {
    var target = +el.getAttribute('data-count') || 0, dur = 620, t0 = null;
    function step(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(Math.round(target * eased));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

            + ' onkeydown="if(event.key===\'Enter\'){mmChainToGeo(\'' + x.seg + '\')}" title="View ' + esc(x.label) + ' on the map"' : '')
        + '><span class="mp-seg-in">' + esc(x.label) + ' · ' + fmt(x.v) + '</span></div>';
    }).join('');
    html += '<div class="mp-bar" aria-hidden="false">' + segs + '</div>'
      + '<div class="mp-legend">' + P.bar.map(function(x) {
          return '<span class="mp-leg"><i style="background:' + x.color + '"></i>' + esc(x.label) + '</span>';
        }).join('') + '</div>';
  }

  // Type × Category cross-tab — comparable at a glance (row + column totals, bar-in-cell)
  if (P.matrix) {
    var M = P.matrix, nc = M.cols.length;
    var colTot = M.cols.map(function(c, ci){ return M.rows.reduce(function(s, r){ return s + (+r.vals[ci] || 0); }, 0); });
    var grand = colTot.reduce(function(s, v){ return s + v; }, 0);
    var mx = '<div class="mp-mx-corner"></div>'
      + M.cols.map(function(c, ci){ return '<div class="mp-mx-hd" title="' + esc(c.full || c.label) + '"><span class="mp-mx-dot" style="background:' + M.colColors[ci] + '"></span>' + esc(c.label) + '</div>'; }).join('')
      + '<div class="mp-mx-hd tot">Total</div>';
    mx += M.rows.map(function(r) {
      var rt = r.vals.reduce(function(s, v){ return s + (+v || 0); }, 0);
      var cells = r.vals.map(function(v, ci) {
        return '<div class="mp-mx-cell"><span class="mp-mx-n" data-count="' + (+v || 0) + '">0</span></div>';
      }).join('');
      return '<div class="mp-mx-rlbl">' + esc(r.label) + '</div>' + cells
        + '<div class="mp-mx-cell tot"><span class="mp-mx-n" data-count="' + rt + '">0</span></div>';
    }).join('');
    mx += '<div class="mp-mx-rlbl tot">Total</div>'
      + colTot.map(function(v, ci) {
          var ch = M.chain && M.cols[ci].seg;
          return '<div class="mp-mx-cell tot' + (ch ? ' ch' : '') + '"'
            + (ch ? ' role="button" tabindex="0" onclick="mmChainToGeo(\'' + M.cols[ci].seg + '\')" onkeydown="if(event.key===\'Enter\'){mmChainToGeo(\'' + M.cols[ci].seg + '\')}" title="View ' + esc(M.cols[ci].label) + ' on the map"' : '')
            + '><span class="mp-mx-n" data-count="' + v + '">0</span>' + (ch ? '<span class="mp-mx-go">↦</span>' : '') + '</div>';
        }).join('')
      + '<div class="mp-mx-cell tot grand"><span class="mp-mx-n" data-count="' + grand + '">0</span></div>';
    html += '<div class="mp-matrix" style="grid-template-columns:auto repeat(' + (nc + 1) + ',minmax(0,1fr))">' + mx + '</div>';
  }

  // stat tiles
  if (P.tiles && P.tiles.length) {
    html += '<div class="mp-tiles">' + P.tiles.map(function(t) {
      var tc = toneColor[t.tone] || 'var(--txt)';
      var chainable = node.panel.chain && t.seg;
      // A tile is actionable either by chaining into the map (seg) or by carrying an
      // explicit click handler (t.click), e.g. the ageing tiles opening their sellers.
      var act = t.click ? t.click : (chainable ? "mmChainToGeo('" + t.seg + "')" : null);
      var val = t.raw ? '<span>' + esc(t.v) + '</span>' : '<span data-count="' + (+t.v || 0) + '">0</span>';
      return '<div class="mp-tile' + (act ? ' ch' : '') + '"'
        + (act ? ' role="button" tabindex="0" title="' + esc(t.tip || 'View records') + '"'
            + ' onclick="' + act + '"'
            + ' onkeydown="if(event.key===\'Enter\'){' + act + '}"' : '')
        + '><div class="mp-tile-v" style="color:' + tc + '">' + val + '</div>'
        + '<div class="mp-tile-l">' + esc(t.label) + (chainable ? ' <span class="mp-go">↦ map</span>' : '') + '</div>'
        + (t.sub ? '<div class="mp-tile-s">' + esc(t.sub) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }

  // extra section (pre-built HTML for rich breakdown content)
  if (P.extra) {
    html += P.extra;
  }

  // records CTA
  if (P.records) {
    html += '<button class="mf-detail-vd mp-vd" onclick="mmCardAction(\'' + esc(P.records) + '\')">'
      + MM_IC.doc + ' View Detailed Records →</button>';
  }

  html += '</div>';
  panel.innerHTML = html;
  panel.className = 'mp mp-open';

  // entrance: count-up figures + grow the bar
  if (_mmModAnimate) {
    _mmCountUp(panel);
    if (motionOK()) {
      [].slice.call(panel.querySelectorAll('.mp-seg')).forEach(function(s) {
        var w = s.style.width; s.style.width = '0%';
        requestAnimationFrame(function(){ s.style.width = w; });
      });
      [].slice.call(panel.querySelectorAll('.mp-tile')).forEach(function(t, i) {
        t.style.opacity = '0'; t.style.transform = 'translateY(8px)';
        setTimeout(function(){ t.style.transition = 'opacity .34s ease, transform .34s cubic-bezier(.34,1.56,.64,1)'; t.style.opacity = ''; t.style.transform = ''; }, 60 + i * 55);
      });
    }
  } else {
    [].slice.call(panel.querySelectorAll('[data-count]')).forEach(function(el){ el.textContent = fmt(+el.getAttribute('data-count')); });
  }
  _mmModAnimate = false;
}

// ── Liquid tab thumb — the white pill that slides between vertical tabs.
//    Recreated on every bar re-render (innerHTML wipes it); positioned from
//    the active tab's box. animate=false snaps (first paint, resize, refresh).
function positionVertThumb(animate) {
  var bar = document.getElementById('vert-tabs-bar');
  if (!bar) return;
  var active = bar.querySelector('.vert-tab.active');
  var thumb  = bar.querySelector('.vert-tab-thumb');
  if (!active) { if (thumb) thumb.style.width = '0px'; return; }
  if (!active.offsetWidth) return;   // bar hidden (GST view) — keep last position
  if (!thumb) {
    thumb = document.createElement('div');
    thumb.className = 'vert-tab-thumb';
    bar.insertBefore(thumb, bar.firstChild);
  }
  bar.classList.add('has-thumb');
  var instant = animate === false || !motionOK();
  if (instant) thumb.style.transition = 'none';
  thumb.style.width = active.offsetWidth + 'px';
  thumb.style.transform = 'translateX(' + active.offsetLeft + 'px)';
  if (instant) requestAnimationFrame(function() { thumb.style.transition = ''; });
}
window.addEventListener('resize', function() { positionVertThumb(false); });

// Merge seller+buyer FY breakdowns into one chronological series per metric.
function mergeFYSeries(vsF, vbF, field) {
  var m = {};
  (vsF || []).concat(vbF || []).forEach(function(f) {
    if (!f || !f.fy) return;
    if (m[f.fy] === undefined) m[f.fy] = null;
    if (f[field] != null) m[f.fy] = (m[f.fy] || 0) + f[field];
  });
  return Object.keys(m).sort().map(function(k) { return m[k]; });
}

// Mini FY bar sparkline — quiet bars, latest year in the accent colour.
function sparkBars(vals, accent, dark) {
  vals = (vals || []).filter(function(v) { return v != null; });
  if (vals.length < 2) return '';
  var max = Math.max.apply(null, vals);
  if (!(max > 0)) return '';
  var H = 26, bw = 9, gap = 5;
  var n = vals.length, W = n * bw + (n - 1) * gap;
  var base = dark ? 'rgba(255,255,255,.22)' : 'rgba(60,60,67,.18)';
  return '<svg class="vkpi-spark" viewBox="0 0 ' + W + ' ' + H + '" style="width:' + W + 'px" aria-hidden="true">'
    + vals.map(function(v, i) {
        var h = Math.max(3, Math.round((v / max) * H));
        var x = i * (bw + gap), y = H - h;
        return '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" rx="2.5" fill="' + (i === n - 1 ? accent : base) + '"/>';
      }).join('')
    + '</svg>';
}

function renderVertKPIs(key) {
  var el = document.getElementById('vert-kpi-row');
  if (!el) return;
  // Show skeleton KPI cards during first load when there's no cached data
  if (_dashLoading && !DS) {
    var skCard = '<div class="sk-kpi-card"></div>';
    el.classList.add('vkpi-grid-4');
    el.innerHTML = skCard + skCard + skCard + skCard;
    return;
  }
  var vs = (DS && DS.verticals || {})[key] || {};
  var vb = (DB && DB.verticals || {})[key] || {};
  var totalS = vs.total || 0, totalB = vb.total || 0;
  var compS  = vs.completed || 0, compB = vb.completed || 0;
  var txnS   = vs.transacted != null ? (vs.transacted || 0) : null;
  var txnB   = vb.transacted != null ? (vb.transacted || 0) : null;
  var txnTotal   = (txnS || 0) + (txnB || 0);
  var nonTxnTotal = Math.max(0, (compS + compB) - txnTotal);
  var newS = vs.newVendors || 0, newB = vb.newVendors || 0;
  var oldS = vs.oldVendors || 0, oldB = vb.oldVendors || 0;
  var vars = vcVars(key);
  function sideRow(v, tag, clr) {
    return '<span class="vkpi-side-row">'
      + '<i class="vkpi-side-dot" style="background:' + clr + '"></i>'
      + '<b class="vkpi-side-num">' + v + '</b>'
      + '<em class="vkpi-side-tag">' + tag + '</em>'
      + '</span>';
  }
  // sides: [{val,tag,clr}] → renders as left column; big number anchors right.
  // sub: plain string shown below the value when no sides are given.
  // id: optional DOM id so cards can be patched after async data arrives.
  function mk(icon, lbl, val, sub, cls, action, id, note) {
    return '<div' + (id ? ' id="' + id + '"' : '') + ' class="vkpi-card' + (cls ? ' ' + cls : '') + '" style="' + vars + '"'
      + ' role="button" tabindex="0"'
      + ' onclick="openKpiModal(\'' + action + '\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openKpiModal(\'' + action + '\')}">'
      + '<div class="vkpi-icon">' + icon + '</div>'
      + '<div class="vkpi-text">'
      + '<div class="vkpi-lbl">' + lbl + '</div>'
      + '</div>'
      + '<div class="vkpi-numgrp">'
      + '<div class="vkpi-val">' + val + '</div>'
      + (sub  != null ? '<div class="vkpi-sub">'  + (sub  || '') + '</div>' : '')
      + (note != null ? '<div class="vkpi-note">' + (note || '') + '</div>' : '')
      + '</div>'
      + '</div>';
  }
  function svg(paths) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
  }
  var icFunnel = svg('<path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/>');
  var icCheck  = svg('<circle cx="12" cy="12" r="8.4"/><path d="M8.6 12.4l2.4 2.4 4.4-5"/>');
  var icZap    = svg('<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>');
  var icUsers  = svg('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>');

  // FY sparklines from real breakdown data (skipped when <2 years exist)
  var spTotal = sparkBars(mergeFYSeries(vs.fyBreakdown, vb.fyBreakdown, 'total'),      'var(--vc, #005DFF)', false);
  var spOnb   = sparkBars(mergeFYSeries(vs.fyBreakdown, vb.fyBreakdown, 'onboarded'),  '#30D158', true);
  var spTxn   = sparkBars(mergeFYSeries(vs.fyBreakdown, vb.fyBreakdown, 'transacted'), 'var(--st-transacted)', false);

  // Completion meter on the ink card — onboarded share of the whole pipeline
  var totAll  = totalS + totalB;
  var compPct = totAll > 0 ? Math.round(((compS + compB) / totAll) * 100) : 0;
  var meter   = '<div class="vkpi-meter" title="' + compPct + '% of pipeline onboarded"><i style="width:' + compPct + '%"></i></div>';

  // Per-category breakdown (seller + buyer union) for this vertical — feeds the
  // Category Distribution sections of the KPI modals. Data-driven: only the
  // categories this vertical actually carries, never hardcoded Metal/Plastic.
  var catTot = _mmCatRows(vs, vb, 'total');
  var catOnb = _mmCatRows(vs, vb, 'onboarded');
  var catTxn = _mmCatRows(vs, vb, 'transacted');

  var nonTxnSub   = nonTxnTotal > 0 ? '<div class="vkpi-sub">' + fmt(nonTxnTotal) + ' not yet</div>' : '';
  var oldTotalSub = '<div class="vkpi-sub">' + fmt(oldS + oldB) + ' existing</div>';
  var txnPct = (compS + compB) > 0 ? Math.round(txnTotal / (compS + compB) * 100) : 0;
  // Save snapshot so openKpiModal() can read it without recomputing
  window._kpiSnap = {
    key: key,
    totalS: totalS, totalB: totalB,
    compS: compS, compB: compB, compPct: compPct,
    txnS: txnS, txnB: txnB, txnTotal: txnTotal, txnPct: txnPct, nonTxnTotal: nonTxnTotal,
    txnUniqueTotal: (vs.totalTxnCount || 0) + (vb.totalTxnCount || 0),
    newS: newS, oldS: oldS, newB: newB, oldB: oldB,
    vs: vs, vb: vb,
    catTot: catTot, catOnb: catOnb, catTxn: catTxn,
  };
  var cards = [
    mk(icFunnel, 'Logged In Cases', fmt(totalS + totalB), fmt(totalS) + ' sellers · ' + fmt(totalB) + ' buyers', 'vk-total',     'total',      null),
    mk(icCheck,  'Onboarded',   fmt(compS + compB),   compPct + '% completion rate',  'vk-onboarded', 'onboarded'),
    mk(icZap,    'Transacted',  fmt(txnTotal),         txnPct > 0 ? txnPct + '% of onboarded' : null, 'vk-transacted', 'transacted'),
  ];
  if (key === 'OMP') {
    var enTotal = (oldS + oldB) + (newS + newB);
    cards.push(mk(icUsers, 'Existing vs New', fmt(enTotal),
      fmt(oldS + oldB) + ' Existing vs ' + fmt(newS + newB) + ' New',
      'vk-oldvsnew', 'oldvsnew'));
  }
  // 3-card verticals use auto-fit; the 4-card OMP row uses an explicit grid
  // (class-driven, see .vkpi-grid-4) so it steps 4-up → 2×2 → 1-up and never
  // breaks to an unbalanced 3 + lone card at intermediate widths.
  el.style.gridTemplateColumns = '';
  el.classList.toggle('vkpi-grid-4', cards.length === 4);
  el.innerHTML = cards.join('');
  animateCounters(el);
}
