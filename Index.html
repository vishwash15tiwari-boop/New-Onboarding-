function closeGpModal() {
  var el = document.getElementById('gp-modal');
  _modalCloseClass(el, 'gm-open', _gpModalEsc);
}
function _gpModalEsc(e) { if (e.key === 'Escape') closeGpModal(); }

function gpFyDrillModal(fy, field, evt) {
  if (evt) evt.stopPropagation();
  var LABELS = { total: 'Total Balance', material: 'Material Balance', gst: 'GST Balance' };
  var label = LABELS[field] || field;

  var vendors;
  if (gpYear === fy) {
    vendors = (GST.rows || []).filter(function(r) { return r.total > 0; })
      .map(function(r) { return { name: r.name, gstNo: r.gstNo, vertical: r.vertical, total: r.total, material: r.material, gst: r.gst }; });
  } else if (gpYear === 'All') {
    vendors = (GST.rows || []).filter(function(r) { return ((r.yearAmounts || {})[fy] || 0) > 0; })
      .map(function(r) {
        var ya = (r.yearAmounts || {})[fy] || 0;
        var mR = r.total > 0 ? r.material / r.total : 0;
        var mA = Math.round(ya * mR);
        return { name: r.name, gstNo: r.gstNo, vertical: r.vertical, total: ya, material: mA, gst: ya - mA };
      });
  } else {
    vendors = null;
  }

  if (vendors) vendors.sort(function(a, b) { return b[field] - a[field]; });

  // Single pass over vendors for all three column totals
  var tots = (vendors || []).reduce(function(s, r) {
    s.material += r.material; s.gst += r.gst; s.total += r.total; return s;
  }, { material: 0, gst: 0, total: 0 });

  // Highlight the sorted-by column, dim the others
  function cell(f, v) {
    return '<span class="' + (field === f ? 'gm-hi' : 'gm-dim') + '">' + fmtRupee(v) + '</span>';
  }

  var content;
  if (!vendors) {
    content = '<div style="padding:28px 20px;text-align:center">'
      + '<div style="color:var(--gp-ink2);margin-bottom:16px;line-height:1.5">Per-vendor detail for a year not currently loaded.<br>Switch to ' + esc(fyFull(fy)) + ' to see the breakdown.</div>'
      + '<button onclick="closeGpModal();gpSetYear(\'' + fy + '\')" style="font-family:inherit;font-size:13px;font-weight:600;padding:9px 22px;border-radius:999px;border:none;background:var(--blue);color:#fff;cursor:pointer">Switch to ' + esc(fyFull(fy)) + '</button>'
      + '</div>';
  } else if (!vendors.length) {
    content = '<div style="padding:32px 20px;text-align:center;color:var(--gp-ink2)">No vendors with outstanding ' + esc(label.toLowerCase()) + ' in ' + esc(fyFull(fy)) + '</div>';
  } else {
    var rows = vendors.map(function(r, i) {
      return '<tr>'
        + '<td class="gm-rank">' + (i + 1) + '</td>'
        + '<td><div class="gm-vname" title="' + esc(r.name) + '">' + esc(r.name || '—') + '</div>'
        + (r.gstNo ? '<div class="gm-gstin">' + esc(r.gstNo) + '</div>' : '') + '</td>'
        + '<td style="font-size:11px;color:var(--gp-ink2)">' + esc(r.vertical || '—') + '</td>'
        + '<td class="r">' + cell('material', r.material) + '</td>'
        + '<td class="r">' + cell('gst',      r.gst)      + '</td>'
        + '<td class="r">' + cell('total',    r.total)    + '</td>'
        + '</tr>';
    }).join('');
    content = '<div style="overflow-x:auto;padding-bottom:4px">'
      + '<table class="gm-tbl">'
      + '<thead><tr>'
      + '<th class="gm-rank"></th>'
      + '<th>Vendor</th>'
      + '<th>Vertical</th>'
      + '<th class="r">Material</th>'
      + '<th class="r">GST</th>'
      + '<th class="r">Total</th>'
      + '</tr></thead>'
      + '<tbody>' + rows + '</tbody>'
      + '<tfoot><tr>'
      + '<td></td>'
      + '<td style="color:var(--gp-ink2);font-size:11px">' + fmt(vendors.length) + ' vendors</td>'
      + '<td></td>'
      + '<td class="r">' + cell('material', tots.material) + '</td>'
      + '<td class="r">' + cell('gst',      tots.gst)      + '</td>'
      + '<td class="r">' + cell('total',    tots.total)    + '</td>'
      + '</tr></tfoot>'
      + '</table></div>';
  }

  var fieldTotal = tots[field];
  var el = document.getElementById('gp-modal');
  var pn = document.getElementById('gm-pn');
  if (!el || !pn) return;
  pn.innerHTML =
    '<div class="km-head">'
    + '<div class="km-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div>'
    + '<div class="km-htxt">'
    + '<div class="km-title">' + esc(fyFull(fy)) + ' — ' + esc(label) + '</div>'
    + '<div class="km-sub">' + (vendors ? fmt(vendors.length) + ' vendors · ' + fmtRupee(fieldTotal) + ' outstanding' : 'Switch year to view vendor details') + '</div>'
    + '</div>'
    + '<button class="km-close" onclick="closeGpModal()" aria-label="Close">✕</button>'
    + '</div>'
    + content;
  _modalOpenClass(el, 'gm-open', _gpModalEsc);
}

function gpSetYear(y) {
  if (y === gpYear) return;
  gpYear = y;
  var swrDone = false;
  try {
    var stored = localStorage.getItem(STORE_PFX + 'gst_' + y);
    if (stored) { var p = JSON.parse(stored); if (p && p.success) { GST = p; renderGST(); swrDone = true; } }
  } catch (e) {}
  loadGSTData(swrDone);
}

function renderGSTLastUpdated() {

}

// ── Charts row: GST status donut · vertical distribution · compliance ──
function gstChartsRow() {
  var g = GST;
  return '<div class="gp-charts-row">'
    + '<div class="gp-card"><div class="gp-card-h"><div><div class="gp-card-title">GST Status</div>'
    +   '<div class="gp-card-sub">Vendor registration breakdown</div></div></div>' + gpDonut(g.gstStatus) + '</div>'
    + '<div class="gp-card"><div class="gp-card-h"><div><div class="gp-card-title">Vertical Distribution</div>'
    +   '<div class="gp-card-sub">Outstanding by business vertical</div></div></div>' + gpVBars(g.verticals) + '</div>'
    + '<div class="gp-card"><div class="gp-card-h"><div><div class="gp-card-title">Compliance Rate</div>'
    +   '<div class="gp-card-sub">% of applicable vendors cleared</div></div></div>' + gpCompliance(g.compliance) + '</div>'
    + '</div>';
}

function gpDonut(segs) {
  var total = segs.reduce(function(a, s) { return a + s.count; }, 0);
  if (!total) return '<div class="gp-empty">No data</div>';
  var cx = 90, cy = 90, r = 66, sw = 24, circ = 2 * Math.PI * r, off = 0;
  var arcs = segs.map(function(s, i) {
    var len = s.count / total * circ, col = GP_STATUS_COLORS[i % GP_STATUS_COLORS.length];
    var el = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '"'
      + ' stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"'
      + ' transform="rotate(-90 ' + cx + ' ' + cy + ')"><title>' + esc(s.label) + ': ' + fmt(s.count) + ' (' + Math.round(s.count / total * 100) + '%)</title></circle>';
    off += len; return el;
  }).join('');
  var legend = segs.map(function(s, i) {
    return '<div class="gp-leg"><span class="gp-leg-dot" style="background:' + GP_STATUS_COLORS[i % GP_STATUS_COLORS.length] + '"></span>'
      + esc(s.label) + ' <b>' + fmt(s.count) + '</b></div>';
  }).join('');
  return '<div class="gp-donut-wrap"><svg viewBox="0 0 180 180" class="gp-donut-svg" role="img" aria-label="GST status breakdown">'
    + arcs
    + '<text x="90" y="86" text-anchor="middle" class="gp-donut-num">' + fmt(total) + '</text>'
    + '<text x="90" y="104" text-anchor="middle" class="gp-donut-lbl">Vendors</text>'
    + '</svg><div class="gp-legend">' + legend + '</div></div>';
}

function gpVBars(items) {
  items = (items || []).slice(0, 8);
  if (!items.length) return '<div class="gp-empty">No data</div>';
  return '<div class="gp-num-list">' + items.map(function(it, i) {
    return '<div class="gp-num-row">'
      + '<span class="gp-num-dot" style="background:' + GP_VERT_COLORS[i % GP_VERT_COLORS.length] + '"></span>'
      + '<span class="gp-num-lbl">' + esc(it.label) + '</span>'
      + '<span class="gp-num-val">' + fmtRupee(it.value) + '</span>'
      + '</div>';
  }).join('') + '</div>';
}

function gpCompliance(items) {
  var colors = ['var(--gp-orange)', 'var(--gp-gold)', 'var(--gp-green)', 'var(--gp-blue)'];
  if (!items || !items.length) return '<div class="gp-empty">No data</div>';
  return '<div class="gp-num-list">' + items.map(function(it, i) {
    return '<div class="gp-num-row">'
      + '<span class="gp-num-dot" style="background:' + colors[i % colors.length] + '"></span>'
      + '<span class="gp-num-lbl">' + esc(it.label) + '</span>'
      + '<span class="gp-num-val">' + fmt(it.count) + ' <span class="gp-num-pct">(' + it.pct + '%)</span></span>'
      + '</div>';
  }).join('') + '</div>';
}

// ── Filters ──
function gstFiltersRow() {
  var g = GST;
  var itcVals = gpDistinct(g.rows, 'itcCheck');
  return '<div class="gp-filters">'
    + '<div class="gp-search"><input type="text" class="gp-input" id="gp-search" placeholder="Search vendor or GST No" value="' + esc(gpFilters.search) + '" oninput="gpSearchDeb()"></div>'
    + gpSelect('gp-status', 'GST Status', g.gstStatus.map(function(s) { return s.label; }), gpFilters.status)
    + gpSelect('gp-vertical', 'Vertical', g.verticals.map(function(s) { return s.label; }), gpFilters.vertical)
    + gpSelect('gp-msme', 'MSME', g.msme.map(function(s) { return s.label; }), gpFilters.msme)
    + gpSelect('gp-itc', 'ITC Check', itcVals, gpFilters.itc)
    + '</div>';
}
function gpSelect(id, label, options, current) {
  var opts = '<option value="All">' + esc(label) + ': All</option>'
    + options.map(function(o) { return '<option value="' + esc(o) + '"' + (current === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('');
  return '<div class="gp-select-wrap"><select class="gp-select" id="' + id + '" onchange="gpFilterChange()">' + opts + '</select></div>';
}
function gpDistinct(rows, field) {
  var seen = {}, out = [];
  rows.forEach(function(r) { var v = r[field]; if (v && !seen[v]) { seen[v] = true; out.push(v); } });
  return out.sort();
}

// ── Vendor register table ──
function gstTableShell() {
  var cols = [
    ['name', 'Vendor', false], ['gstNo', 'GST No', false], ['gstStatus', 'Status', false],
    ['vertical', 'Vertical', false], ['msme', 'MSME', false], ['total', 'Total Balance', true],
    ['material', 'Material Balance', true], ['gst', 'GST Balance', true],
  ];
  return '<div class="gp-table-card">'
    + '<div class="gp-table-head"><div class="gp-card-title">Vendor Register</div>'
    +   '<div class="gp-card-sub" id="gp-table-sub">GST Payables Register</div></div>'
    + '<div class="gp-table-scroll"><table class="gp-table"><thead><tr>'
    + cols.map(function(c) {
        return '<th class="' + (c[2] ? 'gp-num' : '') + '" data-key="' + c[0] + '" onclick="gpSortBy(\'' + c[0] + '\')">' + c[1] + '</th>';
      }).join('')
    + '</tr></thead><tbody id="gp-tbody"></tbody></table></div>'
    + '<div class="gp-table-note" id="gp-table-note"></div>'
    + '</div>';
}

function gpFilteredRows() {
  if (!GST) return [];
  var q = (gpFilters.search || '').toLowerCase();
  return GST.rows.filter(function(r) {
    if (gpFilters.status   !== 'All' && r.gstStatus !== gpFilters.status)   return false;
    if (gpFilters.vertical !== 'All' && r.vertical  !== gpFilters.vertical) return false;
    if (gpFilters.msme     !== 'All' && r.msme      !== gpFilters.msme)     return false;
    if (gpFilters.itc      !== 'All' && r.itcCheck  !== gpFilters.itc)      return false;
    if (q && (r.name || '').toLowerCase().indexOf(q) === -1
          && (r.gstNo || '').toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function gpSortRows(rows) {
  var key = gpSort.key, dir = gpSort.dir;
  var numeric = (key === 'total' || key === 'material' || key === 'gst');
  return rows.slice().sort(function(a, b) {
    var va = numeric ? (a[key] || 0) : String(a[key] || '').toLowerCase();
    var vb = numeric ? (b[key] || 0) : String(b[key] || '').toLowerCase();
    if (va < vb) return -dir;
    if (va > vb) return dir;
    return 0;
  });
}

function gpSortBy(key) {
  if (gpSort.key === key) gpSort.dir = -gpSort.dir;
  else gpSort = { key: key, dir: (key === 'total' || key === 'material' || key === 'gst') ? -1 : 1 };
  renderGSTVendorTable();
}

function renderGSTVendorTable() {
  var tbody = document.getElementById('gp-tbody');
  var note = document.getElementById('gp-table-note');
  var sub = document.getElementById('gp-table-sub');
  if (!tbody || !GST) return;

  var filtered = gpSortRows(gpFilteredRows());
  var shown = filtered.slice(0, GP_MAX_ROWS);
  var sumTotal = filtered.reduce(function(a, r) { return a + (r.total || 0); }, 0);

  document.querySelectorAll('#tab-gst .gp-table thead th').forEach(function(th) {
    th.classList.remove('gp-sort-asc', 'gp-sort-desc');
    if (th.dataset.key === gpSort.key) th.classList.add(gpSort.dir === 1 ? 'gp-sort-asc' : 'gp-sort-desc');
  });

  tbody.innerHTML = shown.length ? shown.map(function(r) {
    return '<tr>'
      + '<td><span class="gp-vname">' + esc(r.name || '—') + '</span></td>'
      + '<td><span class="gp-gstno">' + esc(r.gstNo || '—') + '</span></td>'
      + '<td>' + gpStatusChip(r.gstStatus) + '</td>'
      + '<td>' + esc(r.vertical || '—') + '</td>'
      + '<td><span class="gp-chip neutral">' + esc(r.msme || '—') + '</span></td>'
      + '<td class="gp-num"><span class="gp-amt">' + fmtRupee(r.total) + '</span></td>'
      + '<td class="gp-num"><span class="gp-amt muted">' + fmtRupee(r.material) + '</span></td>'
      + '<td class="gp-num"><span class="gp-amt muted">' + fmtRupee(r.gst) + '</span></td>'
      + '</tr>';
  }).join('') : '<tr><td colspan="8" class="gp-empty">No vendors match the selected filters</td></tr>';

  if (sub) sub.textContent = fmt(GST.vendorCount) + ' vendors · GST Payables Register'
    + (gpYear !== 'All' ? ' · ' + fyFull(gpYear) : '');
  if (note) note.textContent = 'Showing ' + fmt(shown.length) + ' of ' + fmt(filtered.length)
    + ' vendors · combined balance ' + fmtRupee(sumTotal)
    + (filtered.length > GP_MAX_ROWS ? ' · refine filters to see all' : '');
}

function gpStatusChip(status) {
  var s = String(status || '').toLowerCase();
  var cls = 'neutral';
  if (s.indexOf('cancel') !== -1) cls = 'cancelled';
  else if (s.indexOf('suspend') !== -1) cls = 'suspended';
  else if (s.indexOf('inactive') !== -1) cls = 'inactive';
  else if (s.indexOf('active') !== -1) cls = 'active';
  return '<span class="gp-chip ' + cls + '">' + esc(status || '—') + '</span>';
}

function gpVal(id) { var el = document.getElementById(id); return el ? el.value : 'All'; }
function gpFilterChange() {
  gpFilters.status   = gpVal('gp-status');
  gpFilters.vertical = gpVal('gp-vertical');
  gpFilters.msme     = gpVal('gp-msme');
  gpFilters.itc      = gpVal('gp-itc');
  renderGSTVendorTable();
}
var gpSearchTimer;
function gpSearchDeb() {
  var el = document.getElementById('gp-search');
  gpFilters.search = el ? el.value : '';
  clearTimeout(gpSearchTimer);
  gpSearchTimer = setTimeout(renderGSTVendorTable, 250);
}

function animateGSTCounters() {
  if (typeof motionOK === 'function' && !motionOK()) return;   // respect reduced-motion
  document.querySelectorAll('#tab-gst .gp-kpi-val[data-count]').forEach(function(el) {
    var target = parseFloat(el.getAttribute('data-count')) || 0, dur = 850, start = null;
    function step(ts) {
      if (!start) start = ts;
      var p = Math.min(1, (ts - start) / dur), eased = 1 - Math.pow(1 - p, 3);
      el.textContent = fmtRupee(Math.round(target * eased));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

// ── GST formatting helpers ──
// Full Indian-grouped rupee value: ₹4,00,42,207
function fmtRupee(v) {
  if (v === null || v === undefined || isNaN(v)) return '₹0';
  return '₹' + Math.round(v).toLocaleString('en-IN');
}
// 'FY 21-22' → '2021-22'  (financial years here are all in the 2000s)
function fyFull(fy) {
  var m = String(fy || '').match(/(\d{2})-(\d{2})/);
  return m ? '20' + m[1] + '-' + m[2] : String(fy || '');
}
// 'FY 21-22' → '21-22'
function fyShort(fy) { return String(fy || '').replace(/^FY\s*/, ''); }

// ═══════════════════════════════════════════════════════════════
// SCROLL REVEAL — D.E. Shaw editorial entrance pattern
// IntersectionObserver fires .visible the moment each .reveal
// element crosses an 8% threshold.  The .reveal CSS rule
// (opacity:0 → 1, translateY 22px → 0) plays the transition.
// Only runs when OS motion is permitted.
// ═══════════════════════════════════════════════════════════════
(function initReveal() {
  if (!window.IntersectionObserver) return;
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        var delay = (parseInt(e.target.getAttribute('data-ri') || '0', 10) || 0) * 8;
        if (delay) {
          setTimeout(function() { e.target.classList.add('visible'); }, delay);
        } else {
          e.target.classList.add('visible');
        }
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.06, rootMargin: '0px 0px -32px 0px' });

  function observe() {
    if (motionOK()) {
      document.querySelectorAll('.reveal:not(.visible)').forEach(function(el) { io.observe(el); });
    } else {
      document.querySelectorAll('.reveal').forEach(function(el) { el.classList.add('visible'); });
    }
  }

  if (document.readyState !== 'loading') { observe(); }
  else { document.addEventListener('DOMContentLoaded', observe); }

  var _origRenderAll = window.renderAll;
  window.renderAll = function() {
    if (_origRenderAll) _origRenderAll.apply(this, arguments);
    requestAnimationFrame(observe);
  };
})();

// IntersectionObserver scroll spy — highlights the sidebar item matching the
// section closest to the top of the viewport.
function setupScrollSpy() {
  if (_scrollSpyObs) { _scrollSpyObs.disconnect(); _scrollSpyObs = null; }
  if (!window.IntersectionObserver) return;

  var sections = document.querySelectorAll('.vert-section[id^="vs-"]');
  if (!sections.length) return;

  _scrollSpyObs = new IntersectionObserver(function(entries) {
    var best = null, bestRatio = 0;
    entries.forEach(function(e) {
      if (e.isIntersecting && e.intersectionRatio > bestRatio) {
        bestRatio = e.intersectionRatio;
        best = e.target;
      }
    });
    if (!best) return;
    var key = best.id.replace('vs-', '');
    if (key === snActiveKey) return;
    snActiveKey = key;
  }, { threshold: [0.1, 0.25, 0.5], rootMargin: '-64px 0px -40% 0px' });

  sections.forEach(function(sec) { _scrollSpyObs.observe(sec); });
}

function set(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }
function dOr(v, suffix) { return (v === null || v === undefined) ? '—' : v + (suffix || ''); }
function fmt(n) { return Number(n || 0).toLocaleString('en-IN'); }
function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtINR(v) {
  if (v === null || v === undefined || isNaN(parseFloat(v))) return '—';
  v = parseFloat(v);
  if (v >= 1e7) {
    var cr = v / 1e7;
    // Large Crore values (≥100 Cr) get Indian grouping and no decimals: "₹35,793 Cr"
    // Smaller Crore values keep 2 decimal places: "₹87.75 Cr"
    var s = cr >= 100
      ? cr.toLocaleString('en-IN', { maximumFractionDigits: 0 })
      : cr.toFixed(2);
    return '₹' + s + ' Cr';
  }
  if (v >= 1e5) return '₹' + (v / 1e5).toFixed(2) + ' L';
  if (v >= 1000) return '₹' + (v / 1000).toFixed(1) + ' K';
  return '₹' + Math.round(v).toLocaleString('en-IN');
}

function statusChip(s) {
  var cls = { COMPLETED: 'chip-completed', DRAFT: 'chip-draft', IN_REVIEW: 'chip-review', REJECTED: 'chip-rejected' };
  return '<span class="status-chip ' + (cls[s] || '') + '">' + esc(STATUS_LABELS[s] || s || '—') + '</span>';
}
function tatChip(t) {
  // 0 is a valid TAT (same-day onboarding) — only null/undefined/'—' mean "no TAT".
  if (t === null || t === undefined || t === '' || t === '—') return '<span class="text-muted">—</span>';
  var n = parseInt(t, 10);
  if (isNaN(n)) return '<span class="text-muted">' + esc(t) + '</span>';
  var cls = n <= 2 ? 'text-green' : n <= 5 ? 'text-amber' : 'text-red';
  return '<span class="' + cls + '">' + n + 'd</span>';
}

var spActiveIdx = -1;
var spCurrentItems = [];

function spBuildItems(query) {
  var q = (query || '').toLowerCase().trim();
  var items = [];

  // ── Navigation ──
  var navItems = [
    { ic:'⊞', title:'Dashboard Overview', sub:'All verticals, onboarding pipeline', action:function(){switchView('onboarding')}, badge:'View' },
    { ic:'₹', title:'GST Payables', sub:'Vendor register, outstanding balances', action:function(){switchView('gst')}, badge:'View' },
  ];
  // Add verticals from config
  var cfgList = (typeof getVertCfg === 'function') ? getVertCfg() : [];
  cfgList.forEach(function(cfg) {
    navItems.push({ ic:cfg.name.charAt(0), title:cfg.name, sub:'View ' + cfg.name + ' vertical detail', action:function(k){return function(){openVertDetail(k)}}(cfg.key), badge:'Vertical' });
  });

  // ── Actions ──
  var actionItems = [
    { ic:'↻', title:'Refresh Data', sub:'Reload the latest data from source', action:function(){refreshActive()}, badge:'Action' },
  ];

  // ── Period filters (shown when on overview) ──
  var periodItems = [
    { ic:'D', title:'Today', sub:'Onboarding activity for today', action:function(){onPeriodSelect('Today')}, badge:'Period' },
    { ic:'MTD', title:'MTD – Month to Date', sub:'From 1st of current month to today', action:function(){onPeriodSelect('MTD')}, badge:'Period' },
    { ic:'YTD', title:'YTD – Year to Date', sub:'From Apr 1 of current financial year', action:function(){onPeriodSelect('YTD')}, badge:'Period' },
    { ic:'All', title:'All Time', sub:'Complete onboarding history', action:function(){onPeriodSelect('All')}, badge:'Period' },
  ];

  var all = navItems.concat(actionItems, periodItems);
  if (q) {
    all = all.filter(function(i) {
      return i.title.toLowerCase().indexOf(q) !== -1 || (i.sub || '').toLowerCase().indexOf(q) !== -1;
    });
  }
  return all;
}

function spRender(query) {
  var items = spBuildItems(query);
  spCurrentItems = items;
  spActiveIdx = items.length > 0 ? 0 : -1;
  var res = document.getElementById('sp-results');
  if (!res) return;
  if (!items.length) {
    res.innerHTML = '<div class="sp-empty">No results for "<b>' + esc(query) + '</b>"</div>';
    return;
  }
  res.innerHTML = items.map(function(item, i) {
    return '<div class="sp-item' + (i === 0 ? ' sp-active' : '') + '" data-sp-i="' + i + '" onclick="spSelect(' + i + ')" onmouseover="spHover(' + i + ')">'
      + '<div class="sp-item-ic">' + esc(item.ic) + '</div>'
      + '<div class="sp-item-body"><div class="sp-item-title">' + esc(item.title) + '</div>'
      + (item.sub ? '<div class="sp-item-sub">' + esc(item.sub) + '</div>' : '')
      + '</div>'
      + (item.badge ? '<span class="sp-item-badge">' + esc(item.badge) + '</span>' : '')
      + '</div>';
  }).join('');
}

function spHover(i) { spActiveIdx = i; spHighlight(); }

function spHighlight() {
  document.querySelectorAll('#sp-results .sp-item').forEach(function(el, i) {
    el.classList.toggle('sp-active', i === spActiveIdx);
  });
}

function spFilter(val) { spRender(val); }

function spSelect(i) {
  var item = spCurrentItems[i];
  if (!item) return;
  closeSpotlight();
  setTimeout(function() { item.action(); }, 50);
}

function spKeydown(e) {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    spActiveIdx = Math.min(spActiveIdx + 1, spCurrentItems.length - 1);
    spHighlight();
    var active = document.querySelector('#sp-results .sp-item.sp-active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    spActiveIdx = Math.max(spActiveIdx - 1, 0);
    spHighlight();
    var active = document.querySelector('#sp-results .sp-item.sp-active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    if (spActiveIdx >= 0) spSelect(spActiveIdx);
  } else if (e.key === 'Escape') {
    closeSpotlight();
  }
}

function openSpotlight() {
  var overlay = document.getElementById('spotlight-overlay');
  if (!overlay) return;
  var wasOpen = overlay.style.display === 'flex';
  overlay.style.display = 'flex';
  spRender('');
  var input = document.getElementById('sp-input');
  if (input) { input.value = ''; setTimeout(function() { input.focus(); }, 50); }
  if (!wasOpen) lockBodyScroll();
}

function closeSpotlight() {
  var overlay = document.getElementById('spotlight-overlay');
  var wasOpen = overlay && overlay.style.display === 'flex';
  if (overlay) overlay.style.display = 'none';
  if (wasOpen) unlockBodyScroll();
}

// ⌘K / Ctrl+K global shortcut
document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    var overlay = document.getElementById('spotlight-overlay');
    if (overlay && overlay.style.display !== 'none') {
      closeSpotlight();
    } else {
      openSpotlight();
    }
  }
  if (e.key === 'Escape') {
    var overlay = document.getElementById('spotlight-overlay');
    if (overlay && overlay.style.display !== 'none') closeSpotlight();
  }
});

// OSV records — a record-level table of every OMP-onboarded seller and its OSV
// state, sourced from the quality feed rather than the vertical's onboarding rows.
// `status` optionally pre-filters to one bucket ('verified' | 'in_progress' |
// 'not_initiated'), which is what the Done / In Progress / Not Initiated tiles pass.
function openOsvRecords(status) {
  var rows = (qualityData && qualityData.vendorOSV) || [];
  var key = activeVertKey || selectedVert;
  var vcfg = getVertCfg().filter(function(c) { return c.key === key; })[0];
  var label = status && OSV_LABELS[status]
    ? 'OSV Status · ' + OSV_LABELS[status]
    : 'OSV Status · All Vendors';
  _mrCtx = {
    module: 'osv', label: label, vertLabel: (vcfg && vcfg.name) || key || '',
    preStatus: null, forceSeller: true, osv: true, cfg: { label: label }
  };
  _mrRows = rows.slice();
  _mrF = { search:'', category:'All', vendor:'All', status:'All', gst:'All', state:'All',
           ageBucket:'All', transacted:'All', dateStart:'', dateEnd:'',
           osvStatus: (status && OSV_LABELS[status]) ? status : 'All',
           vertical:'All', assigned:'All' };
  _mrSort = { key:'', dir:1 };
  _mrPg = { size:25, page:0 };
  // Hide Assigned User / GSTIN when the feed carries nothing for them, so the
  // table never shows a column of dashes.
  _mrColVis = {};
  if (!rows.some(function(r) { return r.assignedTo; })) _mrColVis['assignedTo'] = true;
  if (!rows.some(function(r) { return r.updatedDate; })) _mrColVis['updatedDate'] = true;
  if (!rows.some(function(r) { return r.gstin; }))      _mrColVis['gstin'] = true;
  var ovl = document.getElementById('mr-ovl');
  if (ovl) { ovl.classList.add('mr-open'); lockBodyScroll(); }
  _mrRender();
}

// State-level geo drill-down — opens the records overlay filtered to one state,
// one audience (seller/buyer), and optionally one category.
function openGeoStateRecords(stateId, aud, cat) {
  if (!stateId || !IN_STATES[stateId]) return;
  var key = activeVertKey || selectedVert;
  var vcfg = getVertCfg().filter(function(c) { return c.key === key; })[0];
  var vertName = (vcfg && vcfg.name) || key || '';
  var stateName = IN_STATES[stateId].name;
  var catLabel = cat ? (CAT_SHORT[cat] || (cat.charAt(0).toUpperCase() + cat.slice(1))) : null;
  var audLabel = aud === 'buyer' ? 'Buyers' : 'Sellers';
  var label = stateName + ' · ' + audLabel + (catLabel ? ' · ' + catLabel : '');
  function _filterRows(src) {
    if (!Array.isArray(src)) return [];
    return src.filter(function(r) {
      if (_geoStateId(r.state) !== stateId) return false;
      if (cat && (r.category || '').toLowerCase() !== cat.toLowerCase()) return false;
      return true;
    });
  }
  var srcRows = aud === 'buyer' ? (_ovnRows && _ovnRows.buyer) : vertRows;
  _mrCtx = {
    module: 'geo', geoState: true, stateId: stateId, geoAud: aud, geoCat: cat || null,
    label: label, vertLabel: vertName, preStatus: null, forceSeller: aud !== 'buyer',
    cfg: { label: label }
  };
  _mrRows = _filterRows(srcRows);
  _mrF = { search:'', category:'All', vendor:'All', status:'All', gst:'All', state:'All',
           ageBucket:'All', transacted:'All', dateStart:'', dateEnd:'',
           osvStatus:'All', vertical:'All', assigned:'All' };
  _mrSort = { key:'', dir:1 };
  _mrPg = { size:25, page:0 };
  _mrColVis = {};
  var ovl = document.getElementById('mr-ovl');
  if (ovl) { ovl.classList.add('mr-open'); lockBodyScroll(); }
  _mrRender();
  if (aud === 'buyer' && (!_ovnRows || !_ovnRows.buyer)) _ovnEnsureAud('buyer');
}

// Transacted Sellers or Buyers breakdown — opens the KPI modal showing total
// count and Metal/Plastic (or data-driven category) split for one audience.
function openTxnAudModal(aud) {
  var d = window._mmTxnAud; if (!d) return;
  var ad = d[aud]; if (!ad) return;
  var el = document.getElementById('km-pn');
  var modal = document.getElementById('kpi-modal');
  if (!el || !modal) return;
  var isS   = aud === 'seller';
  var label = isS ? 'Sellers' : 'Buyers';
  var color = isS ? '#1DC797' : '#005DFF';
  var icon  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>';
  function srow(items) {
    var cols = Math.min(items.length, 3);
    return '<div class="km-srow km-srow-' + cols + '">'
      + items.map(function(it) {
          return '<div class="km-s"><div class="km-sv"' + (it.c ? ' style="color:' + it.c + '"' : '') + '>' + it.v + '</div><div class="km-sl">' + esc(it.l) + '</div></div>';
        }).join('') + '</div>';
  }
  function sec(title, inner) {
    return '<div class="km-sec"><div class="km-sec-t">' + esc(title) + '</div>' + inner + '</div>';
  }

  if (ad.cats && ad.cats.length) {

    });
  } else {
    if (ad.metal)   catItems.push({ l:'Metal',   v:fmt(ad.metal),   c:color });
    if (ad.plastic) catItems.push({ l:'Plastic', v:fmt(ad.plastic), c:color });
  }
  var catSection = catItems.length ? sec('Category Breakdown', srow(catItems)) : '';
  el.innerHTML =
    '<div class="km-head"><div style="display:flex;align-items:center;min-width:0">'
    + '<div class="km-icon">' + icon + '</div>'
    + '<div class="km-htxt"><div class="km-title">Transacted ' + esc(label) + '</div>'
    + '<div class="km-sub">' + esc(label) + ' who have made at least one transaction</div>'
    + '</div></div>'
    + '<button class="km-close" onclick="closeKpiModal()" aria-label="Close">✕</button></div>'
    + '<div class="km-hero"><div class="km-hero-num" style="color:' + color + '">' + fmt(ad.total) + '</div>'
    + '<div class="km-hero-lbl">Transacted ' + esc(label) + '</div></div>'

// TAT records — the vendors behind one cell of the Average TAT matrix.
// `aud` is 'seller' or 'buyer'; `cat` narrows to one category, or null for Overall.
// Rows come from the vertical's detail feed for that audience, which may not be the
// audience currently on screen, so they are fetched on demand and cached.
function openTatRecords(aud, cat) {
  aud = (aud === 'buyer') ? 'buyer' : 'seller';
  var key  = activeVertKey || selectedVert;
  var pKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  if (_tatRows.key !== key || _tatRows.pKey !== pKey) {
    _tatRows = { key:key, pKey:pKey, seller:null, buyer:null, loading:{} };
  }
  // Reuse the rows already loaded for the on-screen audience rather than refetching.
  if (_tatRows[aud] == null && selectedVert === key && selectedAud === aud
      && Array.isArray(vertRows) && vertRows.length) {
    _tatRows[aud] = vertRows.slice();
  }

  var vcfg = getVertCfg().filter(function(c) { return c.key === key; })[0];
  _mrCtx = {
    module: 'tat', tat: true, tatAud: aud, tatCat: cat || null,
    label: 'Average TAT · ' + (aud === 'buyer' ? 'Buyers' : 'Sellers') + (cat ? ' · ' + cat : ''),
    vertLabel: (vcfg && vcfg.name) || key || '',
    preStatus: 'COMPLETED', forceSeller: false, cfg: { label: 'Average TAT' }
  };
  _mrRows = _tatRows[aud] || [];
  _mrF = { search:'', category: cat || 'All', vendor:'All', status:'All', gst:'All', state:'All',
           ageBucket:'All', transacted:'All', dateStart:'', dateEnd:'',
           osvStatus:'All', vertical:'All', assigned:'All' };
  _mrSort = { key:'tat', dir:-1 };   // slowest first — the useful end of a TAT list
  _mrPg = { size:25, page:0 };
  _mrColVis = {};

  var ovl = document.getElementById('mr-ovl');
  if (ovl) { ovl.classList.add('mr-open'); lockBodyScroll(); }
  _mrRender();

  if (_tatRows[aud] == null && !_tatRows.loading[aud]) {
    _tatRows.loading[aud] = true;
    var f = { audience: aud, period: currentPeriod };
    if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
    google.script.run
      .withSuccessHandler(function(res) {
        _tatRows.loading[aud] = false;
        try { var d = JSON.parse(res); _tatRows[aud] = (d && d.success && Array.isArray(d.rows)) ? d.rows : []; }
        catch (e) { _tatRows[aud] = []; }
        // Only repaint if this drill-down is still the one on screen.
        if (_mrCtx && _mrCtx.tat && _mrCtx.tatAud === aud) { _mrRows = _tatRows[aud]; _mrRender(); }
      })
      .withFailureHandler(function() {
        _tatRows.loading[aud] = false;
        _tatRows[aud] = [];
        if (_mrCtx && _mrCtx.tat && _mrCtx.tatAud === aud) { _mrRows = []; _mrRender(); }
      })
      .getVerticalRows(key, JSON.stringify(f));
  }
}

function openModRecords(module) {
  if (module === 'osv') return openOsvRecords(null);
  var cfg = MR_MOD_CFG[module];
  if (!cfg) { openRecordsSheet(selectedAud || 'seller'); return; }
  var key = activeVertKey || selectedVert;
  var vcfg = getVertCfg().filter(function(c) { return c.key === key; })[0];
  var vertLabel = (vcfg && vcfg.name) || key || '';
  _mrCtx = { module: module, label: cfg.label, vertLabel: vertLabel, preStatus: cfg.preStatus, forceSeller: !!cfg.forceSeller, cfg: cfg };
  _mrRows = vertRows.slice();
  _mrF = { search:'', category:'All', vendor:'All', status:'All', gst:'All', state:'All', ageBucket:'All', transacted:'All', dateStart:'', dateEnd:'' };
  _mrSort = { key:'', dir:1 };
  _mrPg = { size:25, page:0 };
  if (cfg.isTxnView) {
    // Transacted-sellers view: show name, category, vendorType, state, txnCount, txnGmv, txnDate
    _mrColVis = { id:true, status:true, gstin:true, createdDate:true, tat:true, txn:true };
  } else {
    _mrColVis = { id:true };
    if (!cfg.showTxnF) _mrColVis['txn'] = true;
    // hide transacted-specific cols in all other modules
    _mrColVis['txnCount'] = true; _mrColVis['txnGmv'] = true; _mrColVis['txnDate'] = true;
  }
  var ovl = document.getElementById('mr-ovl');
  if (ovl) { ovl.classList.add('mr-open'); lockBodyScroll(); }
  _mrRender();
}

// A records drill-down open while vertRows reloads (period or audience change)
// would keep showing the previous period's rows. Re-snapshot and repaint the views
// that are backed by vertRows; the OSV and TAT views own their own datasets and are
// left alone. The overlay stays open throughout — only its data changes.
function _mrRefreshFromVertRows() {
  var ovl = document.getElementById('mr-ovl');
  if (!ovl || !ovl.classList.contains('mr-open') || !_mrCtx) return;
  if (_mrCtx.osv || _mrCtx.tat) return;
  _mrRows = Array.isArray(vertRows) ? vertRows.slice() : [];
  _mrPg.page = 0;          // the row set changed; page 2 of the old set is meaningless
  _mrRender();
}

function closeMr() {
  var ovl = document.getElementById('mr-ovl');
  if (ovl) ovl.classList.remove('mr-open');
  unlockBodyScroll();
  _mrMenuOpen = false;
  var cm = document.getElementById('mr-col-menu');
  if (cm) cm.style.display = 'none';
}

document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  var ovl = document.getElementById('mr-ovl');
  if (ovl && ovl.classList.contains('mr-open')) { e.stopPropagation(); closeMr(); }
});

// Coloured pill for an OSV state, matching the tile colours in the panel.
function _osvChip(status) {
  var c = status === 'verified'    ? { bg:'rgba(48,209,88,.15)',  fg:'#248A3D' }
        : status === 'in_progress' ? { bg:'rgba(245,158,11,.15)', fg:'#B45309' }
        :                            { bg:'var(--bg2)',           fg:'var(--txt3)' };
  return '<span class="km-vbadge" style="background:' + c.bg + ';color:' + c.fg + ';font-weight:600">'
    + esc(OSV_LABELS[status] || status || '—') + '</span>';
}

function _mrColSet() {
  if (_mrCtx && _mrCtx.stage) return MR_STAGE_COLS;
  if (_mrCtx && _mrCtx.aging) return MR_AGING_COLS;
  if (_mrCtx && _mrCtx.tat) return MR_TAT_COLS;
  return (_mrCtx && _mrCtx.osv) ? MR_OSV_COLS : MR_COLS;
}
function _mrVisibleCols() {
  return _mrColSet().filter(function(c) { return !_mrColVis[c.key]; });
}

function _mrRenderHeader() {
  var bc = document.getElementById('mr-breadcrumb');
  var tt = document.getElementById('mr-title');
  if (!_mrCtx) return;
  // Stage drill-downs merge both audiences, so naming one of them would be wrong.
  var audLbl = _mrCtx.stage ? 'Breakup'
             : (_mrCtx.forceSeller || selectedAud !== 'buyer') ? 'Sellers' : 'Buyers';
  if (bc) bc.textContent = _mrCtx.vertLabel + ' › ' + audLbl;
  if (_mrCtx.cfg && _mrCtx.cfg.isTxnView) {
    var txnRows = _mrRows.filter(function(r) { return r.hasTransacted; });
    var sumTxns = txnRows.reduce(function(s, r) { return s + (r.txnCount || 1); }, 0);
    var sumGmv  = txnRows.reduce(function(s, r) { return s + (r.txnValue  || 0); }, 0);
    if (tt) tt.textContent = _mrCtx.label + '  (' + fmt(txnRows.length) + ' unique sellers · ' + fmt(sumTxns) + ' txns · ' + fmtINR(sumGmv) + ' GMV)';
  } else if (_mrCtx.aging) {
    // Count the bucket, not the feed: _mrRows holds every row for the vertical, so
    // "source rows" here would contradict the number on the card that was clicked.
    var inBucket = _mrRows.filter(_mrPreFilter).length;
    if (tt) tt.textContent = _mrCtx.label + '  (' + fmt(inBucket) + ' seller' + (inBucket === 1 ? '' : 's') + ')';
  } else if (_mrCtx.stage) {
    // Same reason as ageing: the card's status gate, not the whole feed.
    var inStage = _mrRows.filter(_mrPreFilter).length;
    if (tt) tt.textContent = _mrCtx.label + '  (' + fmt(inStage) + ' record' + (inStage === 1 ? '' : 's') + ')';
  } else {
    if (tt) tt.textContent = _mrCtx.label + '  (' + fmt(_mrRows.length) + ' source rows)';
  }
}

function _mrUniq(field) {
  var seen = {}, out = [];
  _mrRows.forEach(function(r) { var v = r[field]; if (v && v !== '—' && !seen[v]) { seen[v]=1; out.push(v); } });
  return out.sort();
}

function _mrSel(id, label, opts, val, onchg) {
  var html = '<select class="filter-select" id="' + id + '" title="' + label + '" onchange="' + onchg + '">'
    + '<option value="All">All ' + label + '</option>'
    + opts.map(function(v){ return '<option value="' + esc(v) + '"' + (val === v ? ' selected':'') + '>' + esc(v) + '</option>'; }).join('')
    + '</select>';
  return html;
}

function _mrRenderFilters() {
  var el = document.getElementById('mr-filters');
  if (!el || !_mrCtx) return;
  var cfg = _mrCtx.cfg;
  var noStatus = !!_mrCtx.preStatus;

  // Stage (KPI card) drill-down: the card fixes the status, so that filter is
  // offered only for the all-status "Logged In" card.
  if (_mrCtx.stage) {
    el.innerHTML =
        '<input type="text" class="filter-input mr-search-inp" id="mr-search" placeholder="Search name, ID or GSTIN…" value="' + esc(_mrF.search) + '" oninput="mrSearchDeb()">'
      + _mrSel('mr-f-cat',  'Categories', _mrUniq('category'), _mrF.category, 'mrFChange()')
      + _mrSel('mr-f-user', 'User Types', ['Seller','Buyer'],  _mrF.userType, 'mrFChange()')
      + (_mrCtx.preStatus ? ''
          : _mrSel('mr-f-sta', 'Statuses', ['DRAFT','IN_REVIEW','COMPLETED','REJECTED'], _mrF.status, 'mrFChange()'))
      + '<button class="vd-close" onclick="mrFClear()" style="flex-shrink:0">Clear</button>';
    return;
  }
  if (_mrCtx.geoState) {
    el.innerHTML =
        '<input type="text" class="filter-input mr-search-inp" id="mr-search" placeholder="Search name, ID or GSTIN…" value="' + esc(_mrF.search) + '" oninput="mrSearchDeb()">'
      + '<button class="vd-close" onclick="mrFClear()" style="flex-shrink:0">Clear</button>';
    return;
  }
  if (_mrCtx.aging) {
    el.innerHTML =
        '<input type="text" class="filter-input mr-search-inp" id="mr-search" placeholder="Search seller, ID or GSTIN…" value="' + esc(_mrF.search) + '" oninput="mrSearchDeb()">'
      + _mrSel('mr-f-cat', 'Categories', _mrUniq('category'), _mrF.category, 'mrFChange()')
      + '<button class="vd-close" onclick="mrFClear()" style="flex-shrink:0">Clear</button>';
    return;
  }
  if (_mrCtx.tat) {
    el.innerHTML =
        '<input type="text" class="filter-input mr-search-inp" id="mr-search" placeholder="Search name or type…" value="' + esc(_mrF.search) + '" oninput="mrSearchDeb()">'
      + (_mrCtx.tatCat ? '' : _mrSel('mr-f-cat', 'Categories', _mrUniq('category'), _mrF.category, 'mrFChange()'))
      + _mrSel('mr-f-ven', 'Types', _mrUniq('vendorType'), _mrF.vendor, 'mrFChange()')
      + '<button class="vd-close" onclick="mrFClear()" style="flex-shrink:0">Clear</button>';
    return;
  }
  // OSV dataset has its own filter set — the onboarding filters (vendor type,
  // state, GST, transaction) don't exist on these rows.
  if (_mrCtx.osv) {
    var osvOpts = OSV_ORDER.filter(function(k) {
      return _mrRows.some(function(r) { return r.status === k; });
    }).map(function(k) { return OSV_LABELS[k]; });
    el.innerHTML =
        '<input type="text" class="filter-input mr-search-inp" id="mr-search" placeholder="Search vendor, ID or GSTIN…" value="' + esc(_mrF.search) + '" oninput="mrSearchDeb()">'
      + _mrSel('mr-f-osv',  'OSV Statuses',  osvOpts,               (OSV_LABELS[_mrF.osvStatus] || 'All'), 'mrFChange()')
      + _mrSel('mr-f-cat',  'Categories',    _mrUniq('category'),   _mrF.category, 'mrFChange()')
      + _mrSel('mr-f-vert', 'Verticals',     _mrUniq('vertical'),   _mrF.vertical, 'mrFChange()')
      + (_mrRows.some(function(r){ return r.assignedTo; })
          ? _mrSel('mr-f-asg', 'Users', _mrUniq('assignedTo'), _mrF.assigned, 'mrFChange()') : '')
      + '<input type="date" class="filter-select" id="mr-f-d1" title="Last updated from" value="' + esc(_mrF.dateStart) + '" onchange="mrFChange()" style="font-size:11px">'
      + '<input type="date" class="filter-select" id="mr-f-d2" title="Last updated to" value="' + esc(_mrF.dateEnd) + '" onchange="mrFChange()" style="font-size:11px">'
      + '<button class="vd-close" onclick="mrFClear()" style="flex-shrink:0">Clear</button>';
    return;
  }

  var html = '<input type="text" class="filter-input mr-search-inp" id="mr-search" placeholder="Search name, GSTIN or ID…" value="' + esc(_mrF.search) + '" oninput="mrSearchDeb()">'
    + _mrSel('mr-f-cat',   'Categories',  _mrUniq('category'),  _mrF.category,  'mrFChange()')
    + _mrSel('mr-f-ven',   'Vendor Types', _mrUniq('vendorType'), _mrF.vendor,  'mrFChange()')
    + (noStatus ? '' : _mrSel('mr-f-sta', 'Statuses', ['DRAFT','IN_REVIEW','COMPLETED','REJECTED'], _mrF.status, 'mrFChange()'))
    + _mrSel('mr-f-state', 'States',      _mrUniq('state'),     _mrF.state,     'mrFChange()')
    + _mrSel('mr-f-gst',   'GST',         ['Active','Inactive'], _mrF.gst,      'mrFChange()')
    + (cfg.showTxnF ? _mrSel('mr-f-txn', 'Transaction', ['Transacted','Non-Transacted'], _mrF.transacted, 'mrFChange()') : '')
    + '<input type="date" class="filter-select" id="mr-f-d1" title="From date" value="' + esc(_mrF.dateStart) + '" onchange="mrFChange()" style="font-size:11px">'
    + '<input type="date" class="filter-select" id="mr-f-d2" title="To date" value="' + esc(_mrF.dateEnd) + '" onchange="mrFChange()" style="font-size:11px">'
    + '<button class="vd-close" onclick="mrFClear()" style="flex-shrink:0">Clear</button>';
  el.innerHTML = html;
}

function _mrPreFilter(r) {
  if (!_mrCtx) return true;
  if (_mrCtx.stage) {
    // Stage cards count every record at that status across both audiences, so the
    // only gate here is the status the stage represents ("Logged In" has none).
    return !_mrCtx.preStatus || r.status === _mrCtx.preStatus;
  }
  if (_mrCtx.aging) {
    // Same predicate the card counted with, so the two can never diverge.
    return _mmAgingBucket(r) === _mrCtx.agingBucket;
  }
  if (_mrCtx.tat) {
    // Only onboarded vendors that actually carry a TAT — the same set the matrix
    // averaged, so the row count matches the n= on the cell that was clicked.
    if (r.status !== 'COMPLETED') return false;
    if (r.tat === null || r.tat === undefined || r.tat === '—' || isNaN(parseInt(r.tat, 10))) return false;
    if (_mrCtx.tatCat && r.category !== _mrCtx.tatCat) return false;
    return true;
  }
  if (_mrCtx.geoState) return true;
  if (_mrCtx.cfg && _mrCtx.cfg.isTxnView && !r.hasTransacted) return false;
  if (_mrCtx.preStatus && r.status !== _mrCtx.preStatus) return false;
  return true;
}

function _mrUserFilter(r) {
  var f = _mrF;
  if (_mrCtx && _mrCtx.stage) {
    if (f.category !== 'All' && r.category !== f.category) return false;
    if (f.userType !== 'All' && (r._aud === 'buyer' ? 'Buyer' : 'Seller') !== f.userType) return false;
    if (f.status   !== 'All' && r.status !== f.status) return false;
    var sq = (f.search || '').toLowerCase();
    if (sq && (r.name  || '').toLowerCase().indexOf(sq) === -1
           && (r.gstin || '').toLowerCase().indexOf(sq) === -1
           && String(r.id || '').toLowerCase().indexOf(sq) === -1) return false;
    return true;
  }
  if (_mrCtx && _mrCtx.aging) {
    if (f.category !== 'All' && r.category !== f.category) return false;
    var aq = (f.search || '').toLowerCase();
    if (aq && (r.name  || '').toLowerCase().indexOf(aq) === -1
           && (r.gstin || '').toLowerCase().indexOf(aq) === -1
           && String(r.id || '').toLowerCase().indexOf(aq) === -1) return false;
    return true;
  }
  if (_mrCtx && _mrCtx.tat) {
    if (f.category !== 'All' && r.category   !== f.category) return false;
    if (f.vendor   !== 'All' && r.vendorType !== f.vendor)   return false;
    var tq = (f.search || '').toLowerCase();
    if (tq && (r.name || '').toLowerCase().indexOf(tq) === -1
           && (r.vendorType || '').toLowerCase().indexOf(tq) === -1
           && String(r.id || '').toLowerCase().indexOf(tq) === -1) return false;
    return true;
  }
  if (_mrCtx && _mrCtx.geoState) {
    var gq = (f.search || '').toLowerCase();
    if (gq && (r.name  || '').toLowerCase().indexOf(gq) === -1
           && (r.gstin || '').toLowerCase().indexOf(gq) === -1
           && String(r.id || '').toLowerCase().indexOf(gq) === -1) return false;
    return true;
  }
  if (_mrCtx && _mrCtx.osv) {
    if (f.osvStatus !== 'All' && r.status !== f.osvStatus) return false;
    if (f.category  !== 'All' && r.category !== f.category) return false;
    if (f.vertical  !== 'All' && r.vertical !== f.vertical) return false;
    if (f.assigned  !== 'All' && r.assignedTo !== f.assigned) return false;
    if (f.dateStart || f.dateEnd) {
      var od = parseDMY(r.updatedDate);
      if (!od) return false;                       // undated rows drop out of a date range
      if (f.dateStart && od < new Date(f.dateStart)) return false;
      if (f.dateEnd   && od > new Date(f.dateEnd))   return false;
    }
    var oq = (f.search || '').toLowerCase();
    if (oq && (r.name       || '').toLowerCase().indexOf(oq) === -1
           && (r.gstin      || '').toLowerCase().indexOf(oq) === -1
           && (r.assignedTo || '').toLowerCase().indexOf(oq) === -1
           && String(r.id   || '').toLowerCase().indexOf(oq) === -1) return false;
    return true;
  }
  if (f.category !== 'All' && r.category !== f.category) return false;
  if (f.vendor   !== 'All' && r.vendorType !== f.vendor) return false;
  if (f.status   !== 'All' && r.status !== f.status) return false;
  if (f.gst === 'Active'   && !r.hasGST) return false;
  if (f.gst === 'Inactive' &&  r.hasGST) return false;
  if (f.state !== 'All' && r.state !== f.state) return false;
  if (f.transacted === 'Transacted'     && !r.hasTransacted) return false;
  if (f.transacted === 'Non-Transacted' &&  r.hasTransacted) return false;
  if (f.ageBucket !== 'All') {
    var ageD = _mrTxnAge(r);
    if (ageD === null) return false;
    if (f.ageBucket === '0–30 days'  && ageD > 30) return false;
    if (f.ageBucket === '31–60 days' && (ageD < 31 || ageD > 60)) return false;
    if (f.ageBucket === '60+ days'   && ageD <= 60) return false;
  }
  if (f.dateStart || f.dateEnd) {
    var isTxnV = _mrCtx && _mrCtx.cfg && _mrCtx.cfg.isTxnView;
    var dateStr = isTxnV ? (r.txnDate && r.txnDate !== '—' ? r.txnDate : null) : (r.onbDate || r.createdDate);
    var d = parseDMY(dateStr);
    if (!d) return false;
    if (f.dateStart && d < new Date(f.dateStart)) return false;
    if (f.dateEnd   && d > new Date(f.dateEnd))   return false;
  }
  var q = (f.search || '').toLowerCase();
  if (q && (r.name  || '').toLowerCase().indexOf(q) === -1
        && (r.gstin || '').toLowerCase().indexOf(q) === -1
        && String(r.id || '').toLowerCase().indexOf(q) === -1) return false;
  return true;
}

function _mrTxnAge(r) {
  var dateStr = r.txnDate && r.txnDate !== '—' ? r.txnDate : r.onbDate;
  var d = parseDMY(dateStr);
  if (!d) return null;
  return Math.max(0, Math.round((Date.now() - d.getTime()) / 86400000));
}

function _mrFilteredRows() {
  return _mrRows.filter(function(r) { return _mrPreFilter(r) && _mrUserFilter(r); });
}

// Sort value for an OSV row. Status sorts by workflow order (Done → In Progress →
// Not Initiated) rather than alphabetically, and dates sort chronologically.
function _osvSortVal(r, key) {
  if (key === 'osvStatus')  { var i = OSV_ORDER.indexOf(r.status); return i < 0 ? 99 : i; }
  if (key === 'updatedDate'){ var d = parseDMY(r.updatedDate); return d ? d.getTime() : 0; }
  return String(r[key] == null ? '' : r[key]).toLowerCase();
}

function _mrSortedRows(rows) {
  if (!_mrSort.key) return rows;
  var key = _mrSort.key, dir = _mrSort.dir;
  var isOsv = !!(_mrCtx && _mrCtx.osv);
  var isSimple = !!(_mrCtx && (_mrCtx.aging || _mrCtx.tat || _mrCtx.stage));
  function simpleVal(r, k) {
    if (k === 'vertical') return String(_mrCtx.vertName || '').toLowerCase();
    if (k === 'userType') return r._aud === 'buyer' ? 'buyer' : 'seller';
    return String(r[k] == null ? '' : r[k]).toLowerCase();
  }
  return rows.slice().sort(function(a, b) {
    var va = isOsv ? _osvSortVal(a, key) : (isSimple && key !== 'tat') ? simpleVal(a, key) : vdSortVal(a, key);
    var vb = isOsv ? _osvSortVal(b, key) : (isSimple && key !== 'tat') ? simpleVal(b, key) : vdSortVal(b, key);
    if (va < vb) return -dir;
    if (va > vb) return  dir;
    return 0;
  });
}

function _mrCellHtml(r, key) {
  if (_mrCtx && _mrCtx.stage) {
    switch (key) {
      case 'name':     return '<strong>' + esc(r.name || '—') + '</strong>'
                            + (r.id ? '<div style="font-size:10.5px;color:var(--txt3)">' + esc(r.id) + '</div>' : '');
      case 'vertical': return '<span class="td-dim">' + esc(_mrCtx.vertName || '—') + '</span>';
      case 'userType': return '<span class="km-vbadge" style="background:' + (r._aud === 'buyer' ? 'rgba(0,122,255,.10);color:#024C8A' : 'rgba(139,92,246,.12);color:#5B3FA8') + ';font-weight:600">'
                            + (r._aud === 'buyer' ? 'Buyer' : 'Seller') + '</span>';
      case 'category': return esc(r.category || '—');
      case 'gstin':    return r.gstin ? '<span class="gst-ok" style="font-size:10.5px">' + esc(r.gstin) + '</span>'
                                      : '<span class="td-dim">—</span>';
      case 'status':   return statusChip(r.status);
      default:         return esc(String(r[key] || '—'));
    }
  }
  if (_mrCtx && _mrCtx.aging) {
    switch (key) {
      case 'name':     return '<strong>' + esc(r.name || '—') + '</strong>'
                            + (r.id ? '<div style="font-size:10.5px;color:var(--txt3)">' + esc(r.id) + '</div>' : '');
      // Constant across the view — the feed is already scoped to one vertical.
      case 'vertical': return '<span class="td-dim">' + esc(_mrCtx.vertName || '—') + '</span>';
      case 'category': return esc(r.category || '—');
      case 'gstin':    return r.gstin
                            ? '<span class="gst-ok" style="font-size:10.5px">' + esc(r.gstin) + '</span>'
                            : '<span class="td-dim">—</span>';
      default:         return esc(String(r[key] || '—'));
    }
  }
  if (_mrCtx && _mrCtx.tat) {
    switch (key) {
      case 'name':       return '<strong>' + esc(r.name || '—') + '</strong>'
                              + (r.id ? '<div style="font-size:10.5px;color:var(--txt3)">' + esc(r.id) + '</div>' : '');
      case 'vendorType': return '<span class="td-dim">' + esc(r.vendorType || '—') + '</span>';
      case 'category':   return esc(r.category || '—');
      case 'tat':        return tatChip(r.tat);
      default:           return esc(String(r[key] || '—'));
    }
  }
  if (_mrCtx && _mrCtx.osv) {
    switch (key) {
      case 'name':      return '<strong>' + esc(r.name || 'Unknown') + '</strong>';
      case 'id':        return '<span style="font-size:11px;color:var(--txt3)">' + esc(r.id || '—') + '</span>';
      case 'gstin':     return r.gstin ? '<span class="gst-ok" style="font-size:10.5px">' + esc(r.gstin) + '</span>' : '<span class="td-dim">—</span>';
      case 'category':  return esc(r.category || '—');
      case 'vertical':  return '<span class="td-dim">' + esc(r.vertical || '—') + '</span>';
      case 'osvStatus': return _osvChip(r.status);
      case 'assignedTo':return r.assignedTo ? esc(r.assignedTo) : '<span class="td-dim">—</span>';
      case 'updatedDate':return '<span class="td-dim td-num">' + esc(r.updatedDate || '—') + '</span>';
      default:          return esc(String(r[key] || '—'));
    }
  }
  switch (key) {
    case 'name':        return '<strong>' + esc(r.name || '—') + '</strong><div style="font-size:10.5px;color:var(--txt3)">' + esc(r.id || '') + '</div>';
    case 'id':          return '<span style="font-size:11px;color:var(--txt3)">' + esc(r.id || '—') + '</span>';
    case 'category':    return esc(r.category || '—');
    case 'vendorType':  return '<span class="td-dim">' + esc(r.vendorType || '—') + '</span>';
    case 'status':      return statusChip(r.status);
    case 'state':       return '<span class="td-dim">' + esc(r.state || '—') + '</span>';
    case 'gstin':       return r.hasGST ? '<span class="gst-ok" style="font-size:10.5px">' + esc(r.gstin) + '</span>' : '<span class="gst-bad" style="font-size:10.5px">Missing</span>';
    case 'createdDate': return '<span class="td-dim td-num">' + esc(r.createdDate || '—') + '</span>';
    case 'onbDate':     return '<span class="td-dim td-num">' + esc(r.onbDate || '—') + '</span>';
    case 'tat':         return tatChip(r.tat);
    case 'txn':
      if (r.hasTransacted) return '<span class="mr-txn-chip">⚡ ' + (r.txnValue !== null ? fmtINR(r.txnValue) : 'Transacted') + '</span>';
      if (r.status === 'COMPLETED') return '<span class="mr-notxn-chip">Not yet</span>';
      return '<span class="td-dim">—</span>';
    case 'txnCount':
      return '<span style="font-weight:700;font-variant-numeric:tabular-nums;color:var(--txt)">' + fmt(r.txnCount || 1) + '</span>';
    case 'txnGmv':
      return r.txnValue > 0 ? '<span class="mr-txn-chip">⚡ ' + fmtINR(r.txnValue) + '</span>' : '<span class="td-dim">—</span>';
    case 'txnDate':
      return '<span class="td-dim td-num">' + esc(r.txnDate && r.txnDate !== '—' ? r.txnDate : '—') + '</span>';
    default: return esc(String(r[key] || '—'));
  }
}

function _mrRenderTable() {
  var allFiltered = _mrSortedRows(_mrFilteredRows());
  var total  = allFiltered.length;
  var pgSize = _mrPg.size;
  var pgMax  = Math.max(1, Math.ceil(total / pgSize));
  _mrPg.page = Math.max(0, Math.min(_mrPg.page, pgMax - 1));
  var start  = _mrPg.page * pgSize;
  var end    = Math.min(start + pgSize, total);
  var page   = allFiltered.slice(start, end);
  var cols   = _mrVisibleCols();

  // thead
  var thead = document.getElementById('mr-thead');
  if (thead) {
    thead.innerHTML = '<tr>' + cols.map(function(c) {
      var sortCls = _mrSort.key === c.key ? (' class="' + (_mrSort.dir === 1 ? 'sort-asc' : 'sort-desc') + '"') : '';
      return '<th' + sortCls + ' onclick="mrSortBy(\'' + c.key + '\')">' + esc(c.label) + '</th>';
    }).join('') + '</tr>';
  }

  // tbody
  var tbody = document.getElementById('mr-tbody');
  if (tbody) {
    _rmD = {}; _rmI = 0;
    if (!page.length) {
      var waiting = _mrCtx && _mrCtx.tat && _tatRows.loading[_mrCtx.tatAud];
      tbody.innerHTML = '<tr><td colspan="' + cols.length + '" class="mr-empty">'
        + (waiting ? 'Loading records…' : 'No records match the selected filters') + '</td></tr>';
    } else {
      // OSV rows come from the quality feed and carry none of the onboarding
      // fields openRecModal expects, so they are not click-through.
      var clickable = !(_mrCtx && (_mrCtx.osv || _mrCtx.aging || _mrCtx.tat || _mrCtx.stage));
      tbody.innerHTML = page.map(function(r) {
        var k = ++_rmI; _rmD[k] = r;
        return '<tr' + (clickable ? ' onclick="mrOpenRec(' + k + ')"' : ' style="cursor:default"') + '>'
          + cols.map(function(c) { return '<td>' + _mrCellHtml(r, c.key) + '</td>'; }).join('')
          + '</tr>';
      }).join('');
    }
  }

  // footer
  var foot = document.getElementById('mr-foot');
  if (foot) {
    var pgBtns = '<button class="mr-pg-btn" onclick="mrGoPg(' + (_mrPg.page - 1) + ')" ' + (_mrPg.page === 0 ? 'disabled' : '') + '>‹ Prev</button>';
    var half = 3, lo = Math.max(0, Math.min(_mrPg.page - half, pgMax - 2*half - 1));
    var hi = Math.min(pgMax, lo + 2*half + 1);
    if (lo > 0) pgBtns += '<button class="mr-pg-btn" onclick="mrGoPg(0)">1</button><span style="padding:0 3px;color:var(--txt3)">…</span>';
    for (var pi = lo; pi < hi; pi++) {
      pgBtns += '<button class="mr-pg-btn' + (pi === _mrPg.page ? ' pg-active' : '') + '" onclick="mrGoPg(' + pi + ')">' + (pi + 1) + '</button>';
    }
    if (hi < pgMax) pgBtns += '<span style="padding:0 3px;color:var(--txt3)">…</span><button class="mr-pg-btn" onclick="mrGoPg(' + (pgMax - 1) + ')">' + pgMax + '</button>';
    pgBtns += '<button class="mr-pg-btn" onclick="mrGoPg(' + (_mrPg.page + 1) + ')" ' + (_mrPg.page >= pgMax - 1 ? 'disabled' : '') + '>Next ›</button>';

    var isTxnV = _mrCtx && _mrCtx.cfg && _mrCtx.cfg.isTxnView;
    var isOsvV = !!(_mrCtx && _mrCtx.osv);
    var isTatV = !!(_mrCtx && _mrCtx.tat);
    var isAgeV = !!(_mrCtx && _mrCtx.aging);
    var isStgV = !!(_mrCtx && _mrCtx.stage);
    var countLabel = isTxnV ? 'sellers' : isOsvV ? 'vendors' : isAgeV ? 'sellers' : isStgV ? 'records'
                   : isTatV ? (_mrCtx.tatAud === 'buyer' ? 'buyers' : 'sellers') : 'records';
    var footExtra = '';
    if (isTxnV && total) {
      var sumTxnsF = allFiltered.reduce(function(s, r) { return s + (r.txnCount || 1); }, 0);
      var sumGmvF  = allFiltered.reduce(function(s, r) { return s + (r.txnValue  || 0); }, 0);
      footExtra = ' · ' + fmt(sumTxnsF) + ' txns · ' + fmtINR(sumGmvF) + ' GMV';
    }
    if (isTatV && total) {
      var tv = allFiltered.map(function(r) { return parseInt(r.tat, 10); })
                          .filter(function(x) { return !isNaN(x); });
      if (tv.length) {
        footExtra = ' · avg ' + Math.round(tv.reduce(function(a, b) { return a + b; }, 0) / tv.length) + 'd'
                  + ' · median ' + tv.slice().sort(function(a, b) { return a - b; })[Math.floor(tv.length / 2)] + 'd';
      }
    }
    if (isOsvV && total) {
      // Status mix of what is currently filtered, so the split is always visible.
      footExtra = ' · ' + OSV_ORDER.map(function(k) {
        return fmt(allFiltered.filter(function(r){ return r.status === k; }).length) + ' ' + OSV_LABELS[k];
      }).join(' · ');
    }
    foot.innerHTML = '<div class="mr-foot-count">'
        + (total ? fmt(start + 1) + '–' + fmt(end) + ' of ' + fmt(total) + ' ' + countLabel : 'No matching ' + countLabel)
        + (isTxnV ? '' : ' (total ' + fmt(_mrRows.length) + ')') + footExtra
        + '</div>'
      + '<div class="mr-pg-row">' + pgBtns + '</div>'
      + '<select class="mr-pg-size" onchange="mrSetPgSize(this.value)">'
        + [10,25,50,100].map(function(s){ return '<option value="' + s + '"' + (s === _mrPg.size ? ' selected':'') + '>' + s + '/page</option>'; }).join('')
      + '</select>';
  }
}

function mrOpenRec(k) { openRecModal(k); }

function mrSortBy(key) {
  if (_mrSort.key === key) _mrSort.dir = -_mrSort.dir;
  else _mrSort = { key:key, dir:1 };
  _mrPg.page = 0;
  _mrRenderTable();
}

function mrGoPg(p) {
  _mrPg.page = Math.max(0, p);
  _mrRenderTable();
}

function mrSetPgSize(s) {
  _mrPg.size = parseInt(s, 10) || 25;
  _mrPg.page = 0;
  _mrRenderTable();
}

function mrFChange() {
  function v(id) { var el = document.getElementById(id); return el ? el.value : 'All'; }
  if (_mrCtx && _mrCtx.stage) {
    _mrF.category = v('mr-f-cat');
    _mrF.userType = v('mr-f-user');
    if (!_mrCtx.preStatus) _mrF.status = v('mr-f-sta');
    _mrPg.page = 0; _mrRenderTable(); return;
  }
  if (_mrCtx && _mrCtx.aging) {
    _mrF.category = v('mr-f-cat');
    _mrPg.page = 0; _mrRenderTable(); return;
  }
  if (_mrCtx && _mrCtx.tat) {
    if (!_mrCtx.tatCat) _mrF.category = v('mr-f-cat');
    _mrF.vendor = v('mr-f-ven');
    _mrPg.page = 0;
    _mrRenderTable();
    return;
  }
  if (_mrCtx && _mrCtx.osv) {
    // The OSV select carries display labels; map back to the stored status key.
    var lbl = v('mr-f-osv');
    var key = 'All';
    for (var i = 0; i < OSV_ORDER.length; i++) { if (OSV_LABELS[OSV_ORDER[i]] === lbl) { key = OSV_ORDER[i]; break; } }
    _mrF.osvStatus = key;
    _mrF.category  = v('mr-f-cat');
    _mrF.vertical  = v('mr-f-vert');
    _mrF.assigned  = v('mr-f-asg');
    _mrF.dateStart = v('mr-f-d1');
    _mrF.dateEnd   = v('mr-f-d2');
    _mrPg.page = 0;
    _mrRenderTable();
    return;
  }
  _mrF.category  = v('mr-f-cat');
  _mrF.vendor    = v('mr-f-ven');
  _mrF.status    = v('mr-f-sta');
  _mrF.state     = v('mr-f-state');
  _mrF.gst       = v('mr-f-gst');
  _mrF.transacted = v('mr-f-txn');
  _mrF.ageBucket = v('mr-f-age');
  _mrF.dateStart = v('mr-f-d1');
  _mrF.dateEnd   = v('mr-f-d2');
  _mrPg.page = 0;
  _mrRenderTable();
}

var _mrSearchTimer;
function mrSearchDeb() {
  var el = document.getElementById('mr-search');
  _mrF.search = el ? el.value : '';
  clearTimeout(_mrSearchTimer);
  _mrSearchTimer = setTimeout(function() { _mrPg.page = 0; _mrRenderTable(); }, 280);
}

function mrFClear() {
  _mrF = { search:'', category:'All', vendor:'All', status:'All', gst:'All', state:'All',
           ageBucket:'All', transacted:'All', dateStart:'', dateEnd:'',
           osvStatus:'All', vertical:'All', assigned:'All' };
  _mrPg.page = 0;
  _mrRender();
}

function mrToggleColMenu() {
  _mrMenuOpen = !_mrMenuOpen;
  var el = document.getElementById('mr-col-menu');
  if (!el) return;
  el.style.display = _mrMenuOpen ? '' : 'none';
  if (_mrMenuOpen) _mrRenderColMenu();
}

function _mrRenderColMenu() {
  var el = document.getElementById('mr-col-menu');
  if (!el) return;
  el.innerHTML = _mrColSet().map(function(c) {
    var chk = !_mrColVis[c.key];
    return '<label class="mr-col-item">'
      + '<input type="checkbox"' + (chk ? ' checked' : '') + (c.always ? ' disabled' : '') + ' onchange="mrToggleCol(\'' + c.key + '\')">'
      + esc(c.label) + '</label>';
  }).join('');
}

function mrToggleCol(key) {
  _mrColVis[key] = !_mrColVis[key];
  _mrRenderTable();
}

function _mrRender() {
  _mrRenderHeader();
  _mrRenderFilters();
  _mrRenderTable();
}

function mrExportCSV() {
  var rows = _mrSortedRows(_mrFilteredRows());
  var cols = _mrVisibleCols();
  var lines = [cols.map(function(c){ return '"' + c.label + '"'; }).join(',')];
  var isOsvX = !!(_mrCtx && _mrCtx.osv);
  var isTatX = !!(_mrCtx && _mrCtx.tat);
  var isAgeX = !!(_mrCtx && _mrCtx.aging);
  var isStgX = !!(_mrCtx && _mrCtx.stage);
  rows.forEach(function(r) {
    lines.push(cols.map(function(c) {
      var v = '';
      if (isTatX) {
        v = c.key === 'tat' ? (r.tat === '—' || r.tat == null ? '' : String(r.tat))
                            : String(r[c.key] == null ? '' : r[c.key]);
        return '"' + v.replace(/"/g, '""') + '"';
      }
      if (isOsvX) {
        v = c.key === 'osvStatus' ? (OSV_LABELS[r.status] || r.status || '')
                                  : String(r[c.key] == null ? '' : r[c.key]);
        return '"' + v.replace(/"/g, '""') + '"';
      }
      if (isAgeX) {
        v = c.key === 'vertical' ? String(_mrCtx.vertName || '')
                                 : String(r[c.key] == null ? '' : r[c.key]);
        return '"' + v.replace(/"/g, '""') + '"';
      }
      if (isStgX) {
        v = c.key === 'vertical' ? String(_mrCtx.vertName || '')
          : c.key === 'userType' ? (r._aud === 'buyer' ? 'Buyer' : 'Seller')
          : c.key === 'status'   ? (STATUS_LABELS[r.status] || r.status || '')
          : String(r[c.key] == null ? '' : r[c.key]);
        return '"' + v.replace(/"/g, '""') + '"';
      }
      switch(c.key) {
        case 'name':        v = r.name || ''; break;
        case 'id':          v = r.id || ''; break;
        case 'category':    v = r.category || ''; break;
        case 'vendorType':  v = r.vendorType || ''; break;
        case 'status':      v = STATUS_LABELS[r.status] || r.status || ''; break;
        case 'state':       v = r.state || ''; break;
        case 'gstin':       v = r.hasGST ? (r.gstin || '') : 'Missing'; break;
        case 'createdDate': v = r.createdDate || ''; break;
        case 'onbDate':     v = r.onbDate || ''; break;
        case 'tat':         v = r.tat != null ? String(r.tat) : ''; break;
        case 'txn':         v = r.hasTransacted ? (r.txnValue !== null ? String(r.txnValue) : 'Transacted') : (r.status === 'COMPLETED' ? 'Not yet' : ''); break;
        case 'txnCount':    v = String(r.txnCount || 1); break;
        case 'txnGmv':      v = r.txnValue != null ? String(r.txnValue) : ''; break;
        case 'txnDate':     v = r.txnDate && r.txnDate !== '—' ? r.txnDate : ''; break;
        default:            v = String(r[c.key] || ''); break;
      }
      return '"' + v.replace(/"/g, '""') + '"';
    }).join(','));
  });
  var csv = lines.join('\n');
  try {
    var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = (_mrCtx ? _mrCtx.label.replace(/[^a-z0-9]/gi,'_') : 'records') + '_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) { /* fallback: copy to clipboard */ }
}
</script>
</body>
</html>
