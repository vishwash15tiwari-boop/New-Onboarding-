// Default (Sellers) vertical layout. Each audience/dataset may ship its own
// `verticalConfig` from the backend; when present it drives the cards instead,
// so Buyers can define an entirely different set of verticals.
var VERT_CFG = [
  { key:'OMP',           name:'Open Marketplace', sub:'', code:'OMP' },
  { key:'EPR',           name:'EPR',              sub:'', code:'EPR' },
  { key:'Marketplace',   name:'Marketplace',      sub:'', code:'MKT' },
  { key:'InfraBusiness', name:'Infra Business',   sub:'', code:'INF' },
  { key:'AFR',           name:'AFR',              sub:'', code:'AFR' },
  { key:'Recommerce',    name:'Re-Commerce',      sub:'', code:'REC' },
  { key:'DRS',           name:'DRS',              sub:'', code:'DRS' },
  { key:'Others',        name:'Others',           sub:'', code:'OTH' },
];

// Active vertical layout: backend-supplied config for this audience, else default.
function getVertCfg() {
  return (D && D.verticalConfig && D.verticalConfig.length) ? D.verticalConfig : VERT_CFG;
}

// ── Signature colour per vertical — the eight Recykal primary-palette hues.
//    c = accent · ink = darker text-safe variant of the same hue.
var VERT_COLORS = {
  OMP:           { c: '#005DFF', ink: '#024C8A' },   // Apple blue
  EPR:           { c: '#8460D4', ink: '#8944AB' },   // iOS purple
  Marketplace:   { c: '#8460D4', ink: '#3634A3' },   // iOS indigo
  InfraBusiness: { c: '#32ADE6', ink: '#0071A4' },   // iOS cyan
  AFR:           { c: '#1DC797', ink: '#248A3D' },   // iOS green
  Recommerce:    { c: '#00C7BE', ink: '#0C817B' },   // iOS mint
  DRS:           { c: '#A2845E', ink: '#7A6248' },   // iOS brown
  Others:        { c: '#8E8E93', ink: '#636366' },   // iOS gray
};
function hexRGBA(hex, a) {
  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
  if (!m) return 'rgba(0,0,0,' + a + ')';
  var n = parseInt(m[1], 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
// Inline CSS-variable pack for a vertical's signature colour.
function vcVars(key) {
  var vc = VERT_COLORS[key] || VERT_COLORS.Others;
  return '--vc:' + vc.c + ';--vc-ink:' + vc.ink
    + ';--vc-soft:' + hexRGBA(vc.c, .09)
    + ';--vc-line:' + hexRGBA(vc.c, .30)
    + ';--vc-fade:' + hexRGBA(vc.c, .25) + ';';
}

// ── Ambient aura — repaint the page's faint colour field to match the
//    active vertical (or GST orange). Registered @property colours make
//    the hue crossfade; older browsers simply snap.
function setAura(key) {
  var c = key === 'gst' ? '#FF9500' : ((VERT_COLORS[key] || VERT_COLORS.OMP).c);
  var rs = document.documentElement.style;
  rs.setProperty('--aura-a', hexRGBA(c, .13));
  rs.setProperty('--aura-b', hexRGBA(c, .07));
}
var selectedVert = null;
var activeVertKey = null;      // which vertical tab is currently active
var selectedAud  = 'seller';   // 'seller' | 'buyer' — which pipeline is shown in the detail section
var vertRows = [];          // lazily loaded rows for the open vertical
var vertRowsLoading = false;
var vertRowsError = null;   // backend error message when the last row fetch failed
var _vertRowsGen = 0;       // incremented on each loadVertRows call; stale callbacks are discarded
var _vertRowsPKey = null;   // period key when vertRows were last fetched; used to detect stale rows
var _ovnRows = {};          // per-audience row cache for the Existing/New modal {seller:[],buyer:[]}
var _ovnTbl  = { exnew:'', bs:'', cat:'', vtype:'', state:'', bv:'', status:'', q:'', dateFrom:'', dateTo:'', sk:'name', sd:1, pg:0, ps:25 };
var vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '', region: 'All', ratingMin: '', ratingMax: '' };
var vdSort = { key: '', dir: 1 };   // detail table sort state (dir: 1 asc, -1 desc)
var vdPage = 0;       // current page index (0-based) for the detail table
var vdPageSize = 50;  // rows per page
var qualityData    = null;   // result of getQualityData() — loaded once for OMP
var qualityLoading = false;
var VD_MAX_RENDER = 200;   // kept for board view compatibility
var KB_MAX_PER_COL = 50;   // cards rendered per Kanban column
var vdView = 'table';      // records view in the detail panel: 'table' only
var KB_COLS = [            // workflow order, left to right
  { key: 'DRAFT',     cls: 'draft'    },
  { key: 'IN_REVIEW', cls: 'review'   },
  { key: 'COMPLETED', cls: 'done'     },
  { key: 'REJECTED',  cls: 'rejected' },
];

// ── Pipeline stage palette — mirrors the CSS --st-* tokens, one set everywhere ──
var STAGE = {
  total:      { fill: 'var(--st-total)',      bg: 'var(--st-total-bg)',      tx: 'var(--st-total-tx)',      lbl: 'Logged In Cases' },
  draft:      { fill: 'var(--st-draft)',      bg: 'var(--st-draft-bg)',      tx: 'var(--st-draft-tx)',      lbl: 'Draft' },
  review:     { fill: 'var(--st-review)',     bg: 'var(--st-review-bg)',     tx: 'var(--st-review-tx)',     lbl: 'In Review' },
  onboarded:  { fill: 'var(--st-onboarded)',  bg: 'var(--st-onboarded-bg)',  tx: 'var(--st-onboarded-tx)',  lbl: 'Onboarded' },
  transacted: { fill: 'var(--st-transacted)', bg: 'var(--st-transacted-bg)', tx: 'var(--st-transacted-tx)', lbl: 'Transacted' },
  rejected:   { fill: 'var(--st-rejected)',   bg: 'var(--st-rejected-bg)',   tx: 'var(--st-rejected-tx)',   lbl: 'Rejected' },
};

// The four current-status segments that partition Total.
function stageSegs(v) {
  return [
    ['draft',     v.draft    || 0],
    ['review',    v.inReview || 0],
    ['onboarded', v.completed|| 0],
    ['rejected',  v.rejected || 0],
  ];
}

// Vertical card: one small stat card per pipeline stage (Draft / In Review /
// Onboarded / Rejected), each with its stage-colour accent.
function cardStats(v) {
  return '<div class="cc-stats">' + stageSegs(v).map(function(s) {
    var st = STAGE[s[0]];
    return '<div class="cc-stat" style="--st-c:' + st.fill + ';--st-bg:' + st.bg + ';--st-tx:' + st.tx + '">'
      + '<b>' + fmt(s[1]) + '</b><span>' + st.lbl + '</span></div>';
  }).join('') + '</div>';
}

// Compact year-wise breakdown table rendered inside the compare card.
function fyTable(v) {
  var rows = (v.fyBreakdown || []);
  if (!rows.length) return '';

  var hasTxn = rows.some(function(f) { return f.pctTransacted !== null || f.totalTxnValue !== null; });

  var thead = '<thead><tr>'
    + '<th style="text-align:left">FY</th>'
    + '<th>Total</th>'
    + '<th>Onboarded</th>'
    + (hasTxn ? '<th>Txn%</th><th>GMV</th>' : '')
    + '<th>Avg TAT</th>'
    + '</tr></thead>';

  var tbody = '<tbody>' + rows.map(function(f) {
    return '<tr>'
      + '<td>' + esc(f.fy) + '</td>'
      + '<td>' + fmt(f.total) + '</td>'
      + '<td>' + fmt(f.onboarded) + ' <span class="cfy-pct">(' + f.completionPct + '%)</span></td>'
      + (hasTxn
          ? '<td>' + (f.pctTransacted !== null ? f.pctTransacted + '%' : '—') + '</td>'
          + '<td class="cfy-gmv">' + (f.totalTxnValue !== null ? fmtINR(f.totalTxnValue) : '—') + '</td>'
          : '')
      + '<td class="cfy-tat">' + (f.avgTAT !== null ? f.avgTAT + 'd' : '—') + '</td>'
      + '</tr>';
  }).join('') + '</tbody>';

  return '<div class="cfy-wrap">'
    + '<div class="cfy-title">Year-wise</div>'
    + '<table class="cfy-table">' + thead + tbody + '</table>'
    + '</div>';
}

// Onboarded count per business category (top `max`, remainder rolled into
// "Others"). Shown in the detail panel. Green accent ties them to Onboarded.
var CARD_CAT_MAX = 8;
function cardCategories(v, max) {
  max = max || CARD_CAT_MAX;
  var cats = (v.categories || []).filter(function(c) { return (c.total || 0) > 0; });
  if (!cats.length) return '';
  if (cats.length > max) {
    var head = cats.slice(0, max - 1);
    var others = cats.slice(max - 1).reduce(function(a, c) {
      return { category: 'Others', onboarded: a.onboarded + (c.onboarded || 0), total: a.total + (c.total || 0) };
    }, { category: 'Others', onboarded: 0, total: 0 });
    head.push(others);
    cats = head;
  }
  return '<div class="cc-cats">' + cats.map(function(c, ci) {
    var n   = c.onboarded || 0;
    var tot = c.total     || 0;
    var pct = tot > 0 ? Math.round((n / tot) * 100) : 0;
    var catEsc = esc(c.category);
    var catJs  = c.category.replace(/'/g, "\\'");
    return '<div class="cc-cat cc-cat-click" role="button" tabindex="0" style="--kd:' + (ci * 40) + '"'
      + ' title="' + catEsc + ': ' + fmt(n) + ' onboarded of ' + fmt(tot) + ' · click to view records"'
      + ' onclick="filterByCategory(\'' + catJs + '\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();filterByCategory(\'' + catJs + '\')}">'
      + '<b>' + fmt(n) + '<i class="cc-cat-of">/ ' + fmt(tot) + '</i></b>'
      + '<span>' + catEsc + '</span>'
      + '<div class="cc-cat-meter"><div class="cc-cat-track"><div class="cc-cat-fill" style="width:' + pct + '%"></div></div><em>' + pct + '%</em></div>'
      + '</div>';
  }).join('') + '</div>';
}

// Shared funnel order — the meter bars and the 3D funnel render this exact
// sequence: Total Cases, then Onboarded, then the remaining stages by
// descending count (so the funnel narrows properly).
function funnelTiers(v) {
  var rest = [
    { k: 'draft',  n: v.draft    || 0 },
    { k: 'review', n: v.inReview || 0 },
  ];
  if (v.transacted !== null && v.transacted !== undefined) {
    rest.push({ k: 'transacted', n: v.transacted });
  }
  rest.sort(function(a, b) { return b.n - a.n; });
  return [{ k: 'total', n: v.total || 0, isTotal: true }, { k: 'onboarded', n: v.completed || 0 }].concat(rest);
}

// Detail funnel — Apple Activity-style concentric rings. One ring per stage,
// sweep proportional to its share of Total (12 o'clock, clockwise); Total sits
// in the centre. The legend carries the exact counts, so precision never
// depends on reading arc lengths. Ring order matches the 3D funnel.
function funnelBig(v, cfg) {
  var tot = v.total || 0;
  if (!tot) return '';

  // Outermost → innermost: Onboarded, then the rest of the pipeline by
  // descending count (same as funnelTiers), Rejected always innermost.
  var tiers = funnelTiers(v).filter(function(t) { return !t.isTotal; });
  tiers.push({ k: 'rejected', n: v.rejected || 0 });

  var S = 260, c0 = S / 2;            // svg size / centre
  var R0 = 112, RW = 14, RGAP = 4;    // outer radius, ring width, ring gap

  var rings = tiers.map(function(t, i) {
    var r = R0 - i * (RW + RGAP);
    if (r < 24) return '';            // never collide with the centre label
    var C = 2 * Math.PI * r;
    var frac = Math.max(0, Math.min(1, (t.n || 0) / tot));
    var st = STAGE[t.k];
    var track = '<circle cx="' + c0 + '" cy="' + c0 + '" r="' + r + '" fill="none"'
      + ' stroke="var(--bg2)" stroke-width="' + RW + '"/>';
    if (!frac) return track;
    // Floor tiny arcs at one ring-width so they read as arcs, never dots;
    // the legend + tooltip carry the exact value.
    var dash = Math.max(frac * C, RW);
    var arc = '<circle class="fring" cx="' + c0 + '" cy="' + c0 + '" r="' + r + '" fill="none"'
      + ' stroke="' + st.fill + '" stroke-width="' + RW + '" stroke-linecap="round"'
      + ' stroke-dasharray="' + dash.toFixed(2) + ' ' + C.toFixed(2) + '"'
      + ' transform="rotate(-90 ' + c0 + ' ' + c0 + ')"'
      + ' style="animation-delay:' + (120 + i * 110) + 'ms"'
      + '><title>' + st.lbl + ' — ' + fmt(t.n) + ' (' + Math.round(frac * 100) + '%)</title></circle>';
    return track + arc;
  }).join('');

  var centre = '<g class="donut-ctr">'
    + '<text x="' + c0 + '" y="' + (c0 - 2) + '" text-anchor="middle" font-family="Inter,sans-serif"'
    + ' font-size="23" font-weight="800" fill="var(--txt)">' + fmt(tot) + '</text>'
    + '<text x="' + c0 + '" y="' + (c0 + 13) + '" text-anchor="middle" font-family="Inter,sans-serif"'
    + ' font-size="8" font-weight="600" fill="var(--txt3)" letter-spacing="0.5">TOTAL CASES</text>'
    + '</g>';

  var svg = '<svg width="' + S + '" height="' + S + '" viewBox="0 0 ' + S + ' ' + S + '"'
    + ' style="flex-shrink:0;display:block" role="img" aria-label="Onboarding funnel rings">'
    + rings + centre + '</svg>';

  var legend = '<div class="fring-leg">'
    + [{ k: 'total', n: tot }].concat(tiers).map(function(t) {
        var st   = STAGE[t.k];
        var pc   = Math.round(((t.n || 0) / tot) * 100);
        var hero = t.k === 'onboarded';
        return '<div class="fring-leg-row' + (hero ? ' is-hero' : '') + '">'
          + '<span class="cc-dot" style="background:' + st.fill + '"></span>'
          + '<span class="fring-leg-lbl">' + st.lbl + '</span>'
          + '<span class="fring-leg-val">' + fmt(t.n) + '</span>'
          + '<span class="fring-leg-pct">(' + pc + '%)</span>'
          + '</div>';
      }).join('')
    + '</div>';

  return '<div class="fun-split">'
    + '<div class="fun-rings">' + svg + legend + '</div>'
    + '<div class="fun-3d">' + funnel3D(v) + '</div>'
    + '</div>';
}

// Small 3D funnel. Sequence: Total Cases, then Onboarded, then the remaining
// stages by descending count (so the funnel narrows properly). Each stage is a
// row: a centred 3D band (width ∝ its share of Total) beside a small detail
// card naming the stage and its count.
function funnel3D(v) {
  var tot = v.total || 0;
  if (!tot) return '';
  var tiers = funnelTiers(v);

  var BA = 178, cx = 89, FW = 166, ry = 6, y0 = 6, bandH = 28, y1 = y0 + bandH, vbH = 40;
  var scale = function(n) { return Math.min(FW, Math.max(28, FW * ((n || 0) / tot))); };

  // Shared cylindrical-sheen gradient, defined once for all band SVGs.
  var out = '<div class="f3d"><svg width="0" height="0" style="position:absolute" aria-hidden="true">'
    + '<defs><linearGradient id="f3d-cyl" x1="0" y1="0" x2="1" y2="0">'
    +   '<stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".40" stop-color="#fff" stop-opacity="0"/>'
    +   '<stop offset=".64" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>'
    + '</linearGradient></defs></svg>';

  out += tiers.map(function(t) {
    var w  = scale(t.n);
    var wB = w * 0.86;
    var col = STAGE[t.k].fill;
    var trap = 'M' + (cx - w / 2) + ' ' + y0 + ' L' + (cx + w / 2) + ' ' + y0
             + ' L' + (cx + wB / 2) + ' ' + y1 + ' L' + (cx - wB / 2) + ' ' + y1 + ' Z';
    var band = '<svg class="f3d-band-svg" viewBox="0 0 ' + BA + ' ' + vbH + '" role="img" aria-label="' + esc(STAGE[t.k].lbl) + '">'
      + '<path d="' + trap + '" fill="' + col + '"/>'
      + '<ellipse cx="' + cx + '" cy="' + y0 + '" rx="' + (w / 2).toFixed(1) + '" ry="' + ry + '" fill="' + col + '"/>'
      + '<ellipse cx="' + cx + '" cy="' + y0 + '" rx="' + (w / 2).toFixed(1) + '" ry="' + ry + '" fill="#fff" opacity=".26"/>'
      + '<path d="' + trap + '" fill="url(#f3d-cyl)"/>'
      + '<ellipse cx="' + cx + '" cy="' + y1 + '" rx="' + (wB / 2).toFixed(1) + '" ry="' + (ry * 0.78).toFixed(1) + '" fill="' + col + '"/>'
      + '<ellipse cx="' + cx + '" cy="' + y1 + '" rx="' + (wB / 2).toFixed(1) + '" ry="' + (ry * 0.78).toFixed(1) + '" fill="#000" opacity=".12"/>'
      + '</svg>';
    var card = '<div class="f3d-card"><span class="cc-dot" style="background:' + col + '"></span>'
      + '<span class="f3d-card-lbl">' + STAGE[t.k].lbl + '</span>'
      + '<span class="f3d-card-val">' + fmt(t.n) + '</span></div>';
    return '<div class="f3d-row">' + band + card + '</div>';
  }).join('');

  return out + '</div>';
}

// ═══════════════════════════════════════════════════════════════
// VERTICAL TAB NAVIGATION — new layout
// ═══════════════════════════════════════════════════════════════
function renderVerticals() {
  if (!DS || !DS.verticals) return;

  if (D && D.dataSource === 'empty') {
    var kEl = document.getElementById('vert-kpi-row');
    var pEl = document.getElementById('vert-pipeline-pair');
    var dEl = document.getElementById('vert-detail-section');
    if (kEl) kEl.innerHTML = '';
    if (pEl) pEl.innerHTML = '<div style="grid-column:1/-1;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:36px 32px;text-align:center;box-shadow:var(--shadow-sm)">'
      + '<div style="font-size:15px;font-weight:800;color:var(--red);margin-bottom:8px">⚠ Backend connected — but no data source is reachable</div>'
      + '<div style="font-size:12.5px;color:var(--txt2);max-width:640px;margin:0 auto 14px;line-height:1.7">The web app responded, but all three data paths came back empty. In the Apps Script editor, check in this order:'
      + '<ol style="text-align:left;margin:10px auto 0;max-width:560px;padding-left:22px">'
      + '<li>Run <b>setupMetabaseCredentials()</b> once (Metabase.gs) so live Metabase fetches can authenticate.</li>'
      + '<li>Run <b>syncAllOnboarding()</b>, then <b>setupMetabaseTrigger()</b> to create the <b>_mb_sellers</b> / <b>_mb_buyers</b> synced sheets.</li>'
      + '<li>If Metabase is unavailable, share the fallback Google Sheets with the account that deployed this web app.</li>'
      + '</ol></div>'
      + '<button onclick="loadData(false)" style="padding:9px 24px;border-radius:999px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-size:13px;font-weight:600;cursor:pointer">↻ Retry</button>'
      + '</div>';
    if (dEl) dEl.style.display = 'none';
    return;
  }

  // First render — initialize the active tab to the first vertical
  if (!activeVertKey) {
    var cfg0 = getVertCfg();
    activeVertKey = cfg0.length ? cfg0[0].key : 'OMP';
    selectedVert  = activeVertKey;
    selectedAud   = 'seller';
    vertRows = []; vertRowsLoading = true; vertRowsError = null;
    _ovnRows = {};
    _vertRowsPKey = null; ++_vertRowsGen;
    loadVertRows(activeVertKey);
  }

  renderVertTabBar();
  renderVertCtxHdr(activeVertKey);
  renderVertKPIs(activeVertKey);
  renderPipelinePair(activeVertKey);

  var detEl = document.getElementById('vert-detail-section');
  if (detEl) detEl.style.display = '';
  renderInlineDetail(activeVertKey);
}

function renderVertTabBar() {
  var bar = document.getElementById('vert-tabs-bar');
  if (!bar) return;
  var cfg = getVertCfg();
  bar.innerHTML = cfg.map(function(c) {
    var isActive = c.key === activeVertKey;
    return '<button class="vert-tab' + (isActive ? ' active' : '') + '"'
      + ' data-key="' + esc(c.key) + '"'
      + ' style="' + vcVars(c.key) + '"'
      + ' onclick="selectVertTab(\'' + c.key + '\')">'
      + esc(c.name)
      + '</button>';
  }).join('')
  + '<button class="vert-tab vert-tab-gst" onclick="switchView(\'gst\')">GST Payables</button>';
  positionVertThumb(false);
}

// ── Liquid tab thumb — the white pill that slides between vertical tabs.
//    Recreated on every bar re-render (innerHTML wipes it); positioned from
//    the active tab's box. animate=false snaps (first paint, resize, refresh).
function positionVertThumb(animate) {
  var bar = document.getElementById('vert-tabs-bar');
  if (!bar) return;
  var active = bar.querySelector('.vert-tab.active');
  var thumb  = bar.querySelector('.vert-tab-thumb');
  if (!active) { if (thumb) thumb.style.width = '0px'; return; }
  if (!active.offsetWidth) return;   // bar hidden (GST view) — keep last position
  if (!thumb) {
    thumb = document.createElement('div');
    thumb.className = 'vert-tab-thumb';
    bar.insertBefore(thumb, bar.firstChild);
  }
  bar.classList.add('has-thumb');
  var instant = animate === false || !motionOK();
  if (instant) thumb.style.transition = 'none';
  thumb.style.width = active.offsetWidth + 'px';
  thumb.style.transform = 'translateX(' + active.offsetLeft + 'px)';
  if (instant) requestAnimationFrame(function() { thumb.style.transition = ''; });
}
window.addEventListener('resize', function() { positionVertThumb(false); });
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function() { positionVertThumb(false); });
}

function renderVertCtxHdr(key) {
  var el = document.getElementById('vert-ctx-hdr');
  if (!el) return;
  if (currentView === 'gst' || !key) { el.innerHTML = ''; return; }
  var cfg = getVertCfg().filter(function(c) { return c.key === key; })[0];
  if (!cfg) { el.innerHTML = ''; return; }
  el.setAttribute('style', vcVars(key));
  el.innerHTML = '<span class="vert-ctx-code">' + esc(cfg.code || cfg.key) + '</span>'
    + '<span class="vert-ctx-name">' + esc(cfg.name) + '</span>';
}

function selectVertTab(key) {
  if (activeVertKey === key) return;
  activeVertKey = key;
  selectedVert  = key;
  // Reset rows — new vertical, fresh load
  vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '', region: 'All', ratingMin: '', ratingMax: '' }; vdPage = 0;
  vdSort = { key: '', dir: 1 };
  vertRows = []; vertRowsLoading = true; vertRowsError = null;
  _ovnRows = {};
  _vertRowsPKey = null; ++_vertRowsGen;
  // Update tab active states in-place (faster than full re-render)
  var actTab = null;
  document.querySelectorAll('.vert-tab[data-key]').forEach(function(t) {
    t.classList.toggle('active', t.dataset.key === key);
    if (t.dataset.key === key) { t.setAttribute('style', vcVars(key)); actTab = t; }
  });
  positionVertThumb(true);
  setAura(key);
  if (actTab && actTab.scrollIntoView) {
    try { actTab.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'nearest', inline: 'nearest' }); } catch (e) {}
  }
  renderVertCtxHdr(key);
  renderVertKPIs(key);
  renderPipelinePair(key);
  var detEl = document.getElementById('vert-detail-section');
  if (detEl) detEl.style.display = '';
  renderInlineDetail(key);
  loadVertRows(key);
}

// Merge seller+buyer FY breakdowns into one chronological series per metric.
function mergeFYSeries(vsF, vbF, field) {
  var m = {};
  (vsF || []).concat(vbF || []).forEach(function(f) {
    if (!f || !f.fy) return;
    if (m[f.fy] === undefined) m[f.fy] = null;
    if (f[field] != null) m[f.fy] = (m[f.fy] || 0) + f[field];
  });
  return Object.keys(m).sort().map(function(k) { return m[k]; });
}

// Mini FY bar sparkline — quiet bars, latest year in the accent colour.
function sparkBars(vals, accent, dark) {
  vals = (vals || []).filter(function(v) { return v != null; });
  if (vals.length < 2) return '';
  var max = Math.max.apply(null, vals);
  if (!(max > 0)) return '';
  var H = 26, bw = 9, gap = 5;
  var n = vals.length, W = n * bw + (n - 1) * gap;
  var base = dark ? 'rgba(255,255,255,.22)' : 'rgba(60,60,67,.18)';
  return '<svg class="vkpi-spark" viewBox="0 0 ' + W + ' ' + H + '" style="width:' + W + 'px" aria-hidden="true">'
    + vals.map(function(v, i) {
        var h = Math.max(3, Math.round((v / max) * H));
        var x = i * (bw + gap), y = H - h;
        return '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" rx="2.5" fill="' + (i === n - 1 ? accent : base) + '"/>';
      }).join('')
    + '</svg>';
}

function renderVertKPIs(key) {
  var el = document.getElementById('vert-kpi-row');
  if (!el) return;
  // Show skeleton KPI cards during first load when there's no cached data
  if (_dashLoading && !DS) {
    var skCard = '<div class="sk-kpi-card"></div>';
    el.classList.add('vkpi-grid-4');
    el.innerHTML = skCard + skCard + skCard + skCard;
    return;
  }
  var vs = (DS && DS.verticals || {})[key] || {};
  var vb = (DB && DB.verticals || {})[key] || {};
  var totalS = vs.total || 0, totalB = vb.total || 0;
  var compS  = vs.completed || 0, compB = vb.completed || 0;
  var txnS   = vs.transacted != null ? (vs.transacted || 0) : null;
  var txnB   = vb.transacted != null ? (vb.transacted || 0) : null;
  var txnTotal   = txnS != null ? (txnS || 0) : 0;
  var nonTxnTotal = Math.max(0, compS - txnTotal);
  var newS = vs.newVendors || 0, newB = vb.newVendors || 0;
  var oldS = vs.oldVendors || 0, oldB = vb.oldVendors || 0;
  var vars = vcVars(key);
  function sideRow(v, tag, clr) {
    return '<span class="vkpi-side-row">'
      + '<i class="vkpi-side-dot" style="background:' + clr + '"></i>'
      + '<b class="vkpi-side-num">' + v + '</b>'
      + '<em class="vkpi-side-tag">' + tag + '</em>'
      + '</span>';
  }
  // sides: [{val,tag,clr}] → renders as left column; big number anchors right.
  // sub: plain string shown below the value when no sides are given.
  // id: optional DOM id so cards can be patched after async data arrives.
  function mk(icon, lbl, val, sub, cls, action, id, note) {
    return '<div' + (id ? ' id="' + id + '"' : '') + ' class="vkpi-card' + (cls ? ' ' + cls : '') + '" style="' + vars + '"'
      + ' role="button" tabindex="0"'
      + ' onclick="openKpiModal(\'' + action + '\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openKpiModal(\'' + action + '\')}">'
      + '<div class="vkpi-lbl">' + lbl + '</div>'
      + '<div class="vkpi-val">' + val + '</div>'
      + (sub != null ? '<div class="vkpi-sub">' + (sub || '') + '</div>' : '')
      + _cfdHtml
      + '</div>';
  }
  function svg(paths) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
  }
  var icFunnel = svg('<path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/>');
  var icCheck  = svg('<circle cx="12" cy="12" r="8.4"/><path d="M8.6 12.4l2.4 2.4 4.4-5"/>');
  var icZap    = svg('<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>');
  var icUsers  = svg('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>');

  // FY sparklines from real breakdown data (skipped when <2 years exist)
  var spTotal = sparkBars(mergeFYSeries(vs.fyBreakdown, vb.fyBreakdown, 'total'),      'var(--vc, #005DFF)', false);
  var spOnb   = sparkBars(mergeFYSeries(vs.fyBreakdown, vb.fyBreakdown, 'onboarded'),  '#30D158', true);
  var spTxn   = sparkBars((vs.fyBreakdown || []).map(function(f){ return f.transacted != null ? f.transacted : null; }), 'var(--st-transacted)', false);

  // Completion meter on the ink card — onboarded share of the whole pipeline
  var totAll  = totalS + totalB;
  var compPct = totAll > 0 ? Math.round(((compS + compB) / totAll) * 100) : 0;
  var meter   = '<div class="vkpi-meter" title="' + compPct + '% of pipeline onboarded"><i style="width:' + compPct + '%"></i></div>';

  var S = '#1DC797', B = '#005DFF';
  var G2 = 'rgba(52,199,89,.38)', B2 = 'rgba(0,122,255,.38)';
  // Plastic vs Metal combined (S + B) per metric
  var PC = '#FF9F0A', MC = '#8E8E93';
  function matLine(p, m) {
    if (!p && !m) return '';
    return '<div class="vkpi-mat">'
      + '<span class="vkpi-mat-chip"><i class="vkpi-mat-dot" style="background:' + PC + '"></i>' + fmt(p) + ' plastic</span>'
      + '<span class="vkpi-mat-chip"><i class="vkpi-mat-dot" style="background:' + MC + '"></i>' + fmt(m) + ' metal</span>'
      + '</div>';
  }
  function matBracket(p, m) {
    if (!p && !m) return '';
    return '<span class="vkpi-mat-br">(' + p + 'P · ' + m + 'M)</span>';
  }
  var pTotal   = (vs.plasticTotal      || 0) + (vb.plasticTotal      || 0);
  var mTotal   = (vs.metalTotal        || 0) + (vb.metalTotal        || 0);
  var pOnb     = (vs.plasticOnboarded  || 0) + (vb.plasticOnboarded  || 0);
  var mOnb     = (vs.metalOnboarded    || 0) + (vb.metalOnboarded    || 0);
  var pTxn     = vs.plasticTransacted || 0;
  var mTxn     = vs.metalTransacted   || 0;
  var pNew     = (vs.plasticNew        || 0) + (vb.plasticNew        || 0);
  var mNew     = (vs.metalNew          || 0) + (vb.metalNew          || 0);

  var nonTxnSub   = nonTxnTotal > 0 ? '<div class="vkpi-sub">' + fmt(nonTxnTotal) + ' not yet</div>' : '';
  var oldTotalSub = '<div class="vkpi-sub">' + fmt(oldS + oldB) + ' existing</div>';
  var txnPct = compS > 0 ? Math.round(txnTotal / compS * 100) : 0;
  // Save snapshot so openKpiModal() can read it without recomputing
  window._kpiSnap = {
    key: key,
    totalS: totalS, totalB: totalB,
    compS: compS, compB: compB, compPct: compPct,
    txnS: txnS, txnB: txnB, txnTotal: txnTotal, txnPct: txnPct, nonTxnTotal: nonTxnTotal,
    txnUniqueTotal: vs.totalTxnCount || 0,
    newS: newS, oldS: oldS, newB: newB, oldB: oldB,
    vs: vs, vb: vb,
    pTotal: pTotal, mTotal: mTotal,
    pOnb: pOnb, mOnb: mOnb,
    pTxn: pTxn, mTxn: mTxn,
    pNew: pNew, mNew: mNew,
  };
  var cards = [
    mk(icFunnel, 'Logged In Cases', fmt(totalS + totalB), '<b>' + fmt(totalS) + '</b> sellers | <b>' + fmt(totalB) + '</b> buyers', 'vk-total',     'total',      null),
    mk(icCheck,  'Onboarded',   fmt(compS + compB),   '<b>' + fmt(compS) + '</b> sellers | <b>' + fmt(compB) + '</b> buyers',  'vk-onboarded', 'onboarded'),
    mk(icZap,    'Transacted',  fmt(txnTotal),         '<b>' + fmt(pTxn) + '</b> Plastic | <b>' + fmt(mTxn) + '</b> Metal', 'vk-transacted', 'transacted'),
  ];
  if (key === 'OMP') {
    var enTotal = (oldS + oldB) + (newS + newB);
    cards.push(mk(icUsers, 'Existing vs New', fmt(enTotal),
      fmt(oldS + oldB) + ' Existing vs ' + fmt(newS + newB) + ' New',
      'vk-oldvsnew', 'oldvsnew'));
  }
  // 3-card verticals use auto-fit; the 4-card OMP row uses an explicit grid
  // (class-driven, see .vkpi-grid-4) so it steps 4-up → 2×2 → 1-up and never
  // breaks to an unbalanced 3 + lone card at intermediate widths.
  el.style.gridTemplateColumns = '';
  el.classList.toggle('vkpi-grid-4', cards.length === 4);
  el.innerHTML = cards.join('');
  animateCounters(el);
}

function vkpiOpen(action) {
  var aud = selectedAud || 'seller';
  var detEl = document.getElementById('vert-detail-section');
  var rowsReady = vertRows.length > 0 && !vertRowsLoading;
  if (rowsReady && detEl) {
    vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '', region: 'All', ratingMin: '', ratingMax: '' }; vdPage = 0;
    ['vdf-category','vdf-vendor','vdf-status','vdf-gst'].forEach(function(id) {
      var e = document.getElementById(id); if (e) e.value = 'All';
    });
    var s = document.getElementById('vdf-search'); if (s) s.value = '';
    if (action === 'missing') {
      vdF.gst = 'Inactive';
      var e = document.getElementById('vdf-gst'); if (e) e.value = 'Inactive';
    } else if (action === 'onboarded') {
      vdF.status = 'COMPLETED';
      var e = document.getElementById('vdf-status'); if (e) e.value = 'COMPLETED';
    }
    renderVdRecords();
    detEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    setDetailAud(aud);
  }
}

function openKpiModal(cardId) {
  window._lastKpiCardId = cardId;
  if (cardId === 'transacted') { openTaModal(); return; }
  var d = window._kpiSnap;
  var isQualityCard = (cardId === 'rating' || cardId === 'osv' || cardId === 'docs');
  if (!d && !isQualityCard) return;
  var el = document.getElementById('km-pn');
  var modal = document.getElementById('kpi-modal');
  if (!el || !modal) return;

  var S = '#1DC797', B = '#005DFF';
  var PC = '#FF9F0A', MC = '#8E8E93';

  // ── layout primitives ────────────────────────────────────────
  function hero(num, lbl) {
    var text = String(num);
    var hasData = /[\d★%]/.test(text);
    return '<div class="km-hero">'
      + '<div class="km-hero-num"' + (!hasData ? ' style="font-size:20px;font-weight:400;letter-spacing:0;color:var(--txt3)"' : '') + '>' + text + '</div>'
      + '<div class="km-hero-lbl">' + lbl + '</div>'
      + '</div>';
  }
  function srow(items) {
    var cols = Math.min(items.length, 4);
    return '<div class="km-srow km-srow-' + cols + '">'
      + items.map(function(it) {
          return '<div class="km-s">'
            + '<div class="km-sv"' + (it.c ? ' style="color:' + it.c + '"' : '') + '>' + it.v + '</div>'
            + '<div class="km-sl">' + it.l + '</div>'
            + (it.s ? '<div class="km-sb">' + it.s + '</div>' : '')
            + '</div>';
        }).join('') + '</div>';
  }
  function sec(title, inner) {
    return '<div class="km-sec"><div class="km-sec-t">' + title + '</div>' + inner + '</div>';
  }
  function sbar(segs) {
    var tot = segs.reduce(function(a, s) { return a + s.w; }, 0);
    if (!tot) return '';
    return '<div class="km-sbar">'
      + segs.map(function(s) {
          return s.w > 0 ? '<div style="flex:' + s.w + ';background:' + s.color + '"></div>' : '';
        }).join('') + '</div>';
  }
  function sgrid(items, two) {
    return '<div class="km-sg' + (two ? ' km-sg-2' : '') + '">'
      + items.map(function(it) {
          return '<div class="km-sg-item">'
            + '<div class="km-sg-v">' + it.v + '</div>'
            + '<div class="km-sg-l"><i class="km-dot" style="background:' + it.c + '"></i>' + it.l + '</div>'
            + '</div>';
        }).join('') + '</div>';
  }
  function expandTileGrid(specs) {
    var gid = 'etg' + Math.random().toString(36).slice(2, 8);
    // Fill the row: N tiles → N equal columns (capped at 4) instead of always 4,
    // so a 2-tile grid (e.g. OSV Verified / Not Initiated) stretches full-width.
    var cols = Math.max(1, Math.min(specs.length, 4));
    var h = '<div class="km-sg" id="' + gid + '-g" style="grid-template-columns:repeat(' + cols + ',1fr)">'
      + specs.map(function(sp, si) {
          var vendors = sp.vendors || [];
          if (vendors.length === 0) {
            return '<div class="km-sg-item">'
              + '<div class="km-sg-v">' + sp.v + '</div>'
              + '<div class="km-sg-l"><i class="km-dot" style="background:' + sp.c + '"></i>' + sp.l + '</div>'
              + '</div>';
          }
          var tid = gid + '-p' + si;
          return '<div class="km-sg-item km-sg-xp" role="button" tabindex="0"'
            + ' onclick="_kmTileToggle(\'' + tid + '\',\'' + gid + '\',this)"'
            + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();_kmTileToggle(\'' + tid + '\',\'' + gid + '\',this)}">'
            + '<div class="km-sg-v">' + sp.v + '</div>'
            + '<div class="km-sg-l"><i class="km-dot" style="background:' + sp.c + '"></i>'
            + sp.l + ' <span class="km-star-arr">▶</span></div>'
            + '</div>';
        }).join('')
      + '</div>';
    specs.forEach(function(sp, si) {
      var vendors = sp.vendors || [];
      if (vendors.length === 0) return;
      var tid = gid + '-p' + si;
      h += '<div id="' + tid + '" class="km-tile-vlist" style="display:none">';
      var shown = vendors.slice(0, 60);
      h += shown.map(function(v) {
        if (sp.mode === 'osv') {
          var st   = v.status || 'not_initiated';
          var cBg  = st === 'done' ? 'rgba(29,199,151,.15)' : st === 'in_progress' ? 'rgba(228,136,0,.12)' : 'var(--bg2)';
          var cClr = st === 'done' ? '#0A7044'              : st === 'in_progress' ? '#7A4F00'              : 'var(--txt3)';
          var cLbl = st === 'done' ? 'Done'                 : st === 'in_progress' ? 'In Progress'          : 'Not Initiated';
          return '<div class="km-vrow" style="flex-wrap:wrap;gap:3px 6px;align-items:center">'
            + '<span class="km-vname" style="min-width:100px">' + esc(v.name || 'Unknown') + '</span>'
            + (v.gstin ? '<span class="km-vaud">' + esc(v.gstin) + '</span>' : '')
            + '<span class="km-vbadge" style="background:' + cBg + ';color:' + cClr + '">' + cLbl + '</span>'
            + (v.category ? '<span class="km-vbadge" style="background:rgba(0,122,255,.10);color:#024C8A;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(v.category) + '</span>' : '')
            + '</div>';
        }
        var vr = '<div class="km-vrow"' + (sp.mode === 'docs' && v.missingDocs && v.missingDocs.length ? ' style="flex-wrap:wrap;align-items:flex-start"' : '') + '>';
        if (v.id) vr += '<span class="km-vid">' + esc(v.id) + '</span>';
        vr += '<span class="km-vname">' + esc(v.name || 'Unknown') + '</span>';
        if (v.aud === 'seller' || v.aud === 'buyer') {
          var ac = v.aud === 'seller' ? '#3B82F6' : '#8B5CF6';
          vr += '<span class="km-vbadge" style="background:' + ac + '20;color:' + ac + '">' + (v.aud === 'seller' ? 'S' : 'B') + '</span>';
        }
        if (sp.mode === 'docs') {
          var docPct_ = v.total > 0 ? Math.round(v.submitted / v.total * 100) : 0;
          vr += '<span class="km-vaud" style="font-weight:600;color:var(--txt)">' + docPct_ + '%'
            + '<span style="font-weight:400;color:var(--txt3);font-size:9.5px;margin-left:3px">(' + (v.submitted || 0) + '/' + (v.total || 0) + ')</span>'
            + '</span>';
          if (v.missingDocs && v.missingDocs.length > 0) {
            vr += '<span class="km-vmissing">Missing: ' + esc(v.missingDocs.join(' · ')) + '</span>';
          }
        }
        vr += '</div>';
        return vr;
      }).join('');
      if (vendors.length > 60) {
        h += '<div class="km-vrow"><span class="km-vname" style="color:var(--txt3);font-size:10px">… and ' + (vendors.length - 60) + ' more</span></div>';
      }
      h += '</div>';
    });
    return h;
  }
  function matBadges(p, m) {
    if (!p && !m) return '';
    return '<div class="km-mat">'
      + '<div class="km-mb"><div class="km-mb-dot" style="background:' + PC + '"></div>'
      + '<div><div class="km-mb-v">' + fmt(p) + '</div><div class="km-mb-l">Plastic</div></div></div>'
      + '<div class="km-mb"><div class="km-mb-dot" style="background:' + MC + '"></div>'
      + '<div><div class="km-mb-v">' + fmt(m) + '</div><div class="km-mb-l">Metal</div></div></div>'
      + '</div>';
  }

  var content = '', title = '', subtitle = '', iconHtml = '';
  var vs = d ? d.vs : {}, vb = d ? d.vb : {};

  if (cardId === 'total') {
    title = 'Logged In Cases';
    subtitle = 'All pipeline entries across sellers & buyers';
    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>';
    var dComb = (vs.draft || 0) + (vb.draft || 0);
    var rComb = (vs.inReview || 0) + (vb.inReview || 0);
    var jComb = (vs.rejected || 0) + (vb.rejected || 0);
    content =
      hero(fmt(d.totalS + d.totalB), 'Logged In Cases')
      + srow([
          {v: fmt(d.totalS), l: 'Sellers', c: S},
          {v: fmt(d.totalB), l: 'Buyers',  c: B},
        ])
      + sec('Pipeline Status',
          sbar([
            {w: d.compS + d.compB, color: 'var(--st-onboarded)'},
            {w: dComb,             color: 'var(--st-draft)'},
            {w: rComb,             color: 'var(--st-review)'},
            {w: jComb,             color: 'var(--st-rejected)'},
          ])
          + sgrid([
              {v: fmt(d.compS + d.compB), l: 'Onboarded', c: 'var(--st-onboarded)'},
              {v: fmt(dComb),             l: 'Draft',      c: 'var(--st-draft)'},
              {v: fmt(rComb),             l: 'In Review',  c: 'var(--st-review)'},
              {v: fmt(jComb),             l: 'Rejected',   c: 'var(--st-rejected)'},
            ])
        )
      + (d.pTotal + d.mTotal > 0 ? sec('Material Mix', matBadges(d.pTotal, d.mTotal)) : '');

  } else if (cardId === 'onboarded') {
    title = 'Onboarded';
    subtitle = 'Vendors who completed onboarding';
    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M8.6 12.4l2.4 2.4 4.4-5"/></svg>';
    var tatS = vs.avgTAT != null ? vs.avgTAT + 'd avg TAT' : null;
    var tatB = vb.avgTAT != null ? vb.avgTAT + 'd avg TAT' : null;
    content =

    : (cardId !== 'transacted' && cardId !== 'oldvsnew' ? 'closeKpiModal();vkpiOpen(\'' + (cardId === 'onboarded' ? 'onboarded' : 'all') + '\')' : null);
  var footLabel  = isQuality ? 'View quality detail in pipeline cards ↓' : 'View vendor detail ↓';

  el.innerHTML =
    '<div class="km-head">'

function closeKpiModal() {

// ── GMV Category Analytics Drawer ────────────────────────────────────────────
// State: view ∈ 'list' | 'mat' | 'vendor'
var _gmvCat = { aud: 'seller', view: 'list', cat: null, mat: null, data: null };
var GMV_CAT_COLORS = {
  'Metal':   { bar: '#1DC797', badge: 'rgba(29,199,151,.15)',  text: '#0A7044' },
  'Plastic': { bar: '#E48800', badge: 'rgba(228,136,0,.12)',   text: '#7A4F00' },
};
function _gmvCatColor(cat) {
  return GMV_CAT_COLORS[cat] || { bar: '#636366', badge: 'rgba(99,99,102,.12)', text: '#636366' };
}

function _gmvCatBuildData(rows) {
  var catMap = {};
  (rows || []).forEach(function(r) {
    var cat  = (r.category  || 'Others').trim();
    var mat  = (r.vendorType || 'Unknown').trim() || 'Unknown';
    var txnV = r.txnValue  != null ? Number(r.txnValue)  : 0;
    var txnC = r.txnCount  != null ? Number(r.txnCount)  : (txnV > 0 ? 1 : 0);
    if (!catMap[cat]) catMap[cat] = { category: cat, txnValue: 0, txnCount: 0, vendorCount: 0, transactedCount: 0, mats: {}, vendors: [] };
    var cs = catMap[cat];
    cs.txnValue += txnV; cs.txnCount += txnC; cs.vendorCount++;
    if (r.hasTransacted) cs.transactedCount++;
    cs.vendors.push(r);
    if (!cs.mats[mat]) cs.mats[mat] = { material: mat, txnValue: 0, txnCount: 0, vendorCount: 0, transactedCount: 0, vendors: [] };
    var ms = cs.mats[mat];
    ms.txnValue += txnV; ms.txnCount += txnC; ms.vendorCount++;
    if (r.hasTransacted) ms.transactedCount++;
    ms.vendors.push(r);
  });
  return Object.keys(catMap).map(function(k) {
    var c = catMap[k];
    c.materials = Object.keys(c.mats).map(function(m) { return c.mats[m]; })
      .sort(function(a, b) { return b.txnValue - a.txnValue || b.vendorCount - a.vendorCount; });
    return c;
  }).sort(function(a, b) { return b.txnValue - a.txnValue || b.vendorCount - a.vendorCount; });
}

function _gmvAudToggleHtml(aud) {
  return '<div class="gmc-aud-toggle">'
    + '<button class="gmc-aud-btn' + (aud === 'seller' ? ' active' : '') + '" onclick="_gmvCatSetAud(\'seller\')">Sellers</button>'
    + '<button class="gmc-aud-btn' + (aud === 'buyer'  ? ' active' : '') + '" onclick="_gmvCatSetAud(\'buyer\')">Buyers</button>'
    + '</div>';
}

function _gmvCatNavigate(view, cat, mat) {
  _gmvCat.view = view;
  _gmvCat.cat  = cat || null;
  _gmvCat.mat  = mat || null;
  _gmvCatRender();
}

function _gmvCatSetAud(aud) {
  if (aud === _gmvCat.aud) return;
  _gmvCat.aud  = aud;
  _gmvCat.view = 'list';
  _gmvCat.cat  = null;
  _gmvCat.mat  = null;
  _gmvCat.data = null;
  // Rebuild from vertRows if audience matches, else fetch
  if (aud === selectedAud && Array.isArray(vertRows) && vertRows.length) {
    _gmvCat.data = _gmvCatBuildData(vertRows);
    _gmvCatRender();
    return;
  }
  var key = activeVertKey || selectedVert;
  if (!key) { _gmvCatRender(); return; }
  var el = document.getElementById('km-pn');
  if (el) {
    var total0 = (_gmvCat.data || []).reduce(function(s, c) { return s + c.txnValue; }, 0);
    el.innerHTML = _gmvCatHeadHtml(aud, total0) + _gmvAudToggleHtml(aud)
      + '<div style="padding:32px 18px;text-align:center;color:var(--txt3);font-size:13px">Loading…</div>';
  }
  var f = { audience: aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!document.getElementById('kpi-modal').classList.contains('km-open')) return;
      try {
        var d = JSON.parse(res);
        if (d.success && Array.isArray(d.rows)) _gmvCat.data = _gmvCatBuildData(d.rows);
      } catch(e) {}
      _gmvCatRender();
    })
    .withFailureHandler(function() { _gmvCatRender(); })
    .getVerticalRows(key, JSON.stringify(f));
}

  var audLbl = aud === 'seller' ? 'Sellers' : 'Buyers';

function _gmvCatRender() {

  } else if (view === 'vendor') {
    var cd2 = data.find(function(c) { return c.category === _gmvCat.cat; });
    var md  = cd2 && cd2.materials.find(function(m) { return m.material === _gmvCat.mat; });
    body = md ? _gmvBodyVendors(cd2, md) : '<div style="padding:28px 18px;text-align:center;color:var(--txt3)">No vendors found</div>';

function openGmvCatModal(aud) {
  _gmvCat.aud  = aud || 'seller';
  _gmvCat.view = 'list';
  _gmvCat.cat  = null;
  _gmvCat.mat  = null;
  _gmvCat.data = null;

  // Best source: per-vendor rows already loaded for this audience
  if (_gmvCat.aud === selectedAud && Array.isArray(vertRows) && vertRows.length) {
    _gmvCat.data = _gmvCatBuildData(vertRows);
    _gmvCatRender();
    return;
  }

  // Fallback: server category summary (has txnValue but no material GMV)
  var rawCats = ((window._gmvCats || {})[_gmvCat.aud] || [])
    .filter(function(c) { return c.txnValue != null && c.txnValue > 0; });
  if (rawCats.length) {
    _gmvCat.data = rawCats.map(function(c) {
      var mats = (c.vendorTypes || []).map(function(vt) {
        return { material: vt.type, txnValue: 0, txnCount: 0, vendorCount: vt.count || 0, transactedCount: vt.transacted || 0, vendors: [] };
      });
      return { category: c.category, txnValue: c.txnValue || 0, txnCount: 0, vendorCount: c.total || 0, transactedCount: c.transacted || 0, materials: mats, vendors: [] };
    }).sort(function(a, b) { return b.txnValue - a.txnValue; });
    _gmvCatRender();
    return;
  }

  // Fetch on demand
  var key = activeVertKey || selectedVert;
  var el  = document.getElementById('km-pn');
  var modal = document.getElementById('kpi-modal');
  if (!el || !modal || !key) { _gmvCatRender(); return; }

  el.innerHTML = _gmvCatHeadHtml(_gmvCat.aud, 0) + _gmvAudToggleHtml(_gmvCat.aud)
    + '<div style="padding:32px 18px;text-align:center;color:var(--txt3);font-size:13px">Loading…</div>';
  modal.classList.add('km-open');
  document.addEventListener('keydown', _kpiEsc);

  var f = { audience: _gmvCat.aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!document.getElementById('kpi-modal').classList.contains('km-open')) return;
      try {
        var d = JSON.parse(res);
        if (d.success && Array.isArray(d.rows)) _gmvCat.data = _gmvCatBuildData(d.rows);
      } catch(e) {}
      _gmvCatRender();
    })
    .withFailureHandler(function() { _gmvCatRender(); })
    .getVerticalRows(key, JSON.stringify(f));
}

// Load rows for `aud` in the background and re-render the open KPI modal when done.
// Called by the "Load Buyers/Sellers detail" button inside the modal tiles.
function _kvnLoadAud(aud) {
  selectedAud = aud;
  vertRows = []; vertRowsLoading = true; vertRowsError = null;
  var myGen = ++_vertRowsGen;
  var key = activeVertKey || selectedVert;
  if (!key) return;
  var f = { audience: aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  var myPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var lsVKey = STORE_PFX + 'vr_' + aud + '_' + key;
  // SWR: serve from localStorage immediately, then refresh from server
  var swrDone = false;
  try {
    var sv = JSON.parse(localStorage.getItem(lsVKey) || 'null');
    if (sv && sv.pKey === myPKey && Array.isArray(sv.rows)) {
      vertRows = sv.rows; vertRowsLoading = false; swrDone = true;
      if (window._lastKpiCardId) openKpiModal(window._lastKpiCardId);
    }
  } catch (e) {}
  if (!swrDone) {
    // Show "Loading…" inside any currently-open tile panels while we wait
    var pn = document.getElementById('km-pn');
    if (pn) {
      var pvs = pn.querySelectorAll('.km-tile-vlist');
      for (var pi = 0; pi < pvs.length; pi++) {
        if (pvs[pi].style.display !== 'none') {
          pvs[pi].innerHTML = '<div style="padding:12px 4px;text-align:center;color:var(--txt3);font-size:11px">Loading…</div>';
        }
      }
    }
  }
  google.script.run
    .withSuccessHandler(function(res) {
      if (myGen !== _vertRowsGen) return;
      vertRowsLoading = false;
      try {
        var data = JSON.parse(res);
        if (data.success) {
          vertRows = data.rows || [];
          try { localStorage.setItem(lsVKey, JSON.stringify({ pKey: myPKey, rows: data.rows || [] })); } catch (e) {}
        }
      } catch (e) {}
      if (window._lastKpiCardId) openKpiModal(window._lastKpiCardId);
    })
    .withFailureHandler(function() {
      if (myGen !== _vertRowsGen) return;
      vertRowsLoading = false;
      if (window._lastKpiCardId) openKpiModal(window._lastKpiCardId);
    })
    .getVerticalRows(key, JSON.stringify(f));
}

// Load rows for `aud` into _ovnRows[aud] (per-audience cache for Existing/New modal).
// Reuses the same localStorage key as _kvnLoadAud for zero-cost SWR hits.
function _ovnEnsureAud(aud) {
  if (_ovnRows[aud] !== undefined) return; // already loaded or in-flight
  _ovnRows[aud] = null; // mark as in-flight
  var key = activeVertKey || selectedVert;
  if (!key) return;
  var f = { audience: aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  var myPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var lsVKey = STORE_PFX + 'vr_' + aud + '_' + key;
  try {
    var sv = JSON.parse(localStorage.getItem(lsVKey) || 'null');
    if (sv && sv.pKey === myPKey && Array.isArray(sv.rows)) {
      _ovnRows[aud] = sv.rows;
      if (window._lastKpiCardId === 'oldvsnew' || window._lastKpiCardId === 'transacted') openKpiModal(window._lastKpiCardId);
      return;
    }
  } catch (e) {}
  google.script.run
    .withSuccessHandler(function(res) {
      try {
        var data = JSON.parse(res);
        _ovnRows[aud] = data.success ? (data.rows || []) : [];
        try { localStorage.setItem(lsVKey, JSON.stringify({ pKey: myPKey, rows: _ovnRows[aud] })); } catch (e) {}
      } catch (e) { _ovnRows[aud] = []; }
      if (window._lastKpiCardId === 'oldvsnew' || window._lastKpiCardId === 'transacted') openKpiModal(window._lastKpiCardId);
    })
    .withFailureHandler(function() {
      _ovnRows[aud] = [];
      if (window._lastKpiCardId === 'oldvsnew' || window._lastKpiCardId === 'transacted') openKpiModal(window._lastKpiCardId);
    })
    .getVerticalRows(key, JSON.stringify(f));
}

// ── OVN enterprise table helpers ─────────────────────────────────────────────
function _ovnTblSetFilter(k, v) { _ovnTbl[k] = v; _ovnTbl.pg = 0; openKpiModal('oldvsnew'); }
function _ovnTblSearch(v)       { _ovnTbl.q  = v; _ovnTbl.pg = 0; openKpiModal('oldvsnew'); }
function _ovnTblSort(k) {
  if (_ovnTbl.sk === k) _ovnTbl.sd = -_ovnTbl.sd; else { _ovnTbl.sk = k; _ovnTbl.sd = 1; }
  openKpiModal('oldvsnew');
}
function _ovnTblSetPage(pg)    { _ovnTbl.pg = pg; openKpiModal('oldvsnew'); }
function _ovnTblSetPageSize(ps){ _ovnTbl.ps = ps; _ovnTbl.pg = 0; openKpiModal('oldvsnew'); }
function _ovnTblClear() {
  var ps = _ovnTbl.ps;
  _ovnTbl = { exnew:'', bs:'', cat:'', vtype:'', state:'', bv:'', status:'', q:'', dateFrom:'', dateTo:'', sk:'name', sd:1, pg:0, ps:ps };
  openKpiModal('oldvsnew');
}

function _ovnBuildContent() {
  var selRows = Array.isArray(_ovnRows.seller) ? _ovnRows.seller.map(function(r) { var c = {}; for (var k in r) c[k] = r[k]; c._aud = 'seller'; return c; }) : null;
  var buyRows = Array.isArray(_ovnRows.buyer)  ? _ovnRows.buyer.map(function(r)  { var c = {}; for (var k in r) c[k] = r[k]; c._aud = 'buyer';  return c; }) : null;
  var loading = selRows === null || buyRows === null;
  var allRows = loading ? [] : selRows.concat(buyRows).filter(function(r) {
    return r.status === 'COMPLETED' && _isValidRec(r);
  });

  function uniq(fn) {
    var seen = {}, out = [];
    allRows.forEach(function(r) { var v = fn(r); if (v && !seen[v]) { seen[v] = 1; out.push(v); } });
    return out.sort();
  }
  var vtypes   = uniq(function(r) { return r.vendorType; });
  var states   = uniq(function(r) { return r.state; });
  var bvList   = uniq(function(r) { return r.vertical || 'OMP'; });
  var statuses = uniq(function(r) { return r.status; });
  var cats     = uniq(function(r) { return r.category; });

  var t    = _ovnTbl;
  var qLow = (t.q || '').toLowerCase();
  var df   = t.dateFrom ? new Date(t.dateFrom).getTime()          : 0;
  var dt2  = t.dateTo   ? new Date(t.dateTo + 'T23:59:59').getTime() : 0;

  var filtered = allRows.filter(function(r) {
    if (t.bs && r._aud !== t.bs) return false;
    if (t.exnew === 'existing' && !r.isOldVendor) return false;
    if (t.exnew === 'new'      &&  r.isOldVendor) return false;
    if (t.cat    && r.category    !== t.cat)    return false;
    if (t.vtype  && r.vendorType  !== t.vtype)  return false;
    if (t.state  && r.state       !== t.state)  return false;
    if (t.bv     && (r.vertical || 'OMP') !== t.bv) return false;
    if (t.status && r.status      !== t.status) return false;
    if (qLow) {
      var nm = (r.name || '').toLowerCase(), id2 = (r.id || '').toLowerCase();
      if (nm.indexOf(qLow) < 0 && id2.indexOf(qLow) < 0) return false;
    }
    if (df || dt2) {
      var rd = r.onbDate && r.onbDate !== '—' ? new Date(r.onbDate).getTime() : 0;
      if (df  && rd && rd < df)  return false;
      if (dt2 && rd && rd > dt2) return false;
    }
    return true;
  });

  var sk = t.sk, sd = t.sd;
  var sorted = filtered.slice().sort(function(a, b) {
    if (sk === 'exnew')   return sd * ((a.isOldVendor ? 1 : 0) - (b.isOldVendor ? 1 : 0));
    if (sk === 'onbDate') {
      var an = (a.onbDate && a.onbDate !== '—') ? new Date(a.onbDate).getTime() : 0;
      var bn = (b.onbDate && b.onbDate !== '—') ? new Date(b.onbDate).getTime() : 0;
      return sd * (an - bn);
    }
    var av = String(sk === 'bs' ? a._aud : sk === 'bv' ? (a.vertical||'OMP') : sk === 'vtype' ? (a.vendorType||'') : sk === 'cat' ? (a.category||'') : sk === 'state' ? (a.state||'') : sk === 'status' ? (a.status||'') : sk === 'id' ? (a.id||'') : (a.name||''));
    var bv2 = String(sk === 'bs' ? b._aud : sk === 'bv' ? (b.vertical||'OMP') : sk === 'vtype' ? (b.vendorType||'') : sk === 'cat' ? (b.category||'') : sk === 'state' ? (b.state||'') : sk === 'status' ? (b.status||'') : sk === 'id' ? (b.id||'') : (b.name||''));
    return sd * av.localeCompare(bv2);
  });

  var cExist = 0, cNew = 0, cMetal = 0, cPlastic = 0;
  filtered.forEach(function(r) {
    if (r.isOldVendor) cExist++; else cNew++;
    if (r.category === 'Metal') cMetal++;
    if (r.category === 'Plastic') cPlastic++;
  });

  function chip(n, lbl, col) {
    return '<div class="ovn-chip">'
      + '<span class="ovn-chip-n"' + (col ? ' style="color:' + col + '"' : '') + '>' + fmt(n) + '</span>'
      + '<span class="ovn-chip-l">' + lbl + '</span></div>';
  }
  var chipsHtml = '<div class="ovn-chips">'
    + chip(filtered.length, 'Total')
    + chip(cExist, 'Existing', 'var(--txt2)')
    + chip(cNew,   'New',      '#1DC797')
    + chip(cMetal, 'Metal',    '#636366')
    + chip(cPlastic,'Plastic', '#E48800')
    + '</div>';

  function selEl(key, opts, placeholder) {
    var cur = t[key] || '';
    var h = '<select class="ovn-sel" onchange="_ovnTblSetFilter(\'' + key + '\',this.value)">';
    h += '<option value="">' + placeholder + '</option>';
    opts.forEach(function(o) {
      h += '<option value="' + esc(o) + '"' + (cur === o ? ' selected' : '') + '>' + esc(o) + '</option>';
    });
    return h + '</select>';
  }

  var hasF = t.exnew || t.bs || t.cat || t.vtype || t.state || t.bv || t.status || t.q || t.dateFrom || t.dateTo;
  var filterBar = '<div class="ovn-filters">'
    + selEl('exnew',  ['new', 'existing'],                'Existing/New')
    + selEl('bs',     ['seller', 'buyer'],                 'Buyer/Seller')
    + selEl('cat',    cats.length ? cats : ['Metal','Plastic'], 'Category')
    + selEl('vtype',  vtypes,                              'Vendor Type')
    + selEl('state',  states,                              'State')
    + selEl('bv',     bvList.length ? bvList : ['OMP'],   'Business Vertical')
    + selEl('status', statuses,                            'Status')
    + '<input type="text" class="ovn-srch" placeholder="Search name / ID…"'
    +   ' value="' + esc(t.q || '') + '" oninput="_ovnTblSearch(this.value)">'
    + '<input type="date" class="ovn-date" title="Onb date from"'
    +   ' value="' + esc(t.dateFrom || '') + '" onchange="_ovnTblSetFilter(\'dateFrom\',this.value)">'
    + '<input type="date" class="ovn-date" title="Onb date to"'
    +   ' value="' + esc(t.dateTo || '') + '" onchange="_ovnTblSetFilter(\'dateTo\',this.value)">'
    + (hasF ? '<button class="ovn-clr-btn" onclick="_ovnTblClear()">Clear</button>' : '')
    + '</div>';

  function th(key, lbl) {
    var cls = sk === key ? (sd > 0 ? ' class="ovn-sk-asc"' : ' class="ovn-sk-desc"') : '';
    return '<th' + cls + ' onclick="_ovnTblSort(\'' + key + '\')">' + lbl + '</th>';
  }

  var ps   = t.ps || 25;
  var pg   = t.pg || 0;
  var tot  = sorted.length;
  var pgs  = Math.max(1, Math.ceil(tot / ps));
  if (pg >= pgs) pg = pgs - 1;
  var s0   = pg * ps, s1 = Math.min(s0 + ps, tot);
  var page = sorted.slice(s0, s1);

  function sbadge(bg, cl, lbl) {
    return '<span class="ovn-badge" style="background:' + bg + ';color:' + cl + '">' + esc(lbl) + '</span>';
  }
  function statusB(st) {
    if (!st) return '—';
    var bg = st === 'COMPLETED' ? 'rgba(29,199,151,.15)' : st === 'IN_PROGRESS' ? 'rgba(255,159,10,.14)' : 'rgba(142,142,147,.12)';
    var cl = st === 'COMPLETED' ? '#0A7044'              : st === 'IN_PROGRESS' ? '#7A4F00'               : 'var(--txt3)';
    var lb = st === 'COMPLETED' ? 'Completed'            : st === 'IN_PROGRESS' ? 'In Progress'           : st;
    return sbadge(bg, cl, lb);
  }
  function catB(c) {
    if (!c || c === '—') return '—';
    var bg = c === 'Metal' ? 'rgba(142,142,147,.15)' : 'rgba(255,159,10,.14)';
    var cl = c === 'Metal' ? '#636366' : '#7A4F00';
    return sbadge(bg, cl, c);
  }
  function exnewB(isOld) {
    return sbadge(isOld ? 'rgba(142,142,147,.14)' : 'rgba(29,199,151,.14)', isOld ? 'var(--txt2)' : '#0A7044', isOld ? 'Existing' : 'New');
  }
  function audB(aud) {
    return sbadge(aud === 'seller' ? 'rgba(29,199,151,.14)' : 'rgba(0,93,255,.12)', aud === 'seller' ? '#0A7044' : '#024C8A', aud === 'seller' ? 'Seller' : 'Buyer');
  }

  var bodyHtml;
  if (loading) {
    bodyHtml = '<tr><td colspan="10" class="ovn-loading">Loading vendors…</td></tr>';
  } else if (page.length === 0) {
    bodyHtml = '<tr><td colspan="10" class="ovn-empty">No vendors match the current filters</td></tr>';
  } else {
    bodyHtml = page.map(function(r) {
      var od = (r.onbDate && r.onbDate !== '—') ? r.onbDate : '—';
      return '<tr>'
        + '<td class="ovn-td-name" title="' + esc(r.name||'') + '">' + esc(r.name || '—') + '</td>'
        + '<td class="ovn-td-id">' + esc(r.id || '—') + '</td>'
        + '<td>' + audB(r._aud) + '</td>'
        + '<td>' + catB(r.category) + '</td>'
        + '<td>' + exnewB(!!r.isOldVendor) + '</td>'
        + '<td>' + esc(r.vertical || 'OMP') + '</td>'
        + '<td title="' + esc(r.vendorType||'') + '">' + esc(r.vendorType || '—') + '</td>'
        + '<td>' + esc(r.state || '—') + '</td>'
        + '<td>' + esc(od) + '</td>'
        + '<td>' + statusB(r.status) + '</td>'
        + '</tr>';
    }).join('');
  }

  var tableHtml = '<div class="ovn-tbl-outer"><table class="ovn-tbl"><thead><tr>'
    + th('name',    'Company Name')
    + th('id',      'Vendor ID')
    + th('bs',      'Buyer/Seller')
    + th('cat',     'Category')
    + th('exnew',   'Existing/New')
    + th('bv',      'Business Vertical')
    + th('vtype',   'Vendor Type')
    + th('state',   'State')
    + th('onbDate', 'Onb. Date')
    + th('status',  'Status')
    + '</tr></thead><tbody>' + bodyHtml + '</tbody></table></div>';

  var pgHtml = '<div class="ovn-pg">'
    + '<select class="ovn-pg-sel" onchange="_ovnTblSetPageSize(+this.value)">'
    + [10, 25, 50, 100].map(function(n) { return '<option value="' + n + '"' + (ps === n ? ' selected' : '') + '>' + n + ' / page</option>'; }).join('')
    + '</select>'
    + '<span class="ovn-pg-info">' + (tot === 0 ? '0 vendors' : (s0 + 1) + '–' + s1 + ' of ' + fmt(tot) + ' vendors') + '</span>'
    + '<button class="ovn-pg-btn" onclick="_ovnTblSetPage(' + (pg - 1) + ')"' + (pg <= 0 ? ' disabled' : '') + '>◀</button>'
    + '<button class="ovn-pg-btn" onclick="_ovnTblSetPage(' + (pg + 1) + ')"' + (pg >= pgs - 1 ? ' disabled' : '') + '>▶</button>'
    + '</div>';

  return chipsHtml + filterBar + tableHtml + pgHtml;
}

function _kmStarToggle(id, row) {
  var el = document.getElementById(id);
  if (!el) return;

}
function _kmRatFilter(tblId) {
  var tbl    = document.getElementById(tblId);
  if (!tbl) return;
  var search = ((document.getElementById(tblId + '-s') || {}).value || '').toLowerCase();
  var cat    = (document.getElementById(tblId + '-c') || {}).value || '';
  var range  = (document.getElementById(tblId + '-r') || {}).value || '';
  var sort   = (document.getElementById(tblId + '-o') || {}).value || 'desc';
  var tbody  = tbl.querySelector('tbody');
  var rows   = Array.prototype.slice.call(tbl.querySelectorAll('tbody tr'));
  rows.forEach(function(tr) {
    var name   = tr.getAttribute('data-n') || '';
    var trCat  = tr.getAttribute('data-c') || '';
    var rating = parseFloat(tr.getAttribute('data-r') || '0');
    var show   = (!search || name.indexOf(search) >= 0)
              && (!cat    || trCat === cat)
              && (!range  || (function() {
                    var p = range.split('-');
                    return rating >= parseFloat(p[0]) && rating <= parseFloat(p[1]);
                  })());
    tr.style.display = show ? '' : 'none';
  });
  var vis = rows.filter(function(tr) { return tr.style.display !== 'none'; });
  vis.sort(function(a, b) {
    if (sort === 'asc') return parseFloat(a.getAttribute('data-r')) - parseFloat(b.getAttribute('data-r'));
    if (sort === 'az')  return (a.getAttribute('data-n')||'').localeCompare(b.getAttribute('data-n')||'');
    if (sort === 'za')  return (b.getAttribute('data-n')||'').localeCompare(a.getAttribute('data-n')||'');
    return parseFloat(b.getAttribute('data-r')) - parseFloat(a.getAttribute('data-r'));
  });
  vis.forEach(function(tr) { tbody.appendChild(tr); });
}
function _kmOsvFilter(tblId) {
  var tbl = document.getElementById(tblId);
  if (!tbl) return;
  var search = ((document.getElementById(tblId + '-s') || {}).value || '').toLowerCase();
  var cat    = (document.getElementById(tblId + '-c') || {}).value || '';
  var status = (document.getElementById(tblId + '-o') || {}).value || '';
  var rows = Array.prototype.slice.call(tbl.querySelectorAll('tbody tr'));
  rows.forEach(function(tr) {
    var name   = tr.getAttribute('data-n') || '';
    var trCat  = tr.getAttribute('data-c') || '';
    var trStat = tr.getAttribute('data-s') || '';
    var show   = (!search || name.indexOf(search) >= 0)
              && (!cat    || trCat === cat)
              && (!status || trStat === status);
    tr.style.display = show ? '' : 'none';
  });
}

    .withSuccessHandler(function(res) {

      }
    })
