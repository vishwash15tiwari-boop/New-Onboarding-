      wrap.innerHTML = '<div class="km-txn-empty" style="color:#c00">Could not load transaction details</div>';
    })
    .getTransactedVendors(JSON.stringify(f));
}

function _renderTxnDetail(wrap, data) {
  var sellers = data.sellers || [];
  var buyers  = data.buyers  || [];
  var totalTxns = 0, totalGMV = 0;
  // GMV is sourced from sellers only — Seller→Buyer is one transaction;
  // adding buyer-side values would double-count the same transaction.
  sellers.forEach(function(r) { totalTxns += (r.txnCount || 1); totalGMV += (r.txnValue || 0); });

  var smry = '<div class="km-txn-smry">'
    + '<div class="km-txn-smry-item"><div class="km-txn-smry-val">' + fmt(totalTxns) + '</div><div class="km-txn-smry-lbl">Total Unique Txns</div></div>'
    + '<div class="km-txn-smry-item"><div class="km-txn-smry-val">' + fmt(sellers.length) + '</div><div class="km-txn-smry-lbl">Total Unique Sellers</div></div>'
    + '<div class="km-txn-smry-item"><div class="km-txn-smry-val">' + fmt(buyers.length) + '</div><div class="km-txn-smry-lbl">Total Unique Buyers</div></div>'
    + '<div class="km-txn-smry-item"><div class="km-txn-smry-val">' + (totalGMV > 0 ? fmtINR(totalGMV) : '—') + '</div><div class="km-txn-smry-lbl">Total GMV</div></div>'
    + '</div>';

  function tblSection(label, rows) {
    var h = '<div class="km-txn-aud">' + esc(label) + '</div>';
    if (!rows.length) return h + '<div class="km-txn-empty">No records</div>';
    h += '<table class="km-txn-tbl"><thead><tr>'
      + '<th>Name</th><th>GSTIN</th><th>Category</th>'
      + '<th style="text-align:right"># Unique Txns</th>'
      + '<th style="text-align:right">Total GMV</th>'
      + '</tr></thead><tbody>';
    rows.slice(0, 100).forEach(function(r) {
      var cat   = String(r.category || '').trim();
      var catLc = cat.toLowerCase();
      var catBg  = catLc.indexOf('plastic') >= 0 ? 'rgba(255,159,10,.15)'
                 : catLc.indexOf('metal')   >= 0 ? 'rgba(142,142,147,.15)' : 'var(--bg2)';
      var catClr = catLc.indexOf('plastic') >= 0 ? '#B25000'
                 : catLc.indexOf('metal')   >= 0 ? '#636366' : 'var(--txt3)';
      var catHtml = cat
        ? '<span style="display:inline-block;padding:1px 6px;border-radius:10px;font-size:9.5px;font-weight:600;background:' + catBg + ';color:' + catClr + '">' + esc(cat) + '</span>'
        : '<span style="color:var(--txt3)">—</span>';
      h += '<tr>'
        + '<td style="font-weight:500;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.name || '—') + '</td>'
        + '<td style="font-family:monospace;font-size:10px;color:var(--txt3)">' + esc(r.gstin || '—') + '</td>'
        + '<td>' + catHtml + '</td>'
        + '<td style="text-align:right;font-weight:600;font-variant-numeric:tabular-nums">' + fmt(r.txnCount || 1) + '</td>'
        + '<td style="text-align:right;font-weight:600;color:var(--st-transacted-tx);font-variant-numeric:tabular-nums">' + (r.txnValue > 0 ? fmtINR(r.txnValue) : '—') + '</td>'
        + '</tr>';
    });
    if (rows.length > 100) h += '<tr><td colspan="5" style="color:var(--txt3);font-size:10px">… and ' + (rows.length - 100) + ' more records</td></tr>';
    h += '</tbody></table>';
    return h;
  }

  wrap.innerHTML = smry + tblSection('Seller-wise Details', sellers) + tblSection('Buyer-wise Details', buyers);
}

// ── Quality data: load once for OMP, patch into Seller + Buyer cards ─
function loadQualityData() {
  if (qualityData) { _patchQualitySects(); return; }
  if (qualityLoading) return;
  qualityLoading = true;
  google.script.run
    .withSuccessHandler(function(json) {
      qualityLoading = false;
      try { qualityData = JSON.parse(json); } catch (e) { qualityData = { success: false }; }
      _patchQualitySects();
    })
    .withFailureHandler(function() {
      qualityLoading = false;
      qualityData = { success: false };
      _patchQualitySects();
    })
    .getQualityData();
}

function _patchQualitySects() {
  ['seller', 'buyer'].forEach(function(aud) {
    var el = document.getElementById('qsect-' + aud);
    if (!el) return;
    el.innerHTML = buildQualitySect(qualityData, aud);
  });
  _patchQualityKpiCards();
  renderDocsSection();
  if (document.getElementById('vd-tbody')) renderVdRecords();
}

function _patchQualityKpiCards() {
  var qd = qualityData;
  if (!qd || !qd.success) return;
  var qc     = qd.seller || {};
  var selOnb = (window._kpiSnap && window._kpiSnap.compS) || 0;

  var rEl = document.getElementById('qkpi-rating');
  if (rEl) {
    var r    = qc.rating || {};
    var avg  = r.avg != null ? r.avg.toFixed(1) + ' / 10' : '—';
    var rsb  = fmt(r.rated || 0) + ' rated · ' + fmt(Math.max(0, (r.total || 0) - (r.rated || 0))) + ' unrated';
    var rv   = rEl.querySelector('.vkpi-val'); if (rv) rv.textContent = avg;
    var rs   = rEl.querySelector('.vkpi-sub'); if (rs) rs.textContent = rsb;
  }

  var oEl = document.getElementById('qkpi-osv');
  if (oEl) {
    var o    = qc.osv || {}, oDn = o.completed || 0, oIp = o.inProgress || 0, oOmp = o.total || 0;
    var opct = oOmp > 0 ? Math.round(oDn / oOmp * 100) + '%' : '—';
    var osb  = fmt(oDn) + ' Done · ' + fmt(oIp) + ' In Progress · ' + fmt(Math.max(0, oOmp - oDn - oIp)) + ' Not Initiated';
    var ov   = oEl.querySelector('.vkpi-val'); if (ov)  ov.textContent  = opct;
    var oSub = oEl.querySelector('.vkpi-sub'); if (oSub) oSub.textContent = osb;
  }

  var dEl = document.getElementById('qkpi-docs');
  if (dEl) {
    var d    = qc.docs || {}, dCmp = d.complete || 0;
    var dpct = selOnb > 0 ? Math.round(dCmp / selOnb * 100) + '%' : '—';
    var dsb  = fmt(dCmp) + (selOnb > 0 ? ' of ' + fmt(selOnb) : '') + ' complete';
    var dv  = dEl.querySelector('.vkpi-val'); if (dv) dv.textContent = dpct;
    var ds  = dEl.querySelector('.vkpi-sub'); if (ds) ds.textContent = dsb;
  }

  // Patch inline seller pipeline card quality strip (legacy — safe no-op if absent)
  var ipcEl = document.getElementById('ipc-qual-seller');
  if (ipcEl) ipcEl.innerHTML = _buildSellerQualStrip(qc);

  // Patch the Business Insights rail's Vendor Rating / OSV Consent mini-cards.
  var bqEl = document.getElementById('biz-qual');
  if (bqEl) bqEl.outerHTML = _buildRailQual(qc, true); // always OMP when quality data is loaded
}

// ═══════════════════════════════════════════════════════════════
// DOCUMENT MANAGEMENT — Open Marketplace only
// Repository of every Seller/Buyer's submitted documents + completeness
// against the mandatory checklist + an actionable "what's missing" list.
// ═══════════════════════════════════════════════════════════════

// Mandatory-document mapping (document keys, matching the backend DOC_NAMES).
// Completeness, pending counts and the improvement checklist all recalculate
// from here. null / empty = treat EVERY document on the record as mandatory.
//   Buyers: GST Certificate, Entity PAN, PWM Certificate.
//   Sellers: full checklist until an official Seller list is provided.
var MANDATORY_DOCS = {
  seller: ['gst_certificate','owner_pan','cancelled_cheque','kyc_document','gst_portal_screenshot_bank_details','msme_certificate'],
  buyer:  ['gst_certificate', 'entity_pan', 'pwm_certificate'],
};

// Canonical display labels by document key — used for pending/mandatory docs
// that may not be present in a record's own document list (e.g. PWM), and to
// keep acronym casing correct (GST, PAN, PWM) rather than naive title-casing.
var DOC_LABEL_MAP = {
  additional_documents: 'Additional Docs',
  proof_of_premises: 'Proof of Premises',
  electricity_bill: 'Electricity Bill',
  kyc_document: 'KYC Document',
  gst_portal_screenshot_bank_details: 'GST Screenshot',
  cancelled_cheque: 'Cancelled Cheque',
  msme_certificate: 'MSME Certificate',
  aadhaar: 'Aadhaar',
  owner_pan: 'Owner PAN',
  entity_pan: 'Entity PAN',
  gst_certificate: 'GST Certificate',
  pwm_certificate: 'PWM Certificate',
};

var _docAud = 'seller';   // which entity type the repository is showing
var _docSearch = '';       // repository search query
var _docLookup = {};       // per-render key → entity, for the detail modal
var _docLookupI = 0;

// Human label for a document key — canonical map first, then a title-cased fallback.
function prettyDocLabel(key) {
  if (DOC_LABEL_MAP[key]) return DOC_LABEL_MAP[key];
  return String(key || '').replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

// Mandatory document keys applicable to an entity (its audience's list, or all
// documents on the record when no explicit list is configured).
function mandatoryDocKeys(aud, docList) {
  var cfg = MANDATORY_DOCS[aud];
  if (cfg && cfg.length) return cfg.slice();
  return (docList || []).map(function(d) { return d.key; });
}

// Completeness for one entity, computed against its mandatory checklist.
function docCompleteness(entity) {
  var docList = entity.docs || [];
  var byKey = {};
  docList.forEach(function(d) { byKey[d.key] = d; });
  var mand = mandatoryDocKeys(entity.aud, docList);
  var submitted = 0, pending = [];
  mand.forEach(function(k) {
    var d = byKey[k];
    if (d && d.submitted) submitted++;
    else pending.push(d || { key: k, label: prettyDocLabel(k), submitted: false });
  });
  var total = mand.length;
  return { total: total, submitted: submitted, pending: pending,
           pct: total > 0 ? Math.round(submitted / total * 100) : 0 };
}

// Completeness colour ramp (accent used only for meaningful emphasis).
function docPctColor(pct) {
  if (pct >= 100) return '#1DC797';
  if (pct >= 67)  return 'var(--blue)';
  if (pct >= 34)  return '#FF9500';
  return '#FF3B30';
}

function renderDocsSection() {
  var el = document.getElementById('vert-docs-section');
  if (!el) return;
  if (activeVertKey !== 'OMP') { el.style.display = 'none'; return; }
  // Keep the full set; audience selection + OMP scoping happen per-audience in
  // renderDocsRows so one audience matching OMP never hides the other.
  window._docEntities = (qualityData && qualityData.vendorDocs) || [];
  el.style.display = '';
  var icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>';
  var searchIc = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
  el.innerHTML =
    '<div class="docs-hd">'
    +   '<div class="docs-hd-ic">' + icon + '</div>'
    +   '<div><div class="docs-hd-tt">Document Management</div>'
    +     '<div class="docs-hd-sb">Uploaded documents &amp; completeness for every Open Marketplace vendor</div></div>'
    +   '<div class="docs-tools">'
    +     '<div class="docs-seg" id="docs-seg">'
    +       '<button data-aud="seller"' + (_docAud === 'seller' ? ' class="on"' : '') + ' onclick="setDocAud(\'seller\')">Sellers</button>'
    +       '<button data-aud="buyer"'  + (_docAud === 'buyer'  ? ' class="on"' : '') + ' onclick="setDocAud(\'buyer\')">Buyers</button>'
    +     '</div>'
    +     '<div class="docs-search">' + searchIc
    +       '<input type="text" id="docs-search-input" placeholder="Search name or GSTIN…" oninput="onDocSearch(this.value)" value="' + esc(_docSearch) + '">'
    +     '</div>'
    +   '</div>'
    + '</div>'
    + '<div class="docs-tbl-wrap"><table class="docs-tbl">'
    +   '<thead><tr>'
    +     '<th>Vendor</th><th>Category</th><th>Onboarding</th>'
    +     '<th class="num">Completeness</th><th class="num">Submitted</th>'
    +   '</tr></thead>'
    +   '<tbody id="docs-tbody"></tbody>'
    + '</table></div>';
  renderDocsRows();
}

// Normalize a doc row's audience to 'seller' | 'buyer' | 'combined'.
function _docNormAud(a) {
  var s = String(a || '').toLowerCase();
  if (s.indexOf('sell') !== -1) return 'seller';
  if (s.indexOf('buy')  !== -1) return 'buyer';
  return 'combined';
}

// Rows applicable to the selected audience: exact-audience rows if any, else
// unclassified/combined rows (so buyer docs still show when the source couldn't
// split by audience). Within that, prefer OMP-matched rows but never return an
// empty set just because the omp flag wasn't set upstream.
function _docAudPool(aud) {
  var all = window._docEntities || [];
  var exact = all.filter(function(d) { return _docNormAud(d.aud) === aud; });
  var base  = exact.length ? exact : all.filter(function(d) { return _docNormAud(d.aud) === 'combined'; });
  if (!base.length) return [];
  var omp = base.filter(function(d) { return d.omp; });
  return omp.length ? omp : base;
}

function renderDocsRows() {
  var tbody = document.getElementById('docs-tbody');
  if (!tbody) return;
  var q = _docSearch.trim().toLowerCase();
  var list = _docAudPool(_docAud).filter(function(d) {
    if (!q) return true;
    return (d.name || '').toLowerCase().indexOf(q) !== -1
        || (d.gstin || '').toLowerCase().indexOf(q) !== -1;
  });
  // Most-complete first — highest completeness vendors surface at the top.
  list = list.map(function(d) { return { d: d, c: docCompleteness(d) }; })
             .sort(function(a, b) { return b.c.pct - a.c.pct || (a.d.name || '').localeCompare(b.d.name || ''); });
  _docLookup = {}; _docLookupI = 0;
  if (!list.length) {
    var msg = q
      ? 'No ' + _docAud + 's match your search.'
      : 'No ' + _docAud + ' document data available yet.';
    tbody.innerHTML = '<tr><td colspan="5" class="docs-empty">' + msg + '</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(function(o) {
    var d = o.d, c = o.c, key = ++_docLookupI;
    _docLookup[key] = d;
    var clr = docPctColor(c.pct);
    var catCls = (d.category || '').toLowerCase() === 'plastic' ? ' plastic'
               : (d.category || '').toLowerCase() === 'metal'   ? ' metal' : '';
    return '<tr onclick="openDocModal(' + key + ')" title="View documents">'
      + '<td><span class="docs-nm">' + esc(d.name || '—') + '</span>'
      +   '<span class="docs-nm-sub">' + esc(d.gstin || '—') + '</span></td>'
      + '<td>' + (d.category ? '<span class="docs-cat' + catCls + '">' + esc(d.category) + '</span>' : '<span class="docs-nm-sub" style="font-family:inherit">—</span>') + '</td>'
      + '<td>' + docStatusChip(d.onboardingStatus) + '</td>'
      + '<td><div class="docs-comp">'
      +   '<div class="docs-comp-track"><div class="docs-comp-fill" style="width:' + c.pct + '%;background:' + clr + '"></div></div>'
      +   '<span class="docs-comp-pct" style="color:' + clr + '">' + c.pct + '%</span></div></td>'
      + '<td><span class="docs-comp-sub">' + c.submitted + ' / ' + c.total + '</span></td>'
      + '</tr>';
  }).join('');
}

function docStatusChip(status) {
  var s = String(status || '').toUpperCase();
  var label = status ? (s.charAt(0) + s.slice(1).toLowerCase()).replace(/_/g, ' ') : '—';
  var bg = 'var(--seg-track)', col = 'var(--txt2)';
  if (s.indexOf('COMPLET') !== -1 || s === 'ONBOARDED' || s === 'ACTIVE') { bg = 'rgba(48,209,88,.14)'; col = '#248A3D'; }
  else if (s.indexOf('REVIEW') !== -1 || s.indexOf('PROGRESS') !== -1)     { bg = 'rgba(255,149,0,.14)'; col = '#B25000'; }
  else if (s.indexOf('REJECT') !== -1 || s.indexOf('DECLIN') !== -1)       { bg = 'rgba(255,59,48,.12)'; col = '#D70015'; }
  if (!status) return '<span class="docs-nm-sub" style="font-family:inherit">—</span>';
  return '<span class="dm-badge" style="background:' + bg + ';color:' + col + '">' + esc(label) + '</span>';
}

function setDocAud(aud) {
  if (_docAud === aud) return;
  _docAud = aud;
  var seg = document.getElementById('docs-seg');
  if (seg) seg.querySelectorAll('button').forEach(function(b) { b.classList.toggle('on', b.dataset.aud === aud); });
  renderDocsRows();
}

function onDocSearch(v) { _docSearch = v || ''; renderDocsRows(); }

function openDocModal(key) {
  var d = _docLookup[key];
  if (!d) return;
  var pn = document.getElementById('doc-pn');
  var modal = document.getElementById('doc-modal');
  if (!pn || !modal) return;
  var c = docCompleteness(d);
  var clr = docPctColor(c.pct);
  // Build the display list: the record's own documents PLUS any mandatory
  // document missing from it (e.g. PWM for buyers) shown as "Not submitted",
  // so every mandatory doc is visible. Mandatory docs sort first, then submitted.
  var mandKeys = mandatoryDocKeys(d.aud, d.docs || []);
  var mandSet = {};
  mandKeys.forEach(function(k) { mandSet[k] = true; });
  var haveKeys = {};
  (d.docs || []).forEach(function(x) { haveKeys[x.key] = true; });
  var docList = (d.docs || []).slice();
  mandKeys.forEach(function(k) {
    if (!haveKeys[k]) docList.push({ key: k, label: prettyDocLabel(k), submitted: false, verified: null, uploadDate: null, url: null });
  });
  docList.sort(function(a, b) {
    return (mandSet[b.key] ? 1 : 0) - (mandSet[a.key] ? 1 : 0)
        || (b.submitted ? 1 : 0) - (a.submitted ? 1 : 0);
  });
  var listSubmitted = docList.filter(function(x) { return x.submitted; }).length;

  function entItem(lbl, val) {
    return '<div class="dm-ent-item"><span class="dm-ent-lbl">' + lbl + '</span>'
      + '<span class="dm-ent-val">' + (val ? esc(val) : '—') + '</span></div>';
  }
  var entType = (d.aud === 'buyer') ? 'Buyer' : 'Seller';
  var head =
    '<div class="km-head">'
    + '<div style="display:flex;align-items:center;min-width:0">'
    +   '<div class="km-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>'
    +   '<div class="km-htxt"><div class="km-title">' + esc(d.name || 'Vendor') + '</div>'
    +     '<div class="km-sub">' + entType + ' · Document repository</div></div>'
    + '</div>'
    + '<button class="km-close" onclick="closeDocModal()" aria-label="Close">✕</button>'
    + '</div>';

  var ent =
    '<div class="dm-ent">'
    + entItem('GSTIN', d.gstin)
    + entItem('Entity Type', entType)
    + entItem('Category', d.category)
    + entItem('Onboarding', d.onboardingStatus ? d.onboardingStatus.charAt(0) + d.onboardingStatus.slice(1).toLowerCase() : '')
    + '</div>';

  var summary =
    '<div class="dm-sum">'
    + '<div class="dm-sum-item"><div class="dm-sum-v">' + c.total + '</div><div class="dm-sum-l">Mandatory</div></div>'
    + '<div class="dm-sum-item"><div class="dm-sum-v" style="color:#248A3D">' + c.submitted + '</div><div class="dm-sum-l">Submitted</div></div>'
    + '<div class="dm-sum-item"><div class="dm-sum-v" style="color:' + (c.pending.length ? '#B25000' : 'var(--txt3)') + '">' + c.pending.length + '</div><div class="dm-sum-l">Pending</div></div>'
    + '<div class="dm-sum-item pct"><div class="dm-sum-v" style="color:' + clr + '">' + c.pct + '%</div><div class="dm-sum-l">Complete</div></div>'
    + '</div>';

  var docsHtml = docList.map(function(doc) {
    var meta = [];
    if (doc.uploadDate) meta.push('Uploaded ' + esc(doc.uploadDate));
    var verBadge = '';
    if (doc.submitted && doc.verified) {
      var vv = String(doc.verified).toUpperCase();
      if (vv.indexOf('VERIF') !== -1 || vv === 'YES' || vv === 'TRUE' || vv === 'DONE')
        verBadge = '<span class="dm-badge ver">Verified</span>';
      else if (vv.indexOf('PEND') !== -1 || vv.indexOf('PROGRESS') !== -1)
        verBadge = '<span class="dm-badge pend">Pending</span>';
    }
    var viewBtn = doc.url
      ? '<a class="dm-view" href="' + esc(doc.url) + '" target="_blank" rel="noopener">View ↗</a>'
      : '<span class="dm-view off">View</span>';
    var mandTag = mandSet[doc.key] ? '<span class="dm-badge mand">Mandatory</span>' : '';
    return '<div class="dm-doc">'
      + '<div class="dm-doc-ic ' + (doc.submitted ? 'yes' : 'no') + '">' + (doc.submitted ? '✓' : '○') + '</div>'
      + '<div class="dm-doc-main"><div class="dm-doc-nm">' + esc(doc.label || prettyDocLabel(doc.key)) + '</div>'
      +   (meta.length ? '<div class="dm-doc-meta">' + meta.join(' · ') + '</div>' : '') + '</div>'
      + '<div class="dm-doc-badges">'
      +   mandTag
      +   (doc.submitted ? '<span class="dm-badge sub">Submitted</span>' : '<span class="dm-badge miss">Not submitted</span>')
      +   verBadge + viewBtn
      + '</div></div>';
  }).join('');

  var fixInner = c.pending.length
    ? c.pending.map(function(p) {
        return '<div class="dm-fix-row"><span class="dm-fix-dot"></span>' + esc(p.label || prettyDocLabel(p.key)) + '</div>';
      }).join('')
    : '<div class="dm-fix-done">✓ All mandatory documents submitted — 100% complete</div>';
  var fixTitle = c.pending.length ? 'Upload these to reach 100% completeness' : 'Improvement checklist';

  pn.innerHTML = head + ent + summary
    + '<div class="km-sec"><div class="km-sec-t">Documents (' + listSubmitted + ' of ' + docList.length + ' submitted)</div>' + docsHtml + '</div>'
    + '<div class="km-sec"><div class="km-sec-t">' + fixTitle + '</div>' + fixInner + '</div>';
  modal.classList.add('km-open');
  document.addEventListener('keydown', _docEsc);
}

function closeDocModal() {
  var modal = document.getElementById('doc-modal');
  if (modal) modal.classList.remove('km-open');
  document.removeEventListener('keydown', _docEsc);
}
function _docEsc(e) { if (e.key === 'Escape') closeDocModal(); }

// Build in-card quality HTML — shows count + % for every item.
// qd = { success, seller:{rating,osv,docs}, buyer:{...}, combined:{...} }
function buildQualitySect(qd, aud) {
  var hd = '<div class="cc-qsect-hd">Quality &amp; Compliance</div>';
  if (!qd || !qd.success) {
    return hd + '<div style="font-size:11px;color:var(--txt3);padding:4px 0">Data syncing… Run syncQualityData() in Apps Script.</div>';
  }
  var q = qd[aud] || qd.combined || {};
  var html = hd;

  // ── Vendor Rating ──────────────────────────────────────────
  // Header: avg score  |  N rated / N total
  // Rows: [★N] [bar] [count] [pct%]  — one per star level
  if (q.rating && q.rating.total > 0) {
    var r    = q.rating;
    var avg  = r.avg != null ? r.avg.toFixed(1) : '—';
    var rRated = r.rated || 1;
    var maxD = Math.max.apply(null, r.dist || [0]) || 1;
    var rSub = fmt(r.rated) + ' rated · ' + fmt(Math.max(0, (r.total||0)-(r.rated||0))) + ' unrated';
    var rngLabels = ['0-2','2-4','4-6','6-8','8-10'];
    var rngCols   = ['#EF4444','#FB923C','#F59E0B','#84CC16','#22C55E'];
    var bars = '';
    for (var i = 4; i >= 0; i--) {
      var rc   = (r.dist || [])[i] || 0;
      var bpct = Math.round(rc / maxD * 100);
      var dpct = Math.round(rc / rRated * 100);
      bars += '<div class="cc-qsect-sbar">'
        + '<span class="cc-qsect-sbar-n" style="min-width:26px;font-size:8.5px">' + rngLabels[i] + '</span>'
        + '<div class="cc-qsect-sbar-t"><div class="cc-qsect-sbar-f" style="width:' + bpct + '%;background:' + rngCols[i] + '"></div></div>'
        + '<span class="cc-qsect-sbar-c">' + (rc > 999 ? Math.round(rc / 1000) + 'k' : rc) + '</span>'
        + '<span class="cc-qsect-sbar-p">' + dpct + '%</span>'
        + '</div>';
    }
    html += '<div class="cc-qsect-row">'
      + '<span class="cc-qsect-ic">★</span>'
      + '<span class="cc-qsect-lb">Vendor Rating</span>'
      + '<span class="cc-qsect-vl">' + avg + '&thinsp;<span class="cc-qsect-sub">/ 10 avg · ' + rSub + '</span></span>'
      + '</div>'
      + '<div class="cc-qsect-bars">' + bars + '</div>';
  }

  // ── OSV Verification ──────────────────────────────────────
  // Header: label | N done / N total
  // Rows: [●col] [label] [count] [pct%]
  if (q.osv && q.osv.total > 0) {
    var o  = q.osv, oT = o.total || 1;
    var osvPct = Math.round((o.completed || 0) / oT * 100);
    var or_ = [
      { col: 'var(--st-onboarded)', v: o.completed || 0,                                          lbl: 'Done'          },
      { col: '#E48800',              v: o.inProgress || 0,                                         lbl: 'In Progress'   },
      { col: 'var(--st-draft)',      v: Math.max(0, oT - (o.completed||0) - (o.inProgress||0)),   lbl: 'Not Initiated' },
    ];
    html += '<div class="cc-qsect-row cc-qsect-mt">'
      + '<span class="cc-qsect-ic">◎</span>'
      + '<span class="cc-qsect-lb">OSV Status</span>'
      + '<span class="cc-qsect-vl">' + fmt(o.completed) + '&thinsp;<span class="cc-qsect-sub">' + osvPct + '% Done</span></span>'
      + '</div>'
      + or_.map(function(x) {
          if (!x.v) return '';
          var p = Math.round(x.v / oT * 100);
          return '<div class="cc-qsect-drow">'
            + '<span class="cc-qsect-dot" style="background:' + x.col + '"></span>'
            + '<span class="cc-qsect-dlb">' + x.lbl + '</span>'
            + '<span class="cc-qsect-dn">' + fmt(x.v) + '</span>'
            + '<span class="cc-qsect-dp">' + p + '%</span>'
            + '</div>';
        }).join('');
  }

  // ── Doc Completeness ──────────────────────────────────────
  // Header: label | N% complete
  // Progress bar
  // Rows: [●col] [label] [count] [pct%]
  if (q.docs && q.docs.total > 0) {
    var d  = q.docs, dT = d.total || 1;
    var dr = [
      { col: 'var(--st-onboarded)', v: d.complete,   lbl: 'Complete'   },
      { col: 'var(--st-review)',    v: d.partial,     lbl: 'Partial'    },
      { col: 'var(--st-draft)',     v: d.incomplete,  lbl: 'Incomplete' },
      { col: 'var(--st-rejected)',  v: d.missing,     lbl: 'Missing'    },
    ];
    html += '<div class="cc-qsect-row cc-qsect-mt">'
      + '<span class="cc-qsect-ic">◻</span>'
      + '<span class="cc-qsect-lb">Doc Completeness</span>'
      + '<span class="cc-qsect-vl">' + Math.round(d.complete / dT * 100) + '<span class="cc-qsect-sub">% complete</span></span>'
      + '</div>'
      + '<div class="cc-qsect-prog">'
      + dr.filter(function(s){ return s.v > 0; }).map(function(s) {
          return '<div class="cc-qsect-prog-seg" style="flex:' + (s.v / dT * 100).toFixed(1) + ';background:' + s.col + '"></div>';
        }).join('')
      + '</div>'
      + dr.map(function(x) {
          if (!x.v) return '';
          var p = Math.round(x.v / dT * 100);
          return '<div class="cc-qsect-drow">'
            + '<span class="cc-qsect-dot" style="background:' + x.col + '"></span>'
            + '<span class="cc-qsect-dlb">' + x.lbl + '</span>'
            + '<span class="cc-qsect-dn">' + fmt(x.v) + '</span>'
            + '<span class="cc-qsect-dp">' + p + '%</span>'
            + '</div>';
        }).join('');
  }

  return html;
}

function _buildSellerQualStrip(qc) {
  var rowAttrs = function(cardId) {
    return ' class="cc-qs-row cc-qs-row-btn" role="button" tabindex="0"'

// ── Business Insights rail (right column) ─────────────────────────

function renderBizRail(cfg, vs) {

  var gmvTile = '<div class="biz-tile biz-tile-gmv" role="button" tabindex="0"'

// Fixed accent per region so the split reads as a consistent legend.
var REGION_COLORS = { North: '#005DFF', South: '#1DC797', Other: '#8E8E93' };
// Frontend mirror of the backend stateToRegion_ (two-way North / South split) —
// lets the Regional Split card populate from loaded detail rows even before
// Code.gs is redeployed, exactly like the GMV-by-category fallback.
var SOUTH_STATES_FE = (function() {
  var s = {};
  ['andhrapradesh','ap','karnataka','ka','kerala','kl','tamilnadu','tn','telangana','ts','tg',
   'puducherry','pondicherry','py','lakshadweep','ld',
   'andamannicobar','andamanandnicobar','andamanandnicobarislands','an']
    .forEach(function(n) { s[n] = true; });
  return s;
}());
var SOUTH_GST_CODES_FE = { '28':1,'29':1,'31':1,'32':1,'33':1,'34':1,'35':1,'36':1,'37':1 };
function _stateToRegionFE(state) {
  var raw = String(state || '').trim();
  if (!raw) return '';
  var digits = raw.match(/^\s*(\d{1,2})\b/);
  if (digits) {
    var code = digits[1].length === 1 ? '0' + digits[1] : digits[1];
    return SOUTH_GST_CODES_FE[code] ? 'South' : 'North';
  }
  var key = raw.toLowerCase().replace(/&/g, 'and').replace(/[^a-z]/g, '');
  return SOUTH_STATES_FE[key] ? 'South' : 'North';
}
// Aggregate per-vendor detail rows into the same shape the backend `regions`
// field uses (region, total, onboarded, txnValue).
function _regionsFromRows(rows) {
  var map = {};
  rows.forEach(function(r) {
    var reg = _stateToRegionFE(r.state);
    if (!reg) return;
    if (!map[reg]) map[reg] = { region: reg, total: 0, onboarded: 0, txnValue: 0, hasTxnVal: false };
    var g = map[reg];
    g.total++;
    if (r.status === 'COMPLETED') g.onboarded++;
    var tv = r.txnValue;
    if (tv != null && tv > 0) { g.txnValue += Number(tv); g.hasTxnVal = true; }
  });
  return Object.keys(map).map(function(k) {
    var g = map[k];
    return { region: g.region, total: g.total, onboarded: g.onboarded, txnValue: g.hasTxnVal ? g.txnValue : null };
  });
}
// Recompute cfg + seller summary for the active vertical and repaint the rail.
// Called after detail rows load so the region fallback can fill the card.
function refreshBizRail() {
  var key = (typeof activeVertKey !== 'undefined' && activeVertKey) || selectedVert;
  if (!key) return;
  var cfg = getVertCfg().filter(function(c) { return c.key === key; })[0];
  if (!cfg) return;
  var vs = (DS && DS.verticals) ? DS.verticals[key] : null;
  renderBizRail(cfg, vs || null);
}
// Region-wise bifurcation card for the Business Insights rail. Shows onboarded
// sellers per region with a proportional share bar; empty when no region data.
function _buildRailRegions(vs) {
  var regs = (vs && vs.regions ? vs.regions : [])
    .filter(function(r) { return (r.total || 0) > 0; });
  // Fallback: derive from loaded seller detail rows when the backend response
  // predates the `regions` field (e.g. before Code.gs is redeployed).
  if (!regs.length && selectedAud === 'seller' && Array.isArray(vertRows) && vertRows.length) {
    regs = _regionsFromRows(vertRows).filter(function(r) { return (r.total || 0) > 0; });
  }
  if (!regs.length) return '';
  // Prefer onboarded counts; fall back to total pipeline if nothing onboarded yet.
  var onbSum = regs.reduce(function(s, r) { return s + (r.onboarded || 0); }, 0);
  var useOnb = onbSum > 0;
  var metric = function(r) { return useOnb ? (r.onboarded || 0) : (r.total || 0); };
  var sorted = regs.slice().sort(function(a, b) { return metric(b) - metric(a); });
  var denom  = sorted.reduce(function(s, r) { return s + metric(r); }, 0);
  var top    = sorted.slice(0, 3);
  var rows = top.map(function(r) {
    var v   = metric(r);
    var p   = denom > 0 ? (v / denom * 100) : 0;
    var col = REGION_COLORS[r.region] || REGION_COLORS.Other;
    var gmv = (r.txnValue != null && r.txnValue > 0) ? ' · ' + fmtINR(r.txnValue) : '';
    var rg  = esc(r.region);
    return '<div class="biz-reg biz-reg-btn" role="button" tabindex="0"'
      + ' title="' + rg + ' — ' + fmt(v) + (useOnb ? ' onboarded' : ' in pipeline') + gmv + ' · click for details"'
      + ' onclick="openRegionModal(\'' + rg + '\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openRegionModal(\'' + rg + '\')}">'
      + '<div class="biz-reg-top">'
      +   '<span class="biz-reg-nm"><i class="biz-reg-dot" style="background:' + col + '"></i>' + rg + '</span>'
      +   '<span class="biz-reg-vl">' + fmt(v) + '<em>' + p.toFixed(0) + '%</em></span>'
      + '</div>'
      + '<div class="biz-reg-bar"><div class="biz-reg-fill" style="width:' + p.toFixed(1) + '%;background:' + col + '"></div></div>'
      + '</div>';
  }).join('');
  var sub = useOnb ? 'Onboarded by region' : 'Pipeline by region';
  return '<div class="biz-t-sub" style="margin-bottom:6px">' + sub + '</div>' + rows;
}

// ═══════════════════════════════════════════════════════════════
// REGION DETAIL MODAL — click a North/South row to see the vendors
// in that region, grouped by onboarding stage, with a Sellers/Buyers
// toggle. Rows are fetched per audience on demand (cached), mirroring
// the GMV-by-category modal.
// ═══════════════════════════════════════════════════════════════
var _rgn = {
  region: '', key: '', pKey: '', aud: 'seller',
  state: null, company: null,
  stSearch: '', stFilter: { cat: 'All', status: 'All', txn: 'All' }, stSort: { key: 'gmv', dir: -1 },
  rows: { seller: null, buyer: null }
};

function openRegionModal(region) {
  var key = (typeof activeVertKey !== 'undefined' && activeVertKey) || selectedVert;
  if (!key) return;
  var pKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  // Reset the row cache when the vertical or period changed since last open.
  if (_rgn.key !== key || _rgn.pKey !== pKey) _rgn.rows = { seller: null, buyer: null };
  _rgn.region = region;
  _rgn.key    = key;
  _rgn.pKey   = pKey;
  _rgn.aud    = (selectedAud === 'buyer') ? 'buyer' : 'seller';
  _rgn.state   = null;   // always open at region overview
  _rgn.company = null;
  _rgn.stSearch = '';
  _rgn.stFilter = { cat: 'All', status: 'All', txn: 'All' };
  _rgn.stSort   = { key: 'gmv', dir: -1 };
  // Seed from already-loaded detail rows when they match the active audience.
  if (_rgn.rows[_rgn.aud] == null && selectedVert === key
      && Array.isArray(vertRows) && vertRows.length
      && (selectedAud === 'buyer' ? 'buyer' : 'seller') === _rgn.aud) {
    _rgn.rows[_rgn.aud] = vertRows.slice();
  }
  _regionShow();
}

function _regionSetAud(aud) {
  if (_rgn.aud === aud) return;
  _rgn.aud = aud;
  _rgn.company = null;
  _regionShow();
}

function _regionSetState(st) {
  _rgn.state   = st;
  _rgn.company = null;
  _rgn.stSearch = '';
  _rgn.stFilter = { cat: 'All', status: 'All', txn: 'All' };
  _rgn.stSort   = { key: 'gmv', dir: -1 };
  _regionRender(false);
}

// Render if rows for the active audience are available, else fetch them first.
function _regionShow() {
  if (_rgn.rows[_rgn.aud] == null) { _regionFetch(_rgn.aud); return; }
  _regionRender(false);
}

function _regionFetch(aud) {
  _regionRender(true);   // paint the loading state immediately
  var f = { audience: aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  google.script.run
    .withSuccessHandler(function(res) {
      try {
        var d = JSON.parse(res);
        _rgn.rows[aud] = (d && d.success && Array.isArray(d.rows)) ? d.rows : [];
      } catch (e) { _rgn.rows[aud] = []; }
      if (_rgn.aud === aud) _regionShow();
    })
    .withFailureHandler(function() {
      _rgn.rows[aud] = [];
      if (_rgn.aud === aud) _regionRender(false);
    })
    .getVerticalRows(_rgn.key, JSON.stringify(f));
}

function _regionRender(loading) {

  var modal = document.getElementById('kpi-modal');

  // ── REGION OVERVIEW ────────────────────────────────────────────────
  var all = allRegion;

    else if (r.status === 'IN_REVIEW') sm.rev++;
    else if (r.status === 'DRAFT') sm.draft++;

          + '<div class="rgn-row-main"><div class="rgn-row-nm">' + esc(r.name || '—') + '</div>'
          +   '<div class="rgn-row-sub">' + meta + '</div></div>'
          + '<div class="rgn-row-side">' + gmvChip + gstChip + '</div>'
          + '</div>';
      }).join('');
      var more = list.length > MAXG
        ? '<div class="rgn-more">+ ' + fmt(list.length - MAXG) + ' more</div>' : '';
      return '<div class="rgn-group">'
        + '<div class="rgn-group-hd"><span class="rgn-group-ttl">' + g[1] + '</span>'
        +   '<span class="rgn-group-ct">' + fmt(list.length) + '</span></div>'
        + rowsHtml + more
        + '</div>';
    }).join('');
  }

  el.innerHTML = head + audToggle + tiles + stateSection + body;
  if (!modal.classList.contains('km-open')) { modal.classList.add('km-open'); document.addEventListener('keydown', _kpiEsc); }
}

// Build the state breakdown list shown in the region overview.
function _buildStateSection(regionRows, aud) {
  var map = {};
  regionRows.forEach(function(r) {
    var st = String(r.state || '').trim() || 'Unknown';
    if (!map[st]) map[st] = { name: st, total: 0, onb: 0, rev: 0, draft: 0, gmv: 0, hasGmv: false };
    var g = map[st];
    g.total++;
    if (r.status === 'COMPLETED') g.onb++;
    else if (r.status === 'IN_REVIEW') g.rev++;
    else if (r.status === 'DRAFT') g.draft++;
    if (r.txnValue != null && r.txnValue > 0) { g.gmv += Number(r.txnValue); g.hasGmv = true; }
  });
  var states = Object.keys(map).map(function(k) { return map[k]; })
    .sort(function(a, b) { return b.total - a.total; });
  if (!states.length) return '';

  var rows = states.map(function(s) {
    var sj = JSON.stringify(s.name);
    return '<div class="rgn-state-row" role="button" tabindex="0"'
      + ' onclick="_regionSetState(' + sj + ')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();_regionSetState(' + sj + ')}">'
      + '<span class="rgn-state-nm">' + esc(s.name) + '</span>'
      + '<span class="rgn-state-meta">'
      +   '<span class="rgn-state-chip">' + fmt(s.total) + ' total</span>'
      +   '<span class="rgn-state-chip rgn-sc-onb">' + fmt(s.onb) + ' onboarded</span>'
      +   (s.rev > 0 ? '<span class="rgn-state-chip rgn-sc-rev">' + fmt(s.rev) + ' review</span>' : '')
      +   (aud === 'seller' && s.hasGmv ? '<span class="rgn-state-chip rgn-sc-gmv">' + fmtINR(s.gmv) + '</span>' : '')
      + '</span>'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" class="rgn-sc-arr" style="width:13px;height:13px"><path d="M9 18l6-6-6-6"/></svg>'
      + '</div>';
  }).join('');

  return '<div class="rgn-state-sec">'
    + '<div class="rgn-state-hd">'
    +   '<span class="rgn-state-hd-ttl">States (' + states.length + ')</span>'
    +   '<span class="rgn-state-hd-hint">Tap a state to drill down →</span>'
    + '</div>'
    + rows
    + '</div>';
}

// ── Region → State → Company drill-down helpers ───────────────────
window._rgnCoRows = [];

function _regionSetCompany(idx) {
  _rgn.company = (idx != null) ? (window._rgnCoRows[idx] || null) : null;
  _regionRender(false);
}

function _stStateRows() {
  var aud = _rgn.aud, state = _rgn.state, region = _rgn.region;
  return (_rgn.rows[aud] || []).filter(function(r) {
    return _stateToRegionFE(r.state) === region && (r.state || '') === state;
  });
}

function _stFilteredRows() {
  var rows = _stStateRows();
  var q = (_rgn.stSearch || '').trim().toLowerCase();
  var f = _rgn.stFilter;
  var STATUS_MAP = { 'Onboarded': 'COMPLETED', 'In Review': 'IN_REVIEW', 'Draft': 'DRAFT', 'Rejected': 'REJECTED' };
  var filtered = rows.filter(function(r) {
    if (q && (String(r.name || '').toLowerCase().indexOf(q) === -1 && String(r.id || '').toLowerCase().indexOf(q) === -1)) return false;
    if (f.cat !== 'All' && String(r.category || '').toLowerCase() !== f.cat.toLowerCase()) return false;
    if (f.status !== 'All' && r.status !== (STATUS_MAP[f.status] || f.status)) return false;
    if (f.txn === 'Transacted' && !(r.txnValue != null && r.txnValue > 0)) return false;
    if (f.txn === 'No Txn' && (r.txnValue != null && r.txnValue > 0)) return false;
    return true;
  });
  var sk = _rgn.stSort.key, dir = _rgn.stSort.dir;
  filtered.sort(function(a, b) {
    if (sk === 'gmv')  return dir * ((Number(b.txnValue) || 0) - (Number(a.txnValue) || 0));
    if (sk === 'txn')  return dir * ((Number(b.txnCount) || 0) - (Number(a.txnCount) || 0));
    if (sk === 'name') return dir * String(a.name || '').localeCompare(String(b.name || ''));
    if (sk === 'date') return dir * (new Date(b.onbDate || 0) - new Date(a.onbDate || 0));
    return 0;
  });
  return filtered;
}

function _stSetSearch(q) {
  _rgn.stSearch = q;
  var el = document.getElementById('rgn-vlist');
  if (el) el.innerHTML = _buildCoList(_stFilteredRows(), _rgn.aud);
}

function _stSetFilter(key, val) {
  _rgn.stFilter[key] = val;
  var chips = document.getElementById('rgn-fil-chips');
  var vlist = document.getElementById('rgn-vlist');
  if (chips) chips.innerHTML = _buildFilChipsHtml();
  if (vlist) vlist.innerHTML = _buildCoList(_stFilteredRows(), _rgn.aud);
}

function _stSetSort(key) {
  if (_rgn.stSort.key === key) { _rgn.stSort.dir *= -1; }
  else { _rgn.stSort.key = key; _rgn.stSort.dir = -1; }
  var sortBar = document.getElementById('rgn-sort-bar');
  var vlist   = document.getElementById('rgn-vlist');
  if (sortBar) sortBar.innerHTML = _buildSortBarHtml();
  if (vlist)   vlist.innerHTML   = _buildCoList(_stFilteredRows(), _rgn.aud);
}

function _buildFilChipsHtml() {
  var stRows = _stStateRows();
  var hasMetal   = stRows.some(function(r) { return String(r.category || '').toLowerCase() === 'metal'; });
  var hasPlastic = stRows.some(function(r) { return String(r.category || '').toLowerCase() === 'plastic'; });
  var c = function(key, val) {
    var on = _rgn.stFilter[key] === val ? ' on' : '';
    return '<button class="rgn-sd-chip' + on + '" onclick="_stSetFilter(' + JSON.stringify(key) + ',' + JSON.stringify(val) + ')">' + esc(val) + '</button>';
  };
  return '<span class="rgn-sd-lbl">Cat:</span>'
    + c('cat', 'All')
    + (hasMetal   ? c('cat', 'Metal')   : '')
    + (hasPlastic ? c('cat', 'Plastic') : '')
    + '<div class="rgn-sd-divider"></div>'
    + '<span class="rgn-sd-lbl">Status:</span>'
    + c('status', 'All') + c('status', 'Onboarded') + c('status', 'In Review') + c('status', 'Draft')
    + '<div class="rgn-sd-divider"></div>'
    + '<span class="rgn-sd-lbl">Txn:</span>'
    + c('txn', 'All') + c('txn', 'Transacted') + c('txn', 'No Txn');
}

function _buildSortBarHtml() {
  var sk = _rgn.stSort.key, dir = _rgn.stSort.dir;
  var arr = dir === -1 ? ' ↓' : ' ↑';
  var s = function(key, lbl) {
    var on = sk === key ? ' on' : '';
    return '<button class="rgn-sd-chip' + on + '" onclick="_stSetSort(' + JSON.stringify(key) + ')">'
      + lbl + (sk === key ? arr : '') + '</button>';
  };
  return '<span class="rgn-sd-lbl">Sort:</span>'
    + s('gmv', 'GMV') + s('txn', 'Txns') + s('name', 'Name') + s('date', 'Date');
}

function _buildStateDetail(stRows, aud) {
  var sm = { total: stRows.length, onb: 0, rev: 0, draft: 0, gmv: 0, txns: 0, hasGmv: false };
  stRows.forEach(function(r) {
    if (r.status === 'COMPLETED') sm.onb++;
    else if (r.status === 'IN_REVIEW') sm.rev++;
    else if (r.status === 'DRAFT') sm.draft++;
    if (r.txnValue != null && r.txnValue > 0) { sm.gmv += Number(r.txnValue); sm.hasGmv = true; }
    if (r.txnCount != null && r.txnCount > 0) sm.txns += Number(r.txnCount);
  });
  var tile = function(v, l) {
    return '<div class="rgn-tile"><div class="rgn-tile-v">' + v + '</div><div class="rgn-tile-l">' + l + '</div></div>';
  };
  var tiles = '<div class="rgn-tiles">'
    + tile(fmt(sm.total), 'Total')
    + tile(fmt(sm.onb), 'Onboarded')
    + tile(fmt(sm.rev), 'In Review')
    + tile(fmt(sm.draft), 'Draft')
    + (aud === 'seller' && sm.hasGmv ? tile(fmtINR(sm.gmv), 'GMV') : '')
    + (sm.txns > 0 ? tile(fmt(sm.txns), 'Transactions') : '')
    + '</div>';

  var toolbar = '<div class="rgn-sd-tb">'
    + '<div class="rgn-sd-srch">'
    +   '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>'
    +   '<input id="rgn-st-sinput" type="text" placeholder="Search by name or vendor ID…" oninput="_stSetSearch(this.value)" onkeydown="event.stopPropagation()">'
    + '</div>'
    + '<div id="rgn-fil-chips" class="rgn-sd-row">' + _buildFilChipsHtml() + '</div>'
    + '<div id="rgn-sort-bar" class="rgn-sd-row">' + _buildSortBarHtml() + '</div>'
    + '</div>';

  var filtered = _stFilteredRows();
  return tiles + toolbar + '<div id="rgn-vlist">' + _buildCoList(filtered, aud) + '</div>';
}

function _buildCoList(rows, aud) {
  window._rgnCoRows = rows;
  if (!rows.length) {
    return '<div class="rgn-co-empty">No matching companies</div>';
  }
  var ST = {
    'COMPLETED': { bg: 'var(--st-onboarded-bg)', tx: 'var(--st-onboarded-tx)', lbl: 'Onboarded' },
    'IN_REVIEW': { bg: 'rgba(228,136,0,.12)',     tx: '#7A4F00',                lbl: 'In Review' },
    'DRAFT':     { bg: 'var(--bg2)',               tx: 'var(--txt3)',            lbl: 'Draft'     },
    'REJECTED':  { bg: 'var(--st-rejected-bg)',    tx: 'var(--st-rejected-tx)', lbl: 'Rejected'  },
  };
  return rows.map(function(r, i) {
    var st = ST[r.status] || { bg: 'var(--bg2)', tx: 'var(--txt3)', lbl: r.status || '—' };
    var catLo = String(r.category || '').toLowerCase();
    var catBg = catLo === 'metal' ? 'rgba(29,199,151,.12)' : catLo === 'plastic' ? 'rgba(228,136,0,.12)' : 'var(--bg2)';
    var catTx = catLo === 'metal' ? '#0A7044' : catLo === 'plastic' ? '#7A4F00' : 'var(--txt3)';
    var gmvHtml = (aud === 'seller' && r.txnValue != null && r.txnValue > 0) ? '<div class="rgn-co-gmv">' + fmtINR(r.txnValue) + '</div>' : '';
    var txnHtml = (r.txnCount != null && r.txnCount > 0) ? '<div class="rgn-co-txn">' + fmt(r.txnCount) + ' txns</div>' : '';
    return '<div class="rgn-co-row" role="button" tabindex="0"'
      + ' onclick="_regionSetCompany(' + i + ')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();_regionSetCompany(' + i + ')}">'
      + '<div class="rgn-co-main">'
      +   '<div class="rgn-co-nm">' + esc(r.name || '—') + '</div>'
      +   '<div class="rgn-co-sub">'
      +     (r.id ? '<span>#' + esc(r.id) + '</span>' : '')
      +     (r.category ? '<span class="rgn-co-cat" style="background:' + catBg + ';color:' + catTx + '">' + esc(r.category) + '</span>' : '')
      +     (r.vendorType ? '<span style="color:var(--txt3);flex-shrink:0">' + esc(r.vendorType) + '</span>' : '')
      +     '<span class="rgn-co-stbadge" style="background:' + st.bg + ';color:' + st.tx + '">' + st.lbl + '</span>'
      +   '</div>'
      + '</div>'
      + '<div class="rgn-co-side">' + gmvHtml + txnHtml + '</div>'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:13px;height:13px;flex-shrink:0;color:var(--txt3)"><path d="M9 18l6-6-6-6"/></svg>'
      + '</div>';
  }).join('');
}

function _buildCompanyProfile(row, region, state) {
  var ST = {
    'COMPLETED': { bg: 'var(--st-onboarded-bg)', tx: 'var(--st-onboarded-tx)', lbl: 'Onboarded' },
    'IN_REVIEW': { bg: 'rgba(228,136,0,.12)',     tx: '#7A4F00',                lbl: 'In Review' },
    'DRAFT':     { bg: 'var(--bg2)',               tx: 'var(--txt3)',            lbl: 'Draft'     },
    'REJECTED':  { bg: 'var(--st-rejected-bg)',    tx: 'var(--st-rejected-tx)', lbl: 'Rejected'  },
  };
  var st = ST[row.status] || { bg: 'var(--bg2)', tx: 'var(--txt3)', lbl: row.status || '—' };
  var catLo = String(row.category || '').toLowerCase();
  var catBg = catLo === 'metal' ? 'rgba(29,199,151,.12)' : catLo === 'plastic' ? 'rgba(228,136,0,.12)' : 'var(--bg2)';
  var catTx = catLo === 'metal' ? '#0A7044' : catLo === 'plastic' ? '#7A4F00' : 'var(--txt3)';
  var f = function(val, lbl) {
    return '<div class="rgn-cp-f"><div class="rgn-cp-lbl">' + lbl + '</div><div class="rgn-cp-val">' + val + '</div></div>';
  };

  var sec1 = '<div class="rgn-cp-sec">'
    + '<div class="rgn-cp-ttl">Vendor Details</div>'
    + '<div class="rgn-cp-grid">'
    + f(esc(row.id || '—'), 'Vendor ID')
    + f('<span class="rgn-cp-badge" style="background:' + st.bg + ';color:' + st.tx + '">' + st.lbl + '</span>', 'Status')
    + (row.category ? f('<span class="rgn-cp-badge" style="background:' + catBg + ';color:' + catTx + '">' + esc(row.category) + '</span>', 'Category') : '')
    + (row.vendorType ? f(esc(row.vendorType), 'Material / Type') : '')
    + f(esc(row.state || state || '—'), 'State')
    + f(esc(region || '—'), 'Region')
    + '</div></div>';

  var gstHtml = row.hasGST
    ? '<span style="color:var(--st-onboarded-tx);font-weight:600">✓ ' + esc(row.gstin || 'Verified') + '</span>'
    : '<span style="color:var(--st-rejected-tx);font-weight:600">✗ No GST</span>';

  var sec2 = '<div class="rgn-cp-sec">'
    + '<div class="rgn-cp-ttl">Compliance & Dates</div>'
    + '<div class="rgn-cp-grid">'
    + f(gstHtml, 'GSTIN')
    + f((row.tat != null && row.tat !== '') ? row.tat + ' days' : '—', 'TAT')
    + f(row.createdDate ? esc(row.createdDate) : '—', 'Created')
    + f(row.onbDate ? esc(row.onbDate) : '—', 'Onboarded')
    + (row.reviewDate ? f(esc(row.reviewDate), 'Reviewed') : '')
    + '</div></div>';

  var hasGmv = _rgn.aud === 'seller' && row.txnValue != null && row.txnValue > 0;
  var hasTxn = row.txnCount != null && row.txnCount > 0;
  var sec3 = (hasGmv || hasTxn || row.txnDate)
    ? '<div class="rgn-cp-sec">'
    + '<div class="rgn-cp-ttl">Transaction Summary</div>'
    + '<div class="rgn-cp-grid">'
    + (hasGmv ? f(fmtINR(row.txnValue), 'GMV') : '')
    + (hasTxn ? f(fmt(row.txnCount) + ' txns', 'Transactions') : '')
    + (row.txnDate ? f(esc(row.txnDate), 'Last Txn Date') : '')
    + '</div></div>' : '';

  return sec1 + sec2 + sec3;
}

// Vendor Rating + OSV Status mini-cards for the rail (Open Marketplace only).
// isOMP=false → returns empty string; isOMP=true with qc=null → "Syncing…" state.
function _buildRailQual(qc, isOMP) {
  if (!isOMP) return '';
  var ratingTile, osvTile;

  if (qc) {
    var r = qc.rating || {}, o = qc.osv || {};
    // Rating tile
    var rVal  = r.avg != null ? r.avg.toFixed(1) + ' / 10 ★' : '— / 10';
    var rSub  = fmt(r.rated || 0) + ' of ' + fmt(r.total || 0) + ' OMP rated';
    var rPct = r.avg != null ? Math.round(r.avg / 10 * 100) : 0;
    ratingTile = '<div class="biz-tile biz-tile--right" role="button" tabindex="0"'
      + ' onclick="openKpiModal(\'rating\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openKpiModal(\'rating\')}">'
      + '<div class="biz-t-hdr"><div class="biz-t-lb">Vendor Rating</div>' + _cfdHtml + '</div>'
      + '<div class="biz-t-val" style="color:#E48800;font-size:19px;letter-spacing:-.6px">' + rVal + '</div>'
      + '<div style="height:3px;border-radius:2px;background:var(--bg2);overflow:hidden;margin:5px 0 4px">'
      +   '<div style="width:' + rPct + '%;height:100%;background:#E48800;border-radius:2px;transition:width .6s var(--ease-out)"></div>'
      + '</div>'
      + '<div class="biz-t-sub">' + rSub + '</div>'
      + '</div>';

    // OSV tile
    var osvDone   = o.completed  || 0;
    var osvInProg = o.inProgress || 0;
    var osvTotal  = o.total      || 0;
    var osvNI     = Math.max(0, osvTotal - osvDone - osvInProg);
    var donePct   = osvTotal > 0 ? Math.round(osvDone   / osvTotal * 100) : 0;
    var ipPct     = osvTotal > 0 ? Math.round(osvInProg / osvTotal * 100) : 0;
    var niPct     = osvTotal > 0 ? Math.round(osvNI     / osvTotal * 100) : 0;
    osvTile = '<div class="biz-tile biz-tile--right" role="button" tabindex="0"'
      + ' onclick="openKpiModal(\'osv\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openKpiModal(\'osv\')}">'
      + '<div class="biz-t-hdr"><div class="biz-t-lb">OSV Status</div>' + _cfdHtml + '</div>'
      + '<div class="biz-osv-cols">'
      +   '<div class="biz-osv-col">'
      +     '<div class="biz-osv-lbl" style="color:#1DC797">Done</div>'
      +     '<div class="biz-osv-num" style="color:#1DC797;font-size:13px">' + fmt(osvDone) + '</div>'
      +     '<div class="biz-osv-pct">' + donePct + '%</div>'
      +   '</div>'
      +   '<div class="biz-osv-col">'
      +     '<div class="biz-osv-lbl" style="color:#E48800">In Progress</div>'
      +     '<div class="biz-osv-num" style="color:#E48800;font-size:13px">' + fmt(osvInProg) + '</div>'
      +     '<div class="biz-osv-pct">' + ipPct + '%</div>'
      +   '</div>'
      +   '<div class="biz-osv-col">'
      +     '<div class="biz-osv-lbl" style="color:var(--txt3)">Not Initiated</div>'
      +     '<div class="biz-osv-num" style="color:var(--txt3);font-size:13px">' + fmt(osvNI) + '</div>'
      +     '<div class="biz-osv-pct">' + niPct + '%</div>'
      +   '</div>'
      + '</div>'
      + '<div class="biz-osv-tot"><span>Total Vendors</span><b>' + fmt(osvTotal) + '</b></div>'
      + '</div>';
  } else {
    ratingTile = '<div class="biz-tile biz-tile--right">'
      + '<div class="biz-t-lb">Vendor Rating</div>'
      + '<div class="biz-q-sync">Syncing</div>'
      + '</div>';
    osvTile = '<div class="biz-tile biz-tile--right">'
      + '<div class="biz-t-lb">OSV Status</div>'
      + '<div class="biz-q-sync">Syncing</div>'
      + '</div>';
  }

  return '<div id="biz-qual" style="display:contents">' + ratingTile + osvTile + '</div>';
}

    { lbl:'In Review', n:vReview, col:'var(--st-review)',    bg:'var(--st-review-bg)',    ic:_ic2('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>') },

          + (isComp
            ? ' role="button" tabindex="0"'

            ? ' role="button" tabindex="0"'
              + ' onclick="openSlModal(\'' + aud + '\',\'' + slStatus + '\')"'
              + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openSlModal(\'' + aud + '\',\'' + slStatus + '\')}"'
            : isDraft
            ? ' role="button" tabindex="0"'
              + ' onclick="openDmModal(\'' + aud + '\')"'
              + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openDmModal(\'' + aud + '\')}"'
            : '');
        return '<div class="vpipe-stat-card"' + cardAttrs + '>'

          + '<div class="vpipe-stat-name">' + s.lbl + '</div>'
          + '<div class="vpipe-stat-num">' + fmt(s.n) + '</div>'
          + '<div class="vpipe-stat-pct">' + pct + '%</div>'
          + (isClick ? _cfdHtml : '')
          + '</div>';
      }).join('')
    + '</div>';

  // ── 3 Operational cards (Right 20%) ─────────────────────────────
  var fys = (v.fyBreakdown || []).filter(function(f) { return !f.fyStart || f.fyStart >= 2019; });
  var curFY = '';
  if (fys.length) {
    var fySorted = fys.slice().sort(function(a, b) { return (a.fyStart || 0) - (b.fyStart || 0); });
    curFY = fySorted[fySorted.length - 1].fy || '';
  }
  var opsData = [
    { lbl:'Avg TAT',    val: v.avgTAT != null ? v.avgTAT + 'd' : '—' },

  var opsCol = '<div class="vpipe-ops-col">'
    + opsData.map(function(o) {
        return '<div class="vpipe-ops-card">'
          + '<div class="vpipe-ops-lbl">' + o.lbl + '</div>'
          + '<div class="vpipe-ops-val">' + o.val + '</div>'
          + '</div>';
      }).join('')
    + '</div>';

  var kpiSection = '<div class="vpipe-kpi-section">' + statusGrid + opsCol + '</div>';

  // ── Material breakdown ───────────────────────────────────────────
  var MAT_CLR = { plastic: '#005DFF', metal: '#1DC797' };
  var cats = (v.categories || []).filter(function(c) { return (c.total || 0) > 0; });
  var matsHtml = '';
  if (cats.length) {
    var matRows = cats.map(function(c) {
      var catKey = (c.category || '').trim().toLowerCase();
      var color  = MAT_CLR[catKey] || '#8E8E93';
      var barW   = tot > 0 ? Math.round(c.total / tot * 100) : 0;

      if ((c.draft     || 0) > 0) parts.push('<em>' + fmt(c.draft)     + '</em> draft');
      if ((c.inReview  || 0) > 0) parts.push('<em>' + fmt(c.inReview)  + '</em> review');

      + '<div class="cc-pipe-stat ps-review"><span class="cc-pipe-stat-lbl">In Review</span><span class="cc-pipe-stat-val">' + fmt(v.inReview || 0) + '</span></div>'

    // Category rows: top 3

      ? '<div class="cc-cat-rows">'
        + topCats.map(function(c) {
            var parts = [];
            if ((c.onboarded||0) > 0) parts.push('<em>' + fmt(c.onboarded) + ' onboarded</em>');
            if ((c.draft    ||0) > 0) parts.push(fmt(c.draft) + ' draft');
            if ((c.inReview ||0) > 0) parts.push(fmt(c.inReview) + ' review');
            return '<div class="cc-cat-row">'

        + '</div>'
      : '<div class="cc-cat-rows"></div>';

    // FY breakdown table: all available FYs from 2015 onwards, newest first
    var fys = (v.fyBreakdown || []).filter(function(f) { return !f.fyStart || f.fyStart >= 2019; });

    if (fys.length) {

      var isOMPc   = cfg.key === 'OMP';

      function fyTr(label, valFn, aggVal, badCls) {

        aud === 'seller' ? fyTr('Total GMV', function(f){ return f.totalTxnValue != null ? fmtINR(f.totalTxnValue) : null; }, aggGMV, '') : null,
      ].filter(Boolean).join('');

      if (fyTbody) {

function openVertDetail(key, aud) {
  aud = aud || 'seller';
  // If a different vertical tab — switch to it, which resets rows and re-renders.
  if (activeVertKey !== key) {
    selectedAud = aud;
    activeVertKey = key;
    selectedVert  = key;
    vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '', region: 'All', ratingMin: '', ratingMax: '' }; vdPage = 0;
    vdSort = { key: '', dir: 1 };
    vertRows = []; vertRowsLoading = true; vertRowsError = null;
    _vertRowsPKey = null; ++_vertRowsGen; _ovnRows = {}; _taBackend = { pKey: null, sellers: null, buyers: null };
    document.querySelectorAll('.vert-tab[data-key]').forEach(function(t) {
      t.classList.toggle('active', t.dataset.key === key);
    });
    renderVertKPIs(key);
    renderPipelinePair(key);
    var detEl = document.getElementById('vert-detail-section');
    if (detEl) detEl.style.display = '';
    renderInlineDetail(key);
    loadVertRows(key);
  } else {
    // Same vertical — just switch audience
    setDetailAud(aud);
  }
  // Scroll to the detail section
  setTimeout(function() {
    var detEl = document.getElementById('vert-detail-section');
    if (detEl) detEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 80);
}

function loadVertRows(key) {
  var myGen = ++_vertRowsGen;
  var f = { audience: selectedAud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  var myPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var lsVKey = STORE_PFX + 'vr_' + selectedAud + '_' + key;

  // SWR: serve cached rows immediately so the panel is never blank
  var swrDone = false;
  try {
    var sv = JSON.parse(localStorage.getItem(lsVKey) || 'null');
    if (sv && sv.pKey === myPKey && Array.isArray(sv.rows)) {
      vertRows = sv.rows;
      _vertRowsPKey = myPKey;
      vertRowsLoading = false;
      vertRowsError = null;
      renderVertDetail();
      if (selectedAud === 'seller') refreshBizRail();  // fill Regional Split from detail rows
      swrDone = true;
    }
  } catch (e) {}

  // Always refresh from the server — spinner only shown when there's no SWR data
  if (!swrDone) { vertRowsLoading = true; vertRowsError = null; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (myGen !== _vertRowsGen) return;  // a newer request superseded this one
      vertRowsLoading = false;
      try {
        var data = JSON.parse(res);
        if (data.success && data.vertKey === selectedVert) {
          vertRows = data.rows || [];
          _vertRowsPKey = myPKey;
          if (selectedAud === 'seller') refreshBizRail();  // fill Regional Split from detail rows
          // Persist so the next open is instant
          try { localStorage.setItem(lsVKey, JSON.stringify({ pKey: myPKey, rows: data.rows || [] })); } catch (e) {}
        } else if (!data.success && !swrDone) {
          vertRowsError = data.error || 'The server could not load records for this vertical.';
        }
      } catch (e) {
        if (!swrDone) vertRowsError = 'Could not read the server response: ' + e.message;
      }
      renderVertDetail();   // always re-render — never leave the panel stuck on the spinner
      // Silently warm the cache for the next vertical tab (2 s delay avoids contention)
      setTimeout(function() { _prefetchNextVert(key); }, 2000);
    })
    .withFailureHandler(function(err) {
      if (myGen !== _vertRowsGen) return;
      vertRowsLoading = false;
      if (!swrDone) vertRowsError = (err && err.message) ? err.message : 'Server error while loading records.';
      renderVertDetail();
    })
    .getVerticalRows(key, JSON.stringify(f));
}

// Retry button in the detail panel's error state.
function vdRetryRows() {
  if (!selectedVert) return;
  loadVertRows(selectedVert);
  renderVertDetail();   // show the loading state immediately
}

// Silently warm the localStorage cache for the next vertical tab so switching
// feels instant. Only fires after the active vertical's rows have loaded and
// the main dashboard fetch is idle.
function _prefetchNextVert(doneKey) {
  if (_dashLoading) return;
  var cfg = getVertCfg();
  var di = -1;
  for (var i = 0; i < cfg.length; i++) { if (cfg[i].key === doneKey) { di = i; break; } }
  if (di < 0 || cfg.length < 2) return;
  var next = cfg[(di + 1) % cfg.length];
  if (!next || next.key === doneKey) return;
  var aud  = selectedAud;
  var pKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var lsKey = STORE_PFX + 'vr_' + aud + '_' + next.key;
  try { var sv = JSON.parse(localStorage.getItem(lsKey) || 'null'); if (sv && sv.pKey === pKey) return; } catch (e) {}
  var f = { audience: aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  google.script.run
    .withSuccessHandler(function(res) {
      try { var d = JSON.parse(res); if (d.success) { localStorage.setItem(lsKey, JSON.stringify({ pKey: pKey, rows: d.rows || [] })); } } catch (e) {}
    })
    .withFailureHandler(function() {})
    .getVerticalRows(next.key, JSON.stringify(f));
}
