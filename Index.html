var _ta = { aud:'seller', cat:'All', q:'', sk:'txnValue', sd:-1, pg:0, pgSz:25, rows:[] };
// Backend-sourced data for the TaModal — uses txnDate filter, matching the Hero Card.
// sellers/buyers===null means still loading; []|[...] means loaded.
var _taBackend = { pKey: null, sellers: null, buyers: null };

function _taFetch() {
  var myPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  if (_taBackend.pKey === myPKey && _taBackend.sellers !== null) return;
  _taBackend = { pKey: myPKey, sellers: null, buyers: null };
  var f = { period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  google.script.run
    .withSuccessHandler(function(res) {
      try {
        var data = JSON.parse(res);
        if (_taBackend.pKey !== myPKey) return;
        _taBackend.sellers = data.success ? (data.sellers || []) : [];
        _taBackend.buyers  = data.success ? (data.buyers  || []) : [];
      } catch (e) { _taBackend.sellers = _taBackend.buyers = []; }
      _taRender();
    })
    .withFailureHandler(function() {
      if (_taBackend.pKey === myPKey) { _taBackend.sellers = _taBackend.buyers = []; }
      _taRender();
    })
    .getTransactedVendors(JSON.stringify(f));
}

function _taNormCat(c) {
  if (!c) return 'Other';
  var lc = String(c).toLowerCase().trim();
  return lc === 'metal' ? 'Metal' : lc === 'plastic' ? 'Plastic' : 'Other';
}

function _taParseDate(str) {
  if (!str || str === '—') return null;
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(str);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(str);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  return null;
}

function _taDaysSince(dateStr) {
  var d = _taParseDate(dateStr);
  if (!d) return null;
  var now = new Date();
  var todayMs = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  var thenMs  = Date.UTC(d.getFullYear(),   d.getMonth(),   d.getDate());
  return Math.max(0, Math.floor((todayMs - thenMs) / 86400000));
}

function _taDateNum(dateStr) {
  if (!dateStr || dateStr === '—') return 0;
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(dateStr);
  if (m) return +m[3] * 10000 + +m[2] * 100 + +m[1];
  m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(dateStr);
  if (m) return +m[1] * 10000 + +m[2] * 100 + +m[3];
  return 0;
}

// Frontend mirror of backend applyTxnDateFilter: checks whether a "dd/mm/yyyy"
// txnDate string falls within the currently selected period window (IST).
function _applyTxnDateFilter(dateStr) {
  if (currentPeriod === 'All' || !currentPeriod) return true;
  var recDay = _taDateNum(dateStr);
  if (!recDay) return false;
  var IST_MS = (5 * 60 + 30) * 60 * 1000;
  var now = new Date(Date.now() + IST_MS);
  var Y = now.getUTCFullYear(), M = now.getUTCMonth(), D = now.getUTCDate();
  var todayDay = Y * 10000 + (M + 1) * 100 + D;
  function bDay(y, m, d0) {
    var t = new Date(Date.UTC(y, m, d0));
    return t.getUTCFullYear() * 10000 + (t.getUTCMonth() + 1) * 100 + t.getUTCDate();
  }
  var psDay = null, peDay = null, p = currentPeriod;
  if      (p === 'Today')                          { psDay = peDay = todayDay; }
  else if (p === 'Yesterday')                      { var yd = bDay(Y, M, D - 1); psDay = peDay = yd; }
  else if (p === 'Last7Days'  || p === 'ThisWeek') { psDay = bDay(Y, M, D - 6);  peDay = todayDay; }
  else if (p === 'Last30Days' || p === 'ThisMonth'){ psDay = bDay(Y, M, D - 29); peDay = todayDay; }
  else if (p === 'MTD')                            { psDay = bDay(Y, M, 1);       peDay = todayDay; }
  else if (p === 'LastMonth')                      { psDay = bDay(Y, M - 1, 1);   peDay = bDay(Y, M, 0); }
  else if (p === 'ThisQuarter') { var qS = Math.floor(M / 3) * 3; psDay = bDay(Y, qS, 1); peDay = todayDay; }
  else if (p === 'ThisYear')                       { psDay = bDay(Y, 0, 1);       peDay = todayDay; }
  else if (p === 'YTD')        { var fyS = (M >= 3) ? Y : Y - 1; psDay = bDay(fyS, 3, 1); peDay = todayDay; }
  else if (p === 'Custom' && customStart && customEnd) {
    var csm = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(customStart);
    var cem = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(customEnd);
    if (csm) psDay = +csm[1] * 10000 + +csm[2] * 100 + +csm[3];
    if (cem) peDay = +cem[1] * 10000 + +cem[2] * 100 + +cem[3];
  } else if (p.indexOf('FY') === 0) {
    var fm = p.match(/FY(\d{2})-(\d{2})/);
    if (fm) { var fy = 2000 + parseInt(fm[1], 10); psDay = fy * 10000 + 401; peDay = (fy + 1) * 10000 + 331; }
  }
  if (psDay !== null && recDay < psDay) return false;
  if (peDay !== null && recDay > peDay) return false;
  return true;
}


function openTaModal() {
  var m = document.getElementById('ta-modal');
  var isOpen = m && m.classList.contains('ta-open');
  if (!isOpen) {
    _ta.aud = 'seller'; _ta.cat = 'All'; _ta.q = '';
    _ta.sk = 'txnValue'; _ta.sd = -1; _ta.pg = 0;
  }
  _taFetch();
  _taRender();
  if (m && !isOpen) { void m.offsetHeight; m.classList.add('ta-open'); }
  if (!isOpen) document.addEventListener('keydown', _taEsc);
}

function closeTaModal() {
  var m = document.getElementById('ta-modal');
  if (m) m.classList.remove('ta-open');
  document.removeEventListener('keydown', _taEsc);
}

function _taEsc(e) {
  if (e.key !== 'Escape') return;
  var m = document.getElementById('ta-modal');
  if (!m || !m.classList.contains('ta-open')) return;
  e.stopPropagation();
  closeTaModal();
}

function _taRender() {
  var hd   = document.getElementById('ta-hd');
  var seg  = document.getElementById('ta-seg-bar');
  var body = document.getElementById('ta-body');
  if (!hd || !body) return;
  var loading = _taBackend.sellers === null;
  function mapRow(r, aud) {
    return { id: r.id, name: r.name, audience: aud,
      vendorType: r.vendorType || '—', _normCat: _taNormCat(r.category),
      state: r.state || '—', txnDate: r.txnDate || '—',
      txnValue: r.txnValue || 0,
      txnCount: r.total_orders || r.txnCount || 0 };
  }
  var allSeller = loading ? [] : (_taBackend.sellers || []).filter(_isValidRec).map(function(r) { return mapRow(r, 'seller'); });
  var allBuyer  = loading ? [] : (_taBackend.buyers  || []).filter(_isValidRec).map(function(r) { return mapRow(r, 'buyer');  });
  _ta.rows = allSeller.concat(allBuyer);
  var sCnt = allSeller.length, bCnt = allBuyer.length;
  hd.innerHTML = _taHdHtml(sCnt, bCnt);
  if (seg) { seg.style.display = (loading || sCnt + bCnt === 0) ? 'none' : ''; seg.innerHTML = _taSegTabsHtml(sCnt, bCnt); }
  body.innerHTML = _taTblHtml();
}

function _taHdHtml(sCnt, bCnt) {
  var ico = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>';
  var total = sCnt + bCnt;
  var sub = total === 0 ? 'Loading…'
    : fmt(sCnt) + ' seller' + (sCnt !== 1 ? 's' : '') + ' · ' + fmt(bCnt) + ' buyer' + (bCnt !== 1 ? 's' : '') + ' · ' + (currentPeriod || 'All') + ' period';
  return '<div class="ta-hd-ico">' + ico + '</div>'
    + '<div class="ta-hd-txt"><div class="ta-hd-title">Transacted Vendors</div>'
    + '<div class="ta-hd-sub">' + sub + '</div></div>'
    + '<button class="ta-hd-close" onclick="closeTaModal()" title="Close">×</button>';
}

function _taSegTabsHtml(sCnt, bCnt) {
  var audHtml = [
    { aud:'seller', lbl:'Sellers (' + fmt(sCnt) + ')' },
    { aud:'buyer',  lbl:'Buyers ('  + fmt(bCnt) + ')' }
  ].map(function(a) {
    return '<button class="ta-seg-tab' + (_ta.aud === a.aud ? ' active' : '') + '" onclick="taSetAud(\'' + a.aud + '\')">' + a.lbl + '</button>';
  }).join('');
  var catHtml = ['All', 'Metal', 'Plastic'].map(function(c) {
    return '<button class="ta-seg-tab' + (_ta.cat === c ? ' active' : '') + '" onclick="taSetCat(\'' + c + '\')">' + c + '</button>';
  }).join('');
  return audHtml + '<span style="width:1px;background:var(--border);align-self:stretch;margin:0 4px;flex-shrink:0"></span>' + catHtml;
}

function _taFiltered() {
  var rows = _ta.rows.filter(function(r) { return r.audience === _ta.aud; });
  if (_ta.cat !== 'All') rows = rows.filter(function(r) { return r._normCat === _ta.cat; });
  var q = (_ta.q || '').toLowerCase().trim();
  if (q) rows = rows.filter(function(r) {
    return (r.name || '').toLowerCase().indexOf(q) >= 0
        || (r.id || '').toLowerCase().indexOf(q) >= 0
        || (r.state || '').toLowerCase().indexOf(q) >= 0
        || (r._normCat || '').toLowerCase().indexOf(q) >= 0
        || (r.vendorType || '').toLowerCase().indexOf(q) >= 0;
  });
  return rows;
}

function _taSorted(rows) {
  var k = _ta.sk, d = _ta.sd;
  return rows.slice().sort(function(a, b) {
    if (k === 'txnValue' || k === 'txnCount') return d * ((+(a[k]||0)) - (+(b[k]||0)));
    if (k === 'avgTxnValue') {
      var aAvg = (a.txnCount && a.txnValue) ? a.txnValue / a.txnCount : 0;
      var bAvg = (b.txnCount && b.txnValue) ? b.txnValue / b.txnCount : 0;
      return d * (aAvg - bAvg);
    }
    if (k === 'txnDate') return d * (_taDateNum(a.txnDate) - _taDateNum(b.txnDate));
    return d * String(a[k]||'').localeCompare(String(b[k]||''));
  });
}

function _taTblHtml() {
  var filtered = _taFiltered();
  var sorted   = _taSorted(filtered);
  var total    = sorted.length;
  var pgSz = _ta.pgSz, pg = _ta.pg;
  var start = pg * pgSz;
  var page  = sorted.slice(start, start + pgSz);
  var maxPg = Math.max(0, Math.ceil(total / pgSz) - 1);

  var uniqueVendors = filtered.length;
  var totalTxns  = filtered.reduce(function(s, r) { return s + (r.txnCount || 0); }, 0);
  var totalGMV   = filtered.reduce(function(s, r) { return s + (r.txnValue || 0); }, 0);
  var avgPerVend = uniqueVendors ? (totalTxns / uniqueVendors) : 0;
  var avgTxnVal  = totalTxns ? (totalGMV / totalTxns) : 0;

  var metricsHtml = '<div class="ta-metrics">'
    + _taMetricCard('Unique Vendors',     fmt(uniqueVendors),                            '#005DFF')
    + _taMetricCard('Total Transactions', fmt(totalTxns),                                '#1DC797')
    + _taMetricCard('Total GMV',          totalGMV > 0 ? fmtINR(totalGMV) : '—',        '#FF9F0A')
    + _taMetricCard('Avg Txns / Vendor',  avgPerVend > 0 ? avgPerVend.toFixed(1) : '—', 'var(--txt2)')
    + _taMetricCard('Avg Txn Value',      avgTxnVal  > 0 ? fmtINR(avgTxnVal)  : '—',   'var(--txt2)')
    + '</div>';

  if (!total) {
    return metricsHtml + '<div class="ta-no-data">'
      + (_taBackend.sellers === null ? 'Loading vendor data…'
        : 'No transacted ' + _ta.aud + 's' + (_ta.cat !== 'All' ? ' with <em>' + esc(_ta.cat) + '</em> category' : '') + ' in the current period.')
      + '</div>';
  }

  var cols = [
    { key:'name',        lbl:'Company Name'     },
    { key:'id',          lbl:'Vendor ID'        },
    { key:'vendorType',  lbl:'Vendor Type'      },
    { key:'_normCat',    lbl:'Category'         },
    { key:'state',       lbl:'State'            },
    { key:'txnCount',    lbl:'Transaction Count'},
    { key:'txnValue',    lbl:'Total GMV'        },
    { key:'avgTxnValue', lbl:'Avg Txn Value'    },
    { key:'txnDate',     lbl:'Last Txn Date'    },
  ];
  var thHtml = cols.map(function(c) {
    var isAsc  = _ta.sk === c.key && _ta.sd ===  1;
    var isDesc = _ta.sk === c.key && _ta.sd === -1;
    var cls = isAsc ? 'ta-th-asc' : isDesc ? 'ta-th-desc' : '';
    return '<th class="' + cls + '" onclick="taSrt(\'' + c.key + '\')">'
      + esc(c.lbl) + '<span class="s-ic">' + (isAsc ? '&#9650;' : isDesc ? '&#9660;' : '&#9651;') + '</span></th>';
  }).join('');

  var trHtml = page.map(function(r) {
    var avg = (r.txnCount && r.txnValue) ? r.txnValue / r.txnCount : 0;
    var catBg  = r._normCat === 'Plastic' ? 'rgba(255,159,10,.15)' : r._normCat === 'Metal' ? 'rgba(29,199,151,.12)' : 'rgba(99,99,102,.12)';
    var catClr = r._normCat === 'Plastic' ? '#B25000' : r._normCat === 'Metal' ? '#0A7044' : '#636366';
    return '<tr class="ta-vl-row">'
      + '<td><strong>' + esc(r.name||'—') + '</strong></td>'
      + '<td style="font-family:monospace;font-size:11px;color:var(--txt3)">' + esc(r.id||'—') + '</td>'
      + '<td>' + esc(r.vendorType||'—') + '</td>'
      + '<td>' + (r._normCat !== 'Other' ? '<span class="ta-cat-badge" style="background:' + catBg + ';color:' + catClr + '">' + esc(r._normCat) + '</span>' : '—') + '</td>'
      + '<td>' + esc(r.state||'—') + '</td>'
      + '<td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600">' + (r.txnCount > 0 ? fmt(r.txnCount) : '—') + '</td>'
      + '<td style="text-align:right">' + (r.txnValue > 0 ? fmtINR(r.txnValue) : '—') + '</td>'
      + '<td style="text-align:right">' + (avg > 0 ? fmtINR(avg) : '—') + '</td>'
      + '<td>' + esc(r.txnDate !== '—' ? r.txnDate : '—') + '</td>'
      + '</tr>';
  }).join('');

  if (!trHtml) {
    trHtml = '<tr><td colspan="9" class="ta-no-data">'
      + (_ta.q ? 'No match for &ldquo;' + esc(_ta.q) + '&rdquo;' : 'No vendors found.') + '</td></tr>';
  }

  return metricsHtml
    + '<div class="ta-toolbar"><input class="ta-search" type="text" placeholder="Search name, ID, state, type…" value="' + esc(_ta.q) + '" oninput="taSetQ(this.value)">'
    + '<span class="ta-count">' + total + ' vendor' + (total !== 1 ? 's' : '') + '</span></div>'
    + '<div class="ta-vl-wrap"><table class="ta-vl-tbl"><thead><tr>' + thHtml + '</tr></thead><tbody>' + trHtml + '</tbody></table></div>'
    + '<div class="ta-pg"><span>Showing ' + (total ? start+1 : 0) + '–' + Math.min(start+pgSz,total) + ' of ' + total + '</span>'
    + '<div class="ta-pg-btns">'
    + '<button class="ta-pg-btn" onclick="taPg(-1)"' + (pg<=0 ? ' disabled' : '') + '>‹ Prev</button>'
    + '<button class="ta-pg-btn" onclick="taPg(1)"'  + (pg>=maxPg ? ' disabled' : '') + '>Next ›</button>'
    + '</div></div>';
}

function _taMetricCard(lbl, val, color) {
  return '<div class="ta-metric-card">'
    + '<div class="ta-metric-val" style="color:' + color + '">' + val + '</div>'
    + '<div class="ta-metric-lbl">' + esc(lbl) + '</div>'
    + '</div>';
}

function taSetAud(aud) { _ta.aud = aud; _ta.pg = 0; _taRender(); }
function taSetCat(cat) { _ta.cat = cat; _ta.pg = 0; _taRender(); }
function taSetQ(v)     { _ta.q = v; _ta.pg = 0; _taRender(); }
function taSrt(key)    { _ta.sd = (_ta.sk === key) ? -_ta.sd : -1; _ta.sk = key; _ta.pg = 0; _taRender(); }
function taPg(d) {
  var max = Math.max(0, Math.ceil(_taFiltered().length / _ta.pgSz) - 1);
  _ta.pg = Math.max(0, Math.min(_ta.pg + d, max));
  _taRender();
}

// ═══════════════════════════════════════════════════════════════
// SPOTLIGHT SEARCH — ⌘K / Ctrl+K command palette
// ═══════════════════════════════════════════════════════════════
var spActiveIdx = -1;
var spCurrentItems = [];

function spBuildItems(query) {
  var q = (query || '').toLowerCase().trim();
  var items = [];

  // ── Navigation ──
  var navItems = [
    { ic:'⊞', title:'Dashboard Overview', sub:'All verticals, onboarding pipeline', action:function(){switchView('onboarding')}, badge:'View' },
    { ic:'₹', title:'GST Payables', sub:'Vendor register, outstanding balances', action:function(){switchView('gst')}, badge:'View' },
  ];
  // Add verticals from config
  var cfgList = (typeof getVertCfg === 'function') ? getVertCfg() : [];
  cfgList.forEach(function(cfg) {
    navItems.push({ ic:cfg.name.charAt(0), title:cfg.name, sub:'View ' + cfg.name + ' vertical detail', action:function(k){return function(){openVertDetail(k)}}(cfg.key), badge:'Vertical' });
  });

  // ── Actions ──
  var actionItems = [
    { ic:'↻', title:'Refresh Data', sub:'Reload the latest data from source', action:function(){refreshActive()}, badge:'Action' },
  ];

  // ── Period filters (shown when on overview) ──
  var periodItems = [
    { ic:'D', title:'Today', sub:'Onboarding activity for today', action:function(){onPeriodSelect('Today')}, badge:'Period' },
    { ic:'MTD', title:'For the Month', sub:'From 1st of current month to today', action:function(){onPeriodSelect('MTD')}, badge:'Period' },
    { ic:'YTD', title:'YTD – Year to Date', sub:'From Apr 1 of current financial year', action:function(){onPeriodSelect('YTD')}, badge:'Period' },
    { ic:'All', title:'All Time', sub:'Complete onboarding history', action:function(){onPeriodSelect('All')}, badge:'Period' },
  ];

  var all = navItems.concat(actionItems, periodItems);
  if (q) {
    all = all.filter(function(i) {
      return i.title.toLowerCase().indexOf(q) !== -1 || (i.sub || '').toLowerCase().indexOf(q) !== -1;
    });
  }
  return all;
}

function spRender(query) {
  var items = spBuildItems(query);
  spCurrentItems = items;
  spActiveIdx = items.length > 0 ? 0 : -1;
  var res = document.getElementById('sp-results');
  if (!res) return;
  if (!items.length) {
    res.innerHTML = '<div class="sp-empty">No results for "<b>' + esc(query) + '</b>"</div>';
    return;
  }
  res.innerHTML = items.map(function(item, i) {
    return '<div class="sp-item' + (i === 0 ? ' sp-active' : '') + '" data-sp-i="' + i + '" onclick="spSelect(' + i + ')" onmouseover="spHover(' + i + ')">'
      + '<div class="sp-item-ic">' + esc(item.ic) + '</div>'
      + '<div class="sp-item-body"><div class="sp-item-title">' + esc(item.title) + '</div>'
      + (item.sub ? '<div class="sp-item-sub">' + esc(item.sub) + '</div>' : '')
      + '</div>'
      + (item.badge ? '<span class="sp-item-badge">' + esc(item.badge) + '</span>' : '')
      + '</div>';
  }).join('');
}

function spHover(i) { spActiveIdx = i; spHighlight(); }

function spHighlight() {
  document.querySelectorAll('#sp-results .sp-item').forEach(function(el, i) {
    el.classList.toggle('sp-active', i === spActiveIdx);
  });
}

function spFilter(val) { spRender(val); }

function spSelect(i) {
  var item = spCurrentItems[i];
  if (!item) return;
  closeSpotlight();
  setTimeout(function() { item.action(); }, 50);
}

function spKeydown(e) {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    spActiveIdx = Math.min(spActiveIdx + 1, spCurrentItems.length - 1);
    spHighlight();
    var active = document.querySelector('#sp-results .sp-item.sp-active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    spActiveIdx = Math.max(spActiveIdx - 1, 0);
    spHighlight();
    var active = document.querySelector('#sp-results .sp-item.sp-active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    if (spActiveIdx >= 0) spSelect(spActiveIdx);
  } else if (e.key === 'Escape') {
    closeSpotlight();
  }
}

function openSpotlight() {
  var overlay = document.getElementById('spotlight-overlay');
  if (!overlay) return;
  overlay.style.display = 'flex';
  spRender('');
  var input = document.getElementById('sp-input');
  if (input) { input.value = ''; setTimeout(function() { input.focus(); }, 50); }
  document.body.style.overflow = 'hidden';
}

function closeSpotlight() {
  var overlay = document.getElementById('spotlight-overlay');
  if (overlay) overlay.style.display = 'none';
  document.body.style.overflow = '';
}

// ⌘K / Ctrl+K global shortcut
document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    var overlay = document.getElementById('spotlight-overlay');
    if (overlay && overlay.style.display !== 'none') {
      closeSpotlight();
    } else {
      openSpotlight();
    }
  }
  if (e.key === 'Escape') {
    var overlay = document.getElementById('spotlight-overlay');
    if (overlay && overlay.style.display !== 'none') closeSpotlight();
  }
});
</script>
</body>
