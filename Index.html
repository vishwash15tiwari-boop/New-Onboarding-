}

function renderVertTabBar() {
  var bar = document.getElementById('vert-tabs-bar');
  if (!bar) return;
  var cfg = getVertCfg();
  bar.innerHTML = cfg.map(function(c) {
    var isActive = c.key === activeVertKey;
    return '<button class="vert-tab' + (isActive ? ' active' : '') + '"'
      + ' data-key="' + esc(c.key) + '"'
      + ' style="' + vcVars(c.key) + '"'
      + ' onclick="selectVertTab(\'' + c.key + '\')">'
      + esc(c.name)
      + '</button>';
  }).join('')
  + '<button class="vert-tab vert-tab-gst" onclick="switchView(\'gst\')">GST Payables</button>';
  positionVertThumb(false);
}

// ── Liquid tab thumb — the white pill that slides between vertical tabs.
//    Recreated on every bar re-render (innerHTML wipes it); positioned from
//    the active tab's box. animate=false snaps (first paint, resize, refresh).
function positionVertThumb(animate) {
  var bar = document.getElementById('vert-tabs-bar');
  if (!bar) return;
  var active = bar.querySelector('.vert-tab.active');
  var thumb  = bar.querySelector('.vert-tab-thumb');
  if (!active) { if (thumb) thumb.style.width = '0px'; return; }
  if (!active.offsetWidth) return;   // bar hidden (GST view) — keep last position
  if (!thumb) {
    thumb = document.createElement('div');
    thumb.className = 'vert-tab-thumb';
    bar.insertBefore(thumb, bar.firstChild);
  }
  bar.classList.add('has-thumb');
  var instant = animate === false || !motionOK();
  if (instant) thumb.style.transition = 'none';
  thumb.style.width = active.offsetWidth + 'px';
  thumb.style.transform = 'translateX(' + active.offsetLeft + 'px)';
  if (instant) requestAnimationFrame(function() { thumb.style.transition = ''; });
}
window.addEventListener('resize', function() { positionVertThumb(false); });
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function() { positionVertThumb(false); });
}

function renderVertCtxHdr(key) {
  var el = document.getElementById('vert-ctx-hdr');
  if (!el) return;
  if (currentView === 'gst' || !key) { el.innerHTML = ''; return; }
  var cfg = getVertCfg().filter(function(c) { return c.key === key; })[0];
  if (!cfg) { el.innerHTML = ''; return; }
  el.setAttribute('style', vcVars(key));
  el.innerHTML = '<span class="vert-ctx-code">' + esc(cfg.code || cfg.key) + '</span>'
    + '<span class="vert-ctx-name">' + esc(cfg.name) + '</span>';
}

function selectVertTab(key) {
  if (activeVertKey === key) return;
  activeVertKey = key;
  selectedVert  = key;
  // Reset rows — new vertical, fresh load
  vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '' };
  vdSort = { key: '', dir: 1 };
  vertRows = []; vertRowsLoading = true; vertRowsError = null;
  _vertRowsPKey = null; ++_vertRowsGen;
  // Update tab active states in-place (faster than full re-render)
  var actTab = null;
  document.querySelectorAll('.vert-tab[data-key]').forEach(function(t) {
    t.classList.toggle('active', t.dataset.key === key);
    if (t.dataset.key === key) { t.setAttribute('style', vcVars(key)); actTab = t; }
  });
  positionVertThumb(true);
  setAura(key);
  if (actTab && actTab.scrollIntoView) {
    try { actTab.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'nearest', inline: 'nearest' }); } catch (e) {}
  }
  renderVertCtxHdr(key);
  renderVertKPIs(key);
  renderPipelinePair(key);
  var detEl = document.getElementById('vert-detail-section');
  if (detEl) detEl.style.display = '';
  renderInlineDetail(key);
  loadVertRows(key);
}

function renderVertKPIs(key) {
  var el = document.getElementById('vert-kpi-row');
  if (!el) return;
  var vs = (DS && DS.verticals || {})[key] || {};
  var vb = (DB && DB.verticals || {})[key] || {};
  var totalS = vs.total || 0, totalB = vb.total || 0;
  var compS  = vs.completed || 0, compB = vb.completed || 0;
  var missS  = vs.missingGST || 0, missB = vb.missingGST || 0;
  var pctTxn = vs.pctTransacted != null ? vs.pctTransacted + '%' : '—';
  var totMiss = missS + missB;
  var vars = vcVars(key);
  function mk(icon, lbl, val, sub, cls, action) {
    return '<div class="vkpi-card' + (cls ? ' ' + cls : '') + '" style="' + vars + '"'
      + ' role="button" tabindex="0"'
      + ' onclick="vkpiOpen(\'' + action + '\')"'
      + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();vkpiOpen(\'' + action + '\')}">'
      + '<div class="vkpi-icon">' + icon + '</div>'
      + '<div class="vkpi-lbl">' + lbl + '</div>'
      + '<div class="vkpi-val">' + val + '</div>'
      + (sub ? '<div class="vkpi-sub">' + sub + '</div>' : '')
      + '</div>';
  }
  function svg(paths) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
  }
  var icFunnel = svg('<path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/>');
  var icCheck  = svg('<circle cx="12" cy="12" r="8.4"/><path d="M8.6 12.4l2.4 2.4 4.4-5"/>');
  var icTrend  = svg('<path d="M3.5 17l5.5-5.5 3.8 3.8L20.5 7.5"/><path d="M14.8 7.5h5.7v5.7"/>');
  var icWarn   = svg('<path d="M12 4.6l8.4 14.6H3.6L12 4.6z"/><path d="M12 10.4v3.6"/><path d="M12 16.9v.01"/>');
  el.innerHTML = [
    mk(icFunnel, 'Total in Pipeline', fmt(totalS + totalB), fmt(totalS) + ' sellers · ' + fmt(totalB) + ' buyers', 'vk-total',    'all'),
    mk(icCheck,  'Onboarded',         fmt(compS + compB),   'Sellers: ' + fmt(compS) + ' · Buyers: ' + fmt(compB), 'vk-onboarded','onboarded'),
    mk(icTrend,  '% Transacted',      pctTxn,               'Seller transacted rate', 'vk-transacted',              'all'),
    mk(icWarn,   'GSTIN Missing',     fmt(totMiss),          'Sellers: ' + fmt(missS) + ' · Buyers: ' + fmt(missB), totMiss > 0 ? 'vk-warn' : 'vk-total', 'missing'),
  ].join('');
  animateCounters(el);
}

function vkpiOpen(action) {
  var aud = selectedAud || 'seller';
  var detEl = document.getElementById('vert-detail-section');
  var rowsReady = vertRows.length > 0 && !vertRowsLoading;
  if (rowsReady && detEl) {
    // Rows already loaded — apply filter shortcut then scroll
    vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '' };
    ['vdf-category','vdf-vendor','vdf-status','vdf-gst'].forEach(function(id) {
      var e = document.getElementById(id); if (e) e.value = 'All';
    });
    var s = document.getElementById('vdf-search'); if (s) s.value = '';
    if (action === 'missing') {
      vdF.gst = 'Inactive';
      var e = document.getElementById('vdf-gst'); if (e) e.value = 'Inactive';
    } else if (action === 'onboarded') {
      vdF.status = 'COMPLETED';
      var e = document.getElementById('vdf-status'); if (e) e.value = 'COMPLETED';
    }
    renderVdRecords();

function buildInlinePipeCard(cfg, v, label, aud, idx) {
  var lblCls = aud === 'seller' ? 'cc-pipe-lbl-seller' : 'cc-pipe-lbl-buyer';
  var isActive = aud === selectedAud;
  var attrs = ' style="--i:' + idx + ';' + vcVars(cfg.key) + '"'
    + ' class="compare-card vpipe-card aud-' + aud + (isActive ? ' det-active' : '') + '"'
    + ' onclick="setDetailAud(\'' + aud + '\')" role="button" tabindex="0"'
    + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();setDetailAud(\'' + aud + '\')}"';
  var ghost = '<span class="cc-ghost" aria-hidden="true">' + (aud === 'seller' ? 'S' : 'B') + '</span>';
  var dotClr = aud === 'seller' ? 'var(--st-onboarded)' : 'var(--st-transacted)';
  var hdr = '<div class="cc-hdr2" style="align-items:center;gap:8px;margin-bottom:12px">'
    + '<span class="pipe-dot" style="background:' + dotClr + '"></span>'
    + '<span class="pipe-title">' + (aud === 'seller' ? 'Sellers' : 'Buyers') + '</span>'
    + '<span class="pipe-sub">Onboarding pipeline</span>'
    + (isActive ? '<span class="pipe-viewing">Viewing below</span>' : '')
    + '</div>';
  var tot = v.total || 0;
  if (!tot) {
    return '<div' + attrs + '>' + ghost + hdr + '<div class="no-data" style="padding:24px 0">No data</div></div>';
  }
  var pipeBoxes = '<div class="cc-pipe">'
    + '<div class="cc-pipe-box cc-pipe-draft"><b>' + fmt(v.draft || 0) + '</b><span>Draft</span></div>'
    + '<div class="cc-pipe-box cc-pipe-review"><b>' + fmt(v.inReview || 0) + '</b><span>In Review</span></div>'
    + '<div class="cc-pipe-box cc-pipe-onb"><b>' + fmt(v.completed || 0) + '</b><span>Completed</span></div>'
    + '</div>';
  var topCats = (v.categories || []).filter(function(c) { return (c.total || 0) > 0; }).slice(0, 3);
  var catRows = topCats.map(function(c) {
    var parts = [];
    if ((c.onboarded || 0) > 0) parts.push('<em>' + fmt(c.onboarded) + ' onboarded</em>');
    if ((c.draft     || 0) > 0) parts.push(fmt(c.draft) + ' draft');
    if ((c.inReview  || 0) > 0) parts.push(fmt(c.inReview) + ' review');
    return '<div class="cc-cat-row"><span class="cc-cat-badge">' + esc(c.category) + '</span>'
      + '<span class="cc-cat-detail">' + parts.join(' · ') + '</span></div>';
  }).join('');
  if (catRows) catRows = '<div class="cc-cat-rows">' + catRows + '</div>';
  var fys = (v.fyBreakdown || []).filter(function(f) { return !f.fyStart || f.fyStart >= 2019; });
  var statsList = '';
  if (fys.length) {
    var aggTAT   = v.avgTAT        != null ? v.avgTAT + 'd'           : null;
    var aggPct   = v.pctTransacted  != null ? v.pctTransacted + '%'   : null;
    var aggGMV   = v.totalTxnValue  != null ? fmtINR(v.totalTxnValue) : null;
    var aggGSTon = v.withGST        != null ? fmt(v.withGST)          : null;
    var aggGSTof = v.missingGST     != null ? fmt(v.missingGST)       : null;
    var fyTr = function(label, valFn, aggVal, badCls) {
      var cells = fys.map(valFn);
      var allEmpty = cells.every(function(c){ return c === null || c === undefined || c === '—'; }) && aggVal == null;
      if (allEmpty) return '';
      return '<tr' + (badCls ? ' class="' + badCls + '"' : '') + '>'
        + '<td class="cc-fy-td-lbl">' + label + '</td>'
        + cells.map(function(c){ return '<td class="cc-fy-td">' + (c != null ? c : '—') + '</td>'; }).join('')
        + '<td class="cc-fy-td cc-fy-all">' + (aggVal != null ? aggVal : '—') + '</td>'
        + '</tr>';
    };
    var hasMissingGST = fys.some(function(f) { return (f.missingGST || 0) > 0; });
    var fyTbody = [
      fyTr('Avg TAT',       function(f){ return f.avgTAT        != null ? f.avgTAT + 'd'           : null; }, aggTAT,   ''),
      fyTr('% Transacted',  function(f){ return f.pctTransacted != null ? f.pctTransacted + '%'   : null; }, aggPct,   ''),
      fyTr('Total GMV',     function(f){ return f.totalTxnValue != null ? fmtINR(f.totalTxnValue) : null; }, aggGMV,   ''),
      fyTr('GSTIN active',  function(f){ return f.withGST       != null ? fmt(f.withGST)          : null; }, aggGSTon, ''),
      fyTr('GSTIN missing', function(f){ return f.missingGST    != null ? fmt(f.missingGST)       : null; }, aggGSTof, hasMissingGST ? 'cc-fy-bad' : ''),
    ].filter(Boolean).join('');
    if (fyTbody) {
      var fyThead = '<thead><tr><th class="cc-fy-th-lbl"></th>'
        + fys.map(function(f){ return '<th class="cc-fy-th">' + esc(f.fy) + '</th>'; }).join('')
        + '<th class="cc-fy-th cc-fy-all">All</th>'
        + '</tr></thead>';
      statsList = '<div class="cc-fy-wrap">'
        + '<table class="cc-fy-tbl">' + fyThead + '<tbody>' + fyTbody + '</tbody></table>'
        + '</div>';
    }
  } else {
    var statRows = [];
    if (v.avgTAT        != null) statRows.push(['Avg TAT',       v.avgTAT + 'd',              '']);
    if (v.pctTransacted != null) statRows.push(['% Transacted',  v.pctTransacted + '%',        '']);
    if (v.totalTxnValue != null && v.totalTxnValue > 0) statRows.push(['Total GMV', fmtINR(v.totalTxnValue), '']);
    if (v.withGST       != null) statRows.push(['GSTIN Active',  fmt(v.withGST),               '']);
    if (v.missingGST    != null) statRows.push(['GSTIN Missing', fmt(v.missingGST),            v.missingGST > 0 ? 'cc-stat-bad' : '']);
    statsList = statRows.length
      ? '<div class="cc-stat-list">' + statRows.map(function(r) {
          return '<div class="cc-stat-row' + (r[2] ? ' ' + r[2] : '') + '">' + r[0] + '<b>' + r[1] + '</b></div>';
        }).join('') + '</div>'
      : '';
  }
  return '<div' + attrs + '>' + ghost + hdr + pipeBoxes + catRows + statsList + '</div>';
}

function openVertDetail(key, aud) {
  aud = aud || 'seller';
  // If a different vertical tab — switch to it, which resets rows and re-renders.
  if (activeVertKey !== key) {
    selectedAud = aud;
    activeVertKey = key;
    selectedVert  = key;
    vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '' };
    vdSort = { key: '', dir: 1 };
    vertRows = []; vertRowsLoading = true; vertRowsError = null;
    _vertRowsPKey = null; ++_vertRowsGen;
    document.querySelectorAll('.vert-tab[data-key]').forEach(function(t) {
      t.classList.toggle('active', t.dataset.key === key);
    });
    renderVertKPIs(key);
    renderPipelinePair(key);
    var detEl = document.getElementById('vert-detail-section');
    if (detEl) detEl.style.display = '';
    renderInlineDetail(key);
    loadVertRows(key);
  } else {
    // Same vertical — just switch audience
    setDetailAud(aud);
  }
  // Scroll to the detail section
  setTimeout(function() {
    var detEl = document.getElementById('vert-detail-section');
    if (detEl) detEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 80);
}

function loadVertRows(key) {
  var myGen = ++_vertRowsGen;
  var f = { audience: selectedAud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  var myPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var lsVKey = STORE_PFX + 'vr_' + selectedAud + '_' + key;

  // SWR: serve cached rows immediately so the panel is never blank
  var swrDone = false;
  try {
    var sv = JSON.parse(localStorage.getItem(lsVKey) || 'null');
    if (sv && sv.pKey === myPKey && Array.isArray(sv.rows)) {
      vertRows = sv.rows;
      _vertRowsPKey = myPKey;
      vertRowsLoading = false;
      vertRowsError = null;
      renderVertDetail();
      swrDone = true;
    }
  } catch (e) {}

  // Always refresh from the server — spinner only shown when there's no SWR data
  if (!swrDone) { vertRowsLoading = true; vertRowsError = null; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (myGen !== _vertRowsGen) return;  // a newer request superseded this one
      vertRowsLoading = false;
      try {
        var data = JSON.parse(res);
        if (data.success && data.vertKey === selectedVert) {
          vertRows = data.rows || [];
          _vertRowsPKey = myPKey;
          // Persist so the next open is instant
          try { localStorage.setItem(lsVKey, JSON.stringify({ pKey: myPKey, rows: data.rows || [] })); } catch (e) {}
        } else if (!data.success && !swrDone) {
          vertRowsError = data.error || 'The server could not load records for this vertical.';
        }
      } catch (e) {
        if (!swrDone) vertRowsError = 'Could not read the server response: ' + e.message;
      }
      renderVertDetail();   // always re-render — never leave the panel stuck on the spinner
    })
    .withFailureHandler(function(err) {
      if (myGen !== _vertRowsGen) return;
      vertRowsLoading = false;
      if (!swrDone) vertRowsError = (err && err.message) ? err.message : 'Server error while loading records.';
      renderVertDetail();
    })
    .getVerticalRows(key, JSON.stringify(f));
}

    var v   = verts[cfg.key] || {};

    if (!tot) return '';

    var vcStyle = 'style="' + vcVars(cfg.key) + '"';
    var pct = v.completionPct || 0;

    // ── Section header ──────────────────────────────────────────────────────
    var hdrHtml = '<div class="vs-hdr">'
      + '<div class="vs-title-wrap">'
      + '<div class="vs-badge">' + cfg.code + '</div>'
      + '<div class="vs-title">' + esc(cfg.name) + '</div>'
      + '<button class="vs-rec-btn" onclick="openVertDetail(\'' + cfg.key + '\')" type="button">View Records →</button>'
      + '</div>'
      + '<div class="vs-hero-stat">'
      + '<div class="vs-hero-count">' + fmt(v.completed || 0) + '</div>'
      + '<div class="vs-hero-lbl">onboarded of ' + fmt(tot) + '</div>'
      + '</div>'
      + '</div>';

    // ── Completion progress bar ──────────────────────────────────────────────
    var progressHtml = '';

    // ── Four pipeline stage boxes ────────────────────────────────────────────
    var pipeHtml = '<div class="vs-pipe">'
      + '<div class="vs-pipe-box vs-pipe-draft" style="--pi:0"><b>' + fmt(v.draft || 0) + '</b><span>Draft</span></div>'
      + '<div class="vs-pipe-box vs-pipe-review" style="--pi:1"><b>' + fmt(v.inReview || 0) + '</b><span>In Review</span></div>'
      + '<div class="vs-pipe-box vs-pipe-onb" style="--pi:2"><b>' + fmt(v.completed || 0) + '</b><span>Onboarded</span></div>'
      + '<div class="vs-pipe-box vs-pipe-rej" style="--pi:3"><b>' + fmt(v.rejected || 0) + '</b><span>Rejected</span></div>'
      + '</div>';

    // ── Compact key metrics strip ────────────────────────────────────────────
    // GMV card: shows total GMV with aging/overdue as a sub-line when present
    var gmvMetric = '';
    if (v.totalTxnValue != null) {
      var agingSub = '';
      if (v.aging != null || v.overdue != null) {
        agingSub = '<div class="vs-aging-sub">';
        if (v.aging   != null) agingSub += 'Aging: <span class="ag-warn">' + fmt(v.aging)   + '</span>';
        if (v.aging != null && v.overdue != null) agingSub += ' · ';
        if (v.overdue != null) agingSub += 'Overdue: <span class="ag-crit">' + fmt(v.overdue) + '</span>';
        agingSub += '</div>';
      }
      gmvMetric = '<div class="vs-metric m-gmv"><b>' + fmtINR(v.totalTxnValue) + '</b><span>Total GMV</span>' + agingSub + '</div>';
    }
    var metArr = [
      ['Avg TAT',        dOr(v.avgTAT, 'd'), ''],
      v.completedThisWeek ? ['Onboarded (7d)', fmt(v.completedThisWeek), ''] : null,
      v.transacted != null ? ['Transacted', fmt(v.transacted) + ' (' + (v.pctTransacted || 0) + '%)', ''] : null,
      v.withGST    != null ? ['GST Active',   fmt(v.withGST),   ''] : null,
      v.missingGST != null ? ['GST Missing',  fmt(v.missingGST), 'm-warn'] : null,
    ].filter(Boolean);
    var metricsHtml = (metArr.length || gmvMetric)
      ? '<div class="vs-metrics">'
        + (gmvMetric || '')
        + metArr.map(function(m) {
            return '<div class="vs-metric' + (m[2] ? ' ' + m[2] : '') + '"><b>' + m[1] + '</b><span>' + m[0] + '</span></div>';
          }).join('')
        + '</div>'
      : '';

    return '<section class="vert-section reveal" id="vs-' + cfg.key + '" ' + vcStyle + '>'
      + hdrHtml + progressHtml + pipeHtml + metricsHtml
      + '</section>';
  }).join('');

  // Animate pipeline boxes and category rows as they scroll into view.
  requestAnimationFrame(function() {
    if (!motionOK()) {
      container.querySelectorAll('.vs-pipe-box,.vs-cat-item').forEach(function(el) {
        el.classList.add('pipe-in','cat-in');
      });
      // Set bar widths immediately
      container.querySelectorAll('.vs-cat-bar-fg').forEach(function(el) {
        el.style.width = (el.getAttribute('data-pct') || '0') + '%';
      });
      return;
    }
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (!e.isIntersecting) return;
        var el  = e.target;
        var idx = parseInt(el.style.getPropertyValue('--pi') || el.style.getPropertyValue('--ci') || '0', 10) || 0;
        setTimeout(function() {
          el.classList.add('pipe-in','cat-in');
          // Animate progress bars inside category items
          el.querySelectorAll('.vs-cat-bar-fg').forEach(function(bar) {
            bar.style.width = (bar.getAttribute('data-pct') || '0') + '%';
          });
        }, idx * 65);
        obs.unobserve(el);
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });
    container.querySelectorAll('.vs-pipe-box,.vs-cat-item').forEach(function(el) { obs.observe(el); });
    // Also animate completion bars that are already in view
    container.querySelectorAll('.vs-progress-fill').forEach(function(el) {
      var w = el.style.width;
      el.style.width = '0';
      requestAnimationFrame(function() { el.style.width = w; });
    });
  });

  // Scroll spy — wired up after DOM is updated
  setTimeout(setupScrollSpy, 200);
}

function vdUnique(rows, field) {
  var seen = {};
  var out = [];
  rows.forEach(function(r) {
    var v = r[field];
    if (v && v !== '—' && !seen[v]) { seen[v] = true; out.push(v); }
  });
  return out.sort();
}

function vdSelect(id, label, options, current, labels) {
  var html = '<div class="filter-group"><span class="filter-label">' + label + '</span>'
    + '<select class="filter-select" id="' + id + '" onchange="vdfChange()">'
    + '<option value="All">All</option>';
  options.forEach(function(o) {
    html += '<option value="' + esc(o) + '"' + (current === o ? ' selected' : '') + '>'
      + esc((labels && labels[o]) || o) + '</option>';
  });
  return html + '</select></div>';
}

// renderVertDetail() is defined above (redirects to renderInlineDetail).
// The old full-overlay implementation has been removed in favour of the inline detail section.

function vdFilteredRows() {
  var _fvd = selectedAud === 'buyer' ? (DB && DB.verticals) : (DS && DS.verticals);
  if (!selectedVert || !_fvd || !_fvd[selectedVert]) return [];
  var rows = vertRows;
  var q = (vdF.search || '').toLowerCase();
  return rows.filter(function(r) {
    if (vdF.category !== 'All' && r.category   !== vdF.category) return false;
    if (vdF.vendor   !== 'All' && r.vendorType !== vdF.vendor)   return false;
    if (vdF.status   !== 'All' && r.status     !== vdF.status)   return false;
    if (vdF.gst === 'Active'   && !r.hasGST) return false;
    if (vdF.gst === 'Inactive' &&  r.hasGST) return false;
    if (q && (r.name  || '').toLowerCase().indexOf(q) === -1
          && (r.gstin || '').toLowerCase().indexOf(q) === -1
          && String(r.id || '').toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function vdSetView(view) {

    btn.classList.toggle('active', btn.textContent.toLowerCase().indexOf(view === 'board' ? 'board' : 'table') !== -1);

function renderVdBoard() {
  var host = document.getElementById('vd-board');

  _rmD = {}; _rmI = 0;   // fresh lookup for the modal

function kbCard(r) {
  var key  = ++_rmI;
  _rmD[key] = r;
  var meta = [r.category, r.vendorType].filter(function(x) { return x && x !== '—'; }).join(' · ');
  var txnChip = '';
  if (r.hasTransacted) {
    var valStr = r.txnValue !== null ? ' · ' + fmtINR(r.txnValue) : '';
    txnChip = '<span class="kb-gst ok" style="background:var(--st-transacted-bg);color:var(--st-transacted-tx);border-color:transparent"'
      + ' title="Transacted' + (r.txnValue !== null ? ' · ₹' + r.txnValue : '') + '">⚡ Txn' + valStr + '</span>';
  } else if (r.status === 'COMPLETED') {
    txnChip = '<span class="kb-gst bad" style="background:var(--bg2);color:var(--txt3);border-color:transparent" title="Onboarded but not yet transacted">— Txn</span>';
  }
  return '<div class="kb-card" onclick="openRecModal(' + key + ')" role="button" tabindex="0"'
    + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openRecModal(' + key + ')}">'
    + '<div class="kb-card-name">' + esc(r.name || '—') + '</div>'
    + '<div class="kb-card-meta">' + esc(r.id) + (meta ? ' · ' + esc(meta) : '') + '</div>'
    + '<div class="kb-card-foot">'
    + '<span class="kb-gst ' + (r.hasGST ? 'ok" title="' + esc(r.gstin) + '">✓ GST' : 'bad">✗ GST') + '</span>'
    + txnChip
    + kbAge(r)
    + '</div></div>';
}

// Onboarded cards show the achieved TAT; open cards show how long they have been sitting.
function kbAge(r) {
  if (r.status === 'COMPLETED') {
    var t = parseInt(r.tat);
    if (isNaN(t)) return '<span class="kb-age text-muted">' + esc(r.onbDate || '—') + '</span>';
    var cls = t <= 2 ? 'text-green' : t <= 5 ? 'text-amber' : 'text-red';
    return '<span class="kb-age ' + cls + '" title="Onboarding TAT">' + t + 'd TAT</span>';
  }
  var d = parseDMY(r.createdDate);
  if (!d) return '<span class="kb-age text-muted">—</span>';
  var days = Math.max(0, Math.round((Date.now() - d.getTime()) / 86400000));
  if (r.status === 'REJECTED') {
    return '<span class="kb-age text-muted" title="Days since created">' + days + 'd</span>';
  }
  var cls2 = days <= 3 ? 'text-muted' : days <= 7 ? 'text-amber' : 'text-red';
  return '<span class="kb-age ' + cls2 + '" title="Days since created — created ' + esc(r.createdDate) + '">' + days + 'd waiting</span>';
}

function parseDMY(s) {
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s || '').trim());
  if (!m) return null;
  var d = new Date(+m[3], +m[2] - 1, +m[1]);
  return isNaN(d.getTime()) ? null : d;
}

// Column sort — clicking a header sorts by that column; a second click reverses it.
function vdSortBy(key) {
  if (vdSort.key === key) vdSort.dir = -vdSort.dir;
  else vdSort = { key: key, dir: 1 };
  renderVdRecords();
}

// Comparable value for a row under a given column key.
function vdSortVal(r, key) {
  if (key === 'tat') {
    var n = parseInt(r.tat, 10);
    return isNaN(n) ? -1 : n;                       // rows without a TAT sort first (asc)
  }
  if (key === 'createdDate' || key === 'onbDate') {
    var d = parseDMY(r[key]);
    return d ? d.getTime() : 0;                     // undated rows sort first (asc)
  }
  if (key === 'txn') {
    // Transacted (by value) > onboarded-but-not-transacted > not applicable
    if (r.hasTransacted) return 1 + (r.txnValue || 0);
    return r.status === 'COMPLETED' ? 0 : -1;
  }
  if (key === 'gstin') return (r.hasGST ? '1' : '0') + String(r.gstin || '').toLowerCase();
  return String(r[key] || '').toLowerCase();
}

function vdSortedRows(filtered) {
  if (!vdSort.key) return filtered;
  var key = vdSort.key, dir = vdSort.dir;
  return filtered.slice().sort(function(a, b) {
    var va = vdSortVal(a, key), vb = vdSortVal(b, key);
    if (va < vb) return -dir;
    if (va > vb) return dir;
    return 0;
  });
}

function renderVdTable() {

  // Sync the ↑/↓ indicator on the column headers with the active sort.
  document.querySelectorAll('#vd-table-view thead th').forEach(function(th) {

    if (th.dataset.key === vdSort.key) th.classList.add(vdSort.dir === 1 ? 'sort-asc' : 'sort-desc');
  });

  tbody.innerHTML = shown.length
    ? shown.map(function(r) {

          txnCell  = '<span class="gst-ok">✓ Transacted</span>' + val + date;
        } else if (r.status === 'COMPLETED') {
          txnCell = '<span style="color:var(--txt3);font-size:11.5px;font-weight:500">— Not yet</span>';
        } else {
          txnCell = '<span class="text-muted">—</span>';
        }
        return '<tr class="vd-tr" onclick="openRecModal(' + key + ')" title="View details">'
          + '<td class="text-muted">' + esc(r.id) + '</td>'
          + '<td><strong>' + esc(r.name || '—') + '</strong></td>'
          + '<td>' + esc(r.category || '—') + '</td>'

          + '<td class="text-muted">' + esc(r.state || '—') + '</td>'
          + '<td class="text-muted">' + esc(r.createdDate) + '</td>'
          + '<td class="text-muted">' + esc(r.onbDate) + '</td>'
          + '<td>' + tatChip(r.tat) + '</td>'
          + '<td style="font-size:11.5px">' + txnCell + '</td>'
          + '</tr>';
      }).join('')
    : '<tr><td colspan="11" class="no-data">No records match the selected filters</td></tr>';

  if (note) {
    note.textContent = 'Showing ' + fmt(shown.length) + ' of ' + fmt(filtered.length)
      + ' matching · ' + fmt(all.length) + ' total · '
      + (vdSort.key ? 'sorted by ' + vdSort.key + (vdSort.dir === 1 ? ' ↑' : ' ↓') : 'latest first');
  }
}

// Called when a category card is clicked — filters the records section to
// that category and scrolls the records into view.
// Show a funnel breakdown card for a single category, in the same bar-chart
// style as the aggregate funnel. Called by filterByCategory().
function renderCatDetailCard(c) {
  var ctot = c.total || 0;
  if (!ctot) return '';

  // Build segment list: Onboarded first, then Draft, In Review, Transacted (if any), Rejected.
  var segs = [
    { key: 'onboarded', n: c.onboarded || 0 },
    { key: 'draft',     n: c.draft     || 0 },
    { key: 'review',    n: c.inReview  || 0 },
    { key: 'rejected',  n: c.rejected  || 0 },
  ];
  if (c.hasTxn) segs.splice(3, 0, { key: 'transacted', n: c.transacted || 0 });
  segs = segs.filter(function(s) { return s.n > 0; });

  // SVG donut chart — each segment is a circle with stroke-dasharray.
  // Segments start at 12 o'clock (−90°) and accumulate clockwise.
  var R = 54, SW = 18, cx = 68, cy = 68;
  var C = 2 * Math.PI * R;
  var GAP = 2.5; // arc-length gap between segments for visual separation
  var cumFrac = 0;

  var rings = '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '"'
    + ' fill="none" stroke="var(--bg2)" stroke-width="' + SW + '"/>'
    + segs.map(function(s, si) {
        var frac = s.n / ctot;
        var dash = Math.max(0, frac * C - GAP);
        var gap  = C - dash;
        var rot  = cumFrac * 360 - 90;
        cumFrac += frac;
        var st = STAGE[s.key];
        return '<circle class="donut-seg" cx="' + cx + '" cy="' + cy + '" r="' + R + '"'
          + ' fill="none" stroke="' + st.fill + '" stroke-width="' + SW + '"'
          + ' stroke-dasharray="' + dash.toFixed(2) + ' ' + gap.toFixed(2) + '"'
          + ' transform="rotate(' + rot.toFixed(2) + ' ' + cx + ' ' + cy + ')"'
          + ' style="animation-delay:' + (140 + si * 110) + 'ms"'
          + '><title>' + st.lbl + ' — ' + fmt(s.n) + ' (' + Math.round(frac * 100) + '%)</title></circle>';
      }).join('');

  // Center text: total count + label (fades in after the rings sweep)
  var centerTxt = '<g class="donut-ctr">'
    + '<text x="' + cx + '" y="63" text-anchor="middle"'
    + ' font-family="Inter,sans-serif" font-size="26" font-weight="800" fill="var(--txt)">' + fmt(ctot) + '</text>'
    + '<text x="' + cx + '" y="78" text-anchor="middle"'
    + ' font-family="Inter,sans-serif" font-size="9.5" font-weight="600" fill="var(--txt3)" letter-spacing="0.4">TOTAL CASES</text>'
    + '</g>';

  // SVG viewBox sized to donut: outer radius = R + SW/2 = 54+9 = 63; center at 68 → total = 68+63 = 131 → use 136
  var svg = '<svg width="136" height="136" viewBox="0 0 136 136" style="flex-shrink:0;display:block">'
    + rings + centerTxt + '</svg>';

  // Legend: each row shows colour swatch, stage label, count, percentage
  var leg = '<div style="flex:1;min-width:150px">'
    + segs.map(function(s, i) {
        var st = STAGE[s.key];
        var pc = Math.round((s.n / ctot) * 100);
        var isPrimary = s.key === 'onboarded';
        return '<div class="donut-leg-row" style="display:flex;align-items:center;gap:10px;padding:' + (i === 0 ? '4' : '7') + 'px 0 7px;border-bottom:1px solid var(--border);animation-delay:' + (180 + i * 70) + 'ms">'
          + '<span style="width:11px;height:11px;border-radius:2px;flex-shrink:0;background:' + st.fill + '"></span>'
          + '<span style="flex:1;font-size:12.5px;font-weight:' + (isPrimary ? '700' : '600') + ';color:var(--txt' + (isPrimary ? '' : '2') + ')">' + st.lbl + '</span>'
          + '<span style="font-size:' + (isPrimary ? '15' : '13.5') + 'px;font-weight:800;color:' + st.fill + ';font-variant-numeric:tabular-nums">' + fmt(s.n) + '</span>'
          + '<span style="font-size:11px;color:var(--txt3);min-width:40px;text-align:right">(' + pc + '%)</span>'
          + '</div>';
      }).join('')
    + '</div>';

  return '<div class="chart-card mt-16">'
    + '<div class="chart-card-title">'
    +   '<span style="font-size:13.5px;font-weight:700;color:var(--txt);text-transform:none;letter-spacing:0">' + esc(c.category) + '</span>'
    +   '<span class="muted-total" style="margin-left:8px">— Category Breakdown</span>'
    +   '<button onclick="filterByCategory(\'All\')" style="margin-left:auto;background:rgba(120,120,128,.12);border:none;border-radius:999px;font-size:11px;font-weight:500;color:var(--txt2);padding:4px 12px;cursor:pointer;font-family:inherit;text-transform:none;letter-spacing:0">✕ Clear</button>'
    + '</div>'
    + '<div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap">'
    +   svg + leg
    + '</div>'
    + '</div>';
}

function showCatDetail(catName, quiet) {
  var wrap = document.getElementById('cat-detail-wrap');
  if (!wrap) return;
  // quiet — re-inject without replaying animations (silent refresh path)
  if (quiet) { wrap.classList.add('no-anim'); } else { wrap.classList.remove('no-anim'); }
  if (!catName || catName === 'All') {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
    return;
  }
  var _scdSrc = selectedAud === 'buyer' ? (DB && DB.verticals) : (DS && DS.verticals);
  var v = _scdSrc && selectedVert && _scdSrc[selectedVert];
  var cats = (v && v.categories) || [];
  var c = null;
  for (var i = 0; i < cats.length; i++) {
    if (cats[i].category === catName) { c = cats[i]; break; }
  }
  if (!c || !c.total) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
  wrap.innerHTML = renderCatDetailCard(c);
  wrap.style.display = 'block';
}

function filterByCategory(cat) {
  vdF.category = cat;
  var el = document.getElementById('vdf-category');
  if (el) {
    var found = false;
    for (var i = 0; i < el.options.length; i++) {
      if (el.options[i].value === cat) { el.value = cat; found = true; break; }
    }
    if (!found) {
      var opt = document.createElement('option');
      opt.value = opt.text = cat;
      el.appendChild(opt);
      el.value = cat;
    }
  }
  showCatDetail(cat);
  renderVdRecords();
  // Scroll to the category detail card if visible, otherwise to the records.
  var target = document.getElementById('cat-detail-wrap');
  if (!target || target.style.display === 'none') {
    target = document.getElementById('vd-board-view') || document.getElementById('vd-table-view');
  }
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function vdfClear() {
  vdF = { category: 'All', vendor: 'All', status: 'All', gst: 'All', search: '' };
  ['vdf-category','vdf-vendor','vdf-status','vdf-gst'].forEach(function(id) {
    var el = document.getElementById(id); if (el) el.value = 'All';
  });
  var s = document.getElementById('vdf-search'); if (s) s.value = '';
  showCatDetail('All');
  renderVdRecords();
}

function loadGSTData(silent) {
  var btn = document.getElementById('btn-refresh');
  if (btn) btn.classList.add('spinning');
  clearTimeout(_refreshTimer);
  clearInterval(_countdownTimer);
  var cd = document.getElementById('refresh-countdown');
  if (cd) cd.textContent = '…';

  var reqYear = gpYear;
  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) btn.classList.remove('spinning');
      if (_isFirstLoad) { hideLoading(); _isFirstLoad = false; }
      try {
        var data = JSON.parse(res);
        if (data.success) {
          try { localStorage.setItem(STORE_PFX + 'gst_' + reqYear, res); } catch (e) {}
          if (currentView === 'gst' && reqYear === gpYear) { GST = data; renderGST(); }
        } else if (currentView === 'gst') {
          showGSTError(data.error || 'No data returned.');
        }
      } catch (e) {
        if (currentView === 'gst') showGSTError('Parse error: ' + e.message);
      }
      scheduleNextRefresh();
    })
    .withFailureHandler(function(err) {
      if (btn) btn.classList.remove('spinning');
      if (_isFirstLoad) { hideLoading(); _isFirstLoad = false; }
      if (currentView === 'gst') showGSTError((err && err.message) ? err.message : 'Server error while loading GST Payables.');
      scheduleNextRefresh();
    })
    .getGSTPayablesData(JSON.stringify({ year: gpYear }));
}

function showGSTError(msg) {
  var host = document.getElementById('tab-gst');
  if (!host) return;
  host.innerHTML = '<div class="gp-card" style="text-align:center;padding:48px 24px">'
    + '<div style="color:var(--gp-red);font-weight:700;font-size:15px;margin-bottom:8px">⚠ Could not load GST Payables</div>'
    + '<div style="color:var(--gp-ink2);margin-bottom:18px;max-width:560px;margin-left:auto;margin-right:auto">' + esc(msg) + '</div>'
    + '<div style="color:var(--gp-ink3);font-size:12px;margin-bottom:18px">If this is a permissions error, share the source sheet with the account that deployed this web app.</div>'
    + '<button onclick="loadGSTData(false)" style="padding:9px 22px;border-radius:999px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">↻ Retry</button>'

}

function gpDonut(segs) {
  var total = segs.reduce(function(a, s) { return a + s.count; }, 0);
  if (!total) return '<div class="gp-empty">No data</div>';
  var cx = 90, cy = 90, r = 66, sw = 24, circ = 2 * Math.PI * r, off = 0;
  var arcs = segs.map(function(s, i) {
    var len = s.count / total * circ, col = GP_STATUS_COLORS[i % GP_STATUS_COLORS.length];
    var el = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '"'
      + ' stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"'
      + ' transform="rotate(-90 ' + cx + ' ' + cy + ')"><title>' + esc(s.label) + ': ' + fmt(s.count) + ' (' + Math.round(s.count / total * 100) + '%)</title></circle>';
    off += len; return el;
  }).join('');
  var legend = segs.map(function(s, i) {
    return '<div class="gp-leg"><span class="gp-leg-dot" style="background:' + GP_STATUS_COLORS[i % GP_STATUS_COLORS.length] + '"></span>'
      + esc(s.label) + ' <b>' + fmt(s.count) + '</b></div>';
  }).join('');
  return '<div class="gp-donut-wrap"><svg viewBox="0 0 180 180" class="gp-donut-svg" role="img" aria-label="GST status breakdown">'
    + arcs
    + '<text x="90" y="86" text-anchor="middle" class="gp-donut-num">' + fmt(total) + '</text>'
    + '<text x="90" y="104" text-anchor="middle" class="gp-donut-lbl">Vendors</text>'
    + '</svg><div class="gp-legend">' + legend + '</div></div>';
}

function gpVBars(items) {
  items = (items || []).slice(0, 8);
  if (!items.length) return '<div class="gp-empty">No data</div>';
  var max = Math.max.apply(null, items.map(function(x) { return x.value; }).concat([1]));
  return '<div class="gp-vbars">' + items.map(function(it, i) {
    var h = Math.max(4, Math.round(it.value / max * 132));
    return '<div class="gp-vbar-col" title="' + esc(it.label) + ': ' + fmtRupee(it.value) + '">'
      + '<div class="gp-vbar" style="height:' + h + 'px;background:' + GP_VERT_COLORS[i % GP_VERT_COLORS.length] + '"></div>'
      + '<div class="gp-vbar-lbl">' + esc(it.label) + '</div></div>';
  }).join('') + '</div>';
}

function gpCompliance(items) {
  var colors = ['var(--gp-orange)', 'var(--gp-gold)', 'var(--gp-green)', 'var(--gp-blue)'];
  if (!items || !items.length) return '<div class="gp-empty">No data</div>';
  return '<div class="gp-comp">' + items.map(function(it, i) {
    return '<div class="gp-comp-row" title="' + esc(it.label) + ': ' + fmt(it.count) + ' vendors (' + it.pct + '%)">'
      + '<span class="gp-comp-lbl">' + esc(it.label) + '</span>'
      + '<div class="gp-comp-track"><div class="gp-comp-fill" style="width:' + it.pct + '%;background:' + colors[i % colors.length] + '"></div></div>'
      + '<span class="gp-comp-val">' + it.pct + '%</span></div>';
  }).join('') + '</div>';
}

// ── Filters ──
function gstFiltersRow() {
  var g = GST;
  var itcVals = gpDistinct(g.rows, 'itcCheck');
  return '<div class="gp-filters">'
    + '<div class="gp-search"><input type="text" class="gp-input" id="gp-search" placeholder="🔍 Search vendor / GST No…" value="' + esc(gpFilters.search) + '" oninput="gpSearchDeb()"></div>'
    + gpSelect('gp-status', 'GST Status', g.gstStatus.map(function(s) { return s.label; }), gpFilters.status)
    + gpSelect('gp-vertical', 'Vertical', g.verticals.map(function(s) { return s.label; }), gpFilters.vertical)
    + gpSelect('gp-msme', 'MSME', g.msme.map(function(s) { return s.label; }), gpFilters.msme)
    + gpSelect('gp-itc', 'ITC Check', itcVals, gpFilters.itc)
    + '</div>';
}
function gpSelect(id, label, options, current) {
  var opts = '<option value="All">' + esc(label) + ': All</option>'
    + options.map(function(o) { return '<option value="' + esc(o) + '"' + (current === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('');
  return '<div class="gp-select-wrap"><select class="gp-select" id="' + id + '" onchange="gpFilterChange()">' + opts + '</select></div>';
}
function gpDistinct(rows, field) {
  var seen = {}, out = [];
  rows.forEach(function(r) { var v = r[field]; if (v && !seen[v]) { seen[v] = true; out.push(v); } });
  return out.sort();
}

// ── Vendor register table ──
function gstTableShell() {
  var cols = [
    ['name', 'Vendor', false], ['gstNo', 'GST No', false], ['gstStatus', 'Status', false],
    ['vertical', 'Vertical', false], ['msme', 'MSME', false], ['total', 'Total Balance', true],
    ['material', 'Material Balance', true], ['gst', 'GST Balance', true],
  ];
  return '<div class="gp-table-card">'
    + '<div class="gp-table-head"><div class="gp-card-title">Vendor Register</div>'
    +   '<div class="gp-card-sub" id="gp-table-sub">GST Payables Register</div></div>'
    + '<div class="gp-table-scroll"><table class="gp-table"><thead><tr>'
    + cols.map(function(c) {
        return '<th class="' + (c[2] ? 'gp-num' : '') + '" data-key="' + c[0] + '" onclick="gpSortBy(\'' + c[0] + '\')">' + c[1] + '</th>';
      }).join('')
    + '</tr></thead><tbody id="gp-tbody"></tbody></table></div>'
    + '<div class="gp-table-note" id="gp-table-note"></div>'
    + '</div>';
}

function gpFilteredRows() {
  if (!GST) return [];
  var q = (gpFilters.search || '').toLowerCase();
  return GST.rows.filter(function(r) {
    if (gpFilters.status   !== 'All' && r.gstStatus !== gpFilters.status)   return false;
    if (gpFilters.vertical !== 'All' && r.vertical  !== gpFilters.vertical) return false;
    if (gpFilters.msme     !== 'All' && r.msme      !== gpFilters.msme)     return false;
    if (gpFilters.itc      !== 'All' && r.itcCheck  !== gpFilters.itc)      return false;
    if (q && (r.name || '').toLowerCase().indexOf(q) === -1
          && (r.gstNo || '').toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function gpSortRows(rows) {
  var key = gpSort.key, dir = gpSort.dir;
  var numeric = (key === 'total' || key === 'material' || key === 'gst');
  return rows.slice().sort(function(a, b) {
    var va = numeric ? (a[key] || 0) : String(a[key] || '').toLowerCase();
    var vb = numeric ? (b[key] || 0) : String(b[key] || '').toLowerCase();
    if (va < vb) return -dir;
    if (va > vb) return dir;
    return 0;
  });
}

function gpSortBy(key) {
  if (gpSort.key === key) gpSort.dir = -gpSort.dir;
  else gpSort = { key: key, dir: (key === 'total' || key === 'material' || key === 'gst') ? -1 : 1 };
  renderGSTVendorTable();
}

function renderGSTVendorTable() {
  var tbody = document.getElementById('gp-tbody');
  var note = document.getElementById('gp-table-note');
  var sub = document.getElementById('gp-table-sub');
  if (!tbody || !GST) return;

  var filtered = gpSortRows(gpFilteredRows());
  var shown = filtered.slice(0, GP_MAX_ROWS);
  var sumTotal = filtered.reduce(function(a, r) { return a + (r.total || 0); }, 0);

  document.querySelectorAll('#tab-gst .gp-table thead th').forEach(function(th) {
    th.classList.remove('gp-sort-asc', 'gp-sort-desc');
    if (th.dataset.key === gpSort.key) th.classList.add(gpSort.dir === 1 ? 'gp-sort-asc' : 'gp-sort-desc');
  });

  tbody.innerHTML = shown.length ? shown.map(function(r) {
    return '<tr>'
      + '<td><span class="gp-vname">' + esc(r.name || '—') + '</span></td>'
      + '<td><span class="gp-gstno">' + esc(r.gstNo || '—') + '</span></td>'
      + '<td>' + gpStatusChip(r.gstStatus) + '</td>'
      + '<td>' + esc(r.vertical || '—') + '</td>'
      + '<td><span class="gp-chip neutral">' + esc(r.msme || '—') + '</span></td>'
      + '<td class="gp-num"><span class="gp-amt">' + fmtRupee(r.total) + '</span></td>'
      + '<td class="gp-num"><span class="gp-amt muted">' + fmtRupee(r.material) + '</span></td>'
      + '<td class="gp-num"><span class="gp-amt muted">' + fmtRupee(r.gst) + '</span></td>'
      + '</tr>';
  }).join('') : '<tr><td colspan="8" class="gp-empty">No vendors match the selected filters</td></tr>';

  if (sub) sub.textContent = fmt(GST.vendorCount) + ' vendors · GST Payables Register'
    + (gpYear !== 'All' ? ' · ' + fyFull(gpYear) : '');
  if (note) note.textContent = 'Showing ' + fmt(shown.length) + ' of ' + fmt(filtered.length)
    + ' vendors · combined balance ' + fmtRupee(sumTotal)
    + (filtered.length > GP_MAX_ROWS ? ' · refine filters to see all' : '');
}

function gpStatusChip(status) {
  var s = String(status || '').toLowerCase();
  var cls = 'neutral';
  if (s.indexOf('cancel') !== -1) cls = 'cancelled';
  else if (s.indexOf('suspend') !== -1) cls = 'suspended';
  else if (s.indexOf('inactive') !== -1) cls = 'inactive';
  else if (s.indexOf('active') !== -1) cls = 'active';
  return '<span class="gp-chip ' + cls + '">' + esc(status || '—') + '</span>';
}

function gpVal(id) { var el = document.getElementById(id); return el ? el.value : 'All'; }
function gpFilterChange() {
  gpFilters.status   = gpVal('gp-status');
  gpFilters.vertical = gpVal('gp-vertical');
  gpFilters.msme     = gpVal('gp-msme');
  gpFilters.itc      = gpVal('gp-itc');
  renderGSTVendorTable();
}
var gpSearchTimer;
function gpSearchDeb() {
  var el = document.getElementById('gp-search');
  gpFilters.search = el ? el.value : '';
  clearTimeout(gpSearchTimer);
  gpSearchTimer = setTimeout(renderGSTVendorTable, 250);
}

function animateGSTCounters() {
  if (typeof motionOK === 'function' && !motionOK()) return;   // respect reduced-motion
  document.querySelectorAll('#tab-gst .gp-kpi-val[data-count]').forEach(function(el) {
    var target = parseFloat(el.getAttribute('data-count')) || 0, dur = 850, start = null;
    function step(ts) {
      if (!start) start = ts;
      var p = Math.min(1, (ts - start) / dur), eased = 1 - Math.pow(1 - p, 3);
      el.textContent = fmtRupee(Math.round(target * eased));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

// ── GST formatting helpers ──
// Full Indian-grouped rupee value: ₹4,00,42,207
function fmtRupee(v) {
  if (v === null || v === undefined || isNaN(v)) return '₹0';
  return '₹' + Math.round(v).toLocaleString('en-IN');
}
// 'FY 21-22' → '2021-22'  (financial years here are all in the 2000s)
function fyFull(fy) {
  var m = String(fy || '').match(/(\d{2})-(\d{2})/);
  return m ? '20' + m[1] + '-' + m[2] : String(fy || '');
}
// 'FY 21-22' → '21-22'
function fyShort(fy) { return String(fy || '').replace(/^FY\s*/, ''); }

// ═══════════════════════════════════════════════════════════════
// SCROLL REVEAL — D.E. Shaw editorial entrance pattern
// IntersectionObserver fires .visible the moment each .reveal
// element crosses an 8% threshold.  The .reveal CSS rule
// (opacity:0 → 1, translateY 22px → 0) plays the transition.
// Only runs when OS motion is permitted.
// ═══════════════════════════════════════════════════════════════
(function initReveal() {
  if (!window.IntersectionObserver) return;
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        var delay = (parseInt(e.target.getAttribute('data-ri') || '0', 10) || 0) * 8;
        if (delay) {
          setTimeout(function() { e.target.classList.add('visible'); }, delay);
        } else {
          e.target.classList.add('visible');
        }
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.06, rootMargin: '0px 0px -32px 0px' });

  function observe() {
    if (motionOK()) {
      document.querySelectorAll('.reveal:not(.visible)').forEach(function(el) { io.observe(el); });
    } else {
      document.querySelectorAll('.reveal').forEach(function(el) { el.classList.add('visible'); });
    }
  }

  if (document.readyState !== 'loading') { observe(); }
  else { document.addEventListener('DOMContentLoaded', observe); }

  var _origRenderAll = window.renderAll;
  window.renderAll = function() {
    if (_origRenderAll) _origRenderAll.apply(this, arguments);
    requestAnimationFrame(observe);
  };
})();

var snActiveKey = null;    // which vertical's section is active (scroll spy)
var snVertsOpen = false;   // sidebar verticals list collapsed by default
var _scrollSpyObs = null;  // IntersectionObserver instance for scroll spy

    html += '<div class="sn-subs sn-open">';
    cfgList.forEach(function(cfg) {

        + ' data-key="' + esc(cfg.key) + '"'

        + ' onclick="snSelectVert(\'' + cfg.key + '\')">'
        + '<span class="sn-sub-dot"></span>'
        + '<span class="sn-sub-lbl">' + esc(cfg.name) + '</span>'
        + '</button>';
    });

  // ── Separator + GST Payables ───────────────────────────────

// Called when a group header (Sellers/Buyers) is clicked.
function snSelectGroup(aud) {
  snActiveKey = null;
  switchAudience(aud);
}

// Called when a vertical sub-item is clicked — opens the detail panel.
function snSelectVert(key) {
  snActiveKey = key;
  openVertDetail(key);
}

// IntersectionObserver scroll spy — highlights the sidebar item matching the
// section closest to the top of the viewport.
function setupScrollSpy() {
  if (_scrollSpyObs) { _scrollSpyObs.disconnect(); _scrollSpyObs = null; }
  if (!window.IntersectionObserver) return;

  var sections = document.querySelectorAll('.vert-section[id^="vs-"]');
  if (!sections.length) return;

  _scrollSpyObs = new IntersectionObserver(function(entries) {
    var best = null, bestRatio = 0;
    entries.forEach(function(e) {
      if (e.isIntersecting && e.intersectionRatio > bestRatio) {
        bestRatio = e.intersectionRatio;
        best = e.target;
      }
    });
    if (!best) return;
    var key = best.id.replace('vs-', '');
    if (key === snActiveKey) return;
    snActiveKey = key;
  }, { threshold: [0.1, 0.25, 0.5], rootMargin: '-64px 0px -40% 0px' });

  sections.forEach(function(sec) { _scrollSpyObs.observe(sec); });
}

// ═══════════════════════════════════════════════════════════════
// UTILITY
// ═══════════════════════════════════════════════════════════════
function set(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }
function dOr(v, suffix) { return (v === null || v === undefined) ? '—' : v + (suffix || ''); }
function fmt(n) { return Number(n || 0).toLocaleString('en-IN'); }
function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtINR(v) {
  if (v === null || v === undefined || isNaN(parseFloat(v))) return '—';
  v = parseFloat(v);
  if (v >= 1e7) {
    var cr = v / 1e7;
    // Large Crore values (≥100 Cr) get Indian grouping and no decimals: "₹35,793 Cr"
    // Smaller Crore values keep 2 decimal places: "₹87.75 Cr"
    var s = cr >= 100
      ? cr.toLocaleString('en-IN', { maximumFractionDigits: 0 })
      : cr.toFixed(2);
    return '₹' + s + ' Cr';
  }
  if (v >= 1e5) return '₹' + (v / 1e5).toFixed(2) + ' L';
  if (v >= 1000) return '₹' + (v / 1000).toFixed(1) + ' K';
  return '₹' + Math.round(v).toLocaleString('en-IN');
}

function statusChip(s) {
  var cls = { COMPLETED: 'chip-completed', DRAFT: 'chip-draft', IN_REVIEW: 'chip-review', REJECTED: 'chip-rejected' };
  return '<span class="status-chip ' + (cls[s] || '') + '">' + esc(STATUS_LABELS[s] || s || '—') + '</span>';
}
function tatChip(t) {
  // 0 is a valid TAT (same-day onboarding) — only null/undefined/'—' mean "no TAT".
  if (t === null || t === undefined || t === '' || t === '—') return '<span class="text-muted">—</span>';
  var n = parseInt(t, 10);
  if (isNaN(n)) return '<span class="text-muted">' + esc(t) + '</span>';
  var cls = n <= 2 ? 'text-green' : n <= 5 ? 'text-amber' : 'text-red';
  return '<span class="' + cls + '">' + n + 'd</span>';
}

// ═══════════════════════════════════════════════════════════════
// SPOTLIGHT SEARCH — ⌘K / Ctrl+K command palette
// ═══════════════════════════════════════════════════════════════
var spActiveIdx = -1;
var spCurrentItems = [];

function spBuildItems(query) {
  var q = (query || '').toLowerCase().trim();
  var items = [];

  // ── Navigation ──
  var navItems = [
    { ic:'⊞', title:'Dashboard Overview', sub:'All verticals, onboarding pipeline', action:function(){switchView('onboarding')}, badge:'View' },
    { ic:'₹', title:'GST Payables', sub:'Vendor register, outstanding balances', action:function(){switchView('gst')}, badge:'View' },
  ];
  // Add verticals from config
  var cfgList = (typeof getVertCfg === 'function') ? getVertCfg() : [];
  cfgList.forEach(function(cfg) {
    navItems.push({ ic:cfg.name.charAt(0), title:cfg.name, sub:'View ' + cfg.name + ' vertical detail', action:function(k){return function(){openVertDetail(k)}}(cfg.key), badge:'Vertical' });
  });

  // ── Actions ──
  var actionItems = [
    { ic:'↻', title:'Refresh Data', sub:'Reload the latest data from source', action:function(){refreshActive()}, badge:'Action' },
  ];

  // ── Period filters (shown when on overview) ──
  var periodItems = [
    { ic:'D', title:'Daily View', sub:'Onboarding activity for today', action:function(){onPeriodSelect('Today')}, badge:'Period' },
    { ic:'W', title:'Weekly View', sub:'This week\'s onboarding activity', action:function(){onPeriodSelect('ThisWeek')}, badge:'Period' },
    { ic:'M', title:'Monthly View', sub:'This month\'s onboarding activity', action:function(){onPeriodSelect('ThisMonth')}, badge:'Period' },
    { ic:'All', title:'All Time', sub:'Complete onboarding history', action:function(){onPeriodSelect('All')}, badge:'Period' },
  ];

  var all = navItems.concat(actionItems, periodItems);
  if (q) {
    all = all.filter(function(i) {
      return i.title.toLowerCase().indexOf(q) !== -1 || (i.sub || '').toLowerCase().indexOf(q) !== -1;
    });
  }
  return all;
}

function spRender(query) {
  var items = spBuildItems(query);
  spCurrentItems = items;
  spActiveIdx = items.length > 0 ? 0 : -1;
  var res = document.getElementById('sp-results');
  if (!res) return;
  if (!items.length) {
    res.innerHTML = '<div class="sp-empty">No results for "<b>' + esc(query) + '</b>"</div>';
    return;
  }
  res.innerHTML = items.map(function(item, i) {
    return '<div class="sp-item' + (i === 0 ? ' sp-active' : '') + '" data-sp-i="' + i + '" onclick="spSelect(' + i + ')" onmouseover="spHover(' + i + ')">'
      + '<div class="sp-item-ic">' + esc(item.ic) + '</div>'
      + '<div class="sp-item-body"><div class="sp-item-title">' + esc(item.title) + '</div>'
      + (item.sub ? '<div class="sp-item-sub">' + esc(item.sub) + '</div>' : '')
      + '</div>'
      + (item.badge ? '<span class="sp-item-badge">' + esc(item.badge) + '</span>' : '')
      + '</div>';
  }).join('');
}

function spHover(i) { spActiveIdx = i; spHighlight(); }

function spHighlight() {
  document.querySelectorAll('#sp-results .sp-item').forEach(function(el, i) {
    el.classList.toggle('sp-active', i === spActiveIdx);
  });
}

function spFilter(val) { spRender(val); }

function spSelect(i) {
  var item = spCurrentItems[i];
  if (!item) return;
  closeSpotlight();
  setTimeout(function() { item.action(); }, 50);
}

function spKeydown(e) {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    spActiveIdx = Math.min(spActiveIdx + 1, spCurrentItems.length - 1);
    spHighlight();
    var active = document.querySelector('#sp-results .sp-item.sp-active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    spActiveIdx = Math.max(spActiveIdx - 1, 0);
    spHighlight();
    var active = document.querySelector('#sp-results .sp-item.sp-active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    if (spActiveIdx >= 0) spSelect(spActiveIdx);
  } else if (e.key === 'Escape') {
    closeSpotlight();
  }
}

function openSpotlight() {
  var overlay = document.getElementById('spotlight-overlay');
  if (!overlay) return;
  overlay.style.display = 'flex';
  spRender('');
  var input = document.getElementById('sp-input');
  if (input) { input.value = ''; setTimeout(function() { input.focus(); }, 50); }
  document.body.style.overflow = 'hidden';
}

function closeSpotlight() {
  var overlay = document.getElementById('spotlight-overlay');
  if (overlay) overlay.style.display = 'none';
  document.body.style.overflow = '';
}

// ⌘K / Ctrl+K global shortcut
document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    var overlay = document.getElementById('spotlight-overlay');
    if (overlay && overlay.style.display !== 'none') {
      closeSpotlight();
    } else {
      openSpotlight();
    }
  }
  if (e.key === 'Escape') {
    var overlay = document.getElementById('spotlight-overlay');
    if (overlay && overlay.style.display !== 'none') closeSpotlight();
  }
});
