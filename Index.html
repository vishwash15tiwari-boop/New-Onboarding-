  var d = window._kpiSnap;
  var isQualityCard = (cardId === 'rating' || cardId === 'osv' || cardId === 'docs');
  if (!d && !isQualityCard) return;
  var el = document.getElementById('km-pn');
  var modal = document.getElementById('kpi-modal');
  if (!el || !modal) return;

  var S = '#1DC797', B = '#005DFF';

  // ── layout primitives ────────────────────────────────────────
  function hero(num, lbl) {
    var text = String(num);
    var hasData = /[\d★%]/.test(text);
    return '<div class="km-hero">'
      + '<div class="km-hero-num"' + (!hasData ? ' style="font-size:20px;font-weight:400;letter-spacing:0;color:var(--txt3)"' : '') + '>' + text + '</div>'
      + '<div class="km-hero-lbl">' + lbl + '</div>'
      + '</div>';
  }
  function srow(items) {
    var cols = Math.min(items.length, 3);
    return '<div class="km-srow km-srow-' + cols + '">'
      + items.map(function(it) {
          return '<div class="km-s">'
            + '<div class="km-sv"' + (it.c ? ' style="color:' + it.c + '"' : '') + '>' + it.v + '</div>'
            + '<div class="km-sl">' + it.l + '</div>'
            + (it.s ? '<div class="km-sb">' + it.s + '</div>' : '')
            + '</div>';
        }).join('') + '</div>';
  }
  function sec(title, inner) {
    return '<div class="km-sec"><div class="km-sec-t">' + title + '</div>' + inner + '</div>';
  }
  function sbar(segs) {
    var tot = segs.reduce(function(a, s) { return a + s.w; }, 0);
    if (!tot) return '';
    return '<div class="km-sbar">'
      + segs.map(function(s) {
          return s.w > 0 ? '<div style="flex:' + s.w + ';background:' + s.color + '"></div>' : '';
        }).join('') + '</div>';
  }
  function sgrid(items, two) {
    return '<div class="km-sg' + (two ? ' km-sg-2' : '') + '">'
      + items.map(function(it) {
          return '<div class="km-sg-item">'
            + '<div class="km-sg-v">' + it.v + '</div>'
            + '<div class="km-sg-l"><i class="km-dot" style="background:' + it.c + '"></i>' + it.l + '</div>'
            + '</div>';
        }).join('') + '</div>';
  }
  function expandTileGrid(specs) {
    var gid = 'etg' + Math.random().toString(36).slice(2, 8);
    // Fill the row: N tiles → N equal columns (capped at 4) instead of always 4,
    // so a small grid (e.g. OSV Done / In Progress / Not Initiated) stretches full-width.
    var cols = Math.max(1, Math.min(specs.length, 4));
    var h = '<div class="km-sg" id="' + gid + '-g" style="grid-template-columns:repeat(' + cols + ',1fr)">'
      + specs.map(function(sp, si) {
          var vendors = sp.vendors || [];
          if (vendors.length === 0) {
            return '<div class="km-sg-item">'
              + '<div class="km-sg-v">' + sp.v + '</div>'
              + '<div class="km-sg-l"><i class="km-dot" style="background:' + sp.c + '"></i>' + sp.l + '</div>'
              + '</div>';
          }
          var tid = gid + '-p' + si;
          return '<div class="km-sg-item km-sg-xp" role="button" tabindex="0"'
            + ' onclick="_kmTileToggle(\'' + tid + '\',\'' + gid + '\',this)"'
            + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();_kmTileToggle(\'' + tid + '\',\'' + gid + '\',this)}">'
            + '<div class="km-sg-v">' + sp.v + '</div>'
            + '<div class="km-sg-l"><i class="km-dot" style="background:' + sp.c + '"></i>'
            + sp.l + ' <span class="km-star-arr">▶</span></div>'
            + '</div>';
        }).join('')
      + '</div>';
    specs.forEach(function(sp, si) {
      var vendors = sp.vendors || [];
      if (vendors.length === 0) return;
      var tid = gid + '-p' + si;
      h += '<div id="' + tid + '" class="km-tile-vlist" style="display:none">';
      var shown = vendors.slice(0, 60);
      h += shown.map(function(v) {
        if (sp.mode === 'osv') {
          var isV  = v.status === 'verified';
          var isIP = v.status === 'in_progress';
          var cBg  = isV ? 'rgba(48,209,88,.15)' : isIP ? 'rgba(245,158,11,.15)' : 'var(--bg2)';
          var cClr = isV ? '#248A3D'             : isIP ? '#B45309'              : 'var(--txt3)';
          var cLbl = v.consentRaw ? esc(v.consentRaw) : (isV ? 'Yes' : isIP ? 'Pending' : 'No / Blank');
          return '<div class="km-vrow" style="flex-wrap:wrap;gap:3px 6px;align-items:center">'
            + '<span class="km-vname" style="min-width:100px">' + esc(v.name || 'Unknown') + '</span>'
            + (v.gstin ? '<span class="km-vaud">' + esc(v.gstin) + '</span>' : '')
            + '<span class="km-vbadge" style="background:' + cBg + ';color:' + cClr + '">' + cLbl + '</span>'
            + (v.category ? '<span class="km-vbadge" style="background:rgba(0,122,255,.10);color:#024C8A;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(v.category) + '</span>' : '')
            + '</div>';
        }
        var vr = '<div class="km-vrow"' + (sp.mode === 'docs' && v.missingDocs && v.missingDocs.length ? ' style="flex-wrap:wrap;align-items:flex-start"' : '') + '>';
        if (v.id) vr += '<span class="km-vid">' + esc(v.id) + '</span>';
        vr += '<span class="km-vname">' + esc(v.name || 'Unknown') + '</span>';
        if (v.aud === 'seller' || v.aud === 'buyer') {
          var ac = v.aud === 'seller' ? '#3B82F6' : '#8B5CF6';
          vr += '<span class="km-vbadge" style="background:' + ac + '20;color:' + ac + '">' + (v.aud === 'seller' ? 'S' : 'B') + '</span>';
        }
        if (sp.mode === 'docs') {
          var docPct_ = v.total > 0 ? Math.round(v.submitted / v.total * 100) : 0;
          vr += '<span class="km-vaud" style="font-weight:600;color:var(--txt)">' + docPct_ + '%'
            + '<span style="font-weight:400;color:var(--txt3);font-size:9.5px;margin-left:3px">(' + (v.submitted || 0) + '/' + (v.total || 0) + ')</span>'
            + '</span>';
          if (v.missingDocs && v.missingDocs.length > 0) {
            vr += '<span class="km-vmissing">Missing: ' + esc(v.missingDocs.join(' · ')) + '</span>';
          }
        }
        vr += '</div>';
        return vr;
      }).join('');
      if (vendors.length > 60) {
        h += '<div class="km-vrow"><span class="km-vname" style="color:var(--txt3);font-size:10px">… and ' + (vendors.length - 60) + ' more</span></div>';
      }
      h += '</div>';
    });
    return h;
  }
  // Category Distribution: one badge per category this vertical actually has,
  // each showing the combined count and its seller / buyer split. Data-driven —
  // never assumes Metal/Plastic. Rows come from _mmCatRows (seller+buyer union).
  function catBadges(rows) {
    if (!rows || !rows.length) return '';
    return '<div class="km-mat">'
      + rows.map(function(r, i) {
          return '<div class="km-mb"><div class="km-mb-dot" style="background:' + MM_CAT_COLORS[i % MM_CAT_COLORS.length] + '"></div>'
            + '<div><div class="km-mb-v">' + fmt(r.s + r.b) + '</div>'
            + '<div class="km-mb-l">' + esc(r.cat) + '</div>'
            + '<div class="km-mb-sub">' + _mmSB(r.s, r.b) + '</div></div></div>';
        }).join('')
      + '</div>';
  }

  var content = '', title = '', subtitle = '', iconHtml = '';
  var vs = d ? d.vs : {}, vb = d ? d.vb : {};

  // Honest "not tracked yet" line — used wherever the spec calls for a field
  // this data source doesn't carry. Never fabricate a number for these.
  function notTracked(msg) {
    return '<span class="km-soon-pill">Not tracked yet</span><div class="km-soon-note">' + msg + '</div>';
  }

  if (cardId === 'total') {
    title = 'Total Logged In Cases';
    subtitle = 'All pipeline entries across sellers & buyers';
    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>';
    content =
      hero(fmt(d.totalS + d.totalB), 'Total Logged In Cases')
      + srow([
          {v: fmt(d.totalS), l: 'Sellers', c: S},
          {v: fmt(d.totalB), l: 'Buyers',  c: B},
        ])
      // Category Distribution reflects the onboarded book, not raw logged-in
      // pipeline entries (many drafts aren't categorized/verified yet) — same
      // basis as every other Category Distribution section in this modal set.
      + (d.catOnb && d.catOnb.length ? sec('Category Distribution', catBadges(d.catOnb)) : '');

  } else if (cardId === 'onboarded') {
    title = 'Successfully Onboarded';
    subtitle = 'Vendors who completed onboarding';
    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M8.6 12.4l2.4 2.4 4.4-5"/></svg>';
    content =
      hero(fmt(d.compS + d.compB), 'Total Successfully Onboarded')
      + srow([
          {v: fmt(d.compS), l: 'Sellers Onboarded', c: S},
          {v: fmt(d.compB), l: 'Buyers Onboarded',  c: B},
        ])
      + (d.catOnb && d.catOnb.length ? sec('Category Distribution', catBadges(d.catOnb)) : '');

  } else if (cardId === 'draft') {
    title = 'Draft Cases';
    subtitle = 'Cases started but not yet submitted for review';
    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
    var draftS = (vs.draft || 0), draftB = (vb.draft || 0);
    content =
      hero(fmt(draftS + draftB), 'Total Draft Cases')
      + srow([
          {v: fmt(draftS), l: 'Sellers', c: S},
          {v: fmt(draftB), l: 'Buyers',  c: B},
        ])
      + sec('Pending Documents', notTracked('Per-case document checklists aren’t captured as a distinct field in the current onboarding feed.'));

  } else if (cardId === 'review') {
    title = 'Cases Under Review';
    subtitle = 'Cases currently being verified before approval';
    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';
    var revS = (vs.inReview || 0), revB = (vb.inReview || 0);
    content =
      hero(fmt(revS + revB), 'Total Cases Under Review')
      + srow([
          {v: fmt(revS), l: 'Sellers', c: S},
          {v: fmt(revB), l: 'Buyers',  c: B},
        ])
      + sec('Current Review Stage', notTracked('Workflow sub-stages (document validation, GST verification, committee approval) aren’t tracked as separate steps in the current onboarding feed.'));

  } else if (cardId === 'rejected') {
    title = 'Rejected Cases';
    subtitle = 'Cases that did not pass onboarding review';
    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
    var rejS = (vs.rejected || 0), rejB = (vb.rejected || 0);
    content =
      hero(fmt(rejS + rejB), 'Total Rejected Cases')
      + srow([
          {v: fmt(rejS), l: 'Sellers', c: S},
          {v: fmt(rejB), l: 'Buyers',  c: B},
        ])
      + sec('Rejection Reason Summary', notTracked('Rejection reasons aren’t captured as a distinct field in the current onboarding feed.'));

  } else if (cardId === 'transacted') {
    title = 'Transacted Vendors';
    subtitle = 'Onboarded vendors who have made a transaction';
    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>';
    // GMV = seller transactions only. Seller→Buyer is one transaction; counting
    // buyer-side values would double-count the same underlying transaction.
    var gmvCombined = vs.totalTxnValue || 0;
    var txnUnique = d.txnUniqueTotal || d.txnTotal;
    content =
      hero(fmt(d.txnTotal), 'Total Transacted Vendors')
      + (d.catTxn && d.catTxn.length ? sec('Category Distribution', catBadges(d.catTxn)) : '')
      + srow([
          {v: fmt(txnUnique), l: 'Total Transactions'},
          {v: gmvCombined > 0 ? fmtINR(gmvCombined) : '—', l: 'Total GMV'},
        ]);

  } else if (cardId === 'nontxn') {
    title = 'Non-Transacted Vendors';
    subtitle = 'Onboarded vendors who haven’t made a transaction yet';
    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>';
    var ntS = Math.max(0, d.compS - (d.txnS || 0));
    var ntB = Math.max(0, d.compB - (d.txnB || 0));
    content =
      hero(fmt(d.nonTxnTotal), 'Total Non-Transacted Vendors')
      + srow([
          {v: fmt(ntS), l: 'Sellers', c: S},
          {v: fmt(ntB), l: 'Buyers',  c: B},
        ])
      + sec('Days Since Onboarding', notTracked('0–30 / 31–90 / 90+ day aging bands aren’t computed yet — the total above is accurate; the breakdown needs a backend aggregation pass.'));

  } else if (cardId === 'oldvsnew') {
    title = 'Vendor Classification';
    subtitle = 'Existing vs. new vendors onboarded through Marketplace';
    iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
    var totalOnb  = (d.newS + d.oldS) + (d.newB + d.oldB);
    var totalNew  = d.newS + d.newB;
    var totalExst = d.oldS + d.oldB;
    content =
      hero(fmt(totalOnb), 'Total Vendors')
      + srow([
          {v: fmt(totalExst), l: 'Existing Vendors'},
          {v: fmt(totalNew),  l: 'New Vendors'},
        ])
      + (d.catOnb && d.catOnb.length ? sec('Category Distribution', catBadges(d.catOnb)) : '');
  }

  // ── Quality card modals ──────────────────────────────────────
  var isQuality = isQualityCard;
  if (isQuality) {
    var qd = qualityData || { success: false };
    var S2 = '#1DC797', B2 = '#005DFF';

    // Reusable score-distribution builder — five bands across a 0-10 score.
    var starBarsHtml = function(dist, rated, vendors) {
      vendors = vendors || [];
      var maxD   = Math.max.apply(null, dist) || 1;
      var ratedD = rated || 1;
      var h = '';
      for (var si = 4; si >= 0; si--) {
        var rc   = dist[si] || 0;
        var bpct = Math.round(rc / maxD * 100);
        var dpct = Math.round(rc / ratedD * 100);
        var bcol = _vsBandColor(si);
        var sv   = vendors.filter(function(v) { return _vsBand(v.rating) === si; })
                          .sort(function(a, b) { return b.rating - a.rating; });
        var tid  = 'km-svl-' + si;
        if (sv.length > 0) {
          h += '<div class="km-star-row km-star-clickable" role="button" tabindex="0"'
            + ' onclick="_kmStarToggle(\'' + tid + '\',this)"'
            + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();_kmStarToggle(\'' + tid + '\',this)}">'
            + '<span class="km-star-n">' + _vsBandLabel(si) + '</span>'
            + '<div class="km-star-track"><div class="km-star-fill" style="width:' + bpct + '%;background:' + bcol + '"></div></div>'
            + '<span class="km-star-cnt">' + fmt(rc) + '</span>'
            + '<span class="km-star-pct">' + dpct + '% <span class="km-star-arr">▶</span></span>'
            + '</div>'
            + '<div id="' + tid + '" class="km-star-vlist" style="display:none">'
            + sv.map(function(v) {
                return '<div class="km-vrow" style="flex-wrap:wrap;gap:3px 6px;align-items:center">'
                  + '<span class="km-vname" style="min-width:100px">' + esc(v.name || 'Unknown') + '</span>'
                  + (v.gstin ? '<span class="km-vaud">' + esc(v.gstin) + '</span>' : '')
                  + '<span class="km-vrating" style="color:' + bcol + '">' + v.rating.toFixed(1) + '</span>'
                  + (v.category ? '<span class="km-vbadge" style="background:rgba(0,122,255,.10);color:#024C8A;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(v.category) + '</span>' : '')
                  + '</div>';
              }).join('')
            + '</div>';
        } else {
          h += '<div class="km-star-row">'
            + '<span class="km-star-n">' + _vsBandLabel(si) + '</span>'
            + '<div class="km-star-track"><div class="km-star-fill" style="width:' + bpct + '%;background:' + bcol + '"></div></div>'
            + '<span class="km-star-cnt">' + fmt(rc) + '</span>'
            + '<span class="km-star-pct">' + dpct + '%</span>'
            + '</div>';
        }
      }
      return h;
    };

    // Segmented progress bar
    var progBar = function(segs) {
      var tot = segs.reduce(function(a, s) { return a + s.w; }, 0);
      if (!tot) return '';
      return '<div class="km-prog">'
        + segs.filter(function(s) { return s.w > 0; }).map(function(s) {
            return '<div class="km-prog-seg" style="flex:' + s.w + ';background:' + s.color + '"></div>';
          }).join('')
        + '</div>';
    };

    var noDataMsg = '<div style="padding:32px 18px;text-align:center;color:var(--txt3);font-size:13px">Quality data is loading — check back shortly.</div>';

    if (cardId === 'rating') {
      title    = 'Vendor Rating';
      subtitle = 'Average Seller Rating — Onboarded Marketplace sellers only';
      iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="#FF9F0A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
      if (!qd.success) {
        content = noDataMsg;
      } else {
        var r      = (qd.seller || {}).rating || {};
        var avg    = r.avg != null ? r.avg.toFixed(1) : '—';
        var rRated = r.rated || 0;
        var rTotal = r.total || 0;
        var selVR  = (qd.vendorRatings || []).filter(function(v){ return v.aud !== 'buyer'; });
        content =
          hero(avg + (r.avg != null ? ' / 10' : ''), 'Average Seller Score (out of 10)')
          + srow([
              {v: fmt(rRated),                  l: 'Sellers Rated',       s: 'have a score'},
              {v: fmt(rTotal - rRated),          l: 'Unrated',             s: 'no score yet'},
            ])
          + (rRated > 0 ? sec('Score Distribution · out of 10', starBarsHtml(r.dist || [0,0,0,0,0], rRated, selVR)) : '');
      }

    } else if (cardId === 'osv') {
      title    = 'OSV Consent';
      subtitle = 'Based on OSV Consent field — Onboarded Marketplace sellers only';
      iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="#005DFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
      if (!qd.success) {
        content = noDataMsg;
      } else {
        var o    = (qd.seller || {}).osv || {};
        var oT   = o.total || 0;
        var oPct = oT > 0 ? Math.round((o.completed || 0) / oT * 100) : 0;
        content =
          hero(fmt(o.completed || 0), 'OSV Completed')
          + srow([
              {v: oPct + '%', l: 'Verification Rate',              s: 'of OMP onboarded'},
              {v: fmt(oT),    l: 'Total Onboarded Sellers (OMP)',  s: 'COMPLETED status'},
            ])
          + sec('Consent Status',
              progBar([
                {w: o.completed    || 0, color: 'var(--st-onboarded)'},
                {w: o.pending      || 0, color: '#F59E0B'},
                {w: o.notInitiated || 0, color: 'var(--st-draft)'},
              ])
              + (function() {
                  var vl = qd.vendorOSV || [];
                  return expandTileGrid([
                    {v: fmt(o.completed    || 0), l: 'Done',          c: 'var(--st-onboarded)', vendors: vl.filter(function(v){return v.status==='verified';}),      mode:'osv'},
                    {v: fmt(o.pending      || 0), l: 'In Progress',   c: '#F59E0B',             vendors: vl.filter(function(v){return v.status==='in_progress';}),   mode:'osv'},
                    {v: fmt(o.notInitiated || 0), l: 'Not Initiated', c: 'var(--st-draft)',     vendors: vl.filter(function(v){return v.status==='not_initiated';}), mode:'osv'},
                  ]);
                })()
            );
      }

    } else { // docs
      title    = 'Document Completeness';
      subtitle = 'KYC & onboarding document collection status';
      iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>';
      if (!qd.success) {
        content = noDataMsg;
      } else {
        var dComb = (qd.combined || qd.seller || {}).docs || {};
        var dT2   = (dComb.complete || 0) + (dComb.partial || 0) + (dComb.incomplete || 0) + (dComb.missing || 0);
        var dPct  = dT2 > 0 ? Math.round((dComb.complete || 0) / dT2 * 100) : 0;
        content =
          hero(dPct + '%', 'Document Completeness Rate')
          + srow([
              {v: fmt(dComb.complete || 0), l: 'Complete Docs', s: 'all docs submitted'},
              {v: fmt(dT2),                 l: 'Total Vendors'},
            ])
          + sec('Status Breakdown',
              progBar([
                {w: dComb.complete   || 0, color: 'var(--st-onboarded)'},
                {w: dComb.partial    || 0, color: 'var(--st-review)'},
                {w: dComb.incomplete || 0, color: 'var(--st-draft)'},
                {w: dComb.missing    || 0, color: 'var(--st-rejected)'},
              ])
              + (function() {
                  var vd = (qd.vendorDocs || []).slice().sort(function(a, b) {
                    var pa = a.total > 0 ? a.submitted / a.total : -1;
                    var pb = b.total > 0 ? b.submitted / b.total : -1;
                    return pb - pa;
                  });
                  return expandTileGrid([

function _gmvCatRender(aud, cats) {

  var rows = cats.length
    ? cats.map(function(c) {
        var pct = total > 0 ? ((c.txnValue / total) * 100).toFixed(1) : '0.0';
        return '<div style="display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border)">'
          + '<div style="flex:1;min-width:0">'

          + '<div style="height:4px;border-radius:2px;background:var(--bg2);overflow:hidden">'

          + '</div>'
          + '<div style="text-align:right;flex-shrink:0">'

          + '<div style="font-size:10.5px;color:var(--txt3);margin-top:1px">' + pct + '%</div>'
          + '</div>'
          + '</div>';
      }).join('')
    : '<div style="padding:28px 18px;text-align:center;color:var(--txt3);font-size:13px">No category GMV data available</div>';
  el.innerHTML = '<div class="km-head">'
    + '<div style="display:flex;align-items:center;min-width:0">'
    + '<div class="km-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="4" height="18" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="18" y="13" width="4" height="8" rx="1"/></svg></div>'
    + '<div class="km-htxt">'
    + '<div class="km-title">GMV by Category</div>'
    + '<div class="km-sub">' + audLbl + ' · Total ' + fmtINR(total) + '</div>'
    + '</div></div>'
    + '<button class="km-close" onclick="closeKpiModal()" aria-label="Close">✕</button>'
    + '</div>'
    + rows

  _modalOpenClass(modal, 'km-open', _kpiEsc);
}

function _gmvCatFromRows(rows) {
  var catValMap = {};
  rows.forEach(function(r) {
    var val = r.txnValue != null ? Number(r.txnValue) : 0;
    if (val > 0) {
      var c = r.category || 'Others';
      catValMap[c] = (catValMap[c] || 0) + val;
    }
  });
  return Object.keys(catValMap)
    .map(function(c) { return { category: c, txnValue: catValMap[c] }; })
    .sort(function(a, b) { return (b.txnValue || 0) - (a.txnValue || 0); });
}

function openGmvCatModal(aud) {
  // Primary: per-category txnValue supplied by server (available after Code.gs is re-deployed)
  var rawCats = (window._gmvCats || {})[aud] || [];
  var cats = rawCats
    .filter(function(c) { return c.txnValue != null && c.txnValue > 0; })
    .slice().sort(function(a, b) { return (b.txnValue || 0) - (a.txnValue || 0); });

  // Fallback 1: sum txnValue per category from the already-loaded per-vendor detail rows.
  // vertRows is loaded for selectedAud, so this only applies when audiences match.
  if (!cats.length && aud === selectedAud && Array.isArray(vertRows) && vertRows.length) {
    var fromActive = _gmvCatFromRows(vertRows);
    if (fromActive.length) cats = fromActive;
  }

  // If we have data, render immediately
  if (cats.length) { _gmvCatRender(aud, cats); return; }

  // Fallback 2: audience doesn't match vertRows — fetch on-demand without switching mode
  var key = activeVertKey || selectedVert;
  var el = document.getElementById('km-pn');
  var modal = document.getElementById('kpi-modal');
  if (!el || !modal || !key) { _gmvCatRender(aud, []); return; }

  var audLbl0 = aud === 'seller' ? 'Sellers' : 'Buyers';
  el.innerHTML = '<div class="km-head">'
    + '<div style="display:flex;align-items:center;min-width:0">'
    + '<div class="km-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="4" height="18" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="18" y="13" width="4" height="8" rx="1"/></svg></div>'
    + '<div class="km-htxt"><div class="km-title">GMV by Category</div>'
    + '<div class="km-sub">' + audLbl0 + '</div></div></div>'
    + '<button class="km-close" onclick="closeKpiModal()" aria-label="Close">✕</button>'
    + '</div>'
    + '<div style="padding:32px 18px;text-align:center;color:var(--txt3);font-size:13px">Loading…</div>';
  _modalOpenClass(modal, 'km-open', _kpiEsc);

  var f = { audience: aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!document.getElementById('kpi-modal').classList.contains('km-open')) return;
      try {
        var data = JSON.parse(res);
        if (data.success && Array.isArray(data.rows)) {
          var computed = _gmvCatFromRows(data.rows);
          if (computed.length) {
            window._gmvCats = window._gmvCats || {};
            window._gmvCats[aud] = computed;
            cats = computed;
          }
        }
      } catch (e) {}
      _gmvCatRender(aud, cats);
    })
    .withFailureHandler(function() {
      _gmvCatRender(aud, []);
    })
    .getVerticalRows(key, JSON.stringify(f));
}

// Load rows for `aud` in the background and re-render the open KPI modal when done.
// Called by the "Load Buyers/Sellers detail" button inside the modal tiles.
function _kvnLoadAud(aud) {
  selectedAud = aud;
  vertRows = []; vertRowsLoading = true; vertRowsError = null;
  var myGen = ++_vertRowsGen;
  var key = activeVertKey || selectedVert;
  if (!key) return;
  var f = { audience: aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  var myPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var lsVKey = STORE_PFX + 'vr_' + aud + '_' + key;
  // SWR: serve from localStorage immediately, then refresh from server
  var swrDone = false;
  try {
    var sv = JSON.parse(localStorage.getItem(lsVKey) || 'null');
    if (sv && sv.pKey === myPKey && Array.isArray(sv.rows)) {
      vertRows = sv.rows; vertRowsLoading = false; swrDone = true;
      if (window._lastKpiCardId) openKpiModal(window._lastKpiCardId);
    }
  } catch (e) {}
  if (!swrDone) {
    // Show "Loading…" inside any currently-open tile panels while we wait
    var pn = document.getElementById('km-pn');
    if (pn) {
      var pvs = pn.querySelectorAll('.km-tile-vlist');
      for (var pi = 0; pi < pvs.length; pi++) {
        if (pvs[pi].style.display !== 'none') {
          pvs[pi].innerHTML = '<div style="padding:12px 4px;text-align:center;color:var(--txt3);font-size:11px">Loading…</div>';
        }
      }
    }
  }
  google.script.run
    .withSuccessHandler(function(res) {
      if (myGen !== _vertRowsGen) return;
      vertRowsLoading = false;
      try {
        var data = JSON.parse(res);
        if (data.success) {
          vertRows = data.rows || [];
          try { localStorage.setItem(lsVKey, JSON.stringify({ pKey: myPKey, rows: data.rows || [] })); } catch (e) {}
        }
      } catch (e) {}
      if (window._lastKpiCardId) openKpiModal(window._lastKpiCardId);
    })
    .withFailureHandler(function() {
      if (myGen !== _vertRowsGen) return;
      vertRowsLoading = false;
      if (window._lastKpiCardId) openKpiModal(window._lastKpiCardId);
    })
    .getVerticalRows(key, JSON.stringify(f));
}

// Load rows for `aud` into _ovnRows[aud] (per-audience cache for Existing/New modal).
// Reuses the same localStorage key as _kvnLoadAud for zero-cost SWR hits.
function _ovnEnsureAud(aud) {
  if (_ovnRows[aud] !== undefined) return; // already loaded or in-flight
  _ovnRows[aud] = null; // mark as in-flight
  var key = activeVertKey || selectedVert;
  if (!key) return;
  var f = { audience: aud, period: currentPeriod };
  if (currentPeriod === 'Custom') { f.startDate = customStart; f.endDate = customEnd; }
  var myPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
  var lsVKey = STORE_PFX + 'vr_' + aud + '_' + key;
  function _ovnAfter(a) {
    if (window._lastKpiCardId === 'oldvsnew' || window._lastKpiCardId === 'transacted') openKpiModal(window._lastKpiCardId);
    if (a === 'buyer' && mmModActive) { _mmModAnimate = false; mmPaint(); }
    if (a === 'buyer' && _mrCtx && _mrCtx.geoState && _mrCtx.geoAud === 'buyer') {
      var sid = _mrCtx.stateId, gc = _mrCtx.geoCat;
      _mrRows = (_ovnRows.buyer || []).filter(function(r) {
        if (_geoStateId(r.state) !== sid) return false;
        if (gc && (r.category || '').toLowerCase() !== gc.toLowerCase()) return false;
        return true;
      });
      _mrRender();
    }
  }
  try {
    var sv = JSON.parse(localStorage.getItem(lsVKey) || 'null');
    if (sv && sv.pKey === myPKey && Array.isArray(sv.rows)) {
      _ovnRows[aud] = sv.rows;
      _ovnAfter(aud);
      return;
    }
  } catch (e) {}
  google.script.run
    .withSuccessHandler(function(res) {
      try {
        var data = JSON.parse(res);
        _ovnRows[aud] = data.success ? (data.rows || []) : [];
        try { localStorage.setItem(lsVKey, JSON.stringify({ pKey: myPKey, rows: _ovnRows[aud] })); } catch (e) {}
      } catch (e) { _ovnRows[aud] = []; }
      _ovnAfter(aud);
    })
    .withFailureHandler(function() {
      _ovnRows[aud] = [];
      _ovnAfter(aud);
    })
    .getVerticalRows(key, JSON.stringify(f));
}

function _renderTxnDetail(wrap, data) {
  var sellers = data.sellers || [];
  var buyers  = data.buyers  || [];
  var totalTxns = 0, totalGMV = 0;
  // GMV is sourced from sellers only — Seller→Buyer is one transaction;
  // adding buyer-side values would double-count the same transaction.
  sellers.forEach(function(r) { totalTxns += (r.txnCount || 1); totalGMV += (r.txnValue || 0); });
  buyers.forEach(function(r)  { totalTxns += (r.txnCount || 1); /* buyer GMV excluded */ });

  var smry = '<div class="km-txn-smry">'
    + '<div class="km-txn-smry-item"><div class="km-txn-smry-val">' + fmt(totalTxns) + '</div><div class="km-txn-smry-lbl">Total Unique Txns</div></div>'
    + '<div class="km-txn-smry-item"><div class="km-txn-smry-val">' + fmt(sellers.length) + '</div><div class="km-txn-smry-lbl">Total Unique Sellers</div></div>'
    + '<div class="km-txn-smry-item"><div class="km-txn-smry-val">' + fmt(buyers.length) + '</div><div class="km-txn-smry-lbl">Total Unique Buyers</div></div>'
    + '<div class="km-txn-smry-item"><div class="km-txn-smry-val">' + (totalGMV > 0 ? fmtINR(totalGMV) : '—') + '</div><div class="km-txn-smry-lbl">Total GMV</div></div>'
    + '</div>';

  function tblSection(label, rows) {
    var h = '<div class="km-txn-aud">' + esc(label) + '</div>';
    if (!rows.length) return h + '<div class="km-txn-empty">No records</div>';
    h += '<table class="km-txn-tbl"><thead><tr>'
      + '<th>Name</th><th>GSTIN</th><th>Category</th>'
      + '<th style="text-align:right"># Unique Txns</th>'
      + '<th style="text-align:right">Total GMV</th>'
      + '</tr></thead><tbody>';
    rows.slice(0, 100).forEach(function(r) {
      var cat   = String(r.category || '').trim();
      var catLc = cat.toLowerCase();
      var catBg  = catLc.indexOf('plastic') >= 0 ? 'rgba(255,159,10,.15)'
                 : catLc.indexOf('metal')   >= 0 ? 'rgba(142,142,147,.15)' : 'var(--bg2)';
      var catClr = catLc.indexOf('plastic') >= 0 ? '#B25000'
                 : catLc.indexOf('metal')   >= 0 ? '#636366' : 'var(--txt3)';
      var catHtml = cat
        ? '<span style="display:inline-block;padding:1px 6px;border-radius:10px;font-size:9.5px;font-weight:600;background:' + catBg + ';color:' + catClr + '">' + esc(cat) + '</span>'
        : '<span style="color:var(--txt3)">—</span>';
      h += '<tr>'
        + '<td style="font-weight:500;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.name || '—') + '</td>'
        + '<td style="font-family:monospace;font-size:10px;color:var(--txt3)">' + esc(r.gstin || '—') + '</td>'
        + '<td>' + catHtml + '</td>'
        + '<td style="text-align:right;font-weight:600;font-variant-numeric:tabular-nums">' + fmt(r.txnCount || 1) + '</td>'
        + '<td style="text-align:right;font-weight:600;color:var(--st-transacted-tx);font-variant-numeric:tabular-nums">' + (r.txnValue > 0 ? fmtINR(r.txnValue) : '—') + '</td>'
        + '</tr>';
    });
    if (rows.length > 100) h += '<tr><td colspan="5" style="color:var(--txt3);font-size:10px">… and ' + (rows.length - 100) + ' more records</td></tr>';
    h += '</tbody></table>';
    return h;
  }

  wrap.innerHTML = smry + tblSection('Seller-wise Details', sellers) + tblSection('Buyer-wise Details', buyers);
}

// ── Quality data: load once for OMP, patch into Seller + Buyer cards ─
function loadQualityData() {
  if (qualityData) { _patchQualitySects(); return; }
  if (qualityLoading) return;
  qualityLoading = true;
  google.script.run
    .withSuccessHandler(function(json) {
      qualityLoading = false;
      try { qualityData = JSON.parse(json); } catch (e) { qualityData = { success: false }; }
      _patchQualitySects();
    })
    .withFailureHandler(function() {
      qualityLoading = false;
      qualityData = { success: false };
      _patchQualitySects();
    })
    .getQualityData();
}

function _patchQualitySects() {
  ['seller', 'buyer'].forEach(function(aud) {
    var el = document.getElementById('qsect-' + aud);
    if (!el) return;
    el.innerHTML = buildQualitySect(qualityData, aud);
  });
  _patchQualityKpiCards();
  refreshBizRail();      // fill Vendor Rating / OSV in Operational Insights
  // Rebuild tree data so panel configs pick up fresh quality numbers,
  // then re-render only the open mod panel — avoid a full DOM wipe + flicker.
  if (currentView !== 'gst' && _mmVert) {
    _mmExtraCache = {};          // quality data changed — invalidate cached extra HTML
    mmTree = mmBuildTree();
    mmAssignIds();
    if (mmModActive) mmRenderModPanel();
  }
  renderDocsSection();
}

function _patchQualityKpiCards() {
  var qd = qualityData;
  if (!qd || !qd.success) return;
  var qc     = qd.seller || {};
  var selOnb = (window._kpiSnap && window._kpiSnap.compS) || 0;

  var rEl = document.getElementById('qkpi-rating');
  if (rEl) {
    var r    = qc.rating || {};
    var avg  = r.avg != null ? r.avg.toFixed(1) + ' / 10' : '—';
    var rOmp = r.total || 0;
    var rsb  = fmt(r.rated || 0) + (rOmp > 0 ? ' of ' + fmt(rOmp) + ' OMP' : '') + ' rated';
    var rv   = rEl.querySelector('.vkpi-val'); if (rv) rv.textContent = avg;
    var rs   = rEl.querySelector('.vkpi-sub'); if (rs) rs.textContent = rsb;
  }

  var oEl = document.getElementById('qkpi-osv');
  if (oEl) {
    var o    = qc.osv || {}, oCmp = o.completed || 0, oOmp = o.total || 0;
    var opct = oOmp > 0 ? Math.round(oCmp / oOmp * 100) + '%' : '—';
    var osb  = fmt(oCmp) + (oOmp > 0 ? ' of ' + fmt(oOmp) + ' OMP' : '') + ' OSV Consent given';
    var ov   = oEl.querySelector('.vkpi-val'); if (ov)  ov.textContent  = opct;
    var oSub = oEl.querySelector('.vkpi-sub'); if (oSub) oSub.textContent = osb;
  }

  var dEl = document.getElementById('qkpi-docs');
  if (dEl) {
    var d    = qc.docs || {}, dCmp = d.complete || 0;
    var dpct = selOnb > 0 ? Math.round(dCmp / selOnb * 100) + '%' : '—';
    var dsb  = fmt(dCmp) + (selOnb > 0 ? ' of ' + fmt(selOnb) : '') + ' complete';
    var dv  = dEl.querySelector('.vkpi-val'); if (dv) dv.textContent = dpct;
    var ds  = dEl.querySelector('.vkpi-sub'); if (ds) ds.textContent = dsb;
  }

  // Patch inline seller pipeline card quality strip (legacy — safe no-op if absent)
  var ipcEl = document.getElementById('ipc-qual-seller');
  if (ipcEl) ipcEl.innerHTML = _buildSellerQualStrip(qc);

  // Patch the Business Insights rail's Vendor Rating / OSV Consent mini-cards.
  var bqEl = document.getElementById('biz-qual');
  if (bqEl) bqEl.outerHTML = _buildRailQual(qc);
}

// DOCUMENT MANAGEMENT — Open Marketplace only
// Repository of every Seller/Buyer's submitted documents + completeness

// ═══════════════════════════════════════════════════════════════

// Mandatory-document mapping (document keys, matching the backend DOC_NAMES).
// Completeness, pending counts and the improvement checklist all recalculate
// from here. null / empty = treat EVERY document on the record as mandatory.
//   Buyers: GST Certificate, Entity PAN, PWM Certificate.
//   Sellers: full checklist until an official Seller list is provided.
var MANDATORY_DOCS = {
  seller: null,
  buyer:  ['gst_certificate', 'entity_pan', 'pwm_certificate'],
};

// Canonical display labels by document key — used for pending/mandatory docs
// that may not be present in a record's own document list (e.g. PWM), and to
// keep acronym casing correct (GST, PAN, PWM) rather than naive title-casing.
var DOC_LABEL_MAP = {
  additional_documents: 'Additional Docs',
  proof_of_premises: 'Proof of Premises',
  electricity_bill: 'Electricity Bill',
  kyc_document: 'KYC Document',
  gst_portal_screenshot_bank_details: 'GST Screenshot',
  cancelled_cheque: 'Cancelled Cheque',
  msme_certificate: 'MSME Certificate',
  aadhaar: 'Aadhaar',
  owner_pan: 'Owner PAN',
  entity_pan: 'Entity PAN',
  gst_certificate: 'GST Certificate',
  pwm_certificate: 'PWM Certificate',
};

var _docAud = 'seller';   // which entity type the repository is showing
var _docSearch = '';       // repository search query
var _docLookup = {};       // per-render key → entity, for the detail modal
var _docLookupI = 0;

// Human label for a document key — canonical map first, then a title-cased fallback.
function prettyDocLabel(key) {
  if (DOC_LABEL_MAP[key]) return DOC_LABEL_MAP[key];
  return String(key || '').replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

// Mandatory document keys applicable to an entity (its audience's list, or all
// documents on the record when no explicit list is configured).
function mandatoryDocKeys(aud, docList) {
  var cfg = MANDATORY_DOCS[aud];
  if (cfg && cfg.length) return cfg.slice();
  return (docList || []).map(function(d) { return d.key; });
}

// Completeness for one entity, computed against its mandatory checklist.
function docCompleteness(entity) {
  var docList = entity.docs || [];
  var byKey = {};
  docList.forEach(function(d) { byKey[d.key] = d; });
  var mand = mandatoryDocKeys(entity.aud, docList);
  var submitted = 0, pending = [];
  mand.forEach(function(k) {
    var d = byKey[k];
    if (d && d.submitted) submitted++;
    else pending.push(d || { key: k, label: prettyDocLabel(k), submitted: false });
  });
  var total = mand.length;
  return { total: total, submitted: submitted, pending: pending,
           pct: total > 0 ? Math.round(submitted / total * 100) : 0 };
}

// Completeness colour ramp (accent used only for meaningful emphasis).
function docPctColor(pct) {
  if (pct >= 100) return '#1DC797';
  if (pct >= 67)  return 'var(--blue)';
  if (pct >= 34)  return '#FF9500';
  return '#FF3B30';
}

function renderDocsSection() {
  var el = document.getElementById('vert-docs-section');
  if (!el) return;
  if (activeVertKey !== 'OMP') { el.style.display = 'none'; return; }
  // Keep the full set; audience selection + OMP scoping happen per-audience in
  // renderDocsRows so one audience matching OMP never hides the other.
  window._docEntities = (qualityData && qualityData.vendorDocs) || [];
  el.style.display = '';
  var icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>';
  var searchIc = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
  el.innerHTML =
    '<div class="docs-hd">'
    +   '<div class="docs-hd-ic">' + icon + '</div>'
    +   '<div><div class="docs-hd-tt">Document Management</div>'
    +     '<div class="docs-hd-sb">Uploaded documents &amp; completeness for every Marketplace vendor</div></div>'
    +   '<div class="docs-tools">'
    +     '<div class="docs-seg" id="docs-seg">'
    +       '<button data-aud="seller"' + (_docAud === 'seller' ? ' class="on"' : '') + ' onclick="setDocAud(\'seller\')">Sellers</button>'
    +       '<button data-aud="buyer"'  + (_docAud === 'buyer'  ? ' class="on"' : '') + ' onclick="setDocAud(\'buyer\')">Buyers</button>'
    +     '</div>'
    +     '<div class="docs-search">' + searchIc
    +       '<input type="text" id="docs-search-input" placeholder="Search name or GSTIN…" oninput="onDocSearch(this.value)" value="' + esc(_docSearch) + '">'
    +     '</div>'
    +   '</div>'
    + '</div>'
    + '<div class="docs-tbl-wrap"><table class="docs-tbl">'
    +   '<thead><tr>'
    +     '<th>Vendor</th><th>Category</th><th>Onboarding</th>'
    +     '<th class="num">Completeness</th><th class="num">Submitted</th>'
    +   '</tr></thead>'
    +   '<tbody id="docs-tbody"></tbody>'
    + '</table></div>';
  renderDocsRows();
}

// Normalize a doc row's audience to 'seller' | 'buyer' | 'combined'.
function _docNormAud(a) {
  var s = String(a || '').toLowerCase();
  if (s.indexOf('sell') !== -1) return 'seller';
  if (s.indexOf('buy')  !== -1) return 'buyer';
  return 'combined';
}

// Rows applicable to the selected audience: exact-audience rows if any, else
// unclassified/combined rows (so buyer docs still show when the source couldn't
// split by audience). Within that, prefer OMP-matched rows but never return an
// empty set just because the omp flag wasn't set upstream.
function _docAudPool(aud) {
  var all = window._docEntities || [];
  var exact = all.filter(function(d) { return _docNormAud(d.aud) === aud; });
  var base  = exact.length ? exact : all.filter(function(d) { return _docNormAud(d.aud) === 'combined'; });
  if (!base.length) return [];
  var omp = base.filter(function(d) { return d.omp; });
  return omp.length ? omp : base;
}

function renderDocsRows() {
  var tbody = document.getElementById('docs-tbody');
  if (!tbody) return;
  var q = _docSearch.trim().toLowerCase();
  var list = _docAudPool(_docAud).filter(function(d) {
    if (!q) return true;
    return (d.name || '').toLowerCase().indexOf(q) !== -1
        || (d.gstin || '').toLowerCase().indexOf(q) !== -1;
  });
  // Most-complete first — highest completeness vendors surface at the top.
  list = list.map(function(d) { return { d: d, c: docCompleteness(d) }; })
             .sort(function(a, b) { return b.c.pct - a.c.pct || (a.d.name || '').localeCompare(b.d.name || ''); });
  _docLookup = {}; _docLookupI = 0;
  if (!list.length) {
    var msg = q
      ? 'No ' + _docAud + 's match your search.'
      : 'No ' + _docAud + ' document data available yet.';
    tbody.innerHTML = '<tr><td colspan="5" class="docs-empty">' + msg + '</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(function(o) {
    var d = o.d, c = o.c, key = ++_docLookupI;
    _docLookup[key] = d;
    var clr = docPctColor(c.pct);
    var catCls = (d.category || '').toLowerCase() === 'plastic' ? ' plastic'
               : (d.category || '').toLowerCase() === 'metal'   ? ' metal' : '';
    return '<tr onclick="openDocModal(' + key + ')" title="View documents">'
      + '<td><span class="docs-nm">' + esc(d.name || '—') + '</span>'
      +   '<span class="docs-nm-sub">' + esc(d.gstin || '—') + '</span></td>'
      + '<td>' + (d.category ? '<span class="docs-cat' + catCls + '">' + esc(d.category) + '</span>' : '<span class="docs-nm-sub" style="font-family:inherit">—</span>') + '</td>'
      + '<td>' + docStatusChip(d.onboardingStatus) + '</td>'
      + '<td><div class="docs-comp">'
      +   '<div class="docs-comp-track"><div class="docs-comp-fill" style="width:' + c.pct + '%;background:' + clr + '"></div></div>'
      +   '<span class="docs-comp-pct" style="color:' + clr + '">' + c.pct + '%</span></div></td>'
      + '<td><span class="docs-comp-sub">' + c.submitted + ' / ' + c.total + '</span></td>'
      + '</tr>';
  }).join('');
}

function docStatusChip(status) {
  var s = String(status || '').toUpperCase();
  var label = status ? (s.charAt(0) + s.slice(1).toLowerCase()).replace(/_/g, ' ') : '—';
  var bg = 'var(--seg-track)', col = 'var(--txt2)';
  if (s.indexOf('COMPLET') !== -1 || s === 'ONBOARDED' || s === 'ACTIVE') { bg = 'rgba(48,209,88,.14)'; col = '#248A3D'; }
  else if (s.indexOf('REVIEW') !== -1 || s.indexOf('PROGRESS') !== -1)     { bg = 'rgba(255,149,0,.14)'; col = '#B25000'; }
  else if (s.indexOf('REJECT') !== -1 || s.indexOf('DECLIN') !== -1)       { bg = 'rgba(255,59,48,.12)'; col = '#D70015'; }
  if (!status) return '<span class="docs-nm-sub" style="font-family:inherit">—</span>';
  return '<span class="dm-badge" style="background:' + bg + ';color:' + col + '">' + esc(label) + '</span>';
}

function setDocAud(aud) {
  if (_docAud === aud) return;
  _docAud = aud;
  var seg = document.getElementById('docs-seg');
  if (seg) seg.querySelectorAll('button').forEach(function(b) { b.classList.toggle('on', b.dataset.aud === aud); });
  renderDocsRows();
}

function onDocSearch(v) { _docSearch = v || ''; renderDocsRows(); }

function openDocModal(key) {
  var d = _docLookup[key];
  if (!d) return;
  var pn = document.getElementById('doc-pn');
  var modal = document.getElementById('doc-modal');
  if (!pn || !modal) return;
  var c = docCompleteness(d);
  var clr = docPctColor(c.pct);
  // Build the display list: the record's own documents PLUS any mandatory
  // document missing from it (e.g. PWM for buyers) shown as "Not submitted",
  // so every mandatory doc is visible. Mandatory docs sort first, then submitted.
  var mandKeys = mandatoryDocKeys(d.aud, d.docs || []);
  var mandSet = {};
  mandKeys.forEach(function(k) { mandSet[k] = true; });
  var haveKeys = {};
  (d.docs || []).forEach(function(x) { haveKeys[x.key] = true; });
  var docList = (d.docs || []).slice();
  mandKeys.forEach(function(k) {
    if (!haveKeys[k]) docList.push({ key: k, label: prettyDocLabel(k), submitted: false, verified: null, uploadDate: null, url: null });
  });
  docList.sort(function(a, b) {
    return (mandSet[b.key] ? 1 : 0) - (mandSet[a.key] ? 1 : 0)
        || (b.submitted ? 1 : 0) - (a.submitted ? 1 : 0);
  });
  var listSubmitted = docList.filter(function(x) { return x.submitted; }).length;

  function entItem(lbl, val) {
    return '<div class="dm-ent-item"><span class="dm-ent-lbl">' + lbl + '</span>'
      + '<span class="dm-ent-val">' + (val ? esc(val) : '—') + '</span></div>';
  }
  var entType = (d.aud === 'buyer') ? 'Buyer' : 'Seller';
  var head =
    '<div class="km-head">'
    + '<div style="display:flex;align-items:center;min-width:0">'
    +   '<div class="km-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>'
    +   '<div class="km-htxt"><div class="km-title">' + esc(d.name || 'Vendor') + '</div>'
    +     '<div class="km-sub">' + entType + ' · Document repository</div></div>'
    + '</div>'
    + '<button class="km-close" onclick="closeDocModal()" aria-label="Close">✕</button>'
    + '</div>';

  var ent =
    '<div class="dm-ent">'
    + entItem('GSTIN', d.gstin)
    + entItem('Entity Type', entType)
    + entItem('Category', d.category)
    + entItem('Onboarding', d.onboardingStatus ? d.onboardingStatus.charAt(0) + d.onboardingStatus.slice(1).toLowerCase() : '')
    + '</div>';

  var summary =
    '<div class="dm-sum">'
    + '<div class="dm-sum-item"><div class="dm-sum-v">' + c.total + '</div><div class="dm-sum-l">Mandatory</div></div>'
    + '<div class="dm-sum-item"><div class="dm-sum-v" style="color:#248A3D">' + c.submitted + '</div><div class="dm-sum-l">Submitted</div></div>'
    + '<div class="dm-sum-item"><div class="dm-sum-v" style="color:' + (c.pending.length ? '#B25000' : 'var(--txt3)') + '">' + c.pending.length + '</div><div class="dm-sum-l">Pending</div></div>'
    + '<div class="dm-sum-item pct"><div class="dm-sum-v" style="color:' + clr + '">' + c.pct + '%</div><div class="dm-sum-l">Complete</div></div>'
    + '</div>';

  var docsHtml = docList.map(function(doc) {
    var meta = [];
    if (doc.uploadDate) meta.push('Uploaded ' + esc(doc.uploadDate));
    var verBadge = '';
    if (doc.submitted && doc.verified) {
      var vv = String(doc.verified).toUpperCase();
      if (vv.indexOf('VERIF') !== -1 || vv === 'YES' || vv === 'TRUE' || vv === 'DONE')
        verBadge = '<span class="dm-badge ver">Verified</span>';
      else if (vv.indexOf('PEND') !== -1 || vv.indexOf('PROGRESS') !== -1)
        verBadge = '<span class="dm-badge pend">Pending</span>';
    }
    var viewBtn = doc.url
      ? '<a class="dm-view" href="' + esc(doc.url) + '" target="_blank" rel="noopener">View ↗</a>'
      : '<span class="dm-view off">View</span>';
    var mandTag = mandSet[doc.key] ? '<span class="dm-badge mand">Mandatory</span>' : '';
    return '<div class="dm-doc">'
      + '<div class="dm-doc-ic ' + (doc.submitted ? 'yes' : 'no') + '">' + (doc.submitted ? '✓' : '○') + '</div>'
      + '<div class="dm-doc-main"><div class="dm-doc-nm">' + esc(doc.label || prettyDocLabel(doc.key)) + '</div>'
      +   (meta.length ? '<div class="dm-doc-meta">' + meta.join(' · ') + '</div>' : '') + '</div>'
      + '<div class="dm-doc-badges">'
      +   mandTag
      +   (doc.submitted ? '<span class="dm-badge sub">Submitted</span>' : '<span class="dm-badge miss">Not submitted</span>')
      +   verBadge + viewBtn
      + '</div></div>';
  }).join('');

  var fixInner = c.pending.length
    ? c.pending.map(function(p) {
        return '<div class="dm-fix-row"><span class="dm-fix-dot"></span>' + esc(p.label || prettyDocLabel(p.key)) + '</div>';
      }).join('')
    : '<div class="dm-fix-done">✓ All mandatory documents submitted — 100% complete</div>';
  var fixTitle = c.pending.length ? 'Upload these to reach 100% completeness' : 'Improvement checklist';

  pn.innerHTML = head + ent + summary
    + '<div class="km-sec"><div class="km-sec-t">Documents (' + listSubmitted + ' of ' + docList.length + ' submitted)</div>' + docsHtml + '</div>'
    + '<div class="km-sec"><div class="km-sec-t">' + fixTitle + '</div>' + fixInner + '</div>';
  _modalOpenClass(modal, 'km-open', _docEsc);
}

function closeDocModal() {
  var modal = document.getElementById('doc-modal');
  _modalCloseClass(modal, 'km-open', _docEsc);
}
function _docEsc(e) { if (e.key === 'Escape') closeDocModal(); }

// Build in-card quality HTML — shows count + % for every item.
// qd = { success, seller:{rating,osv,docs}, buyer:{...}, combined:{...} }
function buildQualitySect(qd, aud) {
  var hd = '<div class="cc-qsect-hd">Quality &amp; Compliance</div>';
  if (!qd || !qd.success) {
    return hd + '<div style="font-size:11px;color:var(--txt3);padding:4px 0">Data syncing… Run syncQualityData() in Apps Script.</div>';
  }
  var q = qd[aud] || qd.combined || {};
  var html = hd;

  // ── Vendor Rating ──────────────────────────────────────────
  // Header: avg score  |  N rated / N total
  // Rows: [band] [bar] [count] [pct%]  — one per score band (0-2 … 8-10)
  if (q.rating && q.rating.total > 0) {
    var r    = q.rating;
    var avg  = r.avg != null ? r.avg.toFixed(1) : '—';
    var rRated = r.rated || r.total || 1;
    var maxD = Math.max.apply(null, r.dist) || 1;
    var rSub = (r.total > r.rated && r.total > 0)
      ? fmt(r.rated) + ' of ' + fmt(r.total) + ' rated'
      : fmt(r.rated) + ' rated';
    var bars = '';
    for (var i = 4; i >= 0; i--) {
      var rc   = r.dist[i] || 0;
      var bpct = Math.round(rc / maxD * 100);
      var dpct = Math.round(rc / rRated * 100);
      var bcol = _vsBandColor(i);
      bars += '<div class="cc-qsect-sbar">'
        + '<span class="cc-qsect-sbar-n">' + _vsBandLabel(i) + '</span>'
        + '<div class="cc-qsect-sbar-t"><div class="cc-qsect-sbar-f" style="width:' + bpct + '%;background:' + bcol + '"></div></div>'
        + '<span class="cc-qsect-sbar-c">' + (rc > 999 ? Math.round(rc / 1000) + 'k' : rc) + '</span>'
        + '<span class="cc-qsect-sbar-p">' + dpct + '%</span>'
        + '</div>';
    }
    html += '<div class="cc-qsect-row">'
      + '<span class="cc-qsect-ic">★</span>'
      + '<span class="cc-qsect-lb">Vendor Rating</span>'
      + '<span class="cc-qsect-vl">' + avg + '&thinsp;<span class="cc-qsect-sub">avg · ' + rSub + '</span></span>'
      + '</div>'
      + '<div class="cc-qsect-bars">' + bars + '</div>';
  }

  // ── OSV Verification ──────────────────────────────────────
  // Header: label | N done / N total
  // Rows: [●col] [label] [count] [pct%]
  if (q.osv && q.osv.total > 0) {
    var o  = q.osv, oT = o.total || 1;
    var osvPct = Math.round((o.completed || 0) / oT * 100);
    var or_ = [
      { col: 'var(--st-onboarded)', v: o.completed,    lbl: 'Done'          },
      { col: '#F59E0B',             v: o.pending,      lbl: 'In Progress'   },
      { col: 'var(--st-draft)',     v: o.notInitiated, lbl: 'Not Initiated' },
    ];
    html += '<div class="cc-qsect-row cc-qsect-mt">'
      + '<span class="cc-qsect-ic">◎</span>'
      + '<span class="cc-qsect-lb">OSV Consent</span>'
      + '<span class="cc-qsect-vl">' + fmt(o.completed) + '&thinsp;<span class="cc-qsect-sub">' + osvPct + '% of OMP</span></span>'
      + '</div>'
      + or_.map(function(x) {
          if (!x.v) return '';
          var p = Math.round(x.v / oT * 100);
          return '<div class="cc-qsect-drow">'
            + '<span class="cc-qsect-dot" style="background:' + x.col + '"></span>'
            + '<span class="cc-qsect-dlb">' + x.lbl + '</span>'
            + '<span class="cc-qsect-dn">' + fmt(x.v) + '</span>'
            + '<span class="cc-qsect-dp">' + p + '%</span>'
            + '</div>';
        }).join('');
  }

  // ── Doc Completeness ──────────────────────────────────────
  // Header: label | N% complete
  // Progress bar
  // Rows: [●col] [label] [count] [pct%]
  if (q.docs && q.docs.total > 0) {
    var d  = q.docs, dT = d.total || 1;
    var dr = [
      { col: 'var(--st-onboarded)', v: d.complete,   lbl: 'Complete'   },
      { col: 'var(--st-review)',    v: d.partial,     lbl: 'Partial'    },
      { col: 'var(--st-draft)',     v: d.incomplete,  lbl: 'Incomplete' },
      { col: 'var(--st-rejected)',  v: d.missing,     lbl: 'Missing'    },
    ];
    html += '<div class="cc-qsect-row cc-qsect-mt">'
      + '<span class="cc-qsect-ic">◻</span>'
      + '<span class="cc-qsect-lb">Doc Completeness</span>'
      + '<span class="cc-qsect-vl">' + Math.round(d.complete / dT * 100) + '<span class="cc-qsect-sub">% complete</span></span>'
      + '</div>'
      + '<div class="cc-qsect-prog">'
      + dr.filter(function(s){ return s.v > 0; }).map(function(s) {
          return '<div class="cc-qsect-prog-seg" style="flex:' + (s.v / dT * 100).toFixed(1) + ';background:' + s.col + '"></div>';
        }).join('')
      + '</div>'
      + dr.map(function(x) {
          if (!x.v) return '';
          var p = Math.round(x.v / dT * 100);
          return '<div class="cc-qsect-drow">'
            + '<span class="cc-qsect-dot" style="background:' + x.col + '"></span>'
            + '<span class="cc-qsect-dlb">' + x.lbl + '</span>'
            + '<span class="cc-qsect-dn">' + fmt(x.v) + '</span>'
            + '<span class="cc-qsect-dp">' + p + '%</span>'
            + '</div>';
        }).join('');
  }

  return html;
}
