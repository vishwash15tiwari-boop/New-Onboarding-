.sp-footer kbd{font-family:inherit;font-size:10px;font-weight:600;background:var(--bg2);border:1px solid var(--border2);border-radius:4px;padding:1px 5px;margin-right:3px}

/* Responsive: collapse sidebar on small screens */
@media(max-width:1024px){
  #side-nav{display:none!important}
  #dash-content{padding:18px 20px 48px}
}
@media(max-width:760px){
  #dash-content{padding:0 16px 60px}
}

/* ══════════════════════════════════════════════════
   MIND-MAP NAV + GUIDED JOURNEY  (redesign)
   ══════════════════════════════════════════════════ */
/* Left navigation tree — one expandable node per business vertical. */
#vnav{flex:0 0 262px;position:sticky;top:56px;align-self:flex-start;height:calc(100vh - 56px);overflow-y:auto;padding:22px 16px 40px;border-right:1px solid var(--border);scrollbar-width:thin}
#vnav::-webkit-scrollbar{width:3px}
#vnav::-webkit-scrollbar-thumb{background:var(--border2,rgba(0,0,0,.15));border-radius:4px}
.vnav-eyebrow{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--txt3);padding:0 8px 12px}
.vnav-tree{display:flex;flex-direction:column;gap:8px}
.vnode{position:relative;border:1px solid var(--border);border-radius:var(--r2);background:var(--card);cursor:pointer;transition:border-color .25s var(--ease-out),box-shadow .25s var(--ease-out),background .25s var(--ease-out)}
.vnode:hover{border-color:rgba(0,0,0,.18)}
.vnode.muted{cursor:default;background:transparent;border-style:dashed}
.vnode.muted:hover{border-color:var(--border)}
.vn-head{display:flex;align-items:center;gap:10px;padding:13px 14px}
.vn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--vn-hue,var(--txt3))}
.vn-main{flex:1;min-width:0}
.vn-name{font-size:13.5px;font-weight:600;letter-spacing:-.1px;line-height:1.2;color:var(--txt)}
.vn-sub{font-size:11px;font-weight:500;color:var(--txt3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vn-toggle{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:16px;line-height:1}
.vnode.on{background:#1A1A1C;border-color:#1A1A1C;box-shadow:0 12px 28px -14px rgba(0,0,0,.55)}
.vnode.on .vn-name{color:#fff}
.vnode.on .vn-sub{color:rgba(255,255,255,.62)}
.vnode.on .vn-dot{background:var(--vn-hue,var(--blue));box-shadow:0 0 0 4px rgba(0,93,255,.20)}
.vnode.on .vn-toggle{color:rgba(255,255,255,.7)}
.vnode.muted .vn-name{color:var(--txt2)}
.vnav-sep{height:1px;background:var(--border);margin:14px 8px 12px}
.vn-util-ic{width:22px;height:22px;border-radius:6px;background:rgba(120,120,128,.14);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--txt2);flex-shrink:0}
.vnode-gst.on .vn-util-ic{background:rgba(255,255,255,.16);color:#fff}
body.view-gst #vnav .vnode:not(.vnode-gst){opacity:.55}
/* The left rail is superseded by the mind map's own Verticals lane. */
#vnav{display:none!important}

/* Canvas: full width — the mind map carries its own lanes. */
/* This rule outranks the base #dash-content declaration, so the real page gutter
   lives here. Top padding trimmed to lift the filter bar toward the header. */
body:not(.view-gst) #dash-content{max-width:1500px;margin:0 auto;padding:12px 30px 56px}
.jr-sec{margin-bottom:24px}
.jr-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
.jr-step{font-size:10px;font-weight:700;color:var(--txt3);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.jr-ttl{font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--txt2)}
.jr-sp{flex:1;height:1px;background:var(--border);align-self:center;margin-left:4px}
.jr-link{font-size:11.5px;font-weight:600;color:var(--blue);cursor:pointer;white-space:nowrap;background:none;border:none;font-family:inherit;padding:0}
/* 1 · Summary ribbon */
.jr-summary{display:flex;align-items:center;gap:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;flex-wrap:wrap;box-shadow:var(--shadow-card)}
.jrs-title{display:flex;align-items:center;gap:11px}
.jrs-code{font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--vc-ink,var(--blue-ink));background:var(--vc-soft,var(--accent-soft));padding:4px 9px;border-radius:6px}
.jrs-name{font-size:19px;font-weight:700;letter-spacing:-.4px;color:var(--txt)}
.jrs-div{width:1px;height:32px;background:var(--border)}
.jrs-stat b{font-size:18px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums;color:var(--txt)}
.jrs-stat span{font-size:11px;font-weight:500;color:var(--txt3);margin-left:6px}
.jrs-prog{flex:1;min-width:150px;max-width:280px}
.jrs-prog-top{display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;color:var(--txt2);margin-bottom:6px}
.jrs-prog-bar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden}
.jrs-prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--st-onboarded));transition:width .8s var(--ease-out)}
/* 3 · Onboarding funnel */
.jr-funnel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.fn-row{display:flex;align-items:center;gap:16px}
.fn-lbl{width:104px;flex-shrink:0;font-size:12.5px;font-weight:600;color:var(--txt2)}
.fn-track{flex:1;height:32px;border-radius:8px;background:var(--bg2);overflow:hidden}
.fn-fill{height:100%;border-radius:8px;display:flex;align-items:center;padding:0 13px;color:#fff;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;transition:width .7s var(--ease-out);min-width:2px}
.fn-meta{width:120px;flex-shrink:0;text-align:right;font-size:11.5px;font-weight:600;color:var(--txt3)}
.fn-meta b{color:var(--txt);font-weight:700}
/* 5 · Operational insights */
.jr-ops{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.op-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:17px 18px;cursor:pointer;transition:box-shadow .25s var(--ease-out),transform .25s var(--ease-out)}
.op-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.op-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.op-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3)}
.op-link{font-size:11px;font-weight:600;color:var(--blue)}
.op-big{font-size:27px;font-weight:700;letter-spacing:-1px;line-height:1;color:var(--txt);font-variant-numeric:tabular-nums}
.op-big small{font-size:14px;font-weight:600;color:var(--txt3);letter-spacing:0}
.op-star{color:var(--blue);font-size:15px;margin-left:4px}
.op-sub{font-size:11px;font-weight:500;color:var(--txt3);margin-top:8px}
.op-bar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden;margin-top:11px}
.op-bar i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .7s var(--ease-out)}
.op-sync{font-size:13px;font-weight:600;color:var(--txt3);margin-top:4px}
.op-card.static{cursor:default}
.op-card.static:hover{transform:none;box-shadow:var(--shadow)}
.jr-perf .biz-card{padding:18px 20px}
.jr-perf .biz-card .biz-region{margin-top:0;padding-top:0;border-top:none}
body:not(.view-gst) #vert-ctx-hdr{display:none}

/* ══════════════════════════════════════════════════
   OPERATIONAL MIND MAP — connected branch tree
   ══════════════════════════════════════════════════ */
.branch-root{display:flex;align-items:center;gap:11px;margin:4px 0 2px;padding-left:2px;flex-wrap:wrap}
.br-code{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--vc-ink,var(--blue-ink));background:var(--vc-soft,var(--accent-soft));padding:4px 9px;border-radius:6px}
.br-name{font-size:20px;font-weight:700;letter-spacing:-.5px;color:var(--txt)}
.br-hint{margin-left:auto;font-size:11px;color:var(--txt3);font-weight:500}
.mm-tree{position:relative;padding-left:44px;margin-top:12px}
.mm-rail{position:absolute;left:19px;top:-6px;width:1.5px;height:0;background:rgba(0,0,0,.16);transition:height .55s var(--ease-out)}
.tnode{position:relative;margin-bottom:24px;opacity:0;transform:translateX(-10px)}
.tnode.in{opacity:1;transform:none;transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
.tnode .stub{position:absolute;left:-25px;top:9px;width:24px;height:1.5px;background:rgba(0,0,0,.16);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease-out) .06s}
.tnode.in .stub{transform:scaleX(1)}
.tnode .knob{position:absolute;left:-29px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--card);border:1.6px solid rgba(0,0,0,.28);z-index:1}
.tnode.lf .knob{border-color:var(--blue);background:var(--blue)}
/* Branch body: transparent wrapper — title + the vertical's own content cards.
   No card-in-card; the connector rail + title carry the hierarchy. */
.mm-card,.mm-branch{background:transparent;border:none;padding:0}
.node-hd{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.node-ttl{font-size:13px;font-weight:700;letter-spacing:-.1px;color:var(--txt)}
.node-tag{font-size:10.5px;font-weight:500;color:var(--txt3)}
.node-open{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--blue);background:none;border:none;font-family:inherit;cursor:pointer;padding:0}
.node-lead{margin-left:auto;font-size:12px;font-weight:600;color:var(--blue)}
/* Detailed Records leaf — a real tappable card (no inner content) */
.tnode.lf .mm-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px 17px;transition:border-color .2s var(--ease-out),box-shadow .2s var(--ease-out)}
.tnode.lf .mm-card .node-hd{margin-bottom:0}
.tnode.lf .mm-card.tap{cursor:pointer}
.tnode.lf .mm-card.tap:hover{border-color:rgba(0,93,255,.35);box-shadow:0 12px 30px -16px rgba(0,0,0,.32)}
/* Journey section-eyebrows are unused in the tree */
.mm-tree .jr-hd{display:none}
/* Reveal-safe: prevent the old .reveal opacity from hiding tree nodes */
.tnode.reveal{opacity:0}

/* Detailed Records slide-over */
.rec-ovl{position:fixed;inset:0;background:rgba(20,20,22,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease-out);z-index:300;display:flex;justify-content:flex-end}
.rec-ovl.show{opacity:1;pointer-events:auto}
.rec-sheet{width:min(880px,96vw);height:100%;background:var(--card);box-shadow:-24px 0 64px rgba(0,0,0,.24);transform:translateX(40px);transition:transform .4s var(--ease-out);display:flex;flex-direction:column}
.rec-ovl.show .rec-sheet{transform:none}
.rec-sheet-hd{display:flex;align-items:center;gap:12px;padding:17px 22px;border-bottom:1px solid var(--border);flex-shrink:0}
.rs-ttl{font-size:15px;font-weight:700;color:var(--txt);letter-spacing:-.2px}
.rs-sub{font-size:11px;color:var(--txt3);margin-top:2px}
.rec-sheet-x{margin-left:auto;width:30px;height:30px;border-radius:50%;border:none;background:var(--bg2);cursor:pointer;font-size:14px;color:var(--txt2);flex-shrink:0}
.rec-sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:16px 22px 44px;flex:1;min-height:0}
body.rec-open{overflow:hidden}
@media(max-width:640px){.rec-sheet{width:100vw}}

/* ── Module Records — full-screen overlay (slide-up "dedicated page") ── */
#mr-ovl{position:fixed;inset:0;z-index:410;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);transition:transform .44s cubic-bezier(.32,1,.28,1);pointer-events:none}
#mr-ovl.mr-open{transform:translateY(0);pointer-events:auto}
.mr-hd{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0}
.mr-hd-left{min-width:0;flex:1}
.mr-breadcrumb{font-size:11px;color:var(--txt3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-title{font-size:15px;font-weight:700;color:var(--txt);letter-spacing:-.25px;margin-top:1px;white-space:nowrap}
.mr-hd-acts{display:flex;align-items:center;gap:7px;flex-shrink:0}
.mr-act-btn{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--txt2);background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;transition:.15s;line-height:1}
.mr-act-btn:hover{border-color:rgba(0,93,255,.4);color:var(--blue)}
.mr-act-btn.primary{color:#fff;background:var(--blue);border-color:var(--blue)}
.mr-act-btn.primary:hover{opacity:.88}
.mr-close-btn{width:28px;height:28px;border-radius:50%;border:none;background:var(--bg2);cursor:pointer;font-size:13px;color:var(--txt2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s}
.mr-close-btn:hover{background:var(--bg3,var(--bg2))}
.mr-filters{display:flex;align-items:center;gap:7px;padding:9px 20px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;overflow-x:auto}
.mr-filters .filter-select{font-size:11.5px;padding:4px 8px;height:28px}
.mr-filters .filter-input{font-size:11.5px;padding:4px 9px;height:28px}
.mr-search-inp{min-width:160px;max-width:220px;flex-shrink:0}
.mr-body{flex:1;min-height:0;overflow-y:auto;background:var(--bg)}
.mr-tbl-wrap{min-width:100%;overflow-x:auto}
.mr-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.mr-tbl th{position:sticky;top:0;background:var(--card);border-bottom:1.5px solid var(--border);padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--txt2);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
.mr-tbl th:hover{color:var(--txt)}
.mr-tbl th.sort-asc::after{content:' ↑';color:var(--blue)}
.mr-tbl th.sort-desc::after{content:' ↓';color:var(--blue)}
.mr-tbl td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.mr-tbl tbody tr{cursor:pointer;transition:background .1s}
.mr-tbl tbody tr:hover td{background:var(--bg2)}
.mr-foot{display:flex;align-items:center;gap:8px;padding:9px 20px;border-top:1px solid var(--border);background:var(--card);flex-shrink:0;flex-wrap:wrap}
.mr-foot-count{font-size:11.5px;color:var(--txt3);flex:1;min-width:120px}
.mr-pg-row{display:flex;align-items:center;gap:4px}
.mr-pg-btn{font-size:11.5px;padding:3px 9px;border:1px solid var(--border);border-radius:5px;background:var(--bg2);color:var(--txt);cursor:pointer;font-weight:500;transition:.12s;line-height:1.4}
.mr-pg-btn:disabled{opacity:.38;cursor:default}
.mr-pg-btn.pg-active{background:var(--blue);color:#fff;border-color:var(--blue)}
.mr-pg-btn:not(:disabled):not(.pg-active):hover{background:var(--bg3,var(--bg2))}
.mr-pg-size{font-size:11.5px;padding:4px 7px;border:1px solid var(--border);border-radius:5px;background:var(--bg2);color:var(--txt);cursor:pointer}
.mr-col-wrap{position:relative}
.mr-col-menu{position:absolute;z-index:20;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px 0;min-width:170px}
.mr-col-item{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;font-size:12.5px;color:var(--txt);white-space:nowrap}
.mr-col-item:hover{background:var(--bg2)}
.mr-col-item input{accent-color:var(--blue);cursor:pointer}
.mr-empty{text-align:center;padding:60px 20px;color:var(--txt3);font-size:13px}
.mr-txn-chip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:600;background:rgba(22,163,74,.12);color:#15803d;white-space:nowrap}
.mr-notxn-chip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:500;background:var(--bg2);color:var(--txt3);white-space:nowrap}
@media(max-width:640px){.mr-hd{padding:10px 14px}.mr-filters{padding:8px 12px}.mr-foot{padding:8px 12px}}

/* ══════════════════════════════════════════════════
   HORIZONTAL MIND MAP — Vertical → Module → KPI cards
   Every level shows all its options at once; clicking a card opens
   the standardized detail modal (the final navigation layer).
   ══════════════════════════════════════════════════ */
/* ── Card-based horizontal mind map: every node is a card; accumulating
      columns; connectors carry only relationships. ── */
/* Breadcrumbs sit inline in the period toolbar, so no bottom padding — it would
   push them off the chips' centre line. min-width:0 lets them wrap rather than
   force the row wider than the grid on narrow screens. */
.mmcrumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0;min-width:0}
body.view-gst #mm-crumbs{display:none}
.mmcrumb{font-family:inherit;font-size:12px;font-weight:600;color:var(--txt2);background:var(--card);border:1px solid var(--border);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;transition:.18s var(--ease-out)}
.mmcrumb:hover{border-color:rgba(0,93,255,.35);color:var(--blue)}
.mmcrumb.here{background:var(--blue);border-color:var(--blue);color:#fff;cursor:default}
.mmcrumb-sep{color:var(--txt3);font-size:12px}
.mm{position:relative;display:flex;align-items:flex-start;gap:0;padding:2px 0 18px;overflow-x:auto;overflow-y:hidden}
.mm-svg{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible}
/* Columns centre against the tallest one, so a short column (Central, Verticals)
   sits level with the middle of the module list rather than pinned to the top. */
.mmcol{position:relative;z-index:1;display:flex;flex-direction:column;gap:11px;flex-shrink:0;width:158px;align-self:center}
.mmcol.wide{width:170px}
.mmcol.rootcol{width:194px}
.mmcolgap{width:26px;flex-shrink:0}
.mmcoleye{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);padding:0 2px 7px;white-space:nowrap;min-height:15px}
.mmn{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 12px;cursor:pointer;position:relative;opacity:0;transform:translateY(8px) scale(.985);
  transition:box-shadow .22s var(--ease-out),transform .22s var(--ease-out),border-color .22s var(--ease-out),opacity .22s var(--ease-out)}
.mmn.in{opacity:1;transform:none}
.mmn.in:hover{box-shadow:0 10px 24px -14px rgba(0,0,0,.3);transform:translateY(-1px);border-color:rgba(0,93,255,.28)}
.mmn.dim{opacity:.4}
.mmn.dim.in:hover{opacity:.82}
.mmn.on{border-color:var(--blue);box-shadow:0 0 0 1.5px rgba(0,93,255,.35),0 10px 24px -14px rgba(0,93,255,.35)}
.mmn.leaf{cursor:default}
.mmn.leaf.in:hover{box-shadow:none;transform:none;border-color:var(--border)}
.mmn-top{display:flex;align-items:center;gap:7px;margin-bottom:0}
.mmn-ic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mmn-ic svg{width:15px;height:15px}
.mmn-ttl{font-size:13.5px;font-weight:600;letter-spacing:-.1px;color:var(--txt);line-height:1.32}
.mmn-arr{margin-left:auto;color:var(--txt3);font-size:13.5px;flex-shrink:0}
.mmn.on .mmn-arr{color:var(--blue)}
.mmn-v{font-size:28px;font-weight:700;letter-spacing:-1.1px;line-height:1;color:var(--txt);margin-top:10px}
.mmn-v small{font-size:13px;font-weight:600;color:var(--txt3);letter-spacing:0}
.mmn-s{font-size:11.5px;font-weight:500;color:var(--txt3);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tones */
.mmn.t-blue .mmn-ic{background:var(--accent-soft);color:var(--blue)}
.mmn.t-green .mmn-ic{background:#E3F8F1;color:var(--green-ink)}
.mmn.t-purple .mmn-ic{background:#F1ECFB;color:#5B3FA8}
.mmn.t-amber .mmn-ic{background:#FFF3E0;color:#B26A00}
.mmn.t-red .mmn-ic{background:#FDECEB;color:#C4271E}
.mmn.t-ink .mmn-ic{background:#EDEDF0;color:var(--txt)}
/* ── Root card: the entry point into the branch, styled as a premium nav card ──
   The whole card is the click target (role=button + onclick in mmNodeCard); the
   CTA is affordance only. Hover lifts, warms the border and nudges the arrow so
   the interaction reads clearly. */
.mmn.root{padding:20px 15px 16px;border-radius:14px;
  box-shadow:0 1px 2px rgba(16,24,40,.05),0 8px 20px -14px rgba(16,24,40,.28)}
/* Branded card interior. The inner column is pinned to 100.69px — the content
   area left by the card's 1px borders and 20px/16px vertical padding — so the card
   stays 138.69px tall regardless of the new content. Logo top, titles bottom,
   whitespace between. */
.mmn.root .mmn-root-inner{display:flex;flex-direction:column;align-items:center;min-height:100.69px;box-sizing:content-box}
/* Full Recykal lockup, same proportions the header uses: the diamond mark beside
   the wordmark, with the "Sustainable Circularity" tagline under the wordmark. */
.mmn.root .mmn-root-logo{display:flex;align-items:center;gap:9px;flex-shrink:0}
.mmn.root .mmn-root-mark{display:block;height:30px;width:auto;flex-shrink:0}
.mmn.root .mmn-root-brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.mmn.root .mmn-root-word{display:block;height:22px;width:auto}
.mmn.root .mmn-root-tag{font-size:8.5px;font-weight:500;color:#5a6470;letter-spacing:.4px;line-height:1;white-space:nowrap}
/* Title block, centred. "Central Onboarding" is title-case so it holds a single
   line inside the card (uppercase overflows at any readable size); "Dashboard"
   sits centred directly beneath it. */
.mmn.root .mmn-root-titles{margin-top:auto;text-align:center}
.mmn.root .mmn-root-t1{font-size:14px;font-weight:800;letter-spacing:.005em;
  white-space:nowrap;color:var(--txt);line-height:1.2}
.mmn.root .mmn-root-t2{margin-top:3px;font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--blue)}
.mmn.root.in:hover{border-color:rgba(0,93,255,.42);
  box-shadow:0 2px 4px rgba(16,24,40,.05),0 14px 28px -14px rgba(0,93,255,.42);
  transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){
  .mmn.root.in:hover{transform:none}
}
/* Vertical + module cards — navigation only. A uniform min-height keeps every
   card in a column the same size whether or not its title wraps ("Onboarded
   (Details)" runs to two lines, "Breakup" does not), so the columns stay on one
   grid and the gaps between cards read as equal. Content is centred so the
   single-line cards do not sit high in their box. */
.mmn.vert,.mmn.module{padding:11px 10px;min-height:60px;
  display:flex;flex-direction:column;justify-content:center}
/* clean status dot on vert cards */
.mmn.vert .mmn-dot{width:8px;height:8px;border-radius:50%;background:var(--txt3);flex-shrink:0;
  transition:background .2s,box-shadow .2s}
.mmn.vert.on .mmn-dot{background:var(--blue);box-shadow:0 0 0 3px rgba(0,93,255,.16)}
.mmn.vert.muted .mmn-dot{background:var(--border)}
/* module cards: colored left accent */
.mmn.module{border-left-width:3px}
.mmn.module.t-blue{border-left-color:#005dff}
.mmn.module.t-green{border-left-color:#16a34a}
.mmn.module.t-amber{border-left-color:#d97706}
.mmn.module.t-purple{border-left-color:#8b5cf6}
.mmn.module.t-red{border-left-color:#dc2626}
.mmn.module.t-ink{border-left-color:var(--border)}
.mmn.vert.muted{border-style:dashed;cursor:default;background:transparent}
.mmn.vert.muted .mmn-ttl{color:var(--txt2)}
.mmn.vert.muted.in:hover{box-shadow:none;transform:none;border-color:var(--border)}
/* View Details / action card */
.mmn.vd{background:var(--blue);border-color:var(--blue)}
.mmn.vd .mmn-ttl{color:#fff}
.mmn.vd .mmn-ic{background:rgba(255,255,255,.2);color:#fff}
.mmn.vd .mmn-arr{color:rgba(255,255,255,.85)}
.mmn.vd.in:hover{box-shadow:0 16px 32px -16px rgba(0,93,255,.7);border-color:var(--blue);transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){.mmn{opacity:1!important;transform:none!important}}

/* ── Workspace split: navigation (left) + detail canvas (right, parallel) ── */
.mmworkspace{display:flex;align-items:flex-start;gap:0}
/* Nav shrinks to its own content so it never opens a horizontal void beside the
   panel; the panel then grows into every pixel the nav does not use. */
.mmnav{flex:0 1 auto;min-width:0}
.mmdetail{flex:0 0 0px;opacity:0;overflow:hidden;align-self:stretch;
  transition:flex-basis .45s cubic-bezier(.4,0,.2,1),opacity .35s ease}
.mmworkspace.has-panel{gap:22px}
/* On surplus width the nav stays at content size and the panel grows; when space
   is tight (below ~1130px, before the 900px stack) the nav may yield so the page
   never overflows horizontally. */
.mmworkspace.has-panel .mmnav{flex:0 1 auto}
.mmworkspace.has-panel .mmdetail{flex:1 1 auto;flex-basis:clamp(520px,54%,900px);opacity:1;
  position:sticky;top:12px;max-height:calc(100vh - 26px);overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin}
.mmworkspace.has-panel .mmdetail::-webkit-scrollbar{width:8px}
.mmworkspace.has-panel .mmdetail::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
/* inside the side canvas the panels are simply shown/hidden — the canvas slide is the reveal */
.mmdetail #mm-funnel,.mmdetail #mm-geo,.mmdetail #mm-modpanel{max-height:none;opacity:1;overflow:visible;margin:0}
.mmdetail #mm-funnel:not(.mf-open),.mmdetail #mm-geo:not(.mg-open),.mmdetail #mm-modpanel:not(.mp-open){display:none}
/* Funnel → vertical stack in the side canvas */
/* Vertical stacked stage cards — all equal width, compact */
.mmdetail .mf-flow{flex-direction:column;overflow:visible;gap:0;padding:2px;align-items:stretch}
.mmdetail .mf-card{width:100%;max-width:none;min-width:0;padding:8px 14px;border-width:1px}
.mmdetail .mf-v{font-size:1.72rem;font-weight:800;letter-spacing:-.4px;margin-bottom:1px}
.mmdetail .mf-label{font-size:.9rem;font-weight:700;letter-spacing:.005em;margin-bottom:0}
.mmdetail .mf-matrix{border-top:1px solid var(--border);padding-top:6px;margin-top:6px;gap:2px 4px}
.mmdetail .mf-mx-hd{font-size:.74rem;font-weight:600;padding-bottom:2px}
.mmdetail .mf-mx-lbl{font-size:.78rem;font-weight:600;padding:2px 6px 2px 0}
.mmdetail .mf-mx-cell{font-size:.88rem;font-weight:700;padding:3px 4px}
.mmdetail .mf-sep{width:100%;height:11px}
.mmdetail .mf-sep svg{width:20px;height:20px;transform:rotate(90deg)}
/* Geo → map above legend, stacked */
.mmdetail .mg-grid{flex-direction:column;gap:14px}
.mmdetail .mg-map{flex:none;width:100%;max-width:none}
.mmdetail .mg-map-svg-wrap{flex:0 0 58%}
.mmdetail .mg-svg{max-height:360px}
.mmdetail .mg-legend,.mmdetail .mg-loading{min-width:0;width:100%}
.mmdetail .mg-rows{max-height:230px}
/* Module panels fill the canvas width */
.mmdetail .mp-body{max-width:none;padding:15px 18px}
/* Denser docked panel — the panel is the scroll bottleneck for "one screen", so
   its section rhythm is compressed without touching the full-screen KPI modal,
   which uses km-* classes rather than mp-*. */
.mmdetail .mp-eye{padding-bottom:7px}
.mmdetail .mp-note{margin-bottom:8px;padding:6px 10px}
.mmdetail .mp-matrix{margin-top:12px}
.mmdetail .mp-tiles{margin-top:12px;gap:8px}
.mmdetail .mp-tile{padding:10px 12px}
.mmdetail .mp-tile-v{font-size:1.32rem}
.mmdetail .mp-bar{height:30px}
.mmdetail .mp-mx-cell{padding:8px 6px}
.mmdetail .mp-vd{margin-top:12px}
@media(max-width:900px){
  .mmworkspace,.mmworkspace.has-panel{flex-direction:column;gap:0}
  .mmworkspace.has-panel .mmdetail{flex-basis:auto;width:100%;position:static;max-height:none;
    overflow:visible;margin-top:12px}
  .mmdetail .mf-flow{flex-direction:row;overflow-x:auto;align-items:stretch}
  .mmdetail .mf-card{width:auto;min-width:148px}
  .mmdetail .mf-sep{width:44px;height:44px}
  .mmdetail .mf-sep svg{transform:none;width:44px;height:44px}
  .mmdetail .mg-grid{flex-direction:row;flex-wrap:wrap}
}

/* ── Inline Funnel Panel ── */
#mm-funnel{overflow:hidden;max-height:0;opacity:0;transition:max-height .45s cubic-bezier(.4,0,.2,1),opacity .3s ease;margin:0}
#mm-funnel.mf-open{max-height:900px;opacity:1;margin:0 0 28px}
.mf-flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.mf-card{flex:1;min-width:148px;max-width:210px;background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:20px 16px 16px;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .18s;position:relative;opacity:0;transform:translateY(14px);will-change:transform,opacity}
.mf-card.mf-in{opacity:1;transform:none;transition:opacity .35s ease,transform .35s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s}
.mf-card:hover{box-shadow:0 4px 18px -4px rgba(0,0,0,.12);transform:translateY(-1px)}
.mf-v{font-size:2.4rem;font-weight:800;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.mf-v.blue{color:#005dff}.mf-v.purple{color:#8b5cf6}.mf-v.amber{color:#d97706}.mf-v.green{color:#16a34a}.mf-v.red{color:#dc2626}
.mf-label{font-size:.75rem;color:var(--txt2);margin-bottom:8px;line-height:1.3}
/* 2×2 breakdown matrix (Type × Category) */
.mf-matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:2px 4px;border-top:1px solid var(--border);padding-top:10px;margin-top:4px;align-items:center}
.mf-mx-corner{} /* top-left empty cell */
.mf-mx-hd{font-size:.68rem;font-weight:600;color:var(--txt3);text-align:center;padding:0 2px 4px;display:flex;align-items:center;justify-content:center;gap:3px}
.mf-mx-lbl{font-size:.7rem;color:var(--txt2);padding:3px 6px 3px 0;display:flex;align-items:center;gap:4px;white-space:nowrap}
.mf-mx-cell{text-align:center;font-size:.82rem;font-weight:700;color:var(--txt);padding:3px 4px;background:var(--bg);border-radius:4px;font-variant-numeric:tabular-nums;min-width:0}
.mf-mx-cell.na{color:var(--txt3);font-weight:400}
/* Every category is shown, so headers must survive narrow columns … */
.mf-mx-hd{min-width:0}
.mf-mx-hd > span:not(.mf-cat-dot){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* … and the Total column is set apart so each row visibly reconciles. */
.mf-mx-hd.tot{color:var(--txt2);font-weight:700}
.mf-mx-cell.tot{background:var(--card);border:1px dashed var(--border);font-weight:800}
/* colored dots used by matrix headers and labels */
.mf-cat-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mf-cat-dot.seller{background:#8b5cf6}.mf-cat-dot.buyer{background:#06b6d4}
/* Whole-card affordance. Absolutely positioned so the summary layout above it
   is untouched — the arrow only fades in on hover / keyboard focus. */
.mf-open-ic{position:absolute;top:7px;right:9px;font-size:13px;line-height:1;font-weight:700;
  color:var(--blue);opacity:0;transform:translateX(-3px);pointer-events:none;
  transition:opacity .18s var(--ease-out),transform .18s var(--ease-out)}
.mf-card:hover .mf-open-ic,.mf-card:focus-visible .mf-open-ic{opacity:.85;transform:none}
.mf-card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.mf-open-ic{transition:opacity .18s var(--ease-out)}}
/* 2×2 breakdown matrix (Type × Category) */
/* colored dots used by matrix headers and labels */
/* detail strip */
/* Arrow connectors between stage cards. The separator is raised above the cards
   (which are position:relative and would otherwise paint over it and clip the
   arrowhead) so the whole arrow is visible in the gap. */
.mf-sep{display:flex;align-items:center;justify-content:center;width:44px;flex-shrink:0;position:relative;z-index:2}
.mf-sep svg{width:44px;height:44px;overflow:visible}
/* One solid filled arrow — no stroke/fill seam. Its geometry is centred in the
   44-unit viewBox (x4→40, symmetric about y22), so after the 90° rotation it sits
   dead-centre in the gap and points cleanly downward. */
.mf-sep-arrow{fill:var(--blue);shape-rendering:geometricPrecision}
.mf-sep.lit .mf-sep-arrow{fill:var(--blue)}
@keyframes mfDetailIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.mf-detail-vd{display:inline-flex;align-items:center;gap:7px;padding:9px 20px;background:var(--blue);color:#fff;border:none;border-radius:999px;font-size:.8rem;font-weight:600;cursor:pointer;transition:opacity .15s,transform .15s;white-space:nowrap}
.mf-detail-vd svg{width:15px;height:15px;flex-shrink:0}
.mf-detail-vd:hover{opacity:.88;transform:translateY(-1px)}

/* ── Inline Geographic Split — India map ── */
:root{--mg-base:#e9ecf2}
@media(prefers-color-scheme:dark){:root{--mg-base:#2a2d34}}
:root[data-theme="dark"]{--mg-base:#2a2d34}
:root[data-theme="light"]{--mg-base:#e9ecf2}
#mm-geo{overflow:hidden;max-height:0;opacity:0;transition:max-height .5s cubic-bezier(.4,0,.2,1),opacity .3s ease;margin:0}
#mm-geo.mg-open{max-height:1200px;opacity:1;margin:0 0 28px}
.mg-eye{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);padding:0 2px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mg-catchip{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);background:var(--accent-soft);border:1px solid rgba(0,93,255,.25);border-radius:999px;padding:4px 10px;cursor:pointer;transition:background .15s}
.mg-catchip:hover{background:rgba(0,93,255,.14)}
.mg-catx{opacity:.6;font-size:9px}
.mg-grid{display:flex;gap:22px;align-items:stretch;flex-wrap:wrap}
.mg-map{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:row;align-items:stretch;position:relative}
.mg-map-svg-wrap{flex:0 0 66%;min-width:0;padding:14px;display:flex;align-items:center;justify-content:center}
.mg-svg{width:100%;height:auto;max-height:420px;display:block}
.mg-state{transition:fill-opacity .25s ease,stroke-width .15s}
.mg-state.active{stroke-linejoin:round}
.mg-state.active.hl{fill-opacity:1!important;stroke-width:2!important}
.mg-state.sel{stroke-width:2.4!important;fill-opacity:1!important}
/* legend */
.mg-legend{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:6px 6px 10px;display:flex;flex-direction:column;overflow:hidden;animation:mgSlide .4s cubic-bezier(.4,0,.2,1) both}
@keyframes mgSlide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.mg-legend-hd,.mg-row{display:grid;grid-template-columns:1fr 64px 64px 64px;align-items:center;gap:4px;padding:8px 12px}
.mg-legend-hd{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
/* Two-tier header used when the table is bifurcated by category:
   State / Total span both rows; Sellers / Buyers band their category columns. */
.mg-legend-hd.mg-hd-grp{row-gap:3px;padding-bottom:6px}
.mg-hd-span{grid-row:span 2;align-self:end;padding-bottom:1px}
.mg-hd-band{text-align:center;font-size:9px;font-weight:700;letter-spacing:.06em;padding-bottom:3px;border-bottom:1px solid var(--border)}
.mg-hd-cat{text-align:right;font-size:8.5px;font-weight:600;letter-spacing:.02em;color:var(--txt3);text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg-legend-wide{min-width:380px}
.mg-rows{overflow-y:auto;max-height:380px}
.mg-row{border:none;background:none;width:100%;text-align:left;cursor:pointer;border-radius:8px;font:inherit;transition:background .15s;opacity:0;animation:mgRowIn .3s ease forwards}
@keyframes mgRowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.mg-row:hover,.mg-row.hl{background:var(--accent-soft)}
.mg-row-nm{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--txt);min-width:0}
.mg-row-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-swatch{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.mg-row-n{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
.mg-legend-hd .mg-row-n{text-align:right}
.mg-total{font-weight:700;color:var(--txt)}
.mg-seller{color:#1DC797;font-weight:600}
.mg-buyer{color:#005DFF;font-weight:600}
.mg-loading{flex:1;min-width:300px;display:flex;align-items:center;justify-content:center;padding:50px 20px;color:var(--txt3);font-size:13px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
/* state detail */
.mg-detail{margin-top:18px;border-top:1px solid var(--border);padding-top:18px;animation:mfDetailIn .32s cubic-bezier(.4,0,.2,1) both}
.mg-detail-hd{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3);margin-bottom:14px}
.mg-dt-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.mg-dt-cell{flex:1;min-width:92px;background:var(--bg);border:1px solid var(--border);border-radius:calc(var(--r) - 2px);padding:12px 14px}
.mg-dt-v{font-size:1.35rem;font-weight:800;line-height:1;margin-bottom:3px;font-variant-numeric:tabular-nums}
.mg-dt-l{font-size:.72rem;color:var(--txt2)}
/* ── State detail overlay — positioned inside the map's bottom-right white space ── */
.mg-state-detail{flex:0 0 34%;min-width:0;border-left:1px solid var(--border);overflow:hidden;font-family:inherit;display:flex;flex-direction:column}
.mgsd-half{flex:0 0 50%;min-height:0;overflow:hidden;overflow-y:auto}
.mgsd-half+.mgsd-half{border-top:1px solid var(--border)}
.mgsd-fix-hd{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);padding:6px 12px 4px;background:var(--sidebar);position:sticky;top:0;border-bottom:1px solid var(--border)}
.mgsd-rgn-tbl{width:100%;border-collapse:collapse}
.mgsd-rgn-tbl thead th{padding:3px 8px;text-align:right;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3)}
.mgsd-rgn-tbl thead th:first-child{text-align:left}
.mgsd-aud td{font-size:11px;font-weight:700;color:var(--txt);padding:4px 8px 2px}
.mgsd-cat td{font-size:9.5px;color:var(--txt2);padding:1px 8px 1px 16px}
.mgsd-rgn-tbl td{font-variant-numeric:tabular-nums}
.mgsd-rgn-tbl td:not(:first-child){text-align:right}
.mgsd-prompt{padding:24px 14px;text-align:center;color:var(--txt3);font-size:11px;line-height:1.7}
.mgsd-hd{padding:8px 12px 6px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--txt);border-bottom:1px solid var(--border);background:var(--sidebar);min-width:0}
.mgsd-total{margin-left:auto;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--txt3);white-space:nowrap;flex-shrink:0}
.mgsd-section:not(:first-child){border-top:1px solid var(--border)}
.mgsd-sec-hd{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:5px 12px 3px}
.mgsd-tbl{width:100%;border-collapse:collapse}
.mgsd-tbl tr:not(:last-child) td{border-bottom:1px solid var(--border)}
.mgsd-tbl td{padding:4px 12px;font-size:10.5px}
.mgsd-tbl td:first-child{color:var(--txt);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.mgsd-tbl td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;width:32px;color:var(--txt)}
.mgsd-clk{cursor:pointer;transition:background .12s,color .12s;border-radius:3px}
.mgsd-clk:hover{background:rgba(0,93,255,.07)}
.mgsd-sec-hd.mgsd-clk:hover{background:rgba(0,93,255,.07)}
.mgsd-tbl tr.mgsd-clk:hover td{background:rgba(0,93,255,.07)}
@media(max-width:720px){.mg-map{flex-direction:column}.mg-map-svg-wrap{flex:none;width:100%}.mg-state-detail{flex:none;width:100%;border-left:none;border-top:1px solid var(--border)}.mg-legend,.mg-loading{min-width:0}}

/* ── Generic inline module panel (Volume / Transactions / Ratings / OSV / Existing) ── */
#mm-modpanel{overflow:hidden;max-height:0;opacity:0;transition:max-height .5s cubic-bezier(.4,0,.2,1),opacity .3s ease;margin:0}
#mm-modpanel.mp-open{max-height:900px;opacity:1;margin:0 0 28px}
.mp-eye{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);padding:0 2px 10px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.mp-badge{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);background:var(--accent-soft);border:1px solid rgba(0,93,255,.22);border-radius:999px;padding:3px 9px}
.mp-note{font-size:.72rem;color:var(--txt3);background:var(--accent-soft);border:1px solid var(--border);border-radius:6px;padding:7px 12px;margin-bottom:10px;line-height:1.5}
.mp-body{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;max-width:660px}
/* Type × Category cross-tab */
.mp-matrix{display:grid;gap:6px 7px;margin-top:18px;align-items:center}
.mp-mx-corner{min-height:1px}
.mp-mx-hd{font-size:.66rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--txt3);text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;padding-bottom:2px}
.mp-mx-hd.tot{color:var(--txt2)}
.mp-mx-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.mp-mx-rlbl{font-size:.84rem;font-weight:600;color:var(--txt2);padding-right:6px;white-space:nowrap}
.mp-mx-rlbl.tot{color:var(--txt);font-weight:700}
.mp-mx-cell{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 8px;text-align:center;min-width:0}
.mp-mx-n{font-size:1.06rem;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
.mp-mx-cell.tot{background:var(--card);border-style:dashed}
.mp-mx-cell.tot .mp-mx-n{font-weight:800}
.mp-mx-cell.tot.grand{border-style:solid;border-color:rgba(0,93,255,.3);background:var(--accent-soft)}
.mp-mx-cell.tot.grand .mp-mx-n{color:var(--blue)}
.mp-mx-cell.ch{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.mp-mx-cell.ch:hover,.mp-mx-cell.ch:focus-visible{border-style:solid;border-color:var(--blue);box-shadow:0 5px 16px -8px rgba(0,93,255,.45);transform:translateY(-1px);outline:none}
.mp-mx-go{position:relative;font-size:9px;font-weight:700;color:var(--blue);margin-left:4px;opacity:0;transition:opacity .15s}
.mp-mx-cell.ch:hover .mp-mx-go,.mp-mx-cell.ch:focus-visible .mp-mx-go{opacity:1}
.mp-headline{margin-bottom:16px}
.mp-h-v{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mp-h-l{font-size:.78rem;color:var(--txt2);margin-top:5px}
/* stacked composition bar */
.mp-bar{display:flex;height:34px;border-radius:9px;overflow:hidden;background:var(--bg);border:1px solid var(--border)}
.mp-seg{display:flex;align-items:center;justify-content:center;min-width:2px;transition:width .6s cubic-bezier(.4,0,.2,1),filter .15s;overflow:hidden;position:relative}
.mp-seg-in{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;padding:0 8px;text-shadow:0 1px 2px rgba(0,0,0,.25);overflow:hidden;text-overflow:ellipsis;min-width:0}
.mp-seg.ch{cursor:pointer}
.mp-seg.ch:hover{filter:brightness(1.08) saturate(1.1)}
.mp-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
.mp-leg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt2)}
.mp-leg i{width:9px;height:9px;border-radius:3px;flex-shrink:0}
/* stat tiles */
.mp-tiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.mp-tile{flex:1;min-width:104px;background:var(--bg);border:1px solid var(--border);border-radius:calc(var(--r) - 2px);padding:13px 15px}
.mp-tile.ch{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.mp-tile.ch:hover{border-color:var(--blue);box-shadow:0 6px 18px -10px rgba(0,93,255,.4);transform:translateY(-1px)}
.mp-tile-v{font-size:1.5rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mp-tile-l{font-size:.74rem;color:var(--txt2);margin-top:5px;display:flex;align-items:center;gap:5px}
.mp-go{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);opacity:0;transition:opacity .15s}
.mp-tile.ch:hover .mp-go{opacity:1}
.mp-tile-s{font-size:.72rem;color:var(--txt3);margin-top:4px}
.mp-vd{margin-top:20px}
@media(max-width:520px){.mp-body{padding:16px}.mp-h-v{font-size:2.1rem}}

.osv-list{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.osv-row{display:flex;align-items:center;gap:9px;font-size:12px}
.osv-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.osv-nm{color:var(--txt2);font-weight:500}
.osv-v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--txt)}
.osv-pct{color:var(--txt3);font-weight:600;font-size:11px;width:36px;text-align:right;font-variant-numeric:tabular-nums}
/* 6 · Business performance */
.jr-perf{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.gmv-dark{background:#1A1A1C;color:#fff;border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;cursor:pointer}
.gmv-dark-top{display:flex;align-items:flex-start;justify-content:space-between}
.gmv-dark-lb{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.gmv-dark-link{font-size:11px;font-weight:600;color:rgba(255,255,255,.72)}
.gmv-dark-vl{font-size:35px;font-weight:700;letter-spacing:-1.5px;margin-top:6px;font-variant-numeric:tabular-nums}
.gmv-dark-split{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.gmv-dr{display:flex;align-items:center;gap:12px}
.gmv-dr-nm{font-size:11px;font-weight:600;color:rgba(255,255,255,.7);width:60px;letter-spacing:.02em}
.gmv-dr-track{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.gmv-dr-fill{height:100%;border-radius:3px;transition:width .7s var(--ease-out)}
.gmv-dr-vl{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;width:88px;text-align:right}
.gmv-dark-empty{margin-top:14px;font-size:12px;color:rgba(255,255,255,.6)}
/* Pipeline pair now stands alone (rail removed) — seller + buyer side by side. */
.vpipe-pair{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.jr-perf{grid-template-columns:1fr}}
@media(max-width:960px){
  #main{flex-direction:column}
  #vnav{flex:none;width:100%;position:static;height:auto;border-right:none;border-bottom:1px solid var(--border);display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
  #vnav .vnav-eyebrow,#vnav .vnav-sep{display:none}
  .vnav-tree{flex-direction:row}
  .vnode{min-width:212px;flex-shrink:0}
  body:not(.view-gst) #dash-content{padding:18px 18px 60px}
  .jr-ops,.vpipe-pair{grid-template-columns:1fr}
}
</style>
</head>

var GP_VERT_COLORS   = ['#005DFF', '#1DC797', '#8460D4', '#8460D4', '#FF9500', '#00C7BE', '#A2845E', '#8E8E93'];
var GP_MAX_ROWS = 300;      // vendor rows rendered at once

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
var AUTO_REFRESH_SEC = 300;  // poll every 5 min — matches the 5-min backend cache TTL
var _refreshTimer    = null;
var _rmD = {};  // key→row map for the record detail modal
var _rmI = 0;   // auto-increment key, reset each board/table render
var _prefetchedAuds  = {};  // tracks which audiences have been prefetched into localStorage
var _lastDashHash    = {};  // per-audience response hash — skip re-render when unchanged
var _dashLoading     = false; // true while getCombinedDashboard/fallback is in-flight
var _countdownTimer  = null;
var _nextAt          = 0;
var _isFirstLoad     = true;

// ═══════════════════════════════════════════════════════════════
// MODAL SCROLL LOCK — true dialog isolation (Notion / Linear / Stripe-style).
// Freezes the dashboard at its exact scroll position — position:fixed body
// with a negative top offset is the only technique that also stops iOS
// Safari's rubber-band background scroll — compensates the vanished
// scrollbar so nothing shifts horizontally, blocks every background scroll
// input (wheel, touch, arrow/Page/Home/End/Space keys) while leaving
// anything inside an open modal panel (any element carrying
// [data-modal-scroll]) free to scroll and receive keystrokes normally, and
// restores the exact position on close with no visible jump. Reference-
// counted so a modal opened from within another (e.g. a KPI card opened
// from inside the records sheet) doesn't unlock the page until the last one
// closes.
// ═══════════════════════════════════════════════════════════════
var _modalLockCount = 0;
var _modalScrollY = 0;
var _MODAL_BLOCK_KEYS = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, PageUp: 1, PageDown: 1, Home: 1, End: 1, ' ': 1, Spacebar: 1 };
function _modalScrollAllowed(target) {
  var el = target;
  while (el && el.nodeType === 1) {
    if (el.hasAttribute && el.hasAttribute('data-modal-scroll')) return true;
    el = el.parentNode;
  }
  return false;
}
function _modalBlockWheelTouch(e) { if (!_modalScrollAllowed(e.target)) e.preventDefault(); }
function _modalBlockKeys(e) {
  if (!_MODAL_BLOCK_KEYS.hasOwnProperty(e.key)) return;
  if (!_modalScrollAllowed(e.target)) e.preventDefault();
}
function lockBodyScroll() {
  if (_modalLockCount === 0) {
    _modalScrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
    var sbw = window.innerWidth - document.documentElement.clientWidth;
    var b = document.body.style;
    b.position = 'fixed';
    b.top = (-_modalScrollY) + 'px';
    b.left = '0'; b.right = '0'; b.width = '100%';
    if (sbw > 0) b.paddingRight = sbw + 'px';
    document.body.classList.add('modal-locked');
    document.addEventListener('wheel', _modalBlockWheelTouch, { passive: false });
    document.addEventListener('touchmove', _modalBlockWheelTouch, { passive: false });
    document.addEventListener('keydown', _modalBlockKeys, true);
  }
  _modalLockCount++;
}
function unlockBodyScroll() {
  if (_modalLockCount === 0) return;
  _modalLockCount--;
  if (_modalLockCount === 0) {
    var b = document.body.style;
    b.position = ''; b.top = ''; b.left = ''; b.right = ''; b.width = ''; b.paddingRight = '';
    document.body.classList.remove('modal-locked');
    document.removeEventListener('wheel', _modalBlockWheelTouch, { passive: false });
    document.removeEventListener('touchmove', _modalBlockWheelTouch, { passive: false });
    document.removeEventListener('keydown', _modalBlockKeys, true);
    window.scrollTo(0, _modalScrollY);
  }
}
// Shared open/close for the class-toggled modals (kpi/doc/gp) — guards
// against double-locking when a modal is re-rendered while already open.
function _modalOpenClass(modal, cls, escFn) {
  if (!modal || modal.classList.contains(cls)) return;
  modal.classList.add(cls);
  document.addEventListener('keydown', escFn);
  lockBodyScroll();
}
function _modalCloseClass(modal, cls, escFn) {
  if (!modal || !modal.classList.contains(cls)) return;
  modal.classList.remove(cls);
  document.removeEventListener('keydown', escFn);
  unlockBodyScroll();
}

// localStorage key prefix — bump the version suffix when the data shape changes
// so stale entries from an old schema are silently ignored.
var STORE_PFX = 'ebt_v13_';   // bumped: Managed Marketplace consolidated into single vertical

// Stale-while-revalidate: if we have a previous response in localStorage, paint
// it immediately so the user sees real data with zero wait, then fetch fresh data
// silently in the background. Perceived load time drops to ~0 ms on return visits.
document.addEventListener('DOMContentLoaded', function() {
  var restored = false;
  try {
    var stored = localStorage.getItem(STORE_PFX + 'combined');
    if (stored) {
      var parsed = JSON.parse(stored);
      // Only restore if the stale data has actual non-zero seller totals.
      // Restoring a zero-state would show 0s while the fresh fetch is in flight,
      // making the user think there's no data when there is.
      var sVerts = (parsed && parsed.seller && parsed.seller.verticals) || {};
      var staleHasData = Object.keys(sVerts).some(function(k) { return (sVerts[k].total || 0) > 0; });
      if (parsed && parsed.success && parsed.seller && parsed.buyer && staleHasData) {
        DS = parsed.seller;
        DB = parsed.buyer;
        D  = parsed;
        D.verticals      = DS.verticals || {};
        D.verticalConfig = parsed.verticalConfig || [];
        D.fiscalYears    = parsed.fiscalYears    || [];
        _isFirstLoad = false;
        hideLoading();
        renderAll();
        var lu = document.getElementById('last-updated');
        if (lu) lu.textContent = 'Refreshing…';
        restored = true;
      }
    }
  } catch (e) {}

  // Always follow up with a backend fetch; silent if stale data was shown
  loadData(restored);
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && selectedVert) closeVertDetail();
});

// Initialize view chrome once the DOM is ready (correct show/hide from the start).
document.addEventListener('DOMContentLoaded', updateViewChrome);

// ── Motion: respect the OS reduced-motion switch for JS-driven animation ──
function motionOK() {
  return !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// ── Glass header: transparent at top → solid + hairline once scrolled ──
(function() {
  var hdr = document.getElementById('header'), ticking = false;
  function apply() { hdr.classList.toggle('scrolled', window.scrollY > 8); ticking = false; }
  window.addEventListener('scroll', function() {
    if (!ticking) { ticking = true; requestAnimationFrame(apply); }
  }, { passive: true });
  apply();
})();

// ── Animated number counters — count up only when a value actually changes ──
var _counterPrev = {};   // id → last shown value, so silent refreshes don't re-run
function animateCounters(scope) {
  var els = (scope || document).querySelectorAll('[data-count]');
  els.forEach(function(el) {
    var id     = el.getAttribute('data-count-id') || '';
    var target = parseInt(el.getAttribute('data-count'), 10) || 0;
    var prev   = (id && _counterPrev[id] !== undefined) ? _counterPrev[id] : null;
    if (id) _counterPrev[id] = target;
    if (!motionOK() || prev === target) { el.textContent = fmt(target); return; }
    var from  = (prev === null) ? 0 : prev;
    var t0    = performance.now(), dur = 650;
    (function tick(now) {
      var p = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);   // ease-out cubic
      el.textContent = fmt(Math.round(from + (target - from) * e));
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  });
}

function scheduleNextRefresh() {
  clearTimeout(_refreshTimer);
  clearInterval(_countdownTimer);
  _nextAt = Date.now() + AUTO_REFRESH_SEC * 1000;

  var el = document.getElementById('refresh-countdown');
  _countdownTimer = setInterval(function() {
    var rem = Math.max(0, Math.ceil((_nextAt - Date.now()) / 1000));
    if (el) el.textContent = (rem >= 60 ? Math.floor(rem / 60) + 'm ' : '') + (rem % 60) + 's';
  }, 1000);

  _refreshTimer = setTimeout(function() { refreshActive(true); }, AUTO_REFRESH_SEC * 1000);
}

// Reload whichever view is active (manual refresh button + auto-refresh timer).
function refreshActive(silent) {
  if (currentView === 'gst') loadGSTData(silent);
  else loadData(silent);
}

// Primary: getCombinedDashboard (one call, seller + buyer together).
// Fallback: two getDashboardData calls when the combined cache is cold and
// the live read returns empty seller data (Metabase temporarily unreachable).
function loadData(silent) {
  // Deduplicate: if a background revalidation is already in-flight, skip.
  // Manual refreshes (silent=false) always proceed and cancel the current fetch.
  if (_dashLoading && silent) return;

  _dashLoading = true;
  var btn = document.getElementById('btn-refresh');
  if (btn) btn.classList.add('spinning');
  clearTimeout(_refreshTimer);
  clearInterval(_countdownTimer);
  var cd = document.getElementById('refresh-countdown');
  if (cd) cd.textContent = '…';

  function done() {
    _dashLoading = false;
    if (btn) btn.classList.remove('spinning');
    if (_isFirstLoad) { hideLoading(); _isFirstLoad = false; }
    scheduleNextRefresh();
  }
  function fail(msg) {
    _dashLoading = false;
    if (_isFirstLoad) { _isFirstLoad = false; hideLoading(); showError(msg, true); }
    else if (!silent) showError(msg, false);
    if (btn) btn.classList.remove('spinning');
    scheduleNextRefresh();
  }

  var baseF = { period: currentPeriod };
  if (currentPeriod === 'Custom') { baseF.startDate = customStart; baseF.endDate = customEnd; }
  var filtersJson = JSON.stringify(baseF);
  var sellerF = JSON.stringify({ audience: 'seller', period: baseF.period, startDate: baseF.startDate, endDate: baseF.endDate });
  var buyerF  = JSON.stringify({ audience: 'buyer',  period: baseF.period, startDate: baseF.startDate, endDate: baseF.endDate });

  function applyAndRender(newDS, newDB, meta) {
    DS = newDS; DB = newDB; D = meta;
    D.verticals      = DS.verticals;
    D.verticalConfig = meta.verticalConfig || [];
    D.fiscalYears    = (meta.seller && meta.seller.fiscalYears) || meta.fiscalYears || [];
    // Only persist to localStorage when we have real data — never overwrite with zeros.
    var freshHasData = Object.keys(DS.verticals || {}).some(function(k) {
      return ((DS.verticals[k] && DS.verticals[k].total) || 0) > 0;
    });
    if (freshHasData) {
      try {
        localStorage.setItem(STORE_PFX + 'combined', JSON.stringify({
          success: true, lastUpdated: D.lastUpdated, dataSource: D.dataSource,
          verticalConfig: D.verticalConfig, fiscalYears: D.fiscalYears,
          seller: DS, buyer: DB,
        }));
      } catch (e) {}
    }
    // Include the active period in the hash so switching periods always forces
    // a re-render even if lastUpdated happens to be identical.
    var hash = (D.lastUpdated || '') + '|' + currentPeriod;
    if (_lastDashHash['combined'] !== hash) {
      _lastDashHash['combined'] = hash;
      // Quality data is period-independent (getQualityData takes no filters), so it
      // is deliberately NOT discarded here. Clearing it on every period change made
      // the Vendor Ratings and OSV modules vanish and re-appear on each switch.
      var newPKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);
      if (selectedVert && _vertRowsPKey !== newPKey) {
        vertRows = []; vertRowsLoading = false; vertRowsError = null;
        _ovnRows = {};
        loadVertRows(selectedVert);
      }
      done();
      try { renderAll(); } catch (e) { console.error('renderAll error', e); }
    } else {
      done();
    }
  }

  // Returns true if seller verticals object has at least one non-zero total.
  function hasSellerData(verticals) {
    if (!verticals) return false;
    return Object.keys(verticals).some(function(k) { return (verticals[k].total || 0) > 0; });
  }

  // Fallback: two individual getDashboardData calls (seller is fatal, buyer is not).
  function loadFallback() {
    var _sData = null, _bData = null, _pending = 2, _fbFailed = false;
    function tryFbMerge() {
      if (_fbFailed || --_pending > 0) return;
      // Fail only when the seller fetch truly returned nothing (null = network/parse
      // error). A valid response with 0 totals is a legitimate empty state for
      // period filters like "Today" or "MTD" — render it, don't treat as an error.
      if (!_sData) {
        fail('Seller data unavailable. Retrying in ' + AUTO_REFRESH_SEC + 's.');
        return;
      }
      applyAndRender(
        { verticals: _sData.verticals || {} },
        _bData ? { verticals: _bData.verticals || {} } : { verticals: {} },
        _sData || _bData || {}
      );
    }
    google.script.run
      .withSuccessHandler(function(res) {
        try { var d = JSON.parse(res); if (d && d.verticals) _sData = d; else { _fbFailed = true; fail((d && d.error) || 'Seller error'); return; } } catch (e) { _fbFailed = true; fail('Parse error'); return; }
        tryFbMerge();
      })
      .withFailureHandler(function(err) { if (!_fbFailed) { _fbFailed = true; fail((err && err.message) || 'Script error'); } })
      .getDashboardData(sellerF);
    google.script.run
      .withSuccessHandler(function(res) { try { var d = JSON.parse(res); if (d && d.verticals) _bData = d; } catch (e) {} tryFbMerge(); })
      .withFailureHandler(function() { tryFbMerge(); })
      .getDashboardData(buyerF);
  }

  // Quality (Vendor Ratings / OSV) is a separate backend call that does not depend
  // on the dashboard payload. Firing it here puts both requests in flight together,
  // so those two modules arrive with the rest instead of appearing afterwards.
  try { loadQualityData(); } catch (e) {}

  // Primary: single combined call.
  google.script.run
    .withSuccessHandler(function(res) {
      try {
        var d = JSON.parse(res);
        if (!d || !d.success || !d.seller) { fail((d && d.error) || 'Data error'); return; }
        var sVerts = (d.seller && d.seller.verticals) || {};
        // "All" period must always have records when Metabase is reachable.
        // Empty seller data under "All" means a cold cache + unreachable source —
        // fall back to individual getDashboardData calls which may have a warm cache.
        // For every other period (Today, MTD, etc.) zero records is a valid result;
        // falling back would just make two more round-trips and still return zero.
        if (currentPeriod === 'All' && !hasSellerData(sVerts)) { loadFallback(); return; }
        applyAndRender(
          { verticals: sVerts },
          { verticals: (d.buyer && d.buyer.verticals) || {} },
          d
        );
      } catch (e) { fail('Parse error: ' + e.message); }
    })
    .withFailureHandler(function(err) {
      // getCombinedDashboard not available (older deployment) — fall back.
      loadFallback();
    })
    .getCombinedDashboard(filtersJson);
}

// Switch to the GST Payables view (paint cached data instantly, then refresh).
function switchView(view) {
  if (view !== 'gst') { switchAudience(currentAudience); return; }
  if (currentView === 'gst') return;
  currentView = 'gst';
  snActiveKey = null;
  if (selectedVert) closeVertDetail();
  document.body.style.overflow = '';
  updateViewChrome();
  renderVNav();   // reflect GST-active state in the mind-map nav

  var swrDone = false;
  try {
    var stored = localStorage.getItem(STORE_PFX + 'gst_' + gpYear);
    if (stored) {
      var parsed = JSON.parse(stored);
      if (parsed && parsed.success) { GST = parsed; renderGST(); swrDone = true; }
    }
  } catch (e) {}
  if (!swrDone) { GST = null; renderGSTSkeleton(); }
  loadGSTData(swrDone);
}

function hideLoading() {
  var el = document.getElementById('loading-overlay');
  if (el) el.classList.add('hidden');
}
// Safety net — if neither callback fires within 20 s (script timeout, network
// issue, or an unhandled render error), dismiss the overlay so the app isn't
// stuck on the loading screen. A retry button will be visible after dismissal.
setTimeout(function() {
  var el = document.getElementById('loading-overlay');
  if (el && !el.classList.contains('hidden')) {
    el.classList.add('hidden');
    console.warn('loading-overlay force-dismissed after 20 s');
  }
}, 20000);
function showError(msg, persistent) {
  console.error(msg);
  var ov = document.getElementById('loading-overlay');
  ov.querySelector('.loading-txt').textContent = '⚠ ' + msg;
  ov.classList.remove('hidden');
  if (!persistent) setTimeout(function() { ov.classList.add('hidden'); }, 6000);
}

// Sync the Today/Weekly/Monthly/MTD/YTD chip active state to currentPeriod.

    btn.classList.toggle('active', btn.dataset.qf === currentPeriod);

// Period select above the cards — options come from the data (fiscalYears)
function renderPeriodControl() {
  renderQFChips();
  var sel = document.getElementById('top-period');
  if (!sel) return;
  var pairs = [
    ['All',       'All Time'],
    ['Today',     'Today'],
    ['MTD',       'MTD (Month to Date)'],
    ['YTD',       'YTD (Apr 1 – Today)'],
  ];
  ((D && D.fiscalYears) || []).forEach(function(fy) { pairs.push([fy, fy.replace(/^FY/, 'FY ')]); });
  pairs.push(['Custom', 'Custom Range']);
  sel.innerHTML = pairs.map(function(o) {
    return '<option value="' + o[0] + '">' + o[1] + '</option>';
  }).join('');
  sel.value = currentPeriod;
  if (!sel.value) { sel.value = 'All'; currentPeriod = 'All'; }
  var cu = document.getElementById('top-custom');
  if (cu) cu.style.display = currentPeriod === 'Custom' ? 'inline-flex' : 'none';
  var st = document.getElementById('top-start');
  var en = document.getElementById('top-end');
  if (st) st.value = customStart;
  if (en) en.value = customEnd;
}

function onPeriodSelect(val) {
  currentPeriod = val;
  renderQFChips();  // immediate visual feedback on click
  if (val === 'Custom') { renderPeriodControl(); return; }   // wait for both dates
  customStart = '';
  customEnd   = '';
  _prefetchedAuds = {};  // period changed — re-prefetch other audience with new period
  // Invalidate the render-dedup hash so the response for the new period always
  // triggers a full re-render, even if lastUpdated happens to match the prior call.
  _lastDashHash['combined'] = null;
  loadData();
}

function onCustomDates() {
  var st = document.getElementById('top-start');
  var en = document.getElementById('top-end');
  customStart = st ? st.value : '';
  customEnd   = en ? en.value : '';
  if (customStart && customEnd) { _lastDashHash['combined'] = null; loadData(); }
}

function renderLastUpdated() {
  var d   = new Date(D.lastUpdated);
  var el  = document.getElementById('last-updated');
  var dot = document.querySelector('.status-dot');

  var t = d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
  var isLive = D.dataSource === 'metabase_live' || D.dataSource === 'metabase_sync' || D.dataSource === 'metabase';
  if (isLive) {
    el.textContent = 'Live · Updated ' + t;
    el.title = (D.dataSource === 'metabase_live' ? 'Metabase Live' : 'Metabase Sync')
      + (D.mbSyncedAt ? ' · synced ' + new Date(D.mbSyncedAt).toLocaleTimeString('en-IN') : '');
    if (dot) { dot.style.background = '#30D158'; }
  } else if (D.dataSource === 'empty') {
    el.innerHTML = '<span style="color:var(--st-rejected-tx);font-weight:600">No data source</span>';
    el.title = 'All data paths returned empty — check the Apps Script configuration';
    if (dot) { dot.style.background = '#FF3B30'; }
  } else {
    el.textContent = 'Updated ' + t;
    el.title = 'Source: ' + (D.dataSource || 'sheet');
    if (dot) { dot.style.background = '#AEAEB2'; }
  }
}

// Default (Sellers) vertical layout. Each audience/dataset may ship its own

var VERT_CFG = [
  { key:'OMP',           name:'Marketplace',         sub:'', code:'OMP' },
  { key:'EPR',           name:'EPR',                 sub:'', code:'EPR' },
  { key:'Marketplace',   name:'Managed Marketplace', sub:'', code:'MKT' },

  var pKey = JSON.stringify([currentPeriod, customStart || '', customEnd || '']);

    _audRows = { key:key, pKey:pKey, seller:null, buyer:null, loading:{} };

      && Array.isArray(vertRows) && vertRows.length) {

  if (_audRows[aud] != null) { cb(_audRows[aud]); return; }
  if (_audRows.loading[aud]) return;              // a request is already in flight
  _audRows.loading[aud] = true;
  var f = { audience: aud, period: currentPeriod };

// Shared funnel order — the meter bars and the 3D funnel render this exact
// sequence: Total Cases, then Onboarded, then the remaining stages by
// descending count (so the funnel narrows properly).
function funnelTiers(v) {
  var rest = [
    { k: 'draft',  n: v.draft    || 0 },
    { k: 'review', n: v.inReview || 0 },
  ];
  if (v.transacted !== null && v.transacted !== undefined) {
    rest.push({ k: 'transacted', n: v.transacted });
  }
  rest.sort(function(a, b) { return b.n - a.n; });
  return [{ k: 'total', n: v.total || 0, isTotal: true }, { k: 'onboarded', n: v.completed || 0 }].concat(rest);
}

// Detail funnel — Apple Activity-style concentric rings. One ring per stage,
// sweep proportional to its share of Total (12 o'clock, clockwise); Total sits
// in the centre. The legend carries the exact counts, so precision never
// depends on reading arc lengths. Ring order matches the 3D funnel.
function funnelBig(v, cfg) {
  var tot = v.total || 0;
  if (!tot) return '';

  // Outermost → innermost: Onboarded, then the rest of the pipeline by
  // descending count (same as funnelTiers), Rejected always innermost.
  var tiers = funnelTiers(v).filter(function(t) { return !t.isTotal; });
  tiers.push({ k: 'rejected', n: v.rejected || 0 });

  var S = 260, c0 = S / 2;            // svg size / centre
  var R0 = 112, RW = 14, RGAP = 4;    // outer radius, ring width, ring gap

  var rings = tiers.map(function(t, i) {
    var r = R0 - i * (RW + RGAP);
    if (r < 24) return '';            // never collide with the centre label
    var C = 2 * Math.PI * r;
    var frac = Math.max(0, Math.min(1, (t.n || 0) / tot));
    var st = STAGE[t.k];
    var track = '<circle cx="' + c0 + '" cy="' + c0 + '" r="' + r + '" fill="none"'
      + ' stroke="var(--bg2)" stroke-width="' + RW + '"/>';
    if (!frac) return track;
    // Floor tiny arcs at one ring-width so they read as arcs, never dots;
    // the legend + tooltip carry the exact value.
    var dash = Math.max(frac * C, RW);
    var arc = '<circle class="fring" cx="' + c0 + '" cy="' + c0 + '" r="' + r + '" fill="none"'
      + ' stroke="' + st.fill + '" stroke-width="' + RW + '" stroke-linecap="round"'
      + ' stroke-dasharray="' + dash.toFixed(2) + ' ' + C.toFixed(2) + '"'
      + ' transform="rotate(-90 ' + c0 + ' ' + c0 + ')"'
      + ' style="animation-delay:' + (120 + i * 110) + 'ms"'
      + '><title>' + st.lbl + ' — ' + fmt(t.n) + ' (' + Math.round(frac * 100) + '%)</title></circle>';
    return track + arc;
  }).join('');

  var centre = '<g class="donut-ctr">'
    + '<text x="' + c0 + '" y="' + (c0 - 2) + '" text-anchor="middle" font-family="Inter,sans-serif"'
    + ' font-size="23" font-weight="800" fill="var(--txt)">' + fmt(tot) + '</text>'
    + '<text x="' + c0 + '" y="' + (c0 + 13) + '" text-anchor="middle" font-family="Inter,sans-serif"'
    + ' font-size="8" font-weight="600" fill="var(--txt3)" letter-spacing="0.5">TOTAL CASES</text>'
    + '</g>';

  var svg = '<svg width="' + S + '" height="' + S + '" viewBox="0 0 ' + S + ' ' + S + '"'
    + ' style="flex-shrink:0;display:block" role="img" aria-label="Onboarding funnel rings">'
    + rings + centre + '</svg>';

  var legend = '<div class="fring-leg">'
    + [{ k: 'total', n: tot }].concat(tiers).map(function(t) {
        var st   = STAGE[t.k];
        var pc   = Math.round(((t.n || 0) / tot) * 100);
        var hero = t.k === 'onboarded';
        return '<div class="fring-leg-row' + (hero ? ' is-hero' : '') + '">'
          + '<span class="cc-dot" style="background:' + st.fill + '"></span>'
          + '<span class="fring-leg-lbl">' + st.lbl + '</span>'
          + '<span class="fring-leg-val">' + fmt(t.n) + '</span>'
          + '<span class="fring-leg-pct">(' + pc + '%)</span>'
          + '</div>';
      }).join('')
    + '</div>';

  return '<div class="fun-split">'
    + '<div class="fun-rings">' + svg + legend + '</div>'
    + '<div class="fun-3d">' + funnel3D(v) + '</div>'
    + '</div>';
}

// Small 3D funnel. Sequence: Total Cases, then Onboarded, then the remaining
// stages by descending count (so the funnel narrows properly). Each stage is a
// row: a centred 3D band (width ∝ its share of Total) beside a small detail
// card naming the stage and its count.
function funnel3D(v) {
  var tot = v.total || 0;
  if (!tot) return '';
  var tiers = funnelTiers(v);

  var BA = 178, cx = 89, FW = 166, ry = 6, y0 = 6, bandH = 28, y1 = y0 + bandH, vbH = 40;
  var scale = function(n) { return Math.min(FW, Math.max(28, FW * ((n || 0) / tot))); };

  // Shared cylindrical-sheen gradient, defined once for all band SVGs.
  var out = '<div class="f3d"><svg width="0" height="0" style="position:absolute" aria-hidden="true">'
    + '<defs><linearGradient id="f3d-cyl" x1="0" y1="0" x2="1" y2="0">'
    +   '<stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".40" stop-color="#fff" stop-opacity="0"/>'
    +   '<stop offset=".64" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>'
    + '</linearGradient></defs></svg>';

  out += tiers.map(function(t) {
    var w  = scale(t.n);
    var wB = w * 0.86;
    var col = STAGE[t.k].fill;
    var trap = 'M' + (cx - w / 2) + ' ' + y0 + ' L' + (cx + w / 2) + ' ' + y0
             + ' L' + (cx + wB / 2) + ' ' + y1 + ' L' + (cx - wB / 2) + ' ' + y1 + ' Z';
    var band = '<svg class="f3d-band-svg" viewBox="0 0 ' + BA + ' ' + vbH + '" role="img" aria-label="' + esc(STAGE[t.k].lbl) + '">'
      + '<path d="' + trap + '" fill="' + col + '"/>'
      + '<ellipse cx="' + cx + '" cy="' + y0 + '" rx="' + (w / 2).toFixed(1) + '" ry="' + ry + '" fill="' + col + '"/>'
      + '<ellipse cx="' + cx + '" cy="' + y0 + '" rx="' + (w / 2).toFixed(1) + '" ry="' + ry + '" fill="#fff" opacity=".26"/>'

function renderFunnel(key) {
  var el = document.getElementById('sec-funnel');
  if (!el) return;

  var vb  = (DB && DB.verticals || {})[key] || {};

  var done   = (vs.completed|| 0) + (vb.completed|| 0);

      + '<div class="fn-track"><div class="fn-fill" style="width:' + w.toFixed(1) + '%;background:' + color + '">' + fmt(val) + '</div></div>'

// ── Mind-map reveal — branches unfold down the rail, one after another ──
function runJourneyReveal() {
  var tree = document.getElementById('mm-tree');
  if (!tree) return;
  var nodes = Array.prototype.slice.call(tree.querySelectorAll('.tnode'));
  if (!nodes.length) return;
  var rail = document.getElementById('mm-rail');
  var grow = function(i) {
    if (!rail || !nodes[i]) return;
    rail.style.height = (nodes[i].offsetTop + 16) + 'px';   // down to the knob centre
  };
  if (!motionOK()) {
    nodes.forEach(function(n) { n.classList.add('in'); });
    grow(nodes.length - 1);
    return;
  }
  nodes.forEach(function(n) { n.classList.remove('in'); void n.offsetWidth; });
  nodes.forEach(function(n, i) {
    setTimeout(function() { n.classList.add('in'); grow(i); }, 70 + i * 140);
  });
}
// Recompute the rail to reach the last branch — call after async content
